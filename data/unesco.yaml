  - {id: 2008_67717_INV_PCI_FRANCE_00025, unesco: mechanical-watchmaking, why: "Clock restoration workshop in Dinan; horology but outside the Doubs/Jura arc craft the inscription describes. Not matched."}
  - {id: 2010_67717_INV_PCI_FRANCE_00114, unesco: transhumance, why: "Aramits shepherds' festival marks the return from summer pastures; a related festivity, not a transhumance fiche. Not matched."}
  - {id: 2013_67717_INV_PCI_FRANCE_00324, unesco: processional-giants, why: "Steenvoorde giants (and other Nord giants fiches: 00323, 00351-00354, 00371) are not among the French towns UNESCO names (Cassel, Douai, Pézenas, Tarascon). Not matched."}
