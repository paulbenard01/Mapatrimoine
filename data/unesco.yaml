# Source: https://ich.unesco.org/en/state/france-FR (fetched 2026-10-09): "30 elements
# inscribed", latest are from the 2024 session (19.COM). UNESCO lists no French
# inscription from the 2025 session (20.COM). French names come from
# https://ich.unesco.org/fr/etat/france-FR. Multinational = more than one State linked
# on the element page.
# For extended multinational files, `year` is the year UNESCO now shows (that of the
# latest extension). France was already in earlier versions: falconry since 2010,
# dry stone walling since 2018.
# Pending nominations on the UNESCO page, not inscribed (no flag yet): "The Biou of Arbois"
# (2026, RL; inventory 2013_67717_INV_PCI_FRANCE_00314) and a new "Transhumance" file (2026).
