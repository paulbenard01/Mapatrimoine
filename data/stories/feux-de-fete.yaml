id: feux-de-fete
kind: theme
title:
  fr: Feux de fête, du solstice d'hiver à l'été
  en: Festive fires, from midwinter to midsummer
tagline:
  fr: >-
    Une tour de pins à Noël, un roi de paille jugé puis brûlé, des flammes qu'on enjambe, des troncs embrasés à la Saint-Jean : le feu rassemble et marque le temps.
  en: >-
    A tower of pine at Christmas, a straw king tried and burnt, flames to leap over, trunks ablaze at midsummer: fire gathers people and marks the turning year.
intro:
  fr: >-
    À Bazas, on dit que la Saint-Jean d'été clôt un cycle ouvert par le feu de Noël et poursuivi au carnaval. Ce parcours suit ce fil d'une année de feux, de la nuit de Noël à la mi-juillet, des Landes à la Normandie en passant par l'Alsace et Paris. Partout, le feu est préparé ensemble, souvent par une confrérie, des services municipaux ou une bande de jeunes, puis allumé devant la foule à un moment précis : sortie de messe, fin de carnaval, veille d'une fête patronale. Il ne sert ni à chauffer ni à cuire. Il réunit, il protège ou purifie, il rappelle une légende de fondation, il fait passer d'une saison ou d'une année à l'autre. Certains de ces feux sont très anciens, d'autres ont été relancés ou déplacés ; tous restent vivants parce qu'une communauté accepte, chaque année, de les rallumer.
  en: >-
    In Bazas they say that midsummer's Saint John's Day closes a cycle opened by the Christmas fire and carried on through carnival. This tour follows that thread through a year of fires, from Christmas night to mid-July, from the Landes to Normandy by way of Alsace and Paris. Everywhere the fire is built together, often by a brotherhood, the town's staff or a band of young people, then lit before the crowd at a set moment: after a church service, at the end of carnival, on the eve of a patron saint's day. It is not there to warm or to cook. It brings people together, protects or cleanses, recalls a founding legend, carries the community from one season or one year to the next. Some of these fires are very old, others have been revived or moved; all stay alive because a community agrees, every year, to light them again.
steps:
  - element: 2010_67717_INV_PCI_FRANCE_00111
    heading:
      fr: Capbreton, la torrèle de la nuit de Noël
      en: Capbreton, the Christmas-night torrèle
    text:
      fr: >-
        Le parcours s'ouvre au cœur de l'hiver, sur la côte landaise. À la sortie de la messe de minuit, sur la place de la mairie de Capbreton, on embrase la torrèle, un bûcher de troncs de pin d'environ trois mètres monté en forme de cheminée pour brûler toute la nuit et s'effondrer vers l'intérieur. Autrefois dressée par les bouviers et leurs bœufs parés, elle est aujourd'hui l'œuvre des agents municipaux, qui choisissent des troncs longs et droits dans une forêt communale. Une légende locale y voit le souvenir d'une nuit où les villageois, défilant entre un grand feu et l'océan, auraient fait croire à des envahisseurs normands qu'une armée les attendait. Vin chaud et chocolat circulent : le premier feu de l'année rassemble autant qu'il éclaire.
      en: >-
        The tour opens in the depths of winter, on the Landes coast. As people leave midnight mass, the torrèle is set alight on the town-hall square in Capbreton: a pyre of pine trunks about three metres high, stacked like a chimney so that it burns all night and collapses inwards. Once raised by ox drivers with their decked-out oxen, it is now built by the town's staff, who pick long, straight trunks in a municipal forest. A local legend links it to a night when villagers, marching back and forth between a great fire and the ocean, are said to have convinced Norman raiders that an army lay in wait. Mulled wine and hot chocolate go round: the first fire of the year gathers people as much as it gives light.
    look_for:
      fr: >-
        La forme en tour du bûcher et le moment où il s'effondre sur lui-même ; observez aussi qui reçoit l'honneur d'y mettre le feu.
      en: >-
        The tower shape of the pyre and the moment it falls in on itself; notice too who is given the honour of lighting it.
  - element: 2012_67717_INV_PCI_FRANCE_00257
    heading:
      fr: Limoux, Sa Majesté Carnaval jugée puis brûlée
      en: Limoux, His Majesty Carnival tried and burnt
    text:
      fr: >-
        Quelques semaines plus tard, dans l'Aude, le feu ferme le carnaval. À Limoux, pendant près de trois mois, les bandes de masques, les fécos, dansent chaque week-end sur la place au son des musiciens, un roseau à la main, en taquinant les passants. Dès le premier dimanche, des meuniers en blouse blanche et foulard rouge accueillent Sa Majesté Carnaval, un mannequin de paille. Le dernier dimanche, lors de la nuit de la Blanquette, on le juge en occitan et le verdict le condamne au bûcher ; les bandes du dimanche se relaient d'une année sur l'autre pour le brûler. Après le feu de Noël qui veille, voici le feu qui juge : on brûle en public les excès de la saison grasse pour pouvoir passer à autre chose.
      en: >-
        A few weeks later, in the Aude, fire closes the carnival. In Limoux, for almost three months, the bands of masked dancers, the fécos, take to the square every weekend to live music, a reed in hand, teasing passers-by. On the first Sunday, millers in white smocks and red scarves welcome His Majesty Carnival, a straw dummy. On the last Sunday, the Night of the Blanquette, he is tried in Occitan and sentenced to the flames; the Sunday bands take turns, year by year, to burn him. After the Christmas fire that keeps watch comes the fire that passes judgement: the excesses of the carnival season are burnt in public so that everyone can move on.
    look_for:
      fr: >-
        Le procès en occitan avant la mise à feu : écoutez comment on reproche à Carnaval tout ce qui s'est passé dans l'année, et comment la foule réagit.
      en: >-
        The trial in Occitan before the fire is lit: listen to how Carnival is blamed for everything that happened during the year, and how the crowd responds.
  - element: 2019_67717_INV_PCI_FRANCE_00447
    heading:
      fr: Paris, sauter le feu avant Norouz
      en: Paris, leaping the fire before Norouz
    text:
      fr: >-
        À l'approche de l'équinoxe de printemps, des feux s'allument au bord de l'eau en région parisienne, sur les quais du canal Saint-Martin ou de la Seine. Iraniens, Kurdes, Afghans et d'autres communautés préparent Norouz, le Nouvel An persan. La nuit qui précède le dernier mercredi de l'année, celle du Tchâhâr Shanbeh Souri, le « mercredi enflammé », on saute par-dessus les flammes en disant au feu : « je te donne ma couleur jaune, tu me donnes ta couleur rouge », la maladie contre la force et la santé. Viennent ensuite la table des sept « sin » et les visites aux aînés. Ce feu-là ne juge personne : on le traverse pour se purifier, et il montre qu'un rite venu d'ailleurs trouve aussi sa place dans le calendrier des fêtes de France.
      en: >-
        As the spring equinox approaches, fires are lit by the water in the Paris region, on the banks of the Canal Saint-Martin or the Seine. Iranians, Kurds, Afghans and other communities are getting ready for Norouz, the Persian New Year. On the night before the last Wednesday of the year, Chaharshanbe Suri or "fiery Wednesday", people leap over the flames, telling the fire: "I give you my yellow, you give me your red", sickness in exchange for strength and health. Then come the table of the seven "sin" and visits to the elders. This fire judges no one: you pass through it to be cleansed, and it shows that a rite from elsewhere has found its own place in France's festive calendar.
    look_for:
      fr: >-
        L'élan de chacun avant le saut et la formule murmurée au-dessus des flammes ; remarquez les âges mêlés, des enfants aux plus anciens.
      en: >-
        Each person's run-up before the leap and the words murmured over the flames; notice the mix of ages, from children to elders.
  - element: 2013_67717_INV_PCI_FRANCE_00313
    heading:
      fr: Luchon, le brandon des Pyrénées
      en: Luchon, the brandon of the Pyrenees
    text:
      fr: >-
        Avec le solstice d'été, le parcours gagne les Pyrénées, où les feux de la Saint-Jean sont inscrits par l'UNESCO pour l'Andorre, l'Espagne et la France. À Bagnères-de-Luchon, un sapin de dix à douze mètres est écorcé puis fendu en public par les charpentiers de la ville, cerclé de fer et laissé debout pour sécher. Le soir venu, ses fentes sont bourrées de copeaux et de paille ; le cortège monte l'allée avec la fanfare, les danseurs et les guides à cheval qui font claquer leurs fouets, puis le maire et le curé allument ensemble le brandon. Il brûle près d'une heure avant de s'effondrer, et des jeunes font tournoyer des tisons dans la nuit. Un second brandon brûle quelques jours plus tard, à la Saint-Pierre.
      en: >-
        With the summer solstice, the tour reaches the Pyrenees, where the Saint John's fires are inscribed by UNESCO for Andorra, Spain and France. In Bagnères-de-Luchon, a fir ten to twelve metres tall is stripped and split in public by the town's carpenters, bound with iron hoops and left standing to dry. When evening comes, its splits are packed with shavings and straw; the procession climbs the avenue with the brass band, the dancers and the mounted guides cracking their whips, then the mayor and the priest light the brandon together. It burns for about an hour before crashing down, and young people whirl glowing brands in the dark. A second brandon burns a few days later, on Saint Peter's Day.
    look_for:
      fr: >-
        La chute du brandon, puis les tisons que les jeunes font tourner ; certains rapportent chez eux un morceau de bois calciné.
      en: >-
        The fall of the brandon, then the brands whirled by young people; some take home a piece of charred wood.
  - element: 2010_67717_INV_PCI_FRANCE_00104
    heading:
      fr: Bazas, trois feux et un taureau pour saint Jean
      en: Bazas, three fires and a bull for Saint John
    text:
      fr: >-
        Le même 24 juin, plus au nord, en Gironde, Bazas fête son saint patron, Jean-Baptiste, à qui sa cathédrale est dédiée. Devant elle, on rejoue d'abord un usage attesté depuis 1283 : le don d'un taureau par les bouchers, autrefois à l'évêque, puis aux jurats au nom des habitants. Disparue à la Révolution, la cérémonie a été rétablie en 1969 sous forme de spectacle. Viennent ensuite les feux : trois bûchers dressés sur une estrade et allumés par les membres d'une confrérie devant une foule nombreuse. C'est ici que le parcours trouve sa clé : pour les Bazadais, ce feu de juin clôt le cycle ouvert par le feu de Noël et poursuivi par les bœufs gras du carnaval, comme si l'année entière tenait entre deux brasiers.
      en: >-
        On the same 24 June, further north in the Gironde, Bazas celebrates its patron saint, John the Baptist, to whom its cathedral is dedicated. In front of it, people first re-enact a custom recorded since 1283: the butchers' gift of a bull, once to the bishop, later to the town magistrates on behalf of the inhabitants. Lost at the Revolution, the ceremony was revived in 1969 as a show. Then come the fires: three pyres set up on a platform and lit by members of a brotherhood before a large crowd. This is where the tour finds its key: for the people of Bazas, the June fire closes the cycle opened by the Christmas fire and carried on by the fattened oxen of carnival, as though the whole year lay between two blazes.
    look_for:
      fr: >-
        Les trois feux alignés sur leur estrade devant la façade de la cathédrale, et le passage du spectacle du taureau à l'embrasement.
      en: >-
        The three fires lined up on their platform before the cathedral front, and the shift from the bull pageant to the lighting of the fires.
  - element: 2009_67717_INV_PCI_FRANCE_00045
    heading:
      fr: Thann, trois sapins pour une légende de fondation
      en: Thann, three firs for a founding legend
    text:
      fr: >-
        Les trois feux de Bazas trouvent un écho en Alsace, le 30 juin. Selon la légende, le serviteur d'un évêque de Gubbio, en Ombrie, rapportait une relique de son maître quand son bâton de pèlerin resta collé à un sapin ; le seigneur du lieu vit alors trois flammes briller au-dessus de la forêt, et la ville de Thann naquit à cet endroit. Chaque année, après les vêpres à la collégiale, un cortège suit la statue de saint Thiébaut jusqu'à la place, où trois crémateurs désignés par le conseil municipal mettent le feu, à la torche, à trois sapins fendus et bourrés de copeaux. Des pèlerins venus de Gubbio, ville jumelle depuis 1958, sont là chaque année : le feu relie aussi deux villes d'Europe.
      en: >-
        Bazas's three fires find an echo in Alsace on 30 June. Legend has it that the servant of a bishop of Gubbio, in Umbria, was carrying home a relic of his master when his pilgrim's staff stuck fast to a fir tree; the local lord then saw three flames shining above the forest, and the town of Thann grew up on the spot. Every year, after vespers in the collegiate church, a procession follows the statue of Saint Theobald to the square, where three "cremators" appointed by the town council set three split firs, packed with shavings, alight with a torch. Pilgrims from Gubbio, twinned with Thann since 1958, come every year: here the fire also links two European towns.
    look_for:
      fr: >-
        Les trois crémateurs et leurs torches, et l'hymne chanté en italien pendant les vêpres, repris par toute l'assistance.
      en: >-
        The three cremators with their torches, and the hymn sung in Italian during vespers, taken up by the whole congregation.
  - element: 2009_67717_INV_PCI_FRANCE_00070
    heading:
      fr: La Haye-de-Routot, le feu de Saint-Clair près des ifs
      en: La Haye-de-Routot, the Saint Clair fire by the yews
    text:
      fr: >-
        Le parcours s'achève en Normandie, en lisière de la forêt de Brotonne, le 16 juillet au soir. À La Haye-de-Routot, deux ifs millénaires, aménagés en chapelle et en oratoire, font l'identité du village ; à quelques mètres, la confrérie de charité, fondée en 1496, prépare chaque année le grand feu de Saint-Clair, qui attire jusqu'à environ deux mille personnes. Les habitants en expliquent peu le sens : ils l'ont toujours connu, interrompu seulement par le couvre-feu de la dernière guerre. Au début des années 2000, on a déplacé le bûcher de quelques mètres pour protéger les ifs de sa chaleur, une décision alors très discutée. La tradition garde sa place au village, mais elle s'ajuste à ce qu'elle doit préserver.
      en: >-
        The tour ends in Normandy, on the edge of the Brotonne forest, on the evening of 16 July. In La Haye-de-Routot, two yew trees around a thousand years old, fitted out as a chapel and an oratory, give the village its identity; a few metres away, the charity brotherhood, founded in 1496, builds the great Saint Clair fire every year, drawing up to about two thousand people. Locals say little about its meaning: they have always known it, broken only by the curfew of the last war. In the early 2000s the pyre was moved a few metres to shield the yews from its heat, a much-debated decision at the time. The tradition keeps its place in the village, but adjusts to what it must protect.
    look_for:
      fr: >-
        Les deux pavages de la Grand-rue, l'ancien et le nouvel emplacement du bûcher, et la distance qui le sépare désormais des ifs.
      en: >-
        The two paved spots on the main street, the old and the new site of the pyre, and the distance that now separates it from the yews.
outro:
  fr: >-
    De Capbreton à La Haye-de-Routot, chaque feu tient à un geste collectif : choisir le bois, le fendre, le dresser, désigner celui ou ceux qui l'allumeront. On y brûle un roi de carnaval, on y enjambe la maladie, on y rejoue une légende, on y attend la nuit la plus courte. Ces feux changent de place, d'organisateurs, parfois de sens, et en accueillent de nouveaux. Et autour de vous : quel moment de l'année mériterait un feu partagé, et qui faudrait-il réunir pour le préparer ?
  en: >-
    From Capbreton to La Haye-de-Routot, each fire depends on a shared effort: choosing the wood, splitting it, raising it, naming the person or people who will light it. Here a carnival king is burnt, there sickness is leapt over, a legend replayed, the shortest night awaited. These fires change place, organisers and sometimes meaning, and new ones join them. And around you: which moment of the year would deserve a shared fire, and whom would you need to bring together to build it?
