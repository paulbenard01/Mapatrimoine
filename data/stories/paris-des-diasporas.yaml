id: paris-des-diasporas
kind: place
title:
  fr: "Paris des diasporas : une année de fêtes venues d'ailleurs"
  en: "Paris of the diasporas: a year of festivals from elsewhere"
tagline:
  fr: >-
    De Yennayer à la Vierge de Guadalupe, huit traditions arrivées avec les migrations, qui ont trouvé
    leurs rues, leurs quais et leurs églises en Île-de-France.
  en: >-
    From Yennayer to Our Lady of Guadalupe, eight traditions that came with migration and found their
    own streets, quays and churches in the Paris region.
intro:
  fr: >-
    Paris et sa région accueillent depuis plus d'un siècle des femmes et des hommes venus du monde
    entier, et avec eux des calendriers, des dieux, des chants et des recettes. Ce parcours suit une année
    de fêtes, de janvier à décembre, pour observer comment une tradition voyage et s'enracine. Elle part
    dans des objets, des gestes et des mémoires ; à l'arrivée, il lui faut trouver un lieu, un quai de
    canal, un temple de quartier, une cathédrale, et souvent changer d'échelle : un repas de famille
    devient fête de rue, un rite de village devient festival. Toutes ces pratiques figurent aujourd'hui à
    l'Inventaire du patrimoine culturel immatériel de la France : elles font partie du paysage parisien.
  en: >-
    For more than a century, Paris and its region have welcomed women and men from all over the world,
    and with them calendars, gods, songs and recipes. This tour follows a year of festivals, from January
    to December, to see how a tradition travels and takes root. It leaves in objects, gestures and
    memories; on arrival it has to find a place, a canal quay, a neighbourhood temple, a cathedral, and
    often change scale: a family meal becomes a street party, a village rite becomes a festival. All
    these practices are now in France's national inventory of intangible cultural heritage: they are
    part of the Paris landscape.
steps:
  - element: 2020_67717_INV_PCI_FRANCE_00479
    heading:
      fr: Yennayer, le Nouvel An amazigh
      en: Yennayer, the Amazigh New Year
    text:
      fr: >-
        L'année commence vers le 12 janvier avec Yennayer, premier jour du calendrier agraire des
        Amazighs, ou Berbères, calé sur l'ancien calendrier julien. En Île-de-France, la plupart sont
        originaires de Kabylie, au nord de l'Algérie, les autres du reste de l'Algérie ou du Maroc. À
        la maison, un repas copieux, souvent un couscous aux sept légumes, doit annoncer une année
        féconde, et l'on évite les paroles tristes. À Paris, la fête a pris une autre dimension : des
        associations, nombreuses depuis le « Printemps berbère » de 1980, organisent concerts,
        conférences, journées culturelles et défilé, où l'on affiche sa langue et son identité. Première
        leçon du parcours : en voyageant, un rite familial peut devenir une prise de parole publique.
        Quelques semaines plus tard, un autre Nouvel An envahit les rues.
      en: >-
        The year begins around 12 January with Yennayer, the first day of the farming calendar of the
        Amazigh, or Berber, peoples, aligned with the old Julian calendar. In the Paris region most come
        from Kabylia in northern Algeria, others from elsewhere in Algeria or Morocco. At home, a generous
        meal, often couscous with seven vegetables, should herald a fruitful year, and sad words are
        avoided. In Paris the festival has taken on another dimension: associations, numerous since the
        1980 "Berber Spring", hold concerts, talks, cultural days and a parade where people display their
        language and identity. First lesson of the tour: on its travels, a family rite can become a
        public statement. A few weeks later, another New Year fills the streets.
    look_for:
      fr: >-
        Le millésime sur les affiches : l'ère amazighe part de 950 avant notre ère, si bien que janvier
        2026 ouvre l'an 2976.
      en: >-
        The year number on the posters: the Amazigh era starts in 950 BCE, so January 2026 opens the
        year 2976.
  - element: 2014_67717_INV_PCI_FRANCE_00348
    heading:
      fr: Le Nouvel An lunaire, de Belleville au 13e
      en: Lunar New Year, from Belleville to the 13th
    text:
      fr: >-
        Entre le 21 janvier et le 20 février, selon la lune, vient le Nouvel An lunaire, ou fête du
        Printemps. Le dimanche, pour que les familles puissent venir, lions et dragons défilent à
        Belleville puis dans le « triangle de Choisy », au milieu des pétards et du rouge qui chassent le
        mauvais sort. L'histoire est longue : pendant la Première Guerre mondiale, la France a fait venir
        des travailleurs chinois, et quelques milliers, originaires de la région de Wenzhou, sont restés.
        D'autres vagues ont suivi, notamment d'Asie du Sud-Est, si bien que la fête réunit des
        communautés aux parcours très divers. La danse du lion s'est enracinée grâce aux têtes et costumes
        importés de Chine et aux écoles de kung-fu qui la transmettent. Fête de famille au départ, elle
        est devenue l'une des plus suivies dans les rues de la capitale. Au printemps, un autre calendrier
        prend le relais.
      en: >-
        Between 21 January and 20 February, depending on the moon, comes the Lunar New Year, or Spring
        Festival. On Sundays, so that whole families can come, lions and dragons parade in Belleville and
        then in the "Choisy triangle", amid firecrackers and the red that drives away bad luck. The story
        goes back a long way: during the First World War France brought in Chinese workers, and a few
        thousand from the Wenzhou area stayed on. Other waves followed, notably from South-East Asia, so
        the festival gathers communities with very different journeys. The lion dance took root thanks to
        heads and costumes imported from China and to the kung-fu schools that teach it. Once a family
        celebration, it has become one of the most watched festivals in the capital's streets. In spring,
        another calendar takes over.
    look_for:
      fr: >-
        La laitue suspendue à l'entrée des commerces, que le lion vient « manger » au son des tambours et
        des cymbales.
      en: >-
        The lettuce hung at shop entrances, which the lion comes to "eat" to the sound of drums and
        cymbals.
  - element: 2019_67717_INV_PCI_FRANCE_00447
    heading:
      fr: Norouz, sauter le feu au bord du canal
      en: Norouz, leaping the fire by the canal
    text:
      fr: >-
        À l'équinoxe de printemps, le 20 ou le 21 mars, Iraniens, Kurdes, Azéris, Afghans, Kazakhs,
        Kirghizes et zoroastriens d'Île-de-France fêtent Norouz, « jour nouveau », un Nouvel An célébré
        depuis plus de deux millénaires. Les familles font germer du blé ou des lentilles et dressent la
        table des sept « sin », sept choses dont le nom commence par la lettre s en persan. La veille du
        dernier mercredi de l'année, on allume des feux et on saute par-dessus en demandant au feu de
        prendre sa pâleur et de donner sa force. À Paris, ce rituel a trouvé place sur les quais du canal
        Saint-Martin. Une même fête rassemble ici des peuples aux langues et aux histoires différentes,
        chacun avec ses chants et ses danses. Un mois plus tard, à Bobigny, c'est aussi le printemps et
        la moisson que l'on salue.
      en: >-
        At the spring equinox, on 20 or 21 March, Iranians, Kurds, Azerbaijanis, Afghans, Kazakhs, Kyrgyz
        and Zoroastrians in the Paris region celebrate Norouz, "new day", a New Year marked for more than
        two thousand years. Families sprout wheat or lentils and lay the table of the seven "sin", seven
        things whose names begin with the letter s in Persian. On the eve of the last Wednesday of the
        year, fires are lit and people jump over them, asking the fire to take their pallor and give them
        strength. In Paris, this rite has found a home on the quays of the Canal Saint-Martin. One
        festival here brings together peoples with different languages and histories, each with its own
        songs and dances. A month later, in Bobigny, spring and harvest are greeted too.
    look_for:
      fr: >-
        La petite pousse verte de blé ou de lentilles, le sabzeh, posée sur la table de Norouz.
      en: >-
        The small green mat of sprouted wheat or lentils, the sabzeh, set on the Norouz table.
  - element: 2017_67717_INV_PCI_FRANCE_00392
    heading:
      fr: Vaisakhi, les sikhs dans les rues de Bobigny
      en: Vaisakhi, the Sikhs in the streets of Bobigny
    text:
      fr: >-
        Au Pendjab, Vaisakhi salue la moisson et le printemps ; depuis 1699, les sikhs y fêtent aussi la
        fondation du Khalsa, la communauté des initiés. En France, la fête est publique depuis 1988. À
        Bobigny, le week-end le plus proche du 13 ou 14 avril, des milliers de fidèles partent du
        gurdwara, le temple, pour un nagar kirtan, « chants pour le voisinage », à travers Bobigny et
        Drancy. Le livre saint avance sur un char, précédé des Panj Piare, cinq hommes qui rappellent
        les cinq premiers initiés ; beaucoup portent un bandana orange, couleur du blé mûr. Des jeunes
        font des démonstrations de gatka, art martial sikh, et des repas végétariens sont offerts à tous.
        La banlieue devient pour un jour un lieu de prière en plein air, et l'hospitalité un geste partagé
        avec les voisins. À la fin de l'été, c'est un dieu hindou qui sort à son tour dans la rue.
      en: >-
        In Punjab, Vaisakhi greets the harvest and the spring; since 1699 Sikhs have also marked it as the
        founding of the Khalsa, the community of the initiated. In France it has been celebrated publicly
        since 1988. In Bobigny, on the weekend closest to 13 or 14 April, thousands of worshippers set out
        from the gurdwara, the temple, for a nagar kirtan, "songs for the neighbourhood", through Bobigny
        and Drancy. The holy book rides on a float, preceded by the Panj Piare, five men recalling the
        first five initiates; many wear an orange bandana, the colour of ripe wheat. Young people give
        displays of gatka, a Sikh martial art, and vegetarian meals are offered to all. For a day the
        suburb becomes an open-air place of prayer, and hospitality a gesture shared with neighbours. At
        the end of summer, a Hindu god takes to the streets in turn.
    look_for:
      fr: >-
        Les stands de repas gratuits le long du cortège, où chacun, sikh ou non, reçoit la même assiette.
      en: >-
        The free food stalls along the route, where everyone, Sikh or not, is handed the same plate.
  - element: 2009_67717_INV_PCI_FRANCE_00038
    heading:
      fr: Ganesh à La Chapelle, « Little Jaffna »
      en: Ganesh in La Chapelle, "Little Jaffna"
    text:
      fr: >-
        Entre fin août et mi-septembre, selon le calendrier hindou, le temple de Ganesh du 18e
        arrondissement fête la naissance du dieu à tête d'éléphant. Depuis le milieu des années 1990, un
        défilé parcourt le quartier de La Chapelle, près de la gare du Nord, cœur de la présence tamoule
        à Paris, que l'on surnomme « Little Jaffna », d'après la grande ville tamoule du nord du Sri Lanka.
        La statue de Ganesh, en bronze doré, avance sur un char fleuri tiré par les fidèles, suivie d'un
        second char pour son frère Skanda. Ceux qui marchent dans le cortège vont pieds nus ; sur le
        passage, on brise des noix de coco sur la chaussée, geste qui signifie que l'on se défait de son
        ego. Les rues d'un quartier commerçant deviennent un chemin de procession. En septembre encore,
        d'autres fidèles lavent les marches d'une église.
      en: >-
        Between late August and mid-September, by the Hindu calendar, the Ganesh temple in the 18th
        arrondissement celebrates the birth of the elephant-headed god. Since the mid-1990s a procession
        has wound through La Chapelle, near the Gare du Nord, the heart of Tamil Paris, nicknamed
        "Little Jaffna" after the main Tamil city in northern Sri Lanka. Ganesh's gilded bronze statue
        rides on a flower-decked chariot pulled by worshippers, followed by a second chariot for his
        brother Skanda. Those walking in the procession go barefoot; along the way, coconuts are smashed
        on the road, a gesture meaning that one breaks free of one's ego. The streets of a shopping
        district become a processional way. Still in September, other worshippers wash the steps of a
        church.
    look_for:
      fr: >-
        Les noix de coco qui éclatent sur le bitume au passage du char, et les pieds nus des fidèles qui
        le tirent.
      en: >-
        Coconuts bursting on the tarmac as the chariot passes, and the bare feet of the worshippers
        pulling it.
  - element: 2015_67717_INV_PCI_FRANCE_00370
    heading:
      fr: Le lavage de la Madeleine, de Bahia à Paris
      en: Washing the Madeleine, from Bahia to Paris
    text:
      fr: >-
        À Salvador de Bahia, au Brésil, on lave depuis au moins deux siècles le parvis de l'église du
        Bonfim, une fête où se rencontrent le catholicisme et le candomblé, religion afro-brésilienne. À
        Paris, la pratique a d'abord eu lieu au Sacré-Cœur avant de se fixer en 2002 à l'église de la
        Madeleine. À la mi-septembre, un cortège vêtu de blanc part de la place de la République :
        batucadas, groupes de capoeira et de danse, puis un camion sonore qui ferme la marche. Devant la
        Madeleine, des femmes en blanc balaient les marches puis les lavent à l'eau parfumée. Autour de ce
        rituel, tout un festival de culture brésilienne s'est construit. La tradition a changé de ville,
        de monument et d'échelle, mais garde son geste central. Ce geste de purification ouvre l'automne,
        saison où l'on se souvient des morts.
      en: >-
        In Salvador de Bahia, Brazil, the forecourt of the Bonfim church has been washed for at least two
        centuries, a festival where Catholicism meets Candomblé, an Afro-Brazilian religion. In Paris the
        practice first took place at the Sacré-Cœur before settling at the church of the Madeleine in
        2002. In mid-September a procession dressed in white sets off from Place de la République:
        batucada drummers, capoeira and dance groups, then a sound truck bringing up the rear. At the
        Madeleine, women in white sweep the steps and wash them with perfumed water. A whole festival of
        Brazilian culture has grown around this rite. The tradition has changed city, monument and scale,
        but keeps its central gesture. This act of purification opens the autumn, the season for
        remembering the dead.
    look_for:
      fr: >-
        Les amphores d'eau parfumée et de fleurs versées sur les marches, et les balais qui suivent le
        rythme des percussions.
      en: >-
        The jars of perfumed water and flowers poured onto the steps, and the brooms keeping time with the
        drums.
  - element: 2010_67717_INV_PCI_FRANCE_00079
    heading:
      fr: Le jour des Morts mexicain et ses autels
      en: The Mexican Day of the Dead and its altars
    text:
      fr: >-
        Les 1er et 2 novembre, la Toussaint française croise le jour des Morts mexicain. Les familles
        mexicaines de Paris dressent un autel d'offrandes : photos des défunts, bougies, plats qu'ils
        aimaient, pain des morts et crânes en sucre. Les fleurs jaunes ou orange indispensables à l'autel
        sont rares à Paris : on les commande, ou on les remplace par des fleurs en papier. Depuis les
        années 2000, des autels publics apparaissent aussi dans des mairies, des musées ou des ateliers
        d'artistes, préparés par des associations qui font découvrir la fête aux voisins. On y honore
        les proches disparus dans l'année, on s'y retrouve, on partage des souvenirs du pays. Loin du
        Mexique, l'autel devient aussi un signe d'identité. L'adaptation se lit ici dans les détails :
        une fleur introuvable, un papier découpé qui la remplace. Six semaines plus tard, la communauté
        se retrouve à Notre-Dame.
      en: >-
        On 1 and 2 November, French All Saints' Day meets the Mexican Day of the Dead. Mexican families in
        Paris set up an offering altar: photos of the dead, candles, the dishes they loved, bread of the
        dead and sugar skulls. The yellow or orange flowers essential to the altar are hard to find in
        Paris: they are ordered in, or replaced with paper flowers. Since the 2000s, public altars have
        also appeared in town halls, museums and artists' studios, set up by associations that share the
        festival with their neighbours. People honour relatives lost during the year, meet and share
        memories of home. Far from Mexico, the altar also becomes a sign of identity. Adaptation shows in
        the details: a flower that cannot be found, cut paper standing in for it. Six weeks later, the
        community gathers at Notre-Dame.
    look_for:
      fr: >-
        Les fleurs en papier jaunes et orange sur l'autel, et les petits crânes en sucre décorés
        posés près des plats.
      en: >-
        The yellow and orange paper flowers on the altar, and the little decorated sugar skulls set
        beside the dishes.
  - element: 2010_67717_INV_PCI_FRANCE_00081
    heading:
      fr: La Vierge de Guadalupe à Notre-Dame
      en: Our Lady of Guadalupe at Notre-Dame
    text:
      fr: >-
        Le 12 décembre, la Vierge de Guadalupe, figure centrale du catholicisme mexicain, est fêtée à
        Notre-Dame de Paris. Selon la tradition, elle serait apparue en 1531 à Juan Diego, un Indien
        converti, près de Mexico ; son image a plus tard accompagné le mouvement d'indépendance. Dans la
        cathédrale, une chapelle du bas-côté nord lui est consacrée, ornée d'une mosaïque à son effigie ;
        selon la mémoire de la communauté, une image offerte par des Mexicains de Paris dans les années
        1930 serait à l'origine de ce lieu. D'un rassemblement spontané devant la chapelle est née une
        messe festive, avec mariachis, qui réunit Mexicains, Latino-Américains et Parisiens, certains
        venus de pays voisins. Le cycle mexicain reprendra le 2 février avec la Candelaria et ses tamales
        partagés en famille. Une dévotion venue de loin a trouvé place au cœur même de Paris, dans son monument le plus
        célèbre.
      en: >-
        On 12 December, Our Lady of Guadalupe, a central figure of Mexican Catholicism, is celebrated at
        Notre-Dame de Paris. According to tradition, she appeared in 1531 to Juan Diego, a converted
        Indigenous man, near Mexico City; her image later accompanied the independence movement. In the
        cathedral a chapel in the north aisle is dedicated to her, with a mosaic of her likeness;
        community memory traces it back to an image given by Mexicans in Paris in the 1930s. A
        spontaneous gathering at the chapel grew into a festive mass with mariachis, drawing Mexicans,
        Latin Americans and Parisians, some from neighbouring countries. The Mexican cycle starts again on
        2 February with the Candelaria and its tamales shared at home. A devotion from far away has found
        a place in the very heart of Paris.
    look_for:
      fr: >-
        Les mariachis qui entonnent « La Guadalupana » devant la chapelle, une fois la messe terminée.
      en: >-
        The mariachis striking up "La Guadalupana" in front of the chapel once mass is over.
outro:
  fr: >-
    Au fil de l'année, on a vu des traditions voyager dans des objets (une tête de lion, une statue de
    bronze, des crânes en sucre), dans des gestes (sauter un feu, briser une noix de coco, laver des
    marches) et dans des calendriers venus d'ailleurs. En s'installant, elles ont changé de lieu,
    d'échelle et parfois de sens : un repas de famille devient fête publique, un rite de village s'adapte
    à un quai de canal ou à une cathédrale. À partir de quand, selon vous, une tradition venue d'ailleurs
    devient-elle celle d'un lieu ? Et lesquelles vos voisins ont-ils apportées ?
  en: >-
    Over the year we have seen traditions travel in objects (a lion's head, a bronze statue, sugar
    skulls), in gestures (leaping a fire, smashing a coconut, washing steps) and in calendars from
    elsewhere. As they settled, they changed place, scale and sometimes meaning: a family meal becomes a
    public festival, a village rite adapts to a canal quay or a cathedral. When, in your view, does a
    tradition from elsewhere become the tradition of a place? And which ones have your neighbours
    brought with them?
