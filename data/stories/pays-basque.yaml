id: pays-basque
kind: place
title:
  fr: Le Pays basque, de la côte à la Soule
  en: The Basque Country, from the coast to the Soule
tagline:
  fr: >-
    Des fêtes de Bayonne aux pastorales de Soule : un voyage où l'on joue, chante et se mesure ensemble, en
    basque comme en français.
  en: >-
    From the Bayonne festival to the pastorales of the Soule: a journey where people play, sing and test
    their strength together, in Basque as well as French.
intro:
  fr: >-
    Le Pays basque nord, Iparralde, réunit trois provinces historiques : le Labourd sur la côte, la
    Basse-Navarre et la Soule vers la montagne. Ce parcours part de l'Adour et de l'océan pour remonter
    vers les villages de l'intérieur. En chemin, les mêmes fils reviennent : des fêtes portées par des
    bénévoles et des associations, des jeux nés du travail de la ferme ou du port, la langue basque
    chantée, improvisée, mise en scène. Chaque élément a son histoire propre, parfois très récente ;
    ensemble, ils montrent comment une société se rassemble, se donne en spectacle et se transmet ses
    savoirs.
  en: >-
    The northern Basque Country, Iparralde, brings together three historic provinces: Labourd on the
    coast, Lower Navarre and the Soule towards the mountains. This tour starts on the Adour and the
    ocean and heads inland to the villages. Along the way the same threads keep returning: festivals run
    by volunteers and associations, games born of farm or harbour work, and the Basque language sung,
    improvised and staged. Each element has its own history, sometimes a very recent one; together they
    show how a society gathers, performs for itself and passes on what it knows.
steps:
  - element: 2010_67717_INV_PCI_FRANCE_00116
    heading:
      fr: Bayonne en blanc et rouge
      en: Bayonne in white and red
    text:
      fr: >-
        Le voyage commence au confluent de l'Adour et de la Nive. Créées en 1932, les fêtes de Bayonne
        occupent cinq jours d'été, du mercredi au dimanche : bandas dans les rues, chants, défilés,
        peñas ouvertes à tous. Chaque midi, la foule assiste au réveil du roi Léon, grand mannequin qui
        rythme les journées. La tenue blanche au foulard rouge ne date que des années 1990, inspirée de
        Pampelune : preuve qu'une tradition peut être jeune et pourtant profondément partagée. Cette
        fête urbaine, immense, donne le ton du parcours : ici, la fête est une affaire collective, faite
        de musique, de rendez-vous et de gestes que chacun reconnaît. Descendons maintenant vers la
        côte, où la fête prend la couleur de la mer.
      en: >-
        The journey begins where the Nive meets the Adour. Created in 1932, the Bayonne festival fills
        five summer days, Wednesday to Sunday: bandas in the streets, songs, parades and peñas open to
        all. Every day at noon the crowd gathers for the waking of King Léon, a giant figure who sets the
        rhythm of the day. The white outfit with a red scarf only dates from the 1990s, borrowed from
        Pamplona: proof that a tradition can be young and still deeply shared. This huge urban festival
        sets the tone for the tour: here, celebrating is a collective affair, made of music, meeting
        points and gestures everyone recognises. Now we head down the coast, where the festival takes on
        the colours of the sea.
    look_for:
      fr: >-
        Le réveil du roi Léon à midi et les bandas : écoutez les cuivres reprendre les mêmes airs que la
        foule chante en chœur.
      en: >-
        King Léon waking at noon, and the bandas: listen to the brass picking up tunes the whole crowd
        sings along to.
  - element: 2013_67717_INV_PCI_FRANCE_00298
    heading:
      fr: Saint-Jean-de-Luz et Ciboure, la fête de la Mer
      en: Saint-Jean-de-Luz and Ciboure, the Sea festival
    text:
      fr: >-
        De part et d'autre de la Nivelle, Saint-Jean-de-Luz et Ciboure accueillent à tour de rôle les
        fêtes de la Mer et du Ttoro, en général au début de septembre. Le ttoro, soupe de poissons née à
        bord des bateaux, fait l'objet d'un concours, aux côtés d'un concours de pêche. Puis viennent la
        levée des couleurs, la messe, la bénédiction des bateaux et une gerbe lancée en mer pour les
        marins disparus. La fête relie ainsi le plaisir de la table et le souvenir des risques du métier.
        Les traînières, longues barques à rames, rappellent que la force et l'endurance se mesurent aussi
        sur l'eau. Le piment qui relève le ttoro nous conduit vers l'intérieur des terres, à Espelette.
      en: >-
        On either side of the Nivelle estuary, Saint-Jean-de-Luz and Ciboure take turns hosting the Sea
        and Ttoro festival, usually in early September. Ttoro, a fish soup first cooked on board, has its
        own contest alongside a fishing competition. Then come the flag-raising, mass, the blessing of the
        boats and a wreath thrown into the sea for sailors lost at sea. The festival thus links the
        pleasure of eating with the memory of a dangerous trade. The traînières, long rowing boats, show
        that strength and stamina are measured on the water too. The chilli that seasons the ttoro leads
        us inland, to Espelette.
    look_for:
      fr: >-
        Le moment où la gerbe est jetée à la mer, et le silence qui l'entoure, juste après l'agitation
        des concours.
      en: >-
        The moment the wreath is thrown into the sea, and the hush around it, just after the bustle of
        the contests.
  - element: 2014_67717_INV_PCI_FRANCE_00330
    heading:
      fr: Espelette fête son piment
      en: Espelette celebrates its chilli
    text:
      fr: >-
        À quelques kilomètres de la côte, Espelette célèbre chaque fin d'octobre la récolte de son piment
        depuis 1969. Marché de produits locaux, messe solennelle, intronisations par la confrérie au
        château et défilés animés par des bandas : la fête met en scène un produit devenu emblème, séché
        en cordes sur les façades. Comme à Bayonne, une association et des bénévoles font vivre
        l'événement ; comme sur la côte, un geste religieux s'y mêle à la fête profane. Le piment, protégé
        par une appellation d'origine depuis 2000, montre aussi comment un savoir agricole devient
        un repère d'identité pour tout un territoire. Le village voisin d'Itxassou fait de même avec un
        autre fruit.
      en: >-
        A few kilometres inland, Espelette has celebrated its chilli harvest every late October since
        1969. A local produce market, a solemn mass, inductions by the brotherhood at the castle and
        parades led by bandas: the festival showcases a crop that has become an emblem, dried in strings
        on house fronts. As in Bayonne, an association and volunteers keep the event going; as on the
        coast, a religious moment blends into the secular festival. Protected by an appellation of origin
        since 2000, the chilli also shows how farming know-how becomes a marker of identity for a whole
        area. The neighbouring village of Itxassou does the same with another fruit.
    look_for:
      fr: >-
        Les cordes de piments rouges suspendues aux façades et sur les étals, fraîches ou déjà séchées.
      en: >-
        Strings of red chillies hanging from house fronts and market stalls, some fresh, some already
        dried.
  - element: 2013_67717_INV_PCI_FRANCE_00296
    heading:
      fr: Itxassou, la cerise et la place du village
      en: Itxassou, the cherry and the village court
    text:
      fr: >-
        Le premier dimanche de juin, Itxassou fête sa cerise, une tradition portée par une association
        locale depuis les années 1950. La semaine précédente, des bénévoles préparent des gâteaux basques
        à la crème ou à la cerise ; le dimanche commence par une messe bilingue, en basque et en français.
        Une partie de pelote à main nue suit, puis un grand repas servi sur des tables dressées dans le
        mur à gauche, où l'on goûte la confiture avec le fromage de brebis. Danses, jeux d'enfants et
        démonstrations de force basque complètent la journée. Cette petite fête réunit presque tout ce
        que l'on va découvrir ensuite : le fronton et la pelote, les épreuves de force, la langue.
      en: >-
        On the first Sunday of June, Itxassou celebrates its cherry, a tradition run by a local
        association since the 1950s. In the week before, volunteers bake Basque cakes filled with cream or
        cherry jam; the Sunday opens with a bilingual mass, in Basque and French. A game of bare-hand
        pelota follows, then a big meal on tables set up inside the pelota court, where cherry jam is
        eaten with sheep's cheese. Dancing, children's games and Basque strength displays round off the
        day. This small festival gathers almost everything we will meet next: the court and pelota, the
        strength trials and the language.
    look_for:
      fr: >-
        La pelote jouée le matin, puis les mêmes murs transformés en salle de banquet pour plusieurs
        centaines de convives.
      en: >-
        The pelota game in the morning, then the same walls turned into a banqueting hall for several
        hundred guests.
  - element: 2012_67717_INV_PCI_FRANCE_00158
    heading:
      fr: La pelote à main nue en trinquet
      en: Bare-hand pelota in the trinquet
    text:
      fr: >-
        La pelote basque désigne une famille de jeux qui combinent trois terrains (place libre, mur à
        gauche, trinquet) et divers instruments. La main nue en trinquet se joue dans une salle fermée,
        seul ou à deux contre deux : on frappe la pelote de la paume contre le mur de face, au-dessus
        d'une raie métallique. Deux « chicanes » rendent le jeu imprévisible : le pan coupé, angle biseauté,
        et le xilo, trou carré dans le mur. On ne dit pas « match » mais « partie », et le public suit
        depuis les galeries. Après la fête, voici l'exigence de l'entraînement : le jeu villageois est
        devenu un sport codifié, pratiqué bien au-delà du Pays basque.
      en: >-
        Basque pelota is a family of games combining three kinds of court (open square, left-wall court,
        trinquet) with various implements. Bare-hand pelota in the trinquet is played in an enclosed hall,
        one against one or two against two: players strike the ball with the palm against the front wall,
        above a metal line. Two obstacles make play unpredictable: the bevelled corner and the xilo, a
        square hole in the wall. People speak of a "partie", a game, rather than a match, and spectators
        follow from the galleries. After the festivals, this is the discipline of training: a village game
        has become a codified sport played far beyond the Basque Country.
    look_for:
      fr: >-
        Le claquement sec de la pelote sur le mur, et ce qui se passe quand elle touche le pan coupé ou
        le xilo.
      en: >-
        The sharp crack of the ball on the wall, and what happens when it hits the bevelled corner or
        the xilo.
  - element: 2012_67717_INV_PCI_FRANCE_00157
    heading:
      fr: La force basque, mémoire des travaux des champs
      en: Basque strength, a memory of farm work
    text:
      fr: >-
        Chaque semaine en été, concours et démonstrations de force basque, herri kirolak, animent les
        fêtes de village. Les épreuves reprennent des gestes de la ferme d'avant la mécanisation : lever
        une pierre sur l'épaule, faire pivoter une charrette autour de son timon, hisser une botte de
        paille avec une poulie, tirer à la corde en équipe, ramasser des épis de maïs à la course. Une
        fédération en harmonise les règles, et des femmes concourent en championnat depuis 2008. Comme
        la pelote, ces jeux ont quitté le travail quotidien pour devenir spectacle et compétition, sans
        perdre le lien avec la vie rurale. Après les corps qui se mesurent, place aux voix qui se répondent.
      en: >-
        Every week in summer, Basque strength contests and displays, herri kirolak, liven up village
        festivals. The trials replay farm tasks from before mechanisation: lifting a stone onto the
        shoulder, swinging a cart round its shaft, hoisting a bale of straw on a pulley, team tug-of-war,
        racing to pick up ears of maize. A federation harmonises the rules, and women have competed in
        championships since 2008. Like pelota, these games have left daily work behind to become show and
        competition, without losing their link to rural life. After bodies testing their strength, we turn
        to voices answering each other.
    look_for:
      fr: >-
        Le tir à la corde : observez comment l'équipe se couche presque au sol et bouge au même rythme.
      en: >-
        The tug-of-war: watch how the team leans almost to the ground and moves to a single rhythm.
  - element: 2022_67717_INV_PCI_FRANCE_00516
    heading:
      fr: Le bertsularisme, l'improvisation chantée
      en: Bertsolaritza, improvised song
    text:
      fr: >-
        Le bertsularisme est une joute verbale improvisée, rimée, mesurée et chantée sans accompagnement,
        entièrement en basque. Un meneur ou une meneuse impose un thème et un rôle ; le ou la bertsolari
        compose sur-le-champ, sur un air connu, sous l'oreille d'un public qui applaudit et devient parfois
        le sujet des couplets. On l'entend dans les fêtes de village, au carnaval et lors de championnats,
        et des écoles le transmettent aux plus jeunes. Après la force des bras, c'est l'agilité de l'esprit
        et de la langue qui se mesure, toujours face à un public. La langue basque, présente à chaque
        étape, devient ici le cœur même de la pratique, comme dans notre dernière étape, en Soule.
      en: >-
        Bertsolaritza is an improvised verbal contest, rhymed, metred and sung unaccompanied, entirely
        in Basque. A host sets a theme and a role; the bertsolari composes on the spot to a known tune,
        before an audience that applauds and sometimes becomes the subject of the verses. It is heard at
        village festivals, at carnival and in championships, and schools pass it on to young people.
        After strength of arm comes agility of mind and tongue, still measured in front of an audience.
        The Basque language, present at every stop, here becomes the very heart of the practice, as it
        does at our last stop, in the Soule.
    look_for:
      fr: >-
        Le court silence entre l'annonce du thème et le premier vers chanté, puis la rime finale qui
        déclenche les applaudissements.
      en: >-
        The brief silence between the theme being announced and the first sung line, then the closing
        rhyme that sets off the applause.
  - element: 2012_67717_INV_PCI_FRANCE_00285
    heading:
      fr: La pastorale souletine, tout un village sur scène
      en: The Soule pastorale, a whole village on stage
    text:
      fr: >-
        Le voyage s'achève en Soule, la plus orientale des provinces. Chaque année, les habitants d'un
        village différent montent une pastorale, théâtre en plein air en basque, joué sur une estrade
        sans décor dressée sur la place, le fronton ou un pré. Anges, Satans et humains y rejouent la
        lutte du Bien et du Mal ; les deux camps se distinguent par le bleu et le rouge, par leurs portes,
        leurs pas et leurs airs. Les Satans, danseurs et bouffons, font rire entre les scènes. Un metteur
        en scène, l'errejent, guide une année de préparation. Fête, jeu, chant et langue s'y rejoignent :
        c'est tout le parcours réuni sur une seule scène.
      en: >-
        The journey ends in the Soule, the easternmost province. Each year the people of a different
        village stage a pastorale, open-air theatre in Basque, played on a bare platform set up on the
        square, the pelota court or a meadow. Angels, Satans and humans act out the struggle between Good
        and Evil; the two camps are told apart by blue and red, by their doors, their steps and their
        tunes. The Satans, dancers and jesters, make people laugh between scenes. A director, the
        errejent, guides a whole year of preparation. Festival, play, song and language meet here: the
        whole tour gathered on a single stage.
    look_for:
      fr: >-
        La démarche des deux camps : pas mesurés pour les « Bleus », pas rapides martelés d'un coup de
        bâton pour les « Rouges ».
      en: >-
        How the two camps walk: measured steps for the "Blues", quick steps hammered out with a stick for
        the "Reds".
outro:
  fr: >-
    De Bayonne à la Soule, on a vu des fêtes récentes et des formes très anciennes, des pratiques nées
    du port ou de la ferme devenues sports, spectacles ou championnats. Partout, des bénévoles, des
    associations et des écoles font le travail de transmission, et la langue basque circule de la messe
    bilingue à l'improvisation chantée. Qu'est-ce qui, selon vous, fait tenir ensemble ces pratiques si
    différentes : un territoire, une langue, ou l'envie de se retrouver ?
  en: >-
    From Bayonne to the Soule, we have seen recent festivals and very old forms, practices born of the
    harbour or the farm that became sports, shows or championships. Everywhere, volunteers, associations
    and schools do the work of passing things on, and the Basque language travels from the bilingual mass
    to improvised song. What, in your view, holds such different practices together: a territory, a
    language, or the wish to come together?
lang_review: draft
review_status: unreviewed
