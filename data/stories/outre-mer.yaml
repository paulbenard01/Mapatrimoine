id: outre-mer
kind: place
title:
  fr: "Outre-mer : des Antilles à l'océan Indien, par la Guyane"
  en: "Overseas France: from the Caribbean to the Indian Ocean, via Guiana"
tagline:
  fr: >-
    Une yole sur l'Atlantique, des tambours ka, un roi de carnaval, un fleuve marron, un chant soufi :
    cinq territoires, chacun avec sa propre voix.
  en: >-
    A yole on the Atlantic, ka drums, a carnival king, a Maroon river, a Sufi song: five territories,
    each speaking in its own voice.
intro:
  fr: >-
    Ce parcours relie des terres éloignées de plusieurs milliers de kilomètres : la Martinique et la
    Guadeloupe dans la Caraïbe, la Guyane sur le continent sud-américain, La Réunion et Mayotte dans
    l'océan Indien. Elles partagent un statut de départements français, mais chacune a son histoire de
    peuplement, ses langues et ses croyances. Plusieurs de ces sociétés se sont construites dans et contre
    l'esclavage, une autre autour d'un islam de tradition soufie ; toutes ont fait d'un bateau, d'un
    tambour, d'un masque ou d'un chant une manière de dire qui elles sont. Plutôt que de chercher un
    « outre-mer » unique, on écoutera chaque pratique dans ses propres mots : makè, kabwèt, Touloulou,
    gaandong, roulèr, bandrabandra.
  en: >-
    This tour links places thousands of kilometres apart: Martinique and Guadeloupe in the Caribbean,
    French Guiana on the South American mainland, Réunion and Mayotte in the Indian Ocean. They share the
    status of French departments, but each has its own history of settlement, its own languages and
    beliefs. Several of these societies were built within and against slavery, another around Islam of
    the Sufi tradition; all of them have turned a boat, a drum, a mask or a song into a way of saying who
    they are. Rather than looking for a single "overseas", we will listen to each practice in its own
    words: makè, kabwèt, Touloulou, gaandong, roulèr, bandrabandra.
steps:
  - element: 2017_67717_INV_PCI_FRANCE_00376
    heading:
      fr: La yole ronde, en équilibre sur l'Atlantique
      en: The yole ronde, balancing on the Atlantic
    text:
      fr: >-
        Le voyage part de la côte atlantique de la Martinique. La yole ronde est un voilier d'une dizaine
        de mètres sans quille, sans lest ni gouvernail : pour l'empêcher de chavirer, des équipiers
        s'avancent au-dessus de l'eau sur de longs bois calés contre la coque, plus ou moins loin selon le
        vent, tandis que le patron gouverne à la pagaie. Héritière de savoirs amérindiens, africains et
        européens, elle servait aux marins-pêcheurs, qui faisaient la course pour rentrer les premiers.
        Quand le moteur l'a remplacée, au milieu du XXe siècle, pêcheurs puis associations ont relancé
        les régates et la construction, toujours sans plan, à l'œil ; c'est ce programme de sauvegarde que
        l'UNESCO a distingué en 2020. Cap au nord, vers la Guadeloupe, où l'équilibre se joue cette fois
        entre un danseur et un tambour.
      en: >-
        The journey starts on Martinique's Atlantic coast. The yole ronde is a sailing boat about ten
        metres long, with no keel, no ballast and no rudder: to stop it capsizing, crew members move out
        over the water on long poles wedged against the hull, further or closer depending on the wind,
        while the skipper steers with a paddle. Heir to Amerindian, African and European skills, it was a
        fishing boat, and fishermen raced to be first home. When motorboats replaced it in the mid-20th
        century, fishermen and then associations revived the regattas and the building, still done by eye
        without plans; UNESCO recognised this safeguarding programme in 2020. Now north to Guadeloupe,
        where the balance is struck between a dancer and a drum.
    look_for:
      fr: >-
        Les équipiers alignés au bout de leurs bois au-dessus de la mer : voyez-les s'avancer plus loin
        quand le vent forcit.
      en: >-
        The crew lined up at the ends of their poles above the sea: watch them move further out as the
        wind picks up.
  - element: 2012_67717_INV_PCI_FRANCE_00284
    heading:
      fr: Le gwoka, un cercle autour des tambours ka
      en: Gwoka, a circle around the ka drums
    text:
      fr: >-
        Le gwoka réunit trois arts : un chant en créole guadeloupéen où un soliste lance une phrase que le
        chœur reprend, des rythmes superposés joués sur les tambours ka, et une danse exécutée par une
        seule personne à la fois, face aux tambours. Les boula tiennent un motif régulier ; le makè,
        tambour soliste, « marque » chaque pas du danseur. Ses racines remontent au XVIIe siècle, quand
        des Africains réduits en esclavage se rassemblaient malgré les interdits pour jouer et danser.
        Longtemps méprisé, il devient dans les années 1960 un symbole d'identité et de contestation ;
        aujourd'hui, femmes et hommes le partagent au léwòz, veillée libre où le public forme le cercle.
        Comme sur la yole, tout repose sur l'écoute de l'autre. Traversons le canal vers Marie-Galante,
        où le tambour ka salue un tout autre défilé.
      en: >-
        Gwoka brings together three arts: singing in Guadeloupean Creole, where a soloist calls out a line
        and the chorus answers, layered rhythms on ka drums, and a dance performed by one person at a time,
        facing the drums. The boula drums keep a steady pattern; the makè, the lead drum, "marks" each of
        the dancer's steps. Its roots go back to the 17th century, when enslaved Africans gathered despite
        the bans to play and dance. Long looked down on, it became a symbol of identity and protest in the
        1960s; today women and men share it at the léwòz, an open night gathering where the audience forms
        the circle. As on the yole, everything rests on listening to one another. We now cross the channel
        to Marie-Galante, where ka drums greet a very different parade.
    look_for:
      fr: >-
        Le dialogue entre le danseur et le makè : chaque mouvement du corps reçoit sa réponse, frappée sur
        la peau du tambour.
      en: >-
        The dialogue between dancer and makè: every movement of the body gets its answer, struck on the
        drumskin.
  - element: 2014_67717_INV_PCI_FRANCE_00359
    heading:
      fr: Marie-Galante, le carnaval en kabwèt
      en: Marie-Galante, the kabwèt carnival
    text:
      fr: >-
        Sur l'île de Marie-Galante, le carnaval culmine à la campagne. Le dimanche gras, deux jours avant
        Mardi gras, une trentaine de charrettes décorées de végétaux, de bois et de matériaux de
        récupération, tirées chacune par une paire de bœufs, parcourent une vingtaine de kilomètres
        jusqu'à la plage du bourg de Saint-Louis. Au XIXe siècle, les familles qui travaillaient la canne
        à sucre y descendaient déjà en charrette ce jour-là. Relancée en 1983, alors que beaucoup
        d'habitants partaient pour la Guadeloupe, la parade est saluée au tambour ka et à la corne de
        lambi ; un jury populaire prime la plus belle charrette, et la fête se prolonge jusqu'au matin
        avec danses et chants de labour. Elle honore aussi le savoir des charrons, aujourd'hui menacé.
        De la terre agricole, passons au continent : en Guyane, le carnaval dure des semaines.
      en: >-
        On the island of Marie-Galante, carnival peaks in the countryside. On the Sunday before Shrove
        Tuesday, some thirty carts decked with plants, wood and salvaged materials, each drawn by a pair
        of oxen, travel about twenty kilometres to the beach of Saint-Louis. In the 19th century, families
        working in sugar cane already rode down there by cart on that day. Revived in 1983, when many
        islanders were leaving for mainland Guadeloupe, the parade is greeted with ka drums and conch-shell
        horns; a popular jury rewards the finest cart, and the festival goes on until morning with dances
        and ploughing songs. It also honours the cartwrights' skills, now under threat. From farmland we
        move to the continent: in Guiana, carnival lasts for weeks.
    look_for:
      fr: >-
        Le son grave de la corne de lambi qui annonce, depuis le bord de la route, l'arrivée des
        attelages.
      en: >-
        The deep call of the conch-shell horn from the roadside, announcing that the ox teams are
        coming.
  - element: 2017_67717_INV_PCI_FRANCE_00389
    heading:
      fr: La Guyane et le Touloulou du bal paré-masqué
      en: Guiana and the Touloulou of the masked ball
    text:
      fr: >-
        En Guyane, le carnaval s'étire du premier dimanche après l'Épiphanie au mercredi des Cendres. Il
        s'ouvre par l'arrivée du roi Vaval, mise en scène autrement chaque année, par la mer ou par les
        airs, et s'achève quand on le brûle. Le dimanche, groupes et orchestres défilent à Cayenne et dans
        les autres communes. Le samedi soir, dans les salles de bal appelées « dancings », règne le
        Touloulou : une femme couverte de la cagoule aux gants, méconnaissable, qui choisit elle-même son
        cavalier. Créé par la société créole guyanaise, enrichi par les apports des migrations
        successives, ce carnaval inverse pour une nuit les rôles entre femmes et hommes. La diaspora
        guyanaise le fait vivre jusque dans la banlieue parisienne. Quittons la côte et remontons le
        Maroni, vers d'autres musiques dansées.
      en: >-
        In French Guiana, carnival stretches from the first Sunday after Epiphany to Ash Wednesday. It
        opens with the arrival of King Vaval, staged differently every year, by sea or by air, and ends
        when he is burnt. On Sundays, groups and bands parade in Cayenne and other towns. On Saturday
        nights, in dance halls known as "dancings", the Touloulou reigns: a woman covered from hood to
        gloves, unrecognisable, who chooses her own dance partner. Created by Guianese Creole society and
        enriched by successive waves of migration, this carnival reverses the roles of women and men for a
        night. The Guianese diaspora keeps it alive as far as the Paris suburbs. Let us leave the coast
        and head up the Maroni river, towards other danced music.
    look_for:
      fr: >-
        L'entrée des Touloulous au bal : aucun centimètre de peau visible, et ce sont elles qui vont
        chercher les hommes.
      en: >-
        The Touloulous arriving at the ball: not an inch of skin showing, and they are the ones who go and
        pick the men.
  - element: 2017_67717_INV_PCI_FRANCE_00388
    heading:
      fr: Sur le Maroni, les musiques dansées aluku
      en: On the Maroni, Aluku danced music
    text:
      fr: >-
        Le long du Maroni et de la Lawa, à Papaïchton, Maripasoula ou Apatou, vivent les Aluku, aussi
        appelés Boni. Leurs ancêtres, réduits en esclavage sur les plantations de l'actuel Suriname, s'en
        sont échappés et ont mené une longue guerre contre l'armée hollandaise avant de traverser le
        fleuve en 1776. Leurs musiques dansées réunissent un orchestre de tambours, des chanteurs et des
        danseurs portant des sonnailles. Le tambour principal, le gaandong, invite les danseurs à entrer ;
        il peut aussi se déplacer vers une danseuse, qui pose le pied sur lui pour faire cesser la musique.
        Le songe, sobre et codifié, et l'awasa, plus libre et joyeuse, se dansent sur l'avant du pied.
        Toutes les générations y prennent part. Comme le gwoka, ces musiques font dialoguer tambour et
        danseur, mais selon les codes d'une société marronne. Changeons d'océan.
      en: >-
        Along the Maroni and Lawa rivers, in Papaïchton, Maripasoula or Apatou, live the Aluku, also
        called Boni. Their ancestors, enslaved on plantations in present-day Suriname, escaped and fought
        a long war against the Dutch army before crossing the river in 1776. Their danced music brings
        together a drum ensemble, singers and dancers wearing rattles. The lead drum, the gaandong, invites
        dancers in; the drummer may even carry it towards a dancer, who sets her foot on it to stop the
        music. The songe, sober and strictly coded, and the awasa, freer and joyful, are danced on the
        balls of the feet. Every generation joins in. Like gwoka, this music sets drum and dancer in
        dialogue, but by the codes of a Maroon society. Time to change oceans.
    look_for:
      fr: >-
        Le moment où une danseuse pose le pied sur le gaandong et où toute la musique s'arrête net.
      en: >-
        The moment a dancer sets her foot on the gaandong and all the music stops dead.
  - element: 2009_67717_INV_PCI_FRANCE_00040
    heading:
      fr: La Réunion, le maloya sorti de l'ombre
      en: Réunion, maloya out of the shadows
    text:
      fr: >-
        À La Réunion, le maloya est né chez les esclaves venus d'Afrique de l'Est et de Madagascar, puis
        s'est créolisé sur les plantations sucrières, au contact des travailleurs engagés venus d'Inde. Un
        soliste lance le chant, un chœur répond ; le roulèr, gros tambour sur lequel on s'assoit, le
        kayanm, hochet de tiges de fleurs de canne, et le bob, arc musical, portent le rythme. Longtemps
        joué à l'abri des regards, lors de cérémonies pour les ancêtres, il gagne l'espace public dans les
        années 1970 et accompagne les luttes politiques. Le conservatoire l'enseigne depuis 1987, et
        quelque 300 groupes le mêlent au rock, au reggae ou au jazz. Comme le gwoka, une musique longtemps
        tenue à l'écart est devenue l'expression de toute une île. Dernière étape, plus au nord, dans
        l'archipel des Comores.
      en: >-
        On Réunion, maloya was born among slaves brought from East Africa and Madagascar, then creolised
        on the sugar plantations, in contact with indentured workers from India. A soloist leads the song
        and a chorus answers; the roulèr, a big drum the player sits astride, the kayanm, a rattle made of
        cane-flower stems, and the bob, a musical bow, drive the rhythm. Long played out of sight, in
        ceremonies for the ancestors, it moved into public space in the 1970s and accompanied political
        struggles. The conservatory has taught it since 1987, and some 300 groups blend it with rock,
        reggae or jazz. As with gwoka, music long kept on the margins has become the voice of a whole
        island. Our last stop lies further north, in the Comoros archipelago.
    look_for:
      fr: >-
        Le musicien assis à califourchon sur le roulèr, qui frappe la peau des deux mains pendant que le
        kayanm bruisse comme une pluie.
      en: >-
        The musician sitting astride the roulèr, striking the skin with both hands while the kayanm
        rustles like rain.
  - element: 2022_67717_INV_PCI_FRANCE_00510
    heading:
      fr: Mayotte, le mawlida shenge sous le bandrabandra
      en: Mayotte, the mawlida shenge under the bandrabandra
    text:
      fr: >-
        À Mayotte, le mawlida shenge appartient à la famille des mawlid, louanges de tradition soufie en
        l'honneur de la naissance du Prophète Muhammad. On dresse sur la place un bandrabandra, enclos
        éphémère de tissus tendus sur une ossature de bois, partagé par le msutru, cordon de tissus
        colorés : d'un côté les hommes, qui chantent les poèmes et jouent des tambours sur cadre ; de
        l'autre les femmes, souvent vêtues du même saluva, qui répondent par le chœur, la danse et des
        gestes codifiés, en grande partie assises. Appris en famille puis à l'école coranique, il marque
        le retour du pèlerinage, la fin d'un deuil, mais aussi des rassemblements syndicaux ou politiques,
        et voyage avec la diaspora mahoraise. Comme le maloya ou le gwoka, il relie toutes les
        générations, mais selon ses propres règles, où le chant fait communiquer deux espaces séparés.
      en: >-
        In Mayotte, the mawlida shenge belongs to the family of mawlid, Sufi praises celebrating the birth
        of the Prophet Muhammad. A bandrabandra is set up on the square, a temporary enclosure of fabric
        stretched over a wooden frame and divided by the msutru, a cord of coloured cloth: on one side the
        men, who sing the poems and play frame drums; on the other the women, often dressed in the same
        saluva, who answer with chorus, dance and coded gestures, mostly seated. Learnt in the family and
        then at Koranic school, it marks the return from pilgrimage, the end of mourning, but also union
        or political rallies, and travels with the Mahoran diaspora. Like maloya or gwoka, it binds all
        generations together, but by its own rules, in which song connects two separate spaces.
    look_for:
      fr: >-
        Les gestes des femmes, de l'autre côté du msutru, qui répondent au chant des hommes au signal
        convenu.
      en: >-
        The women's gestures on the far side of the msutru, answering the men's song on the agreed cue.
outro:
  fr: >-
    De la yole martiniquaise au bandrabandra mahorais, on a croisé des sociétés aux histoires très
    différentes : héritières de l'esclavage et du marronnage, de l'engagisme, de l'islam soufi. Chacune a
    fait d'un bateau, d'un tambour, d'un masque ou d'un chant un lieu où l'on se retrouve et où l'on
    transmet, souvent après des périodes de mépris ou de déclin. Elles changent encore : femmes au
    tambour, scènes, diasporas en Hexagone. Pensez-vous ces traditions comme celles de « l'outre-mer »,
    ou comme celles de la Guadeloupe, de la Guyane, de Mayotte ? Que change ce regard ?
  en: >-
    From the Martinique yole to the Mahoran bandrabandra, we have met societies with very different
    histories: heirs to slavery and marronage, to indentured labour, to Sufi Islam. Each has turned a
    boat, a drum, a mask or a song into a place to gather and pass things on, often after periods of
    contempt or decline. They are still changing: women at the drums, stages, diasporas in mainland
    France. Do you think of these traditions as those of "overseas France", or as those of Guadeloupe,
    Guiana, Mayotte? What difference does that make?
