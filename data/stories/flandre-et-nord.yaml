id: flandre-et-nord
kind: place
title:
  fr: La Flandre et le Nord, pays des géants
  en: Flanders and the Nord, land of giants
tagline:
  fr: >-
    Du port de Grand-Fort-Philippe aux rues de Douai, des géants qu'on baptise, des bandes de carnaval et des
    jeux de boules nés dans la cour des estaminets.
  en: >-
    From the harbour of Grand-Fort-Philippe to the streets of Douai: giants who are christened, carnival
    bands and bowling games born in the yards of estaminets.
intro:
  fr: >-
    Dans le Nord de la France, de la côte de la mer du Nord aux villes de l'ancien bassin industriel, les
    habitants se donnent rendez-vous autour de figures qu'ils portent, font danser et considèrent comme
    des membres de la famille : les géants. Autour d'eux gravitent des carnavals, des danses, des bandes
    de musiciens et de carnavaleux, mais aussi des jeux plus discrets, pratiqués entre voisins. Ce parcours
    suit la côte, monte vers les monts de Flandre, longe la frontière belge puis descend vers la métropole
    lilloise et Douai. Le fil conducteur : une sociabilité qui se vit en groupe, dehors ou au café, et qui
    se transmet en portant, en jouant, en défilant ensemble.
  en: >-
    In northern France, from the North Sea coast to the towns of the old industrial basin, people gather
    around figures they carry, make dance and treat as members of the family: the giants. Around them
    move carnivals, dances, bands of musicians and revellers, and quieter games played among neighbours.
    This tour follows the coast, climbs to the hills of Flanders, runs along the Belgian border, then
    heads down to the Lille area and Douai. The common thread: a sociability lived as a group, outdoors
    or in the café, and passed on by carrying, playing and parading together.
steps:
  - element: 2013_67717_INV_PCI_FRANCE_00323
    heading:
      fr: Grand-Fort-Philippe, la géante Matelote
      en: Grand-Fort-Philippe, the giant Matelote
    text:
      fr: >-
        Le voyage commence à l'embouchure de l'Aa, dans le port de pêche de Grand-Fort-Philippe. Au
        printemps, la géante Matelote, habillée en femme de marin avec bonnet de dentelle et tablier noir,
        reçoit les géants des communes voisines. La fête met en scène la vie de sa famille : fiançailles,
        mariage, naissances, avec de vrais actes signés en mairie lors de baptêmes civils. Les géants de
        la famille gardent la mémoire du métier, comme le géant qui tient une pomme de touline, nœud de
        marin. Des harengs sont lancés à la foule depuis le balcon de la mairie. D'emblée, une idée
        s'impose : ici, un géant n'est pas un décor, c'est un personnage de la communauté.
      en: >-
        The journey starts at the mouth of the Aa, in the fishing port of Grand-Fort-Philippe. In spring,
        the giant Matelote, dressed as a sailor's wife with a lace bonnet and black apron, welcomes giants
        from neighbouring towns. The festival stages her family's life: engagement, wedding, births, with
        real certificates signed at the town hall during civil christenings. The family's giants carry the
        memory of the trade, such as the one holding a monkey's fist, a sailor's knot. Herrings are thrown
        to the crowd from the town hall balcony. One idea comes through at once: here a giant is not a
        decoration but a member of the community.
    look_for:
      fr: >-
        Le costume de Matelote, coiffe de dentelle blanche et châle, et les objets de marin que portent
        les autres géants de sa famille.
      en: >-
        Matelote's costume, with its white lace cap and shawl, and the seafaring objects carried by the
        other giants of her family.
  - element: 2021_67717_INV_PCI_FRANCE_00496
    heading:
      fr: Dunkerque, la danse d'épées
      en: Dunkirk, the sword dance
    text:
      fr: >-
        Quelques kilomètres plus à l'est, sur la place Jean-Bart de Dunkerque, huit danseurs vêtus de
        blanc et de bleu forment une ronde en tenant chacun la pointe de l'épée de son voisin. Au son des
        fifres et des tambours, ils enchaînent pendant un quart d'heure des figures qui passent dessus,
        dessous, autour des lames, jusqu'à l'étoile finale sur laquelle monte le capitaine. Recréée en
        1990, la danse se rattache à une famille de danses d'épées connue dans toute l'Europe ; elle a
        lieu le deuxième dimanche après le mardi gras, en plein cœur de la saison du carnaval. Une
        tradition peut donc renaître : la danse vit grâce à une association de bénévoles qui forme aussi
        des enfants.
      en: >-
        A few kilometres east, on the Place Jean-Bart in Dunkirk, eight dancers in white and blue form a
        ring, each holding the tip of a neighbour's sword. To fifes and drums, for a quarter of an hour
        they move through figures that pass over, under and around the blades, ending with a star on which
        the captain climbs. Revived in 1990, the dance belongs to a family of sword dances found across
        Europe; it takes place on the second Sunday after Shrove Tuesday, right in the middle of carnival
        season. So a tradition can be reborn: the dance lives through a volunteer association that also
        trains children.
    look_for:
      fr: >-
        L'étoile formée par les épées entrecroisées à la fin de la danse, et le capitaine qui monte dessus
        en brandissant le drapeau.
      en: >-
        The star made of interlocked swords at the end of the dance, and the captain climbing onto it
        waving the flag.
  - element: 2014_67717_INV_PCI_FRANCE_00354
    heading:
      fr: Wormhout, faire la bande
      en: Wormhout, joining the band
    text:
      fr: >-
        En s'enfonçant dans les terres, on arrive à Wormhout, où le carnaval suit le modèle du littoral
        dunkerquois. Un millier de carnavaleux, maquillés et vêtus de leur « klet'che » coloré, suivent la
        bande des Mitrons et le tambour-major costumé en soldat d'Empire. On s'arrête devant la mairie pour
        le jet de harengs, on se serre dans le « chahut », on se retrouve ensuite dans les « chapelles »,
        maisons ouvertes aux amis. Les géants de la ville sont de la fête, et le samedi est réservé aux
        enfants, avec des bonbons à la place des harengs. Après la ronde ordonnée des épées, voici la
        foule qui marche, chante et pousse d'un même élan.
      en: >-
        Heading inland, we reach Wormhout, where carnival follows the model of the Dunkirk coast. About a
        thousand carnival-goers, made up and dressed in their colourful "klet'che", follow the Mitrons band
        and a drum major dressed as an Empire soldier. There is the herring throw at the town hall, the
        crush of the "chahut", then gatherings in the "chapelles", homes opened to friends. The town's
        giants join in, and Saturday is the children's carnival, with sweets instead of herrings. After
        the orderly ring of swords, here is a crowd that walks, sings and pushes as one.
    look_for:
      fr: >-
        Le chahut : les premiers rangs de la bande s'arrêtent et résistent à la poussée de ceux qui
        suivent.
      en: >-
        The chahut: the front rows of the band stop and hold firm against the push of those behind.
  - element: 2013_67717_INV_PCI_FRANCE_00322
    heading:
      fr: Cassel, Reuze Papa et Reuze Maman
      en: Cassel, Reuze Papa and Reuze Maman
    text:
      fr: >-
        Perchée sur son mont, Cassel fête deux carnavals, le plus grand le lundi de Pâques. Les tambours
        réveillent la ville dès l'aube, puis Reuze Papa et Reuze Maman, dont le nom vient du mot flamand
        pour « géant », dansent sur la grand-place, entourés du cheval-jupon et du char du Four merveilleux.
        Devant certaines maisons, les deux géants se font face pour une « ritournelle ». Les géants
        d'origine, nés au XIXe siècle et cachés pendant les deux guerres, sont aujourd'hui conservés au
        musée ; des répliques fidèles ont pris le relais. Le carnaval de Cassel fait partie des géants et
        dragons processionnels inscrits par l'UNESCO. On voit ici comment une ville protège l'objet tout en
        gardant le geste vivant.
      en: >-
        Perched on its hill, Cassel holds two carnivals, the larger on Easter Monday. Drums wake the town
        at dawn, then Reuze Papa and Reuze Maman, named after the Flemish word for "giant", dance on the
        main square with the hobby horse and the float of the Marvellous Oven. Outside certain houses the
        two giants face each other for a "ritournelle". The original giants, born in the 19th century and
        hidden during both world wars, are now kept in the museum; faithful replicas have taken over.
        Cassel's carnival is part of the processional giants and dragons inscribed by UNESCO. Here we see
        how a town protects the object while keeping the gesture alive.
    look_for:
      fr: >-
        La ritournelle, quand les deux géants se font face et « s'embrassent » devant une maison qu'on veut
        honorer.
      en: >-
        The ritournelle, when the two giants face each other and "kiss" outside a house the town wants to
        honour.
  - element: 2013_67717_INV_PCI_FRANCE_00324
    heading:
      fr: Steenvoorde, la ronde européenne des géants
      en: Steenvoorde, the European round of giants
    text:
      fr: >-
        Au pied des monts, Steenvoorde fête depuis l'après-guerre un carnaval d'été autour de ses géants,
        dont Jean le Bûcheron, casqué, la hache à l'épaule, héros légendaire du village. Certaines années,
        une ronde européenne y réunit jusqu'à une centaine de géants portés venus de plusieurs pays. On
        dit ici qu'un géant qui n'est pas porté ne danse pas, et donc ne vit pas : d'où l'importance des
        porteurs, et d'une section d'enfants qui apprend le portage avec un petit géant. Le soir, la fête se
        prolonge en musique dans les estaminets. Après Cassel, Steenvoorde montre l'autre visage de la
        tradition : l'ouverture, l'échange avec des villes de Belgique et d'ailleurs.
      en: >-
        At the foot of the hills, Steenvoorde has held a summer carnival since the post-war years around
        its giants, including Jean the Woodcutter, helmeted, axe on shoulder, the village's legendary hero.
        In some years a European round brings together up to a hundred carried giants from several
        countries. People here say that a giant who is not carried does not dance, and so does not live:
        hence the importance of carriers, and of a children's section that learns to carry with a small
        giant. In the evening the party carries on with music in the estaminets. After Cassel, Steenvoorde
        shows another side of tradition: openness and exchange with towns in Belgium and beyond.
    look_for:
      fr: >-
        Les jambes des porteurs sous la jupe des géants, et la façon dont ils les font tourner et danser.
      en: >-
        The carriers' legs under the giants' skirts, and how they make the giants spin and dance.
  - element: 2012_67717_INV_PCI_FRANCE_00241
    heading:
      fr: Godewaersvelde, la boule flamande
      en: Godewaersvelde, Flemish bowls
    text:
      fr: >-
        Tout près de la frontière belge, Godewaersvelde garde un jeu de précision longtemps pratiqué dans
        la cour des cafés et des estaminets : la boule flamande. Sur une piste légèrement creusée, la
        bourloire, on fait rouler non pas une boule mais un disque de bois, plus lourd d'un côté, qui
        décrit une courbe avant de s'arrêter près de l'étaque, rondelle de cuivre incrustée dans le sol.
        Deux équipes, rouge et bleue, s'affrontent sous la conduite d'un meneur qui décide de la
        stratégie. Autrefois en terre battue mêlée de bouse, la piste est aujourd'hui en ciment et
        couverte. Après les grands cortèges, voici la sociabilité de tous les jours, entre voisins.
      en: >-
        Close to the Belgian border, Godewaersvelde keeps a game of precision long played in the yards of
        cafés and estaminets: Flemish bowls. On a slightly hollowed track, the bourloire, players roll not
        a ball but a wooden disc, heavier on one side, which curves before stopping near the étaque, a
        copper disc set into the ground. Two teams, red and blue, compete under a leader who decides the
        strategy. Once made of beaten earth mixed with dung, the track is now concrete and covered. After
        the great parades, this is everyday sociability, among neighbours.
    look_for:
      fr: >-
        La trajectoire en courbe du disque, qui penche du côté le plus lourd avant de s'arrêter.
      en: >-
        The curving path of the disc, leaning towards its heavier side before it stops.
  - element: 2012_67717_INV_PCI_FRANCE_00242
    heading:
      fr: Tourcoing, la bourle
      en: Tourcoing, the bourle
    text:
      fr: >-
        Dans la métropole lilloise, autour de Tourcoing et de Wattrelos, un jeu cousin se pratique de part
        et d'autre de la frontière : la bourle. Son nom vient du picard « bourler », tomber, car le disque
        de bois cerclé d'acier finit presque toujours sa course couché sur le côté. Les bourloires se
        trouvaient jadis au fond des cabarets ou dans la cour des estaminets, et l'on y jouait le dimanche
        après la messe ; aujourd'hui, des sociétés ouvrent leurs pistes presque toute la semaine. De
        Godewaersvelde à Tourcoing, le même principe change de nom, de bois et de langue : flamand d'un
        côté, picard de l'autre. Le voyage peut finir avec les plus anciens géants du parcours.
      en: >-
        In the Lille area, around Tourcoing and Wattrelos, a related game is played on both sides of the
        border: the bourle. Its name comes from the Picard "bourler", to fall, because the steel-rimmed
        wooden disc nearly always ends up on its side. Bourle tracks used to lie at the back of taverns or
        in the yards of estaminets, and people played on Sunday after mass; today clubs open their tracks
        almost every day of the week. From Godewaersvelde to Tourcoing, the same idea changes its name, its
        wood and its language: Flemish on one side, Picard on the other. The journey can now end with the
        oldest giants of the tour.
    look_for:
      fr: >-
        Le moment où la bourle ralentit, oscille, puis tombe sur le flanc près de l'étaque.
      en: >-
        The moment the bourle slows, wobbles and falls on its side near the étaque.
  - element: 2014_67717_INV_PCI_FRANCE_00350
    heading:
      fr: Douai, la famille Gayant
      en: Douai, the Gayant family
    text:
      fr: >-
        À Douai, un géant est attesté dès 1530 et sa compagne l'année suivante ; leurs trois enfants sont
        venus plus tard. Chaque été, début juillet, Monsieur Gayant, plus de huit mètres, Madame Gayant et
        leurs enfants Jacquot, Fillon et le petit Binbin défilent trois jours au son des tambours. Les
        tout-petits sont soulevés pour embrasser Binbin. Détruits plusieurs fois, notamment par les
        guerres, les géants ont toujours été refaits. Ils sont portés par une corporation aux règles
        transmises surtout en famille, où l'on commence comme quêteur. Les fêtes de Gayant, inscrites par
        l'UNESCO avec Cassel, bouclent le parcours : une ville entière qui se reconnaît dans une famille de
        géants.
      en: >-
        In Douai, a giant is recorded as early as 1530 and his companion the following year; their three
        children came later. Every summer, in early July, Monsieur Gayant, over eight metres tall, Madame
        Gayant and their children Jacquot, Fillon and little Binbin parade for three days to the beat of
        drums. Toddlers are lifted up to kiss Binbin. Destroyed several times, not least by wars, the
        giants have always been rebuilt. They are carried by a guild whose rules pass down mostly within
        families, where one starts as a collector. The Gayant festival, inscribed by UNESCO alongside
        Cassel, closes the tour: a whole town that recognises itself in a family of giants.
    look_for:
      fr: >-
        Le rigodon, la danse des géants lancée au signal des chefs de protocole, et le baiser de Binbin aux
        tout-petits.
      en: >-
        The rigodon, the giants' dance launched at the protocol leaders' signal, and Binbin's kiss for the
        little ones.
outro:
  fr: >-
    De la côte à Douai, les géants ont des noms, des familles, des actes de baptême, des répliques et des
    porteurs formés dès l'enfance ; les carnavals ont leurs bandes, leurs chapelles, leurs chahuts ; les
    jeux de boules leurs pistes au fond des cafés. Certaines traditions sont très anciennes, d'autres
    renaissent ou se transforment, et toutes passent volontiers la frontière belge. Selon vous, qu'est-ce
    qui fait qu'un objet porté devient un membre de la communauté ?
  en: >-
    From the coast to Douai, giants have names, families, christening certificates, replicas and carriers
    trained from childhood; carnivals have their bands, their chapelles and their crushes; bowling games
    have their tracks at the back of cafés. Some traditions are very old, others are revived or changed,
    and all of them cross the Belgian border readily. What, in your view, turns a carried object into a
    member of the community?
