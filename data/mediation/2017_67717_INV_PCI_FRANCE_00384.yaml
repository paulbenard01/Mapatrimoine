id: 2017_67717_INV_PCI_FRANCE_00384
audience: general
questions:
  fr:
    - Pour couvrir un toit courbe, le couvreur façonne la feuille de zinc à la batte de bois sur l'établi ; que révèle ce geste sur le rapport entre la main, l'outil et le matériau ?
    - Certains couvreurs laissent un objet caché sous la couverture, que d'autres retrouveront des décennies plus tard ; que dit cette coutume du lien entre les générations d'un métier ?
    - Toits végétalisés, panneaux solaires, chaleur des étés ; comment un savoir-faire né au XIXe siècle peut-il trouver sa place dans la ville de demain ?
    - L'UNESCO reconnaît ici les gestes des artisans plutôt que les toits eux-mêmes ; pourquoi, selon vous, distinguer le savoir-faire du monument ?
    - Regardez les toits de votre ville ou de votre village ; quels matériaux et quels métiers y voyez-vous, et les remarquiez-vous avant ?
  en:
    - To cover a curved roof, the roofer shapes the zinc sheet with a wooden mallet on the workbench; what does this gesture reveal about the link between hand, tool and material?
    - Some roofers leave an object hidden under the roofing for others to find decades later; what does this custom say about the bond between generations in a trade?
    - Green roofs, solar panels, hotter summers; how can a skill born in the 19th century find its place in the city of tomorrow?
    - Here UNESCO recognises craftspeople's skills rather than the roofs themselves; why do you think it matters to separate the skill from the monument?
    - Look at the roofs of your own town or village; which materials and trades do you see there, and had you noticed them before?
vocabulary:
  - fr: couvreur zingueur
    en: roofer-zinc worker
    def_fr: Artisan qui pose et répare les couvertures de toits ; à Paris, son nom est lié au zinc, matériau principal des toits.
    def_en: Craftsperson who lays and repairs roof coverings; in Paris the name is tied to zinc, the main roofing material.
  - fr: ornemaniste
    en: ornamentalist
    def_fr: Artisan qui travaille le zinc en atelier pour fabriquer fenêtres de toit et décors, en copiant d'anciens modèles ou en créant de nouveaux.
    def_en: Craftsperson who works zinc in the workshop to make roof windows and decorations, copying old models or creating new ones.
  - fr: zinc laminé
    en: rolled zinc
    def_fr: Zinc aplati en feuilles minces et légères ; sa fabrication au XIXe siècle a permis d'en couvrir des milliers d'immeubles parisiens.
    def_en: Zinc flattened into thin, light sheets; its production in the 19th century made it possible to roof thousands of Paris buildings.
  - fr: tasseau
    en: batten
    def_fr: Baguette de bois fixée sur le toit entre deux feuilles de zinc, recouverte d'un couvre-joint ; elle dessine les lignes des toits parisiens.
    def_en: Wooden strip fixed to the roof between two zinc sheets and capped with a cover strip; it draws the lines of Paris roofs.
  - fr: brisis et terrasson
    en: lower and upper slope
    def_fr: Les deux pentes du toit à la Mansart ; le brisis, raide, souvent en ardoise, et le terrasson, presque plat, en zinc.
    def_en: The two slopes of a mansard roof; the steep lower one, often slate, and the almost flat upper one, covered in zinc.
  - fr: toit à l'impériale
    en: imperial roof
    def_fr: Toit bombé qui rappelle une coque de bateau renversée, apparu rue de Rivoli ; le zinc doit y être cintré avec soin.
    def_en: Domed roof recalling an upturned boat hull, first seen on the rue de Rivoli; the zinc on it has to be carefully curved.
  - fr: gouttière anglaise
    en: English gutter
    def_fr: Gouttière en zinc posée en bordure du toit, typique des immeubles parisiens, dont la pose demande un savoir-faire particulier.
    def_en: Zinc gutter fitted along the edge of the roof, typical of Paris buildings, whose fitting calls for particular skill.
  - fr: batte
    en: mallet
    def_fr: Maillet en bois avec lequel le couvreur frappe la feuille de zinc pour la plier ou la courber sans la marquer.
    def_en: Wooden mallet the roofer uses to strike the zinc sheet to fold or curve it without marking it.
context:
  fr: >-
    Sur les toits de Paris, le couvreur zingueur pose le zinc, mais aussi le plomb, le cuivre, l'ardoise et la tuile plate, et surtout sait les raccorder entre eux. Le métier s'est formé au XIXe siècle, quand la fabrication de feuilles de zinc laminé a rencontré les grands travaux du Second Empire : des dizaines de milliers d'immeubles haussmanniens ont reçu des toits à la Mansart, avec un brisis en ardoise et un terrasson en zinc. Aujourd'hui, la grande majorité des toits parisiens sont en zinc et dessinent un paysage gris-bleu qui change avec la lumière.

    Plus d'un millier de couvreurs travaillent à Paris et en proche banlieue, à côté d'ornemanistes qui fabriquent en atelier lucarnes et décors. Le métier s'apprend en alternance dans des centres de formation et sur les chantiers, où les gestes se transmettent des anciens aux apprentis.
  en: >-
    On the roofs of Paris, the roofer-zinc worker lays zinc, but also lead, copper, slate and flat tiles, and above all knows how to join them together. The trade took shape in the 19th century, when the production of rolled zinc sheets met the great building works of the Second Empire: tens of thousands of Haussmann-era buildings received mansard roofs, with a slate lower slope and a zinc upper slope. Today the great majority of Paris roofs are zinc and form a blue-grey landscape that changes with the light.

    More than a thousand roofers work in Paris and its inner suburbs, alongside ornamentalists who make dormers and decorations in workshops. The trade is learnt through work-study in training centres and on building sites, where skills are passed from experienced workers to apprentices.
unesco:
  fr: >-
    Les savoir-faire des couvreurs-zingueurs parisiens et des ornemanistes sont inscrits depuis 2024 sur la Liste représentative du patrimoine culturel immatériel de l'humanité, dans un dossier présenté par la France seule. L'inscription ne porte pas sur les toits de Paris comme monument : elle reconnaît les gestes et les connaissances qui permettent de les restaurer, de la découpe du zinc à la fabrication des ornements, ainsi que leur transmission par l'apprentissage. Elle engage l'État et la communauté du métier à garantir que ces savoir-faire continuent d'être appris et pratiqués.
  en: >-
    The skills of Parisian zinc roofers and ornamentalists have been on the Representative List of the Intangible Cultural Heritage of Humanity since 2024, in a file submitted by France alone. The inscription is not about the roofs of Paris as a monument: it recognises the skills and knowledge used to restore them, from cutting zinc to making ornaments, and how they are handed on through apprenticeship. It commits the State and the trade community to making sure these skills keep being learnt and practised.
activity:
  title_fr: Une lettre cachée sous le toit
  title_en: A letter hidden under the roof
  fr: >-
    Imaginez que vous êtes apprenti couvreur et que vous terminez la réfection d'un toit de Paris. Comme le veut une coutume du métier, vous glissez sous la couverture un message que d'autres couvreurs trouveront dans cinquante ans. Écrivez cette lettre en une dizaine de lignes : décrivez le chantier, vos outils, ce que vous voyez du toit et une question pour celui ou celle qui la lira. Lisez quelques lettres à voix haute et discutez de ce qui aura changé, selon vous, dans cinquante ans.
  en: >-
    Imagine you are an apprentice roofer finishing the repair of a Paris roof. As a custom of the trade has it, you slip a message under the roofing for other roofers to find in fifty years. Write this letter in about ten lines: describe the job, your tools, what you see from the roof and one question for whoever reads it. Read a few letters aloud and discuss what you think will have changed in fifty years.
  levels: [middle, high]
lang_review: draft
