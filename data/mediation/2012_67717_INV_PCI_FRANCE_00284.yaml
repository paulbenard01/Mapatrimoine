id: 2012_67717_INV_PCI_FRANCE_00284
audience: general
questions:
  fr:
    - Dans la ronde du léwòz, le tambour makè suit chaque pas du danseur. Observez ou écoutez ce dialogue. Qui mène, selon vous, le danseur ou le tambour ?
    - Pourquoi, selon vous, des personnes mises en esclavage ont-elles continué à jouer du tambour, à chanter et à danser malgré les interdits ?
    - Autrefois, peu de femmes dansaient dans la ronde ; aujourd'hui elles chantent, dansent et jouent du tambour. Qu'est-ce que ce changement dit d'une tradition vivante ?
    - Le gwoka est reconnu par l'UNESCO comme une pratique représentative de l'identité guadeloupéenne. Qu'est-ce que cette reconnaissance peut apporter aux habitants de l'île et à ceux qui vivent loin d'elle ?
    - Dans votre vie, quelle musique ou quelle danse se pratique en cercle, où chacun peut entrer à son tour ?
  en:
    - In the léwòz circle the makè drum follows the dancer's every step. Watch or listen to this dialogue. Who do you think leads, the dancer or the drum?
    - Why do you think enslaved people kept on drumming, singing and dancing despite the bans?
    - In the past few women danced in the circle; today they sing, dance and play the drum. What does this change say about a living tradition?
    - UNESCO recognises gwoka as a practice representative of Guadeloupean identity. What can this recognition bring to the island's people and to those who live far away from it?
    - In your own life, which music or dance takes place in a circle that everyone can enter in turn?
vocabulary:
  - fr: tambour ka
    en: ka drum
    def_fr: Famille de tambours du gwoka (makè et boula) ; leur fabrication est un savoir-faire transmis en atelier, qui se renouvelle par l'expérimentation.
    def_en: Family of gwoka drums (makè and boula); making them is a skill passed on in workshops and renewed through experiment.
  - fr: makè
    en: makè
    def_fr: Tambour soliste qui « marque » en sons les gestes, les pas et les attitudes du danseur, tout en improvisant lui-même.
    def_en: Lead drum that "marks" the dancer's gestures, steps and attitudes in sound, while improvising in its own right.
  - fr: boula
    en: boula
    def_fr: Tambour, souvent joué à deux ou trois, qui répète un motif rythmique régulier sur lequel s'appuient le danseur et le makè.
    def_en: Drum, often played two or three at a time, that repeats a steady rhythmic pattern on which the dancer and the makè build.
  - fr: chacha
    en: chacha
    def_fr: Hochet fait d'une calebasse vidée puis remplie de graines dures, secoué pour compléter les rythmes des tambours.
    def_en: Rattle made from a hollowed-out calabash filled with hard seeds, shaken to complete the drum rhythms.
  - fr: léwòz
    en: léwòz
    def_fr: Soirée de gwoka, libre et gratuite, où musiciens, chanteurs et public forment un grand cercle ; c'est aussi le nom d'un des rythmes.
    def_en: Free gwoka evening, open to all, where musicians, singers and audience form a large circle; it is also the name of one of the rhythms.
  - fr: lawonn
    en: lawonn (the circle)
    def_fr: Cercle formé par les participants du léwòz ; son centre reste libre pour les danseurs qui entrent tour à tour face aux tambours.
    def_en: Circle formed by the people at a léwòz; its centre is left free for the dancers, who step in one at a time to face the drums.
  - fr: chant responsorial
    en: call and response
    def_fr: Chant où un soliste lance une phrase en créole et où le chœur, souvent tout le public, lui répond par un refrain.
    def_en: Singing in which a soloist calls out a line in Creole and the chorus, often the whole audience, answers with a refrain.
  - fr: tanbouyé
    en: tanbouyé (drummer)
    def_fr: Joueur ou joueuse de tambour ka ; on distingue celui qui joue le makè de ceux qui tiennent les boula.
    def_en: Player of the ka drum; the one who plays the makè is distinguished from those who play the boula.
context:
  fr: >-
    Le gwoka réunit trois arts : un chant en créole guadeloupéen où un soliste lance une phrase reprise par le chœur, des rythmes superposés joués sur les tambours ka, et une danse toujours exécutée par une seule personne à la fois, face aux tambours. Le tambour makè dialogue avec le danseur et met ses pas en valeur, tandis que les boula tiennent l'un des sept rythmes de base. Le gwoka se vit surtout au léwòz, soirée ouverte à tous où le public forme un cercle, frappe des mains et répond au chanteur ; on le joue aussi dans la rue, sur scène, aux veillées funèbres ou lors des fêtes de Pâques au bord de la mer.

    Ses racines remontent au XVIIe siècle : des Africains déportés et mis en esclavage en Guadeloupe se rassemblaient malgré les interdits pour jouer, chanter et danser. Méprisé pendant longtemps, le gwoka devient à partir des années 1960 un symbole d'identité et de contestation, puis s'étend à toute la société. Aujourd'hui, il s'apprend en famille, entre amis et dans des écoles et associations, et donne naissance à des formes nouvelles jouées sur scène.
  en: >-
    Gwoka brings together three arts: singing in Guadeloupean Creole in which a soloist calls out a line that the chorus takes up, layered rhythms played on ka drums, and a dance always performed by one person at a time, facing the drums. The makè drum talks with the dancer and highlights their steps, while the boula drums hold one of the seven basic rhythms. Gwoka is lived above all at the léwòz, an evening open to everyone where the audience forms a circle, claps and answers the singer; it is also played in the street, on stage, at wakes and at Easter seaside gatherings.

    Its roots go back to the 17th century: Africans deported and enslaved in Guadeloupe gathered despite the bans to play, sing and dance. Long looked down upon, gwoka became a symbol of identity and protest from the 1960s, then spread through the whole of society. Today it is learnt in families, among friends and in schools and associations, and it gives rise to new forms performed on stage.
unesco:
  fr: >-
    Le gwoka est inscrit depuis 2014 sur la Liste représentative du patrimoine culturel immatériel de l'humanité, dans un dossier présenté par la France pour la Guadeloupe. L'inscription ne désigne pas un style musical « supérieur » : elle reconnaît une pratique vivante, partagée par toutes les composantes de la société guadeloupéenne, porteuse de convivialité, de résistance et de dignité. Elle engage les communautés et l'État à la sauvegarder, par exemple en soutenant la transmission aux enfants, la fabrication des tambours et les léwòz ouverts à tous.
  en: >-
    Gwoka has been on the Representative List of the Intangible Cultural Heritage of Humanity since 2014, in a file submitted by France for Guadeloupe. The inscription does not name a "superior" musical style: it recognises a living practice shared by every part of Guadeloupean society and carrying values of conviviality, resistance and dignity. It commits the communities and the State to safeguarding it, for instance by supporting transmission to children, drum-making and léwòz evenings open to all.
activity:
  title_fr: Une ronde de gwoka avec les mains et la voix
  title_en: A gwoka circle with hands and voices
  fr: >-
    Écoutez d'abord un court enregistrement de léwòz et repérez à l'oreille le chant du soliste, la réponse du chœur et les tambours. Formez ensuite un cercle. Un groupe tape sur les tables ou les cuisses un motif régulier, comme les boula. Un élève volontaire, le makè, frappe dans ses mains pour accompagner chaque geste d'un camarade qui entre seul au centre et invente quelques pas ; les autres reprennent un refrain simple. On change de rôles plusieurs fois, puis on discute : qu'est-ce qui était le plus difficile, écouter ou suivre ?
  en: >-
    First listen to a short recording of a léwòz and pick out by ear the soloist's singing, the chorus's answer and the drums. Then form a circle. One group taps a steady pattern on tables or thighs, like the boula drums. A volunteer, the makè, claps to accompany every gesture of a classmate who steps alone into the centre and invents a few moves; the others sing a simple refrain. Swap roles several times, then discuss: what was hardest, listening or following?
  levels: [primary, middle, high]
