id: 2015_67717_INV_PCI_FRANCE_00370
audience: general
questions:
  fr:
    - "Pourquoi, selon vous, les femmes qui lavent les marches de la Madeleine sont-elles vêtues de blanc et jettent-elles de l'eau parfumée et des fleurs ?"
    - "Venu d'une fête religieuse de Bahia, le lavage est devenu à Paris un festival de culture brésilienne : que garde et que perd un rituel quand il voyage avec une diaspora ?"
    - "Quelles fêtes apportées par des habitants venus d'ailleurs font aujourd'hui partie de la vie de votre ville ?"
  en:
    - "Why do you think the women who wash the steps of the Madeleine are dressed in white and throw perfumed water and flowers?"
    - "Born from a religious festival in Bahia, the washing has become a festival of Brazilian culture in Paris: what does a ritual keep, and lose, when it travels with a diaspora?"
    - "Which festivals brought by people from elsewhere are now part of life in your own town?"
vocabulary:
  - fr: baiana
    en: baiana
    def_fr: "Femme portant le costume traditionnel blanc de Bahia ; les baianas ouvrent le cortège et lavent les marches de l'église."
    def_en: "Woman wearing the traditional white dress of Bahia; the baianas lead the procession and wash the church steps."
  - fr: candomblé
    en: candomblé
    def_fr: "Religion afro-brésilienne qui honore des divinités d'origine africaine, les orixás ; les lavages d'églises en reprennent des gestes de purification."
    def_en: "Afro-Brazilian religion honouring deities of African origin, the orixás; the church washings echo its purification rites."
  - fr: syncrétisme
    en: syncretism
    def_fr: "Mélange de croyances d'origines différentes ; à Bahia, des divinités du candomblé ont été associées à des figures catholiques, comme Oxalá au Christ du Bonfim."
    def_en: "Blending of beliefs from different origins; in Bahia, candomblé deities were linked to Catholic figures, such as Oxalá with the Christ of Bonfim."
  - fr: batucada
    en: batucada
    def_fr: "Ensemble de percussions brésiliennes guidé par un maître au sifflet ; une batucada parisienne anime le défilé depuis la première édition."
    def_en: "Brazilian percussion group led by a master with a whistle; a Paris batucada has played in the parade since the very first edition."
  - fr: trio elétrico
    en: trio elétrico
    def_fr: "Camion équipé d'une puissante sonorisation, qui ferme le cortège et sert de scène mobile à la musique populaire brésilienne."
    def_en: "Lorry fitted with a powerful sound system that closes the procession and acts as a moving stage for Brazilian popular music."
lang_review: draft
review_status: unreviewed
