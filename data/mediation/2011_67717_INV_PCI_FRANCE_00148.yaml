id: 2011_67717_INV_PCI_FRANCE_00148
audience: general
questions:
  fr:
    - Pourquoi, selon vous, hisse-t-on un drapeau au sommet du clocher pour annoncer que les reliques vont être montrées ?
    - Comment une fête religieuse qui ne revient que tous les sept ans peut-elle réunir croyants et non-croyants autour des mêmes préparatifs ?
    - Observez les rues décorées de fleurs et de guirlandes de couleurs différentes selon les quartiers. Que disent ces décors de la façon dont les habitants s'organisent ?
    - Les ostensions sont reconnues par l'UNESCO. Qu'est-ce que cette reconnaissance peut changer pour des bénévoles qui préparent une fête tous les sept ans, et qu'est-ce qu'elle ne change pas ?
    - Quel événement de votre région ne revient qu'à de longs intervalles, et comment se transmet-il d'une édition à l'autre ?
  en:
    - Why do you think a flag is hoisted to the top of the church tower to announce that the relics are about to be shown?
    - How can a religious festival that comes round only every seven years bring believers and non-believers together around the same preparations?
    - Look at the streets decorated with flowers and garlands whose colours differ from one district to another. What do these decorations say about how residents organise themselves?
    - The ostensions are recognised by UNESCO. What can this recognition change for volunteers who prepare a festival every seven years, and what does it leave unchanged?
    - Which event in your own region returns only after a long gap, and how is it passed on from one edition to the next?
vocabulary:
  - fr: ostension
    en: ostension
    def_fr: Du latin ostendere, « montrer » ; présentation solennelle des reliques d'un saint aux fidèles, accompagnée de processions.
    def_en: From the Latin ostendere, "to show"; the solemn display of a saint's relics to the faithful, with processions.
  - fr: relique
    en: relic
    def_fr: Reste du corps d'un saint, ou objet lui ayant appartenu, conservé et vénéré dans une église.
    def_en: Part of a saint's body, or an object that belonged to the saint, kept and venerated in a church.
  - fr: reliquaire
    en: reliquary
    def_fr: Coffret ou châsse, souvent richement orné, qui renferme les reliques d'un saint ; sans reliquaire, pas d'ostension.
    def_en: Casket or shrine, often richly decorated, that holds a saint's relics; without it, no ostension can take place.
  - fr: confrérie
    en: confraternity
    def_fr: Association de laïcs qui garde les reliques et la mémoire du rituel et transmet protocole, costumes, décors et parcours des processions.
    def_en: Association of lay people who look after the relics and the memory of the ritual, and pass on protocol, costumes, decorations and routes.
  - fr: comité ostensionnaire
    en: ostension committee
    def_fr: Groupe de bénévoles qui organise les ostensions dans une commune, parfois créé pour faire revivre une tradition interrompue.
    def_en: Group of volunteers who organise the ostensions in a commune, sometimes set up to revive a tradition that had lapsed.
  - fr: drapeau des ostensions
    en: ostension flag
    def_fr: Drapeau hissé en haut du clocher, avec l'aide des pompiers, pour marquer l'ouverture des ostensions ; on le redescend à la clôture.
    def_en: Flag raised to the top of the church tower, with the help of the fire brigade, to open the ostensions; it comes down at the close.
  - fr: cortège historique
    en: historical procession
    def_fr: Partie de la procession où des habitants en costumes d'époque figurent des scènes de la vie du saint ou de l'histoire locale.
    def_en: Part of the procession in which residents in period costume act out scenes from the saint's life or from local history.
  - fr: mal des ardents
    en: mal des ardents
    def_fr: Épidémie qui frappa le Limousin en 994 ; la présentation du corps de saint Martial l'aurait arrêtée, ce qui serait à l'origine des ostensions.
    def_en: Epidemic that struck the Limousin in 994; showing the body of Saint Martial is said to have ended it, which is seen as the origin of the ostensions.
context:
  fr: >-
    Les ostensions sont de grandes fêtes religieuses et populaires du Limousin, dans l'ouest du Massif central. Tous les sept ans, une vingtaine de villes et de villages de Haute-Vienne, de Creuse, de Charente et de Vienne sortent de leurs églises les reliques des saints locaux, évêques, ermites ou fondateurs de monastères, pour les montrer et les porter en procession. Selon la tradition, tout commence à Limoges en 994, quand l'exposition du corps de saint Martial aurait mis fin à une épidémie ; la coutume gagne ensuite d'autres villes et prend son rythme septennal au XVIe siècle.

    Pendant la période des ostensions, un drapeau flotte en haut du clocher. Les habitants, croyants ou non, préparent la fête parfois plus d'un an à l'avance : ils fabriquent guirlandes, fleurs et costumes, décorent les rues et défilent dans des cortèges historiques avec chorales et fanfares. Depuis quelques décennies, d'anciens lieux ont relancé la tradition grâce à de nouvelles confréries et à des comités de bénévoles.
  en: >-
    The ostensions are large religious and popular festivals of the Limousin, in the west of the Massif Central. Every seven years about twenty towns and villages in Haute-Vienne, Creuse, Charente and Vienne bring the relics of their local saints, bishops, hermits or founders of monasteries, out of their churches to display them and carry them in procession. According to tradition it all began in Limoges in 994, when showing the body of Saint Martial is said to have ended an epidemic; the custom then spread to other towns and settled into its seven-year rhythm in the 16th century.

    Throughout the ostension period a flag flies from the church tower. Residents, believers or not, prepare the festival sometimes more than a year ahead: they make garlands, flowers and costumes, decorate the streets and walk in historical processions with choirs and brass bands. In recent decades some places have revived the tradition through new confraternities and volunteer committees.
unesco:
  fr: >-
    Les ostensions septennales limousines sont inscrites depuis 2013 sur la Liste représentative du patrimoine culturel immatériel de l'humanité, dans un dossier présenté par la France seule. L'inscription ne classe ni les églises ni les reliquaires comme des monuments : elle reconnaît une pratique vivante, portée par la population du Limousin, croyants et non-croyants, et transmise par les confréries et les comités. Elle engage ces communautés et l'État à la sauvegarder, en particulier en aidant à transmettre d'une édition à l'autre la mémoire et les savoir-faire de la fête.
  en: >-
    The Limousin septennial ostensions have been on the Representative List of the Intangible Cultural Heritage of Humanity since 2013, in a file submitted by France alone. The inscription does not list the churches or reliquaries as monuments: it recognises a living practice, carried by the people of the Limousin, believers and non-believers alike, and handed down by the confraternities and committees. It commits these communities and the State to safeguarding it, especially by helping to pass the memory and skills of the festival from one edition to the next.
activity:
  title_fr: Une frise des ostensions de sept ans en sept ans
  title_en: A timeline of the ostensions, seven years at a time
  fr: >-
    Tracez au tableau une frise de 1953 à 2030, avec un repère tous les sept ans. Pour chaque édition, chaque élève note l'âge qu'auraient eu ses parents, ses grands-parents et lui-même. Discutez ensuite : combien d'éditions une personne voit-elle dans sa vie ? À quel âge peut-on porter un costume, puis organiser la fête ? Par petits groupes, imaginez enfin comment transmettre la fête à quelqu'un qui n'en aura vu qu'une seule : un carnet, des photos, un récit ? Chaque groupe présente sa solution.
  en: >-
    Draw a timeline on the board from 1953 to 2030, with a mark every seven years. For each edition, every pupil notes how old their parents, grandparents and they themselves would have been. Then discuss: how many editions does a person see in a lifetime? At what age can you wear a costume, and later organise the festival? Finally, in small groups, imagine how to pass the festival on to someone who has seen only one edition: a notebook, photos, a story? Each group presents its solution.
  levels: [primary, middle]
