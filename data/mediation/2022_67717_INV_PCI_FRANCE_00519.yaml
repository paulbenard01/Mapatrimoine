id: 2022_67717_INV_PCI_FRANCE_00519
audience: general
questions:
  fr:
    - "Pourquoi, selon vous, récompense-t-on des poèmes par des fleurs en métal précieux plutôt que par un simple diplôme ?"
    - "Comment un concours né au Moyen Âge peut-il attirer aujourd'hui de jeunes poètes, en français comme en occitan, et s'ouvrir à la chanson ou au slam ?"
    - "Quelle place la poésie, ou une langue régionale, occupe-t-elle dans votre vie ou dans votre région ?"
  en:
    - "Why do you think poems are rewarded with flowers made of precious metal rather than a simple certificate?"
    - "How can a contest founded in the Middle Ages attract young poets today, in French and in Occitan, and open up to song or slam?"
    - "What place does poetry, or a regional language, have in your own life or in your region?"
vocabulary:
  - fr: "mainteneur"
    en: "mainteneur"
    def_fr: "Membre de l'Académie des Jeux floraux, élu par ses pairs ; les quarante mainteneurs jugent les œuvres et décernent les prix."
    def_en: "Member of the Academy of the Floral Games, elected by the other members; the forty mainteneurs judge the entries and award the prizes."
  - fr: "maître ès jeux"
    en: "maître ès jeux"
    def_fr: "Titre donné à des poètes ou lettrés distingués, qui participent avec les mainteneurs à la sélection des lauréats."
    def_en: "Title given to distinguished poets or scholars, who take part with the mainteneurs in choosing the winners."
  - fr: "Fleur"
    en: "Flower"
    def_fr: "Prix en forme de fleur en métal précieux ; le premier concours, en 1324, offrait une violette d'or."
    def_en: "Prize in the shape of a flower made of precious metal; the first contest, in 1324, offered a golden violet."
  - fr: "devise"
    en: "motto"
    def_fr: "Titre choisi par le candidat pour identifier son poème de façon anonyme ; son nom n'est révélé qu'après le vote des jurys."
    def_en: "Title chosen by the entrant so the poem can be identified anonymously; the author's name is revealed only after the judges have voted."
  - fr: "Consistori del Gay Saber"
    en: "Consistori del Gay Saber"
    def_fr: "« Consistoire du Gai Savoir » en occitan ; nom de la compagnie formée par les sept troubadours fondateurs, devenue l'Académie."
    def_en: "\"Consistory of the Gay Science\" in Occitan; name of the society formed by the seven founding troubadours, which later became the Academy."
