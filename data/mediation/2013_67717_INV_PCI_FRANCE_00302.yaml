id: 2013_67717_INV_PCI_FRANCE_00302
audience: general
questions:
  fr:
    - Que veut dire, selon vous, une bénédiction des bourgeons qui vise à la fois la vigne et les enfants présents ?
    - Comment une vieille fête de vignerons a-t-elle pu prendre un nouvel élan avec une confrérie née au moment de l'appellation du vin de Marcillac ?
    - Quelle production agricole de votre région est célébrée par une fête, une bénédiction ou une confrérie ?
  en:
    - What do you think is meant by a blessing of the buds that is aimed both at the vines and at the children present?
    - How could an old winegrowers' festival gain new momentum through a brotherhood founded when Marcillac wine got its official appellation?
    - Which farm product of your own region is celebrated with a festival, a blessing or a brotherhood?
vocabulary:
  - fr: bourrou
    en: bourrou
    def_fr: Du mot occitan borron, le bourgeon de vigne ; la fête en a fait le saint patron de Marcillac, saint Bourrou.
    def_en: From the Occitan word borron, a vine bud; the festival turned it into Marcillac's patron, Saint Bourrou.
  - fr: mansois
    en: mansois
    def_fr: Cépage rouge du vallon de Marcillac, appelé fer servadou ailleurs ; un cep taillé en couronne est porté dans le défilé.
    def_en: Red grape variety of the Marcillac valley, known elsewhere as fer servadou; a vine stock pruned into a crown is carried in the parade.
  - fr: échansonnerie
    en: wine brotherhood
    def_fr: Confrérie de Saint-Bourrou, créée en 1989 pour faire connaître le vin de Marcillac ; ses membres portent tunique rouge et chapeau noir.
    def_en: The Saint-Bourrou brotherhood, founded in 1989 to promote Marcillac wine; its members wear a red tunic and a black hat.
  - fr: tasson
    en: tasson (tastevin)
    def_fr: Petite tasse à déguster le vin, portée au cou par les échansons ; souvent en argent, elle se transmet de génération en génération.
    def_en: Small wine-tasting cup worn round the neck by brotherhood members; often made of silver and handed down through the generations.
  - fr: intronisation
    en: induction
    def_fr: Cérémonie où la confrérie accueille de nouveaux membres ; ils jurent fidélité au mansois et vident d'un trait un tasson de vin.
    def_en: Ceremony in which the brotherhood welcomes new members; they swear loyalty to mansois and drain a tasson of wine in one go.
lang_review: draft
