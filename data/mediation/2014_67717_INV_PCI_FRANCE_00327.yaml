id: 2014_67717_INV_PCI_FRANCE_00327
audience: general
questions:
  fr:
    - Observez une cueillette de jasmin ou de rose de mai, fleur par fleur. Pourquoi, selon vous, ce geste reste-t-il fait à la main ?
    - Le cultivateur, le distillateur et le parfumeur dépendent les uns des autres. Que perdrait chacun d'eux si l'un des trois métiers disparaissait du pays de Grasse ?
    - Une grande partie des matières premières vient aujourd'hui du monde entier. Comment garder vivant un savoir-faire lié aux fleurs et aux paysages d'un territoire ?
    - L'UNESCO a reconnu des savoir-faire plutôt que des parfums ou des marques célèbres. Qu'est-ce que cette distinction change pour les cultivateurs et les apprentis ?
    - Quelle odeur vous rappelle un lieu, une saison ou une personne, et comment pourriez-vous la décrire avec des mots ?
  en:
    - Look at jasmine or May roses being picked flower by flower. Why do you think this gesture is still done by hand?
    - The grower, the distiller and the perfumer depend on one another. What would each of them lose if one of the three trades disappeared from the Pays de Grasse?
    - Much of the raw material now comes from all over the world. How can a skill tied to the flowers and landscapes of one area be kept alive?
    - UNESCO has recognised skills rather than famous perfumes or brands. What does this distinction change for growers and apprentices?
    - Which smell reminds you of a place, a season or a person, and how could you describe it in words?
vocabulary:
  - fr: plante à parfum
    en: perfume plant
    def_fr: Plante cultivée pour son odeur, comme le jasmin, la rose de mai, la tubéreuse, la violette, le mimosa ou la fleur d'oranger.
    def_en: Plant grown for its scent, such as jasmine, May rose, tuberose, violet, mimosa or orange blossom.
  - fr: rose de mai
    en: May rose
    def_fr: Rose très parfumée, emblème du pays de Grasse avec le jasmin et la tubéreuse, cueillie à la main au moment de sa floraison.
    def_en: Highly fragrant rose, an emblem of the Pays de Grasse alongside jasmine and tuberose, picked by hand when it blooms.
  - fr: matière première naturelle
    en: natural raw material
    def_fr: Fleur, feuille, racine, écorce ou résine, fraîche ou séchée, d'où l'on tire une substance odorante pour le parfum.
    def_en: Flower, leaf, root, bark or resin, fresh or dried, from which a fragrant substance is drawn for perfume.
  - fr: distillation
    en: distillation
    def_fr: Technique qui chauffe les plantes avec de l'eau dans un alambic ; la vapeur emporte l'odeur, puis se refroidit pour donner une huile essentielle.
    def_en: Technique that heats plants with water in a still; the steam carries off the scent, then cools to give an essential oil.
  - fr: alambic
    en: still
    def_fr: Appareil de cuivre ou de verre utilisé pour la distillation ; sa fabrication mobilise aussi chaudronniers et souffleurs de verre.
    def_en: Copper or glass apparatus used for distillation; making it also involves coppersmiths and glassblowers.
  - fr: enfleurage
    en: enfleurage
    def_fr: Technique ancienne où des fleurs fragiles sont posées sur de la graisse qui absorbe peu à peu leur parfum.
    def_en: Old technique in which delicate flowers are laid on fat that slowly absorbs their scent.
  - fr: extraction par solvant
    en: solvent extraction
    def_fr: Technique qui dissout l'odeur des fleurs dans un liquide volatil, que l'on évapore ensuite pour recueillir une matière très concentrée.
    def_en: Technique that dissolves the scent of flowers in a volatile liquid, which is then evaporated to collect a highly concentrated material.
  - fr: composition
    en: composition
    def_fr: Art du parfumeur qui assemble des matières naturelles et de synthèse pour bâtir une « architecture » d'odeurs.
    def_en: The perfumer's art of combining natural and synthetic materials to build an "architecture" of scents.
context:
  fr: >-
    Autour de Grasse, dans les Alpes-Maritimes, trois savoir-faire liés au parfum se sont construits ensemble depuis le XVIe siècle. Les cultivateurs et les cueilleurs font pousser jasmin, rose de mai, tubéreuse, violette, mimosa ou iris, grâce à une connaissance fine des sols, du climat et des techniques de greffe. Les spécialistes de la transformation, distillateurs, laborantins ou évaluateurs, tirent l'odeur de ces plantes par distillation, enfleurage ou extraction, avec des outils adaptés à chaque matière. Les parfumeurs, enfin, composent des parfums à partir de matières naturelles et de synthèse.

    Ces trois métiers dépendent les uns des autres, et peu de territoires les réunissent ainsi en un même lieu. Aujourd'hui, une grande partie des matières premières vient du monde entier et arrive à Grasse pour y être transformée et composée. L'apprentissage, souvent long, se fait surtout sur le lieu de travail, mais des formations se développent ; des parfumeurs formés à Grasse exercent désormais dans de nombreux pays.
  en: >-
    Around Grasse, in the Alpes-Maritimes, three perfume-related skills have grown up together since the 16th century. Growers and pickers raise jasmine, May rose, tuberose, violet, mimosa or iris, drawing on detailed knowledge of soils, climate and grafting techniques. Processing specialists, distillers, lab technicians or evaluators, draw the scent out of these plants by distillation, enfleurage or extraction, with tools suited to each material. Perfumers, finally, compose perfumes from natural and synthetic materials.

    The three trades depend on one another, and few places bring them together in a single area. Today much of the raw material comes from all over the world and is brought to Grasse to be processed and composed. Learning, often long, takes place mainly in the workplace, though formal training is developing; perfumers trained in Grasse now work in many countries.
unesco:
  fr: >-
    Les savoir-faire liés au parfum en pays de Grasse sont inscrits depuis 2018 sur la Liste représentative du patrimoine culturel immatériel de l'humanité, dans un dossier présenté par la France seule. L'inscription couvre ensemble la culture des plantes, la connaissance et la transformation des matières premières naturelles et l'art de composer, portés par les habitants et les praticiens du pays de Grasse. Elle ne récompense ni une marque ni un parfum : elle reconnaît des savoir-faire vivants et engage les communautés et l'État à les transmettre et à les sauvegarder.
  en: >-
    The skills related to perfume in the Pays de Grasse have been on the Representative List of the Intangible Cultural Heritage of Humanity since 2018, in a file submitted by France alone. The inscription covers together the growing of plants, the knowledge and processing of natural raw materials and the art of composition, carried by the residents and practitioners of the Pays de Grasse. It rewards no brand and no perfume: it recognises living skills and commits the communities and the State to passing them on and safeguarding them.
activity:
  title_fr: L'atelier des nez
  title_en: The noses' workshop
  fr: >-
    Chaque groupe reçoit quelques petits pots fermés contenant des produits de cuisine apportés de la maison : cannelle, clou de girofle, zeste d'orange, menthe, lavande, café. Les yeux bandés, chacun sent un pot et le décrit sans le nommer : couleur, saison, souvenir, adjectif. Le groupe dresse une liste de mots pour chaque odeur. Ensuite, sur une feuille, chaque groupe « compose » un parfum en choisissant trois odeurs et en expliquant pourquoi elles iraient bien ensemble, puis lui donne un nom.
  en: >-
    Each group gets a few small closed jars containing kitchen ingredients brought from home: cinnamon, clove, orange zest, mint, lavender, coffee. Blindfolded, each pupil smells one jar and describes it without naming it: a colour, a season, a memory, an adjective. The group draws up a list of words for each smell. Then, on a sheet of paper, each group "composes" a perfume by choosing three smells, explaining why they would go well together, and giving it a name.
  levels: [primary, middle, high]
