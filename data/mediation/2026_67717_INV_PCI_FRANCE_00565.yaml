id: 2026_67717_INV_PCI_FRANCE_00565
audience: general
questions:
  fr:
    - "Que produit, selon vous, la vue de milliers de cierges allumés dans la nuit, et pourquoi le chapelet est-il récité tour à tour dans de nombreuses langues ?"
    - "Les malades, en fauteuil ou sur brancard, sont placés au premier rang : que dit cette organisation de la place donnée aux plus fragiles ?"
    - "Avez-vous déjà vécu un rassemblement où des personnes de pays et de langues très différents faisaient la même chose ensemble ?"
  en:
    - "What effect do you think thousands of candles lit in the dark have, and why is the rosary said in turn in many languages?"
    - "Sick people, in wheelchairs or on stretchers, are placed at the front; what does this arrangement say about the place given to the most vulnerable?"
    - "Have you ever been part of a gathering where people from very different countries and languages all did the same thing together?"
vocabulary:
  - fr: "cierge"
    en: "candle"
    def_fr: "Longue bougie que chaque participant tient allumée ; c'est elle qui vaut à la procession son nom de « procession aux flambeaux »."
    def_en: "Long candle that every participant holds alight; it gives the procession its name of \"torchlight procession\"."
  - fr: "chapelet"
    en: "rosary"
    def_fr: "Prière faite d'une suite de « Je vous salue Marie », comptés sur un collier de grains ; on la récite pendant la procession."
    def_en: "Prayer made up of a series of Hail Marys, counted on a string of beads; it is said during the procession."
  - fr: "hospitalier"
    en: "hospitaller"
    def_fr: "Bénévole qui accueille et accompagne les pèlerins malades ou handicapés pendant leur séjour et pendant la procession."
    def_en: "Volunteer who welcomes and accompanies sick or disabled pilgrims during their stay and during the procession."
  - fr: "cérémoniaire"
    en: "master of ceremonies"
    def_fr: "Membre de l'équipe du sanctuaire qui marche en tête, règle le rythme du cortège et répartit les langues de la prière."
    def_en: "Member of the sanctuary staff who walks at the front, sets the pace of the procession and shares out the prayer among languages."
  - fr: "voiture bleue"
    en: "blue carriage"
    def_fr: "Petite voiture bleue à bras, menée par des hospitaliers, dans laquelle des pèlerins malades ou à mobilité réduite suivent la procession."
    def_en: "Small blue carriage moved by hand by hospitallers, in which sick pilgrims or those with limited mobility take part in the procession."
