id: 2013_67717_INV_PCI_FRANCE_00318
audience: general
questions:
  fr:
    - Pourquoi, selon vous, l'arbre de mai doit-il être abattu à la main, à la scie, par les jeunes de 19 ans plutôt qu'avec une machine ?
    - Que devient un rite autrefois mené par les conscrits, surtout des garçons, quand filles et garçons de 19 ans y prennent part ensemble ?
    - Quels gestes ou quelles fêtes marquent, autour de vous, le passage à l'âge adulte ?
  en:
    - Why do you think the May tree has to be felled by hand, with a saw, by the 19-year-olds rather than with a machine?
    - What becomes of a rite once led by conscripts, mostly young men, when 19-year-old women and men now take part together?
    - Which customs or celebrations mark the step into adulthood in the world around you?
vocabulary:
  - fr: arbre de mai
    en: May tree
    def_fr: Arbre planté début mai sur la place du village pour saluer le retour de la belle saison ; à Locronan, c'est toujours un hêtre.
    def_en: Tree planted on the village square in early May to welcome the return of the fine season; in Locronan it is always a beech.
  - fr: cycle de mai
    en: May cycle
    def_fr: Ensemble des coutumes qui fêtent le renouveau de la nature au début de mai, comme planter un arbre ou poser des branches aux fenêtres.
    def_en: The customs that celebrate nature's renewal in early May, such as planting a tree or putting branches at windows.
  - fr: harpon
    en: harpon (two-man saw)
    def_fr: Grande scie à deux manches, maniée à deux ; les jeunes de 19 ans s'en servent pour abattre l'arbre, souvent aidés par le public.
    def_en: Large saw with a handle at each end, worked by two people; the 19-year-olds use it to fell the tree, often helped by onlookers.
  - fr: feu de la Saint-Jean
    en: Midsummer bonfire
    def_fr: Grand feu allumé autour du 24 juin ; à Locronan, les branches de l'arbre de mai abattu viennent l'alimenter.
    def_en: Large bonfire lit around 24 June; in Locronan, the branches of the felled May tree go on to feed it.
  - fr: vente aux enchères
    en: auction
    def_fr: Vente au plus offrant ; le bas du tronc abattu est vendu ainsi sur la place, autrefois à des sabotiers, aujourd'hui plutôt à des artistes qui le sculptent.
    def_en: Sale to the highest bidder; the base of the felled trunk is auctioned on the square, once to clog-makers, now more often to sculptors.
