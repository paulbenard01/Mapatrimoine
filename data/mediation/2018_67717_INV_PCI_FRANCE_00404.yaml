id: 2018_67717_INV_PCI_FRANCE_00404
audience: general
questions:
  fr:
    - "Observez une perle de verre de près : à quels indices peut-on deviner qu'elle a été enroulée autour d'une tige, puis décorée de points ou de fils de verre ?"
    - "Pourquoi, selon vous, offre-t-on depuis des millénaires des perles pour marquer un moment important de la vie, et qu'est-ce qu'une perle faite à la main ajoute à ce geste ?"
    - "Ce savoir-faire a failli disparaître avec la fermeture des grandes manufactures, puis renaît dans de petits ateliers individuels : qu'est-ce qui change quand un métier passe de l'usine à l'atelier ?"
    - "Qu'est-ce qu'une reconnaissance par l'UNESCO, partagée avec l'Italie, peut apporter à des artisans qui travaillent souvent seuls, et qu'est-ce qu'elle ne peut pas faire à leur place ?"
    - "Possédez-vous un bijou, un chapelet ou un objet orné de perles transmis dans votre famille : quelle histoire raconte-t-il ?"
  en:
    - "Look closely at a glass bead; what clues suggest it was wound around a rod and then decorated with dots or threads of glass?"
    - "Why do you think beads have been given for thousands of years to mark important moments in life, and what does a handmade bead add to that gesture?"
    - "This craft almost vanished when the large factories closed, then revived in small one-person workshops; what changes when a craft moves from the factory to the workshop?"
    - "What can a UNESCO recognition shared with Italy bring to craftspeople who often work alone, and what can it not do for them?"
    - "Do you own a piece of jewellery, a rosary or an object decorated with beads that was handed down in your family? What story does it tell?"
vocabulary:
  - fr: perlier, perlière
    en: bead maker
    def_fr: Artisan ou artiste qui façonne des perles de verre à la flamme ; en France, ce sont aujourd'hui surtout des femmes travaillant seules dans leur atelier.
    def_en: Craftsperson or artist who shapes glass beads in a flame; in France today they are mostly women working alone in their own studio.
  - fr: chalumeau
    en: torch
    def_fr: Brûleur fixé sur l'établi, alimenté en gaz et en oxygène, dont la flamme ramollit puis fait fondre les baguettes de verre.
    def_en: Burner fixed to the workbench, fed with gas and oxygen, whose flame softens and then melts the glass rods.
  - fr: mandrin
    en: mandrel
    def_fr: Fine tige d'acier autour de laquelle on enroule le verre en fusion ; son diamètre donne la taille du trou de la perle.
    def_en: Thin steel rod around which molten glass is wound; its thickness sets the size of the bead's hole.
  - fr: séparateur
    en: bead release
    def_fr: Enduit à base d'argile dans lequel on trempe le mandrin pour que le verre chaud ne colle pas au métal.
    def_en: Clay-based coating into which the mandrel is dipped so that the hot glass does not stick to the metal.
  - fr: recuisson
    en: annealing
    def_fr: Refroidissement lent et contrôlé dans un petit four, qui supprime les tensions du verre et rend la perle solide.
    def_en: Slow, controlled cooling in a small kiln that removes stresses from the glass and makes the bead strong.
  - fr: murrine
    en: murrine
    def_fr: Canne faite de verres de couleurs assemblés autour d'un cœur puis étirée ; coupée en fines tranches, elle révèle un motif posé sur la perle.
    def_en: Cane of coloured glasses built around a core and then stretched; cut into thin slices, it reveals a pattern that is set on the bead.
  - fr: enrobage
    en: encasing
    def_fr: Couche de verre transparent posée sur la perle décorée, qui donne de la profondeur au motif ou le déforme comme une loupe.
    def_en: Layer of clear glass laid over a decorated bead, giving depth to the pattern or distorting it like a lens.
  - fr: fil de verre tiré
    en: stringer
    def_fr: Fil de verre très fin, étiré à la flamme par le perlier, qui sert à dessiner des traits et des points sur la perle.
    def_en: Very thin thread of glass, pulled in the flame by the bead maker, used to draw lines and dots on the bead.
context:
  fr: >-
    Le perlier travaille assis devant un chalumeau : il chauffe une baguette de verre jusqu'à ce qu'elle devienne pâteuse, l'enroule autour d'un mandrin et laisse la rotation et la gravité arrondir la perle. Il la décore ensuite de points, de fils, de feuilles de métal ou de tranches de murrine, la garde toujours chaude pour qu'elle ne casse pas, puis la laisse refroidir lentement au four. Il existe aussi des perles creuses et des perles soufflées. Quelques gestes de base suffisent, mais leur combinaison et des années de pratique ouvrent une variété infinie.
    En France, les perles de verre existent depuis l'Antiquité : les artisans gaulois en fabriquaient déjà, puis les faiseurs de chapelets, les manufactures de fausses perles et, du XIXe siècle aux années 1970, de grandes usines exportant dans le monde entier. Après un fort déclin, le métier renaît depuis la fin des années 1990 dans de petits ateliers dispersés dans tout le pays, portés par des associations, des stages et des rencontres régulières.
  en: >-
    The bead maker sits at a torch, heats a glass rod until it turns soft, winds it around a mandrel and lets rotation and gravity round off the bead. It is then decorated with dots, threads, metal leaf or slices of murrine, kept hot all the time so it does not crack, and finally left to cool slowly in a kiln. There are also hollow and blown beads. A few basic gestures are enough, but combining them, with years of practice, opens up endless variety.
    In France, glass beads go back to Antiquity: Gaulish craftsmen already made them, followed by rosary makers, imitation-pearl workshops and, from the 19th century to the 1970s, large factories exporting worldwide. After a steep decline, the craft has revived since the late 1990s in small workshops spread across the country, supported by associations, courses and regular gatherings.
unesco:
  fr: >-
    L'art de la perle de verre est inscrit depuis 2020 sur la Liste représentative du patrimoine culturel immatériel de l'humanité, à la suite d'un dossier commun de la France et de l'Italie. L'inscription couvre les techniques des deux pays, des perles pleines ou creuses façonnées à la flamme aux perles taillées dans une canne, et les liens qui unissent leurs praticiens. Elle reconnaît un savoir-faire vivant transmis surtout d'atelier en atelier, et engage les deux États à soutenir sa transmission ; ce n'est pas un classement des plus belles perles.
  en: >-
    The art of glass beads has been on the Representative List of the Intangible Cultural Heritage of Humanity since 2020, following a joint file from France and Italy. The inscription covers both countries' techniques, from solid or hollow beads shaped in a flame to beads cut from a glass cane, and the bonds between their makers. It recognises a living skill passed on mainly from workshop to workshop and commits both States to supporting its transmission; it is not a ranking of the finest beads.
activity:
  title_fr: La frise de la perle de verre
  title_en: A timeline of the glass bead
  fr: >-
    En petits groupes, tracez une longue frise chronologique sur une bande de papier, de l'Antiquité à aujourd'hui. Placez-y les grandes étapes évoquées dans la fiche : perles importées puis fabriquées par les Gaulois, chapelets et parures de la Renaissance, fausses perles, grandes usines d'exportation, déclin, puis renouveau dans de petits ateliers. Pour chaque étape, dessinez une perle imaginée et notez qui la fabriquait et où. Comparez ensuite les frises : qu'est-ce qui a changé dans les outils, les lieux de travail et les personnes qui font les perles ?
  en: >-
    In small groups, draw a long timeline on a strip of paper, from Antiquity to today. Place on it the main stages mentioned on this sheet: beads imported and then made by the Gauls, Renaissance rosaries and jewellery, imitation pearls, large export factories, decline, and the revival in small workshops. For each stage, draw an imagined bead and note who made it and where. Then compare the timelines: what changed in the tools, the workplaces and the people who make beads?
  levels: [primary, middle, high]
