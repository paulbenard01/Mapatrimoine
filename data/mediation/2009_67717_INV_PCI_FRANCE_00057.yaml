id: 2009_67717_INV_PCI_FRANCE_00057
audience: general
questions:
  fr:
    - "Canne, rubans de couleur, surnom : que disent ces signes de l'appartenance d'un compagnon, et pourquoi les montrer plutôt que les garder pour soi ?"
    - "Pour devenir compagnon, il faut réaliser un chef-d'œuvre qui reste ensuite dans la maison : que signifie offrir à une communauté l'objet où l'on a mis tout son savoir ?"
    - "Longtemps réservé aux hommes, le compagnonnage accueille aujourd'hui aussi des femmes et de nouveaux métiers : comment une tradition peut-elle changer sans perdre ce qui la fait tenir ?"
    - "Voyager plusieurs années de ville en ville pour apprendre un métier : est-ce encore possible et souhaitable aujourd'hui, et qu'est-ce que la reconnaissance par l'UNESCO y change ?"
    - "Qui vous a appris quelque chose de concret, un geste ou un savoir-faire, et qu'avez-vous déjà transmis vous-même à quelqu'un d'autre ?"
  en:
    - "Cane, coloured ribbons, nickname: what do these signs say about a compagnon's belonging, and why show them rather than keep them private?"
    - "To become a compagnon you make a masterpiece that then stays in the house; what does it mean to give a community the object into which you put all your skill?"
    - "Long reserved for men, the compagnonnage now also welcomes women and new trades; how can a tradition change without losing what holds it together?"
    - "Travelling for several years from town to town to learn a trade: is this still possible and desirable today, and what does UNESCO recognition change about it?"
    - "Who taught you something concrete, a gesture or a skill, and what have you yourself already passed on to someone else?"
vocabulary:
  - fr: Tour de France
    en: Tour de France
    def_fr: "Voyage de formation de plusieurs années, de ville en ville, en France et à l'étranger, que l'on accomplit avant d'être reconnu compagnon."
    def_en: "Training journey of several years from town to town, in France and abroad, completed before being recognised as a compagnon."
  - fr: aspirant
    en: aspirant
    def_fr: "Jeune en formation qui a été admis dans une société de compagnons et se prépare, par son travail et son voyage, à devenir compagnon."
    def_en: "Young trainee admitted to a compagnon society who prepares, through work and travel, to become a compagnon."
  - fr: chef-d'œuvre
    en: masterpiece
    def_fr: "Ouvrage de métier qui rassemble tout le savoir de son auteur ; jugé par les compagnons, il ouvre l'accès au titre et reste dans la maison."
    def_en: "Piece of work that brings together all its maker's skill; judged by the compagnons, it opens the way to the title and stays in the house."
  - fr: cayenne
    en: cayenne
    def_fr: "L'un des noms de la maison compagnonnique, qui loge et nourrit les itinérants et abrite ateliers, salles de cours et réunions."
    def_en: "One of the names for a compagnon house, which lodges and feeds travellers and holds workshops, classrooms and meetings."
  - fr: la Mère
    en: the Mother
    def_fr: "Femme qui tient le rôle de maîtresse de maison et recrée, pour les jeunes itinérants, un cadre familial loin de chez eux."
    def_en: "Woman who acts as head of the household and recreates a family setting for young travellers far from home."
  - fr: canne
    en: cane
    def_fr: "Bâton de marche remis lors d'un rite ; il rappelle le voyage et marque l'appartenance au compagnonnage."
    def_en: "Walking stick handed over during a rite; it recalls the journey and marks membership of the compagnonnage."
  - fr: couleurs
    en: colours
    def_fr: "Rubans portés lors des fêtes et des cérémonies, dont les teintes et la manière de les porter varient selon le métier et le groupe."
    def_en: "Ribbons worn at festivals and ceremonies, whose shades and way of wearing vary with the trade and the group."
  - fr: rouleur
    en: rouleur
    def_fr: "Gardien des usages et des cérémonies d'une maison ; ce rôle est souvent confié à un jeune compagnon, qui apprend en l'exerçant."
    def_en: "Keeper of a house's customs and ceremonies; the role is often given to a young compagnon, who learns by carrying it out."
context:
  fr: >-
    Le compagnonnage est un mode de formation aux métiers qui associe l'apprentissage technique, la construction de la personne et l'entrée dans une communauté. Il concerne les métiers de la pierre, du bois, du métal, du cuir, du textile ou de l'alimentation. Les jeunes, à partir de 16 ans, partent pour un Tour de France de plusieurs années : ils changent de ville et d'employeur, logent dans des maisons compagnonniques où se mêlent ateliers, cours, repas en commun et transmission par les anciens. Des rites marquent chaque étape, d'aspirant à compagnon, avec leurs symboles (canne, rubans, surnom) et une part de secret. Pour être reçu, chacun réalise un chef-d'œuvre jugé par ses pairs. Attesté depuis au moins le XVIIe siècle, le compagnonnage a été repensé par chaque génération ; il compte aujourd'hui des maisons dans de nombreuses villes, comme Paris, Tours ou Versailles.
  en: >-
    The compagnonnage is a way of training in a trade that combines technical learning, personal growth and entry into a community. It covers trades working with stone, wood, metal, leather, textiles or food. Young people aged 16 and over set off on a Tour de France lasting several years: they change towns and employers and stay in compagnon houses where workshops, classes, shared meals and teaching by older members come together. Rites mark each stage, from aspirant to compagnon, with their symbols (cane, ribbons, nickname) and an element of secrecy. To be received, each makes a masterpiece judged by peers. Attested since at least the 17th century, the compagnonnage has been rethought by each generation; it now has houses in many towns, such as Paris, Tours or Versailles.
unesco:
  fr: >-
    Le compagnonnage, réseau de transmission des savoirs et des identités par le métier, est inscrit depuis 2010 sur la Liste représentative du patrimoine culturel immatériel de l'humanité. Le dossier, présenté par la France seule, réunit les trois grands groupements de compagnons et leurs dizaines de milliers de membres. L'inscription ne récompense ni un bâtiment ni des chefs-d'œuvre exposés : elle reconnaît une façon vivante d'apprendre un métier par le voyage, les rites et l'accompagnement entre générations, et engage à la faire connaître et à la transmettre.
  en: >-
    Compagnonnage, a network for on-the-job transmission of knowledge and identities, has been on the Representative List of the Intangible Cultural Heritage of Humanity since 2010. The file, presented by France alone, brings together the three main compagnon groups and their tens of thousands of members. The inscription rewards neither a building nor exhibited masterpieces: it recognises a living way of learning a trade through travel, rites and support between generations, and commits to making it known and passing it on.
activity:
  title_fr: Le tour de France d'un métier dans ma famille
  title_en: A family member's journey into a trade
  fr: >-
    Chaque élève interroge un parent, un voisin ou un proche sur la manière dont il a appris son métier : où, auprès de qui, combien de temps, quels déplacements, quel geste a été le plus difficile, à qui il l'a transmis. Préparez ensemble cinq questions, notez les réponses sans noms de famille. En classe, reportez sur une carte de France les lieux d'apprentissage cités, reliés par des flèches. Comparez ces parcours avec le Tour de France des compagnons : où sont les ressemblances, où sont les différences ?
  en: >-
    Each pupil interviews a parent, neighbour or relative about how they learnt their trade: where, from whom, for how long, what moves it involved, which gesture was hardest, whom they passed it on to. Prepare five questions together and note the answers without surnames. In class, mark the places of learning on a map of France, linked by arrows. Compare these journeys with the compagnons' Tour de France: where are the similarities and the differences?
  levels: [middle, high, adult]
