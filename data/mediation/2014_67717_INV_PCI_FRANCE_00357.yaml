id: 2014_67717_INV_PCI_FRANCE_00357
audience: general
questions:
  fr:
    - Les sonneurs disent qu'on ne « joue » pas de la trompe mais qu'on la « sonne » ; que révèle ce choix de mot sur leur façon de vivre leur instrument ?
    - Tous les sonneurs utilisent le même modèle de trompe ; pourquoi, selon vous, un instrument identique pour tous renforce-t-il le sentiment d'appartenir à une communauté ?
    - Née pour les chasses royales, la trompe est aujourd'hui surtout sonnée par des personnes qui ne chassent pas ; comment une musique peut-elle survivre à l'usage qui l'a fait naître ?
    - La reconnaissance de l'UNESCO est partagée avec des sonneurs de Belgique, d'Italie et du Luxembourg ; que peut changer pour une pratique le fait de se découvrir une famille au-delà des frontières ?
    - Avez-vous déjà appris quelque chose surtout en écoutant et en imitant d'autres personnes, plutôt qu'en lisant ? Comment cela s'est-il passé ?
  en:
    - Players say they do not "play" the trompe but "sound" it; what does this choice of word reveal about how they relate to their instrument?
    - All players use the same model of trompe; why do you think an identical instrument for everyone strengthens the feeling of belonging to a community?
    - Born for royal hunts, the trompe is now mostly sounded by people who do not hunt; how can a music outlive the use it was created for?
    - The UNESCO recognition is shared with horn players in Belgium, Italy and Luxembourg; what can it change for a practice to discover a family beyond its borders?
    - Have you ever learnt something mainly by listening to and imitating other people rather than by reading? How did it go?
vocabulary:
  - fr: trompe
    en: trompe (French hunting horn)
    def_fr: Cor naturel en cuivre, enroulé en cercle, sans pistons ; les sonneurs refusent l'expression « cor de chasse », jugée impropre.
    def_en: Natural brass horn coiled into a circle, without valves; players reject the term "cor de chasse", which they consider inaccurate.
  - fr: trompe d'Orléans
    en: Orléans trompe
    def_fr: Modèle de référence de la trompe en ré, au tuyau d'environ 4,5 mètres, utilisé par presque tous les sonneurs.
    def_en: Reference model of the trompe in D, with a tube about 4.5 metres long, used by almost all players.
  - fr: sonner
    en: to sound
    def_fr: Verbe employé par les sonneurs à la place de « jouer » pour désigner l'acte de faire chanter la trompe.
    def_en: Verb that players use instead of "play" for the act of making the trompe sing.
  - fr: fanfare
    en: fanfare
    def_fr: Courte pièce du répertoire de trompe, bâtie sur une alternance de refrain et de couplet ; les pièces plus longues sont des fantaisies.
    def_en: Short piece of the trompe repertoire, built on alternating refrain and verse; longer pieces are called fantaisies.
  - fr: chant, seconde et basse
    en: melody, second and bass
    def_fr: Les trois parties d'une pièce sonnée en groupe ; la mélodie principale, une deuxième voix et l'accompagnement grave.
    def_en: The three parts of a piece sounded by a group; the main tune, a second voice and the low accompaniment.
  - fr: vibrato
    en: vibrato
    def_fr: Ondulation régulière du son produite par le souffle et le contrôle du corps, l'une des marques du style de la trompe.
    def_en: Regular wavering of the sound produced by breath and body control, one of the hallmarks of trompe style.
  - fr: école de trompe
    en: horn school
    def_fr: Lieu où les débutants apprennent la technique des lèvres et du souffle, souvent par imitation, avant de rejoindre un groupe.
    def_en: Place where beginners learn lip and breath technique, often by imitation, before joining a group.
  - fr: rallye
    en: rallye (horn group)
    def_fr: Un des noms donnés aux groupes de trompe, qui réunissent en général une douzaine de sonneurs et portent souvent le nom d'un lieu.
    def_en: One of the names given to horn groups, which usually bring together about a dozen players and are often named after a place.
context:
  fr: >-
    La trompe est un cor de cuivre enroulé en cercle, sans pistons, apparu à la cour de France à la fin du XVIIe siècle pour accompagner les chasses royales. Peu à peu détachée de la chasse, elle a développé un style propre : un son cuivré et perçant, un souffle très maîtrisé, un vibrato caractéristique, et des pièces écrites pour trois voix. Son répertoire de fanfares et de fantaisies n'a cessé de s'enrichir depuis le XVIIIe siècle.

    Aujourd'hui, des milliers de sonneurs la pratiquent dans toute la France, surtout autour de la vallée de la Loire, en Île-de-France et dans le Centre, ainsi que dans plusieurs pays voisins. Ils se réunissent en groupes d'une douzaine de membres et apprennent dans des écoles de trompe. La plupart ne chassent pas ; les femmes sonnent dans les groupes depuis le XIXe siècle, et la pratique rassemble des personnes de milieux sociaux très différents.
  en: >-
    The trompe is a brass horn coiled into a circle, without valves, which appeared at the French court in the late 17th century to accompany royal hunts. Gradually freed from hunting, it developed a style of its own: a bright, piercing sound, tightly controlled breath, a distinctive vibrato and pieces written for three voices. Its repertoire of fanfares and fantaisies has kept growing since the 18th century.

    Today thousands of players sound it all over France, especially around the Loire valley, the Paris region and central France, as well as in several neighbouring countries. They gather in groups of about a dozen and learn in horn schools. Most of them do not hunt; women have played in groups since the 19th century, and the practice brings together people from very different social backgrounds.
unesco:
  fr: >-
    L'art musical des sonneurs de trompe est inscrit depuis 2020 sur la Liste représentative du patrimoine culturel immatériel de l'humanité. Le dossier est commun à quatre pays : la Belgique, la France, l'Italie et le Luxembourg. Il reconnaît une technique liée au chant, à la maîtrise du souffle, au vibrato, à la résonance des lieux et à la convivialité des groupes, transmise surtout à l'oreille. Une inscription n'établit pas de classement entre les musiques : elle reconnaît une pratique vivante et engage les communautés et les États à en assurer la transmission.
  en: >-
    The musical art of horn players has been on the Representative List of the Intangible Cultural Heritage of Humanity since 2020. The file is shared by four countries: Belgium, France, Italy and Luxembourg. It recognises a technique bound up with singing, breath control, vibrato, the resonance of places and the conviviality of groups, passed on mostly by ear. An inscription does not rank musics: it recognises a living practice and commits communities and States to ensuring it is handed on.
activity:
  title_fr: Écouter et décrire le son de la trompe
  title_en: Listen to and describe the sound of the trompe
  fr: >-
    Écoutez en classe un enregistrement d'un groupe de trompes, puis celui d'un autre instrument à vent (trompette, cornemuse, cor des Alpes...). Pendant chaque écoute, chacun note trois mots pour le son et une image qu'il évoque. Réécoutez la trompe en essayant de repérer la mélodie, la deuxième voix et la basse. Mettez en commun les mots dans un tableau à deux colonnes et discutez : pourquoi ce son portait-il si loin dans les forêts, et dans quels lieux aimeriez-vous l'entendre ?
  en: >-
    In class, listen to a recording of a trompe group, then to another wind instrument (trumpet, bagpipes, alphorn...). During each listening, everyone writes down three words for the sound and one image it brings to mind. Listen to the trompe again and try to pick out the melody, the second voice and the bass. Pool the words in a two-column table and discuss: why did this sound carry so far in the forests, and where would you like to hear it?
  levels: [primary, middle, high]
