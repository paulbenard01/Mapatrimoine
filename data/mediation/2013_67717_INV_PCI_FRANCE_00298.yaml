id: 2013_67717_INV_PCI_FRANCE_00298
audience: general
questions:
  fr:
    - Pourquoi, selon vous, la gerbe en mémoire des marins disparus est-elle jetée au large, tous les bateaux réunis, plutôt que déposée sur le quai ?
    - Comment une fête née des bénédictions qui précédaient les longues campagnes de pêche garde-t-elle son sens aujourd'hui ?
    - Quel plat de votre région est né d'un métier, et à quelle occasion le cuisine-t-on encore ensemble ?
  en:
    - Why do you think the wreath for lost sailors is thrown out at sea, with all the boats gathered, rather than laid on the quay?
    - How does a festival that grew out of blessings before long fishing voyages keep its meaning today?
    - Which dish from your own region was born of a trade, and on what occasion is it still cooked together?
vocabulary:
  - fr: ttoro
    en: ttoro
    def_fr: Soupe de poissons basque, préparée à l'origine à bord par les pêcheurs, à base de baudroie, merlu ou congre, de pommes de terre et de piment d'Espelette.
    def_en: Basque fish soup first cooked on board by fishermen, made with monkfish, hake or conger eel, potatoes and Espelette pepper.
  - fr: levée des couleurs
    en: flag-raising ceremony
    def_fr: Cérémonie où l'on hisse le drapeau ; ici, un jeune mousse le monte au mât sur l'ordre d'un officier de marine.
    def_en: Ceremony in which the flag is hoisted; here a young ship's boy raises it on the order of a naval officer.
  - fr: traînière
    en: trainera
    def_fr: Longue embarcation basque à rames, menée par treize rameurs et un barreur debout à l'arrière ; on en voit lors du défi nautique.
    def_en: Long Basque rowing boat crewed by thirteen rowers and a coxswain standing at the stern; some take part in the boating challenge.
  - fr: gerbe
    en: wreath
    def_fr: Couronne de fleurs jetée en mer depuis un bateau, après une prière et un chant, en hommage aux marins péris.
    def_en: Ring of flowers thrown into the sea from a boat, after a prayer and a song, in tribute to sailors who died at sea.
  - fr: criée
    en: fish auction hall
    def_fr: Halle du port où le poisson débarqué est vendu aux enchères ; celle de Ciboure accueille le repas qui clôt la fête.
    def_en: Harbour hall where the landed fish is sold at auction; the one in Ciboure hosts the meal that closes the festival.
