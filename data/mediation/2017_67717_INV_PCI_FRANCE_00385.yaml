id: 2017_67717_INV_PCI_FRANCE_00385
audience: general
questions:
  fr:
    - Les tailleurs de pierre de l'atelier travaillent encore uniquement à la main, avec des outils de forme médiévale ; que perçoit-on d'un tel geste qu'une machine ne montrerait pas ?
    - Comment une institution peut-elle durer près de 800 ans sans interruption, malgré les guerres, la Révolution et les changements de régime ?
    - "Les artisans consultent des plans et des registres vieux de plusieurs siècles : que change le fait de travailler avec les traces de ses prédécesseurs ?"
    - Qu'apporte une reconnaissance de l'UNESCO comme « bonne pratique de sauvegarde » à un atelier qui existait déjà bien avant elle ?
    - Y a-t-il près de chez vous un bâtiment auquel les habitants sont attachés au point de donner du temps ou de l'argent pour l'entretenir ?
  en:
    - The workshop's stonemasons still work only by hand, with tools of medieval shape; what can you perceive in such a gesture that a machine would not show?
    - How can an institution last for nearly 800 years without a break, through wars, the Revolution and changes of regime?
    - The craftspeople consult plans and records that are centuries old; what difference does it make to work alongside the traces of those who came before?
    - What does UNESCO recognition as a "good safeguarding practice" bring to a workshop that existed long before it?
    - Is there a building near you that residents care about so much that they give time or money to look after it?
vocabulary:
  - fr: Œuvre Notre-Dame
    en: Œuvre Notre-Dame
    def_fr: Institution laïque attestée à Strasbourg dès 1224, chargée de financer puis d'entretenir la cathédrale ; elle est administrée par la Ville.
    def_en: Lay institution recorded in Strasbourg from 1224, set up to fund and then maintain the cathedral; it is run by the city.
  - fr: atelier de cathédrale
    en: cathedral workshop
    def_fr: Équipe permanente d'artisans attachée à un seul édifice, qu'elle entretient et restaure en continu ; on dit Bauhütte en allemand.
    def_en: Permanent team of craftspeople attached to a single building, which it maintains and restores continuously; called a Bauhütte in German.
  - fr: loge
    en: lodge
    def_fr: Au Moyen Âge, local et communauté des tailleurs de pierre d'un chantier ; celle de Strasbourg fut un temps la loge suprême de l'Empire.
    def_en: In the Middle Ages, the shed and community of a building site's stonemasons; Strasbourg's was for a time the supreme lodge of the Empire.
  - fr: taille manuelle
    en: hand dressing
    def_fr: Façonnage d'un bloc de pierre uniquement avec des outils à main, sans machine ; l'atelier de Strasbourg en a fait sa règle.
    def_en: Shaping a block of stone with hand tools only, without machines; the Strasbourg workshop has made this its rule.
  - fr: polka
    en: polka
    def_fr: Outil de taille ancien, sorte de marteau à double tranchant, redécouvert en 2008 pour retrouver l'aspect d'origine des surfaces de pierre.
    def_en: Old stone-dressing tool, a kind of double-edged hammer, rediscovered in 2008 to recreate the original look of stone surfaces.
  - fr: maître d'ouvrage délégué
    en: delegated client
    def_fr: Rôle confié par l'État à la Fondation en 1999 ; elle conduit et paie elle-même une partie des travaux sur la cathédrale.
    def_en: Role given to the Foundation by the State in 1999; it runs and pays for part of the work on the cathedral itself.
  - fr: don
    en: gift
    def_fr: Argent ou biens offerts à la Fondation ; au Moyen Âge contre des indulgences, aujourd'hui par attachement au monument, y compris en ligne.
    def_en: Money or property given to the Foundation; in the Middle Ages in exchange for indulgences, today out of attachment to the building, including online.
  - fr: fonds documentaire
    en: documentary archive
    def_fr: Plans médiévaux, comptes, registres d'atelier et photographies accumulés depuis le XIIIe siècle, qui servent encore aux artisans.
    def_en: Medieval plans, accounts, workshop logbooks and photographs gathered since the 13th century, still used by the craftspeople.
context:
  fr: >-
    La cathédrale de Strasbourg est entretenue depuis près de huit siècles par une même institution, la Fondation de l'Œuvre Notre-Dame. Née au début du XIIIe siècle pour gérer les dons destinés au chantier, elle passe à la fin du Moyen Âge sous l'autorité de la Ville, qui l'administre toujours. Sa loge de tailleurs de pierre devient au XVe siècle la plus prestigieuse du Saint-Empire. Elle traverse la Révolution, retrouve son rôle en 1803 et, depuis une convention de 1999, mène une partie des travaux pour le compte de l'État, propriétaire de l'édifice.
    Aujourd'hui, une vingtaine de techniciens (tailleurs de pierre, sculpteurs, maçons) y travaillent en permanence. C'est le seul atelier attaché à une cathédrale en France, et il taille la pierre uniquement à la main. Les gestes se transmettent d'artisan à apprenti, en s'appuyant sur des archives conservées depuis le Moyen Âge. Les dons de particuliers et de mécènes continuent de financer les chantiers, aux côtés des revenus d'un patrimoine immobilier ancien.
  en: >-
    Strasbourg Cathedral has been maintained for nearly eight centuries by one institution, the Fondation de l'Œuvre Notre-Dame. Founded in the early 13th century to manage gifts for the building site, it came under the authority of the city by the end of the Middle Ages, and the city still runs it. In the 15th century its stonemasons' lodge became the most prestigious in the Holy Roman Empire. It survived the Revolution, regained its role in 1803 and, under an agreement signed in 1999, carries out part of the work on behalf of the State, which owns the building.
    Today around twenty technicians (stonemasons, sculptors, builders) work there full time. It is the only workshop attached to a cathedral in France, and it dresses stone by hand only. Skills pass from craftsperson to apprentice, drawing on archives kept since the Middle Ages. Gifts from individuals and patrons still fund the work, alongside income from property built up over the centuries.
unesco:
  fr: >-
    En 2020, l'UNESCO a inscrit les pratiques des ateliers de cathédrales d'Europe, ou Bauhütten, au Registre des bonnes pratiques de sauvegarde. Ce dossier commun à l'Allemagne, l'Autriche, la France, la Norvège et la Suisse réunit des ateliers de plusieurs pays ; la Fondation de l'Œuvre Notre-Dame y représente la France. Ce registre ne classe pas un monument : il distingue une manière de transmettre et de faire vivre des savoir-faire, jugée exemplaire et utile à d'autres. Les ateliers s'engagent à former, documenter et partager leur expérience.
  en: >-
    In 2020 UNESCO selected the practices of Europe's cathedral workshops, or Bauhütten, for the Register of Good Safeguarding Practices. This joint file of Austria, France, Germany, Norway and Switzerland brings together workshops from several countries; the Fondation de l'Œuvre Notre-Dame represents France. The register does not list a monument: it highlights a way of passing on and keeping skills alive that is seen as exemplary and useful to others. The workshops commit to training, documenting and sharing their experience.
activity:
  title_fr: La frise chronologique de la cathédrale
  title_en: The cathedral timeline
  fr: >-
    Tracez au tableau une longue frise de 1200 à aujourd'hui. Par petits groupes, placez-y les grandes étapes de la Fondation (création, loge suprême, Révolution, 1803, 1999, inscription en 2020), puis ajoutez des repères que vous connaissez par ailleurs (inventions, guerres, rois, présidents). Comptez combien de générations d'artisans se sont succédé. Discutez enfin : qu'est-ce qui a permis à l'atelier de durer, et qu'est-ce qui pourrait le menacer demain ?
  en: >-
    Draw a long timeline on the board from 1200 to today. In small groups, place the main stages of the Foundation on it (founding, supreme lodge, Revolution, 1803, 1999, inscription in 2020), then add landmarks you know from elsewhere (inventions, wars, kings, presidents). Count how many generations of craftspeople have followed one another. Finally discuss: what has allowed the workshop to last, and what might threaten it tomorrow?
  levels: [middle, high]
lang_review: draft
