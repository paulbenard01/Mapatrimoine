id: 2013_67717_INV_PCI_FRANCE_00296
audience: general
questions:
  fr:
    - Pourquoi, selon vous, la cerise est-elle devenue l'emblème d'Itxassou, jusque sur les bérets des danseurs et les foulards des bénévoles ?
    - Que reste-t-il d'une fête de la cerise quand une partie des fruits vendus vient d'ailleurs, faute de vergers entretenus sur place ?
    - Quel fruit, quel plat ou quel produit sert d'emblème à votre ville ou à votre région, et comment le fête-t-on ?
  en:
    - Why do you think the cherry has become the emblem of Itxassou, even on the dancers' berets and the volunteers' scarves?
    - What remains of a cherry festival when part of the fruit on sale comes from elsewhere, because local orchards are no longer kept up?
    - Which fruit, dish or product is the emblem of your own town or region, and how is it celebrated?
vocabulary:
  - fr: cerise d'Itxassou
    en: Itxassou cherry
    def_fr: Cerise des vergers de ce village basque, réputée depuis au moins le début du XXe siècle ; on la déguste souvent en confiture avec du fromage de brebis.
    def_en: Cherry from the orchards of this Basque village, renowned since at least the early 20th century; often eaten as jam with sheep's cheese.
  - fr: gâteau basque
    en: Basque cake
    def_fr: Gâteau fourré de crème pâtissière ou de confiture de cerises ; des bénévoles en préparent dans la semaine qui précède la fête.
    def_en: Cake filled with custard cream or cherry jam; volunteers bake them in the week before the festival.
  - fr: pelote à main nue
    en: bare-hand pelota
    def_fr: Jeu de balle basque où l'on frappe la pelote avec la paume contre un mur ; une partie est jouée le matin de la fête, après la messe.
    def_en: Basque ball game in which the ball is struck against a wall with the palm; a match is played on the festival morning, after mass.
  - fr: mur à gauche
    en: mur à gauche (pelota court)
    def_fr: Terrain de pelote bordé d'un mur de face et d'un mur latéral à gauche ; à Itxassou, on y dresse aussi les tables du grand repas.
    def_en: Pelota court with a front wall and a side wall on the left; in Itxassou it also holds the tables for the big festival meal.
  - fr: force basque
    en: Basque strength games
    def_fr: Épreuves de force issues des travaux de la ferme, comme le tir à la corde ou le lever de pierre, présentées pendant la fête.
    def_en: Contests of strength drawn from farm work, such as tug-of-war or stone lifting, shown during the festival.
