  fr: >-
    Le 2 février, les familles mexicaines de Paris prolongent les fêtes de l'Épiphanie : ceux qui ont trouvé la fève de la rosca de Reyes offrent les tamales, rappel du culte ancien du maïs, autour de l'Enfant Jésus de la maison.
  en: >-
    On 2 February, Mexican families in Paris close the Epiphany season: those who found the figurine in the rosca de Reyes provide tamales, a reminder of ancient maize worship, around the household's Christ Child figure.
