summary:
  fr: >-
    À Chaumont, le Grand Pardon est un jubilé accordé au Moyen Âge : il n'a lieu que les années où la Saint-Jean-Baptiste, le 24 juin, tombe un dimanche, la ville se couvre alors de milliers de fleurs en papier, après une année de célébrations.
  en: >-
    In Chaumont, the Great Pardon is a jubilee granted in the Middle Ages: it only takes place in years when Saint John the Baptist's day, 24 June, falls on a Sunday, the town is then decked with thousands of paper flowers, after a year of celebrations.
