summary:
  fr: >-
    À Mayotte, le mawlida shenge est une cérémonie de louanges au Prophète, chantée et dansée en grande partie assis, hommes et femmes séparés par un cordon de tissu, organisée pour des fêtes, des commémorations ou des rassemblements.
  en: >-
    In Mayotte, the mawlida shenge is a ceremony of praise to the Prophet, sung and danced mostly seated, with men and women separated by a fabric cord, held for festivals, commemorations and gatherings.
