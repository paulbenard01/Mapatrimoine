summary:
  fr: >-
    Pendant près de trois mois, chaque week-end, les bandes masquées du carnaval de Limoux dansent sur la place au son des musiciens, chacune à son tour ; le carnaval se termine par le jugement et l'incinération de Sa Majesté Carnaval lors de la nuit de la Blanquette.
  en: >-
    For almost three months, every weekend, the masked bands of the Limoux carnival take turns dancing on the main square to live music; the carnival ends with the trial and burning of His Majesty Carnival on the Night of the Blanquette.
