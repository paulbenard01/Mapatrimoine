    À Flers-Bourg, quartier de Villeneuve-d'Ascq, un cortège aux lanternes part à la recherche du géant Saint-Nicolas, accompagné du Père Fouettard et du char du Boucher ; bonbons et coquilles sont distribués aux enfants.
