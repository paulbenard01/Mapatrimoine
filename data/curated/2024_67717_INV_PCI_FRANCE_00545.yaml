    Après une messe de minuit, les pèlerins de Magnac-Laval parcourent de nuit puis de jour une boucle de neuf lieues (environ 53 km) jalonnée de croix fleuries, en l'honneur de saint Maximin, avant de revenir à l'église le soir.
