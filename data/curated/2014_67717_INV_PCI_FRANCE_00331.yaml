summary:
  fr: >-
    Chaque 13 juillet au col de la Pierre-Saint-Martin, les maires de la vallée béarnaise de Barétous et ceux de la vallée navarraise de Roncal renouvellent, mains jointes sur la borne frontière, un traité de paix pastoral médiéval ; trois génisses sont remises en tribut.
  en: >-
    Every 13 July at the Pierre-Saint-Martin pass, the mayors of the Barétous valley in Béarn and of the Roncal valley in Navarre renew a medieval pastoral peace treaty with their hands joined on the border stone; three heifers are handed over as tribute.
