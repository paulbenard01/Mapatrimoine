    543 elements; 6 have two domains. First domain: know-how 178 (33%), games 125 (23%), social and festive practices 102 (19%), rituals 55, performing arts 50, physical practices 21, oral traditions 12. Periods: 137, 222, 127, 57 entries; rituals 27% of 2008-11 entries, then under 9%; know-how 39%, 14%, 55%, 40%. 2012: 141 entries including 119 games, 69 of them in the Brittany box: a sign of a thematic survey campaign, to check in the fiches. Overseas: 29 (5.3%); 2, 3, 12 then 12 per period, i.e. 21% of 2022-26 entries; Réunion 8, Guadeloupe 6, Mayotte 5, French Guiana 4. Events: 113 (21%), 75 of them festive practices. UNESCO: 34 elements (6.3%), no games or oral traditions, 14 know-how; 28 of 34 entered the inventory in or before their inscription year. Fiches: Granville, free headings; the whole town takes part to varying degrees, district and friends' committees, an elected organising committee, the town a stakeholder; no section on consent or threats. Mawlida, plan I to VI; community = Mayotte's population and diaspora, plus associations, Koranic schools, media, researchers; threats: rented marquees, costs, subsidies, fewer young performers; IV.3 makes the inventory the first safeguarding measure; V.2 lists support and consent.
