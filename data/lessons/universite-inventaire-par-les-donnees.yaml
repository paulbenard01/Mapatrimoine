    543 éléments ; 6 ont deux domaines. Premier domaine : savoir-faire 178 (33 %), jeux 125 (23 %), pratiques sociales et festives 102 (19 %), rituels 55, arts du spectacle 50, pratiques physiques 21, traditions orales 12. Périodes : 137, 222, 127, 57 entrées ; rituels 27 % des entrées 2008-11 puis moins de 9 % ; savoir-faire 39 %, 14 %, 55 %, 40 %. 2012 : 141 entrées dont 119 jeux, 69 de ces jeux dans le rectangle breton : indice d'une campagne thématique, à vérifier dans les fiches. Outre-mer : 29 (5,3 %) ; 2, 3, 12 puis 12 par période, soit 21 % des entrées 2022-26 ; La Réunion 8, Guadeloupe 6, Mayotte 5, Guyane 4. Événements : 113 (21 %), dont 75 pratiques festives. UNESCO : 34 éléments (6,3 %), aucun jeu ni tradition orale, 14 savoir-faire ; 28 sur 34 entrés à l'inventaire l'année de l'inscription ou avant. Fiches : Granville, rubriques libres ; toute la ville participe à des degrés divers, comités de quartier et d'amis, comité d'organisation élu, la ville partie prenante ; pas de rubrique consentement ni menaces. Mawlida, plan I à VI ; communauté = population mahoraise et diaspora, plus associations, écoles coraniques, médias, chercheurs ; menaces : chapiteaux loués, coûts, subventions, moindre pratique des jeunes ; IV.3 fait de l'inventaire la première mesure de sauvegarde ; V.2 liste soutiens et consentements.
