id: primaire-detectives-patrimoine-vivant
level: primary
title:
  fr: Détectives du patrimoine vivant
  en: Living heritage detectives
grade:
  fr: CM1-CM2 (cycle 3)
  en: Years 5-6 / grades 4-5 (French cycle 3, CM1-CM2)
duration_min: 60
summary:
  fr: >-
    La classe devient une agence de détectives. Chaque équipe reçoit un dossier mystère : un objet, un son ou une odeur, un geste et un lieu. Il faut deviner la tradition, la confirmer sur la carte, puis chercher les preuves qu'elle est vivante : qui la fait vivre, comment on l'apprend, ce qui a changé. Les équipes présentent leur tradition en mimant son geste, épinglent la carte de classe et écrivent une carte postale envoyée depuis la tradition. On termine avec « Autour de moi » pour découvrir le patrimoine vivant près de l'école.
  en: >-
    The class becomes a detective agency. Each team gets a mystery file: an object, a sound or smell, a gesture and a place. They must guess the tradition, confirm it on the map, then gather proof that it is alive: who keeps it going, how people learn it, what has changed. Teams present their tradition by miming its gesture, pin it on the class map and write a postcard sent from the tradition. The lesson ends with "Autour de moi" (Near me) to discover living heritage close to the school.
curriculum:
  fr: >-
    La séance s'inscrit dans le parcours d'éducation artistique et culturelle (PEAC) : rencontrer des pratiques culturelles vivantes et en parler. En géographie de CM1, elle prolonge l'étude des lieux où l'on habite et apprend à se repérer sur une carte de France qui inclut les territoires d'outre-mer. En enseignement moral et civique, elle fait travailler la coopération en équipe et le respect des cultures des autres. Elle mobilise aussi le langage oral (présenter, justifier une hypothèse), la lecture de documents (texte, image) et l'écriture d'un court texte. L'écoute de musiques (éducation musicale) peut s'ajouter si la classe dispose d'enregistrements.
  en: >-
    The lesson belongs to the arts and culture education pathway (PEAC): meeting living cultural practices and talking about them. In Year 5 (CM1) geography, it extends the study of the places where we live and practises finding places on a map of France that includes the overseas territories. In moral and civic education, it builds teamwork and respect for other people's cultures. It also draws on speaking (presenting, justifying a guess), reading documents (text and image) and writing a short text. Listening to music (music education) can be added if the class has recordings.
objectives:
  fr:
    - >-
      Faire des hypothèses à partir d'indices et les vérifier avec un outil numérique (recherche et carte).
    - >-
      Comprendre qu'une tradition est « vivante » parce que des personnes la font, l'apprennent et la transmettent.
    - >-
      Situer des traditions de l'Hexagone et des outre-mer sur une carte de France.
    - >-
      Présenter oralement une tradition et écrire un court texte qui dit qui la fait vivre.
  en:
    - >-
      Make guesses from clues and check them with a digital tool (search and map).
    - >-
      Understand that a tradition is "living" because people practise it, learn it and pass it on.
    - >-
      Locate traditions from mainland France and the overseas territories on a map of France.
    - >-
      Present a tradition orally and write a short text saying who keeps it alive.
materials:
  fr:
    - >-
      Le site PCI Map vidéoprojeté, et une tablette ou un ordinateur par équipe (https://paulbenard01.github.io/Mapatrimoine/).
    - >-
      Six enveloppes « dossier mystère » contenant chacune quatre cartes-indices découpées (objet, son ou odeur, geste, lieu), plus un dossier bonus.
    - >-
      Une grande carte de France muette avec les outre-mer en encadré (format A2 ou A1) et des gommettes ou épingles.
    - >-
      Une « fiche détective » par équipe : hypothèses, nom de la tradition, lieu, trois preuves de vie.
    - >-
      Des cartes A5 cartonnées pour les cartes postales, crayons de couleur.
    - >-
      Facultatif : les fiches imprimables des éléments (?id=<id>&sheet=1) pour les équipes sans écran.
  en:
    - >-
      The PCI Map site on the projector, and one tablet or computer per team (https://paulbenard01.github.io/Mapatrimoine/).
    - >-
      Six "mystery file" envelopes, each holding four cut-out clue cards (object, sound or smell, gesture, place), plus a bonus file.
    - >-
      A large blank map of France with the overseas territories in insets (A2 or A1) and stickers or pins.
    - >-
      One "detective sheet" per team: guesses, name of the tradition, place, three proofs of life.
    - >-
      A5 card for the postcards, coloured pencils.
    - >-
      Optional: the printable element sheets (?id=<id>&sheet=1) for teams without a screen.
