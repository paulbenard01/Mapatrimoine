id: college-qui-fait-vivre-une-tradition
level: middle
title:
  fr: "Qui fait vivre une tradition ? Une enquête en puzzle"
  en: "Who keeps a tradition alive? A jigsaw investigation"
grade:
  fr: 5e-4e (cycle 4)
  en: Years 8-9 / grades 7-8 (French cycle 4, 5e-4e)
duration_min: 60
summary:
  fr: >-
    Un musée veut ouvrir une salle consacrée au patrimoine vivant, mais comment écrire l'étiquette d'une chose qui bouge ? La classe enquête en puzzle : chaque élève devient expert d'une tradition (les géants de Cassel, les couvreurs zingueurs de Paris, le fest-noz breton, le Touloulou du carnaval de Guyane, et le 'ori tahiti pour les grandes classes), puis rejoint son groupe d'origine pour comparer qui la porte, comment on l'apprend, ce qui change et ce que l'inventaire ou l'UNESCO y changent. Un débat mouvant met ces preuves à l'épreuve, et chacun écrit un cartel de musée pour une tradition vivante ou une prise de position argumentée.
  en: >-
    A museum wants to open a room on living heritage, but how do you write a label for something that moves? The class runs a jigsaw investigation: each student becomes an expert on one tradition (the Cassel giants, the zinc roofers of Paris, the Breton fest-noz, the Touloulou of the Guiana carnival, and Tahitian 'ori for larger classes), then returns to a home group to compare who carries it, how it is learnt, what is changing and what the national inventory or UNESCO changes for it. A walking debate puts this evidence to the test, and everyone writes a museum label for a living tradition or an argued position.
curriculum:
  fr: >-
    Cycle 4 (5e-4e). En enseignement moral et civique, la séance exerce le jugement : débat réglé, distinction entre un fait sourcé et une opinion, respect de la diversité des cultures et de l'égale dignité des pratiques. En français, elle travaille l'oral (exposer à des camarades qui ne connaissent pas le sujet, défendre un point de vue) et l'écriture d'un texte court pour un lecteur précis. Elle s'inscrit dans le parcours d'éducation artistique et culturelle et peut nourrir l'histoire des arts (patrimoine, fête, savoir-faire). En éducation aux médias et à l'information, les élèves cherchent une information, vérifient d'où elle vient (page de l'élément, fiche officielle du ministère de la Culture) et la citent. Ils situent enfin des territoires de l'Hexagone et des outre-mer.
  en: >-
    French cycle 4 (5e-4e). In moral and civic education, the lesson trains judgement: a structured debate, telling a sourced fact from an opinion, respect for cultural diversity and for the equal dignity of practices. In French, it works on speaking (explaining to classmates who do not know the topic, defending a view) and on writing a short text for a specific reader. It belongs to the arts and culture education pathway (PEAC) and can feed into art history (heritage, festivals, craft skills). In media and information literacy, students look for information, check where it comes from (the element page, the Ministry of Culture's official fiche) and cite it. They also locate places in mainland France and the overseas territories.
objectives:
  fr:
    - >-
      Devenir expert d'une tradition à partir de documents et l'expliquer en 90 secondes à des camarades qui ne la connaissent pas.
    - >-
      Comparer plusieurs traditions selon quatre critères : qui la porte, comment elle se transmet, ce qui change, ce que change sa reconnaissance.
    - >-
      Comprendre qu'une tradition vivante évolue et que ses praticiens discutent de ce qui doit rester.
    - >-
      Distinguer l'inventaire national et l'inscription à l'UNESCO, sans en faire un classement des traditions.
    - >-
      Défendre une position avec des preuves tirées des éléments étudiés, à l'oral puis à l'écrit.
  en:
    - >-
      Become an expert on one tradition from documents and explain it in 90 seconds to classmates who do not know it.
    - >-
      Compare several traditions on four criteria: who carries it, how it is handed on, what is changing, what recognition changes for it.
    - >-
      Understand that a living tradition evolves and that its practitioners debate what must stay.
    - >-
      Tell the national inventory from UNESCO inscription, without turning either into a ranking of traditions.
    - >-
      Defend a position with evidence from the elements studied, first orally, then in writing.
materials:
  fr:
    - >-
      Le site PCI Map vidéoprojeté, et une tablette ou un ordinateur par table d'experts (https://paulbenard01.github.io/Mapatrimoine/).
    - >-
      Les fiches imprimables (?id=<id>&sheet=1) de Cassel, des couvreurs zingueurs et du fest-noz (fiches longues, avec contexte et UNESCO) et du carnaval de Guyane.
    - >-
      Les cinq cartes-dossiers A à E et une grille de l'expert par élève (voir l'étape 2).
    - >-
      Des pastilles de couleur A, B, C, D (et E) pour former les groupes d'origine et les groupes d'experts.
    - >-
      Une matrice de comparaison A3 par groupe d'origine (une ligne par tradition, une colonne par question) et les quatre cartes-défis.
    - >-
      Un ruban adhésif au sol pour le débat mouvant.
    - >-
      Des cartons A5 pour les cartels et un minuteur projeté.
  en:
    - >-
      The PCI Map site on the projector, and one tablet or computer per expert table (https://paulbenard01.github.io/Mapatrimoine/).
    - >-
      The printable sheets (?id=<id>&sheet=1) for Cassel, the zinc roofers and the fest-noz (extended sheets with context and UNESCO) and for the Guiana carnival.
    - >-
      The five dossier cards A to E and one expert grid per student (see step 2).
    - >-
      Coloured stickers A, B, C, D (and E) to form the home groups and the expert groups.
    - >-
      One A3 comparison matrix per home group (one row per tradition, one column per question) and the four challenge cards.
    - >-
      Masking tape on the floor for the walking debate.
    - >-
      A5 card for the labels and an on-screen timer.
