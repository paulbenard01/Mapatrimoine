id: lycee-comite-unesco-simule
level: high
title:
  fr: "Le Comité de l'UNESCO en séance : faut-il inscrire le Biou d'Arbois ?"
  en: "UNESCO committee in session: should the Biou of Arbois be inscribed?"
grade:
  fr: Terminale, spécialité HGGSP ; adaptable en Seconde et en EMC
  en: Final year of upper secondary (Terminale, HGGSP specialism); adaptable for Seconde (Year 11 / grade 10) and civics (EMC)
duration_min: 60
summary:
  fr: >-
    La classe devient le Comité intergouvernemental de l'UNESCO. À l'ordre du jour : une candidature réelle, encore en attente, celle du Biou d'Arbois, fête des vignerons du Jura. Cinq délégations (communauté porteuse, État, tourisme, expert du patrimoine, journaliste sceptique) lisent les pièces sur PCI Map, s'appuient sur des précédents (Granville, géants du Nord, baguette, maloya, yole de Martinique), plaident, s'interpellent puis votent avec les critères de la Convention de 2003. Le débriefing relie la décision aux enjeux géopolitiques du patrimoine et chacun rédige un avis motivé.
  en: >-
    The class becomes UNESCO's Intergovernmental Committee. On the agenda: a real nomination that is still pending, the Biou of Arbois, a winegrowers' festival in the Jura. Five delegations (the bearer community, the State, tourism, a heritage expert, a sceptical journalist) read the evidence on PCI Map, draw on precedents (Granville, the giants of the North, the baguette, maloya, the Martinique yole), make their case, challenge each other and vote using the criteria of the 2003 Convention. The debrief links the decision to the geopolitics of heritage, and everyone writes a reasoned opinion.
curriculum:
  fr: >-
    En Terminale, spécialité HGGSP, la séance sert le thème « Identifier, protéger et valoriser le patrimoine : enjeux géopolitiques » : usages sociaux et politiques du patrimoine, tensions et concurrences autour de sa protection, rôle de l'UNESCO et action de la France (elle peut nourrir l'objet de travail conclusif sur la France et le patrimoine). Elle entraîne aux capacités de la spécialité : analyser des documents, construire une argumentation, s'exprimer à l'oral, ce qui prépare aussi au Grand oral. En Seconde ou en EMC, elle se prête à un débat argumenté et réglé sur la délibération collective, l'engagement et le respect de la diversité culturelle.
  en: >-
    In the final year, for the HGGSP specialism (history, geography, geopolitics and political science), the lesson serves the theme on identifying, protecting and showcasing heritage and its geopolitical stakes: the social and political uses of heritage, the tensions and rivalries around protecting it, the role of UNESCO and the action of France (it can feed the closing case study on France and heritage). It trains the specialism's skills: analysing documents, building an argument and speaking, which also prepares for the Grand oral exam. In Seconde or in civics (EMC), it works as a structured, evidence-based debate on collective deliberation, civic engagement and respect for cultural diversity.
objectives:
  fr:
    - >-
      Énoncer avec ses mots les idées clés de la Convention de 2003 : patrimoine vivant, communautés au centre, sauvegarde plutôt que conservation figée.
    - >-
      Appliquer à un dossier réel les cinq critères d'inscription sur la Liste représentative, à partir de documents.
    - >-
      Identifier les acteurs du patrimoine et leurs intérêts parfois divergents : communauté, État, tourisme, experts, médias.
    - >-
      Construire et défendre, à l'oral puis à l'écrit, un avis motivé qui pèse les bénéfices et les risques d'une inscription.
    - >-
      Relier une décision locale aux enjeux géopolitiques du patrimoine : rayonnement, concurrence entre dossiers, candidatures multinationales.
  en:
    - >-
      State in their own words the key ideas of the 2003 Convention: living heritage, communities at the centre, safeguarding rather than freezing.
    - >-
      Apply the five criteria for the Representative List to a real nomination, using documents.
    - >-
      Identify the actors of heritage and their sometimes conflicting interests: community, State, tourism, experts, media.
    - >-
      Build and defend, orally then in writing, a reasoned opinion weighing the benefits and risks of an inscription.
    - >-
      Link a local decision to the geopolitics of heritage: influence, competition between nominations, multinational files.
materials:
  fr:
    - >-
      PCI Map vidéoprojeté avec le filtre UNESCO (https://paulbenard01.github.io/Mapatrimoine/?unesco=1) et un ordinateur ou une tablette par délégation.
    - >-
      La page du Biou d'Arbois (?id=2013_67717_INV_PCI_FRANCE_00314) et son lien vers la fiche officielle ; les fiches imprimables étendues des précédents (?id=<id>&sheet=1).
    - >-
      Cinq cartes de rôle et une carte « critères R.1 à R.5 » par délégation ; un chevalet nominatif par délégation.
    - >-
      Une grille de prise de notes (argument, fait cité, critère, solidité de la preuve) et un bulletin de vote par élève, plus une urne.
    - >-
      Facultatif : la page UNESCO du carnaval de Granville (lien depuis l'élément) pour comparer avec le vocabulaire officiel.
  en:
    - >-
      PCI Map on the projector with the UNESCO filter (https://paulbenard01.github.io/Mapatrimoine/?unesco=1) and one computer or tablet per delegation.
    - >-
      The Biou of Arbois page (?id=2013_67717_INV_PCI_FRANCE_00314) and its link to the official fiche; the extended printable sheets of the precedents (?id=<id>&sheet=1).
    - >-
      Five role cards and one "criteria R.1 to R.5" card per delegation; a name plate for each delegation.
    - >-
      A note-taking grid (argument, fact cited, criterion, strength of evidence) and a ballot paper per student, plus a ballot box.
    - >-
      Optional: UNESCO's page on the Carnival of Granville (linked from the element) to compare with the official wording.
