# Short summaries for the inventory elements not curated in data/curated yet (M7).
# Own-words drafts written from the fiche text published on PCI Lab (read: pcilab) or
# the official fiche (read: fiche); never dated. Schema: schema/summary.schema.json.
2008_67717_INV_PCI_FRANCE_00001:
  kind: practice
  summary:
    fr: >-
      À Carbuccia (Corse-du-Sud), les chantres de la confrérie interprètent en paghjella, polyphonie masculine
      a cappella à trois voix, les offices des vivants et des morts et ceux de la Semaine sainte ; leur
      versu « composite » emprunte à d'autres versi en plus de sa propre matrice.
    en: >-
      In Carbuccia (Corse-du-Sud), the confraternity's cantors sing the services for the living and the
      dead and those of Holy Week in paghjella, three-voice unaccompanied male polyphony; their "composite"
      versu borrows from other versi on top of its own pattern.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00002:
  kind: practice
  summary:
    fr: >-
      Dans le Nebbiu, la confrérie Saint-Jean-Baptiste de Furiani (Haute-Corse) chante en paghjella un
      répertoire religieux en latin et en grec, notamment pendant la Semaine sainte ; le prieur transmet
      oralement ce versu composite aux nouveaux chantres pendant au moins deux ans.
    en: >-
      In the Nebbiu, the confraternity of Saint John the Baptist in Furiani (Haute-Corse) sings a Latin
      and Greek religious repertoire in paghjella, especially during Holy Week; the prior teaches this
      composite versu orally to new cantors over at least two years.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00003:
  kind: practice
  summary:
    fr: >-
      À Sermanu (Haute-Corse), le versu « entier » du cantu in paghjella, chant d'hommes à trois voix
      entrant toujours dans le même ordre, accompagne messes des vivants et des morts, fêtes patronales,
      processions et veillées ; il se transmet oralement des anciens aux plus jeunes.
    en: >-
      In Sermanu (Haute-Corse), the "whole" versu of cantu in paghjella, a male song whose three voices
      always enter in the same order, accompanies masses for the living and the dead, patronal feasts,
      processions and evening gatherings; it passes orally from elders to the young.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00005:
  kind: practice
  summary:
    fr: >-
      En Basse-Normandie, des potiers façonnent dans des moules en plâtre des épis de faîtage en terre
      cuite émaillée, ornements qui coiffent le toit des maisons depuis le Moyen Âge ; leur savoir-faire
      peine aujourd'hui à se transmettre.
    en: >-
      In Lower Normandy, potters shape glazed earthenware finials in plaster moulds, ornaments that have
      crowned house roofs since the Middle Ages; the skill is now hard to pass on.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00008:
  kind: practice
  summary:
    fr: >-
      L'héliogravure transfère une image sur une plaque de cuivre grâce à une gélatine sensible à la lumière,
      avant gravure à l'acide et impression ; née au XIXe siècle pour la reproduction en nombre, elle
      est pratiquée dans un atelier de Meudon pour l'estampe d'art.
    en: >-
      Photogravure transfers an image onto a copper plate through light-sensitive gelatine before acid
      etching and printing; born in the 19th century for mass reproduction, it is practised in a workshop
      in Meudon for fine-art prints.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00009:
  kind: practice
  summary:
    fr: >-
      La calligraphie fait de l'écriture un art : dans un atelier d'Allaire (Morbihan), chaque texte est
      mis en page, essayé et calculé avant d'être tracé à la plume ou au calame, la préparation occupant
      les deux tiers du temps de travail.
    en: >-
      Calligraphy turns handwriting into an art: in a workshop in Allaire (Morbihan), each text is laid
      out, tried out and measured before being written with a pen or reed, with preparation taking two
      thirds of the working time.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00010:
  kind: practice
  summary:
    fr: >-
      À Peillac (Morbihan), un atelier de tissage à bras produit sur des métiers actionnés à la main des
      pièces uniques, des tissus bretons traditionnels et des reconstitutions d'étoffes anciennes pour
      les musées ; aucune formation officielle n'existe en France pour ce métier.
    en: >-
      In Peillac (Morbihan), a hand-weaving workshop uses manually operated looms to make one-off pieces,
      traditional Breton fabrics and reconstructions of old textiles for museums; France has no official
      training for this trade.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00011:
  kind: practice
  summary:
    fr: >-
      À Liffol-le-Grand (Vosges), haut lieu historique du siège en France, menuisiers et sculpteurs fabriquent
      des carcasses de sièges en bois, assemblées à tenons et mortaises chevillés pour le style XVIIIe,
      avant dorure ou garniture par d'autres artisans.
    en: >-
      In Liffol-le-Grand (Vosges), a historic centre of French chair-making, joiners and woodcarvers build
      wooden seat frames, joined with pegged mortise and tenon for 18th-century styles, before other craftspeople
      gild or upholster them.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00012:
  kind: practice
  summary:
    fr: >-
      À Saint-Junien (Haute-Vienne), ville de tradition gantière, une mégisserie installée au bord de
      la Vienne transforme des peaux de chevreau et d'agneau en cuir souple, par une longue suite d'opérations
      de délainage, de bains et de tannage.
    en: >-
      In Saint-Junien (Haute-Vienne), a town with a long glove-making tradition, a tawery on the banks
      of the Vienne turns kid and lamb skins into soft leather through a long series of dewooling, soaking
      and tanning steps.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00013:
  kind: practice
  summary:
    fr: >-
      En Lorraine, à Nancy et Vannes-le-Châtel, une cristallerie fondée en 1878 perpétue la pâte de verre,
      technique antique redécouverte en France à la fin du XIXe siècle : les pièces sont moulées puis
      fondues à la cire perdue.
    en: >-
      In Lorraine, at Nancy and Vannes-le-Châtel, a crystal works founded in 1878 keeps alive pâte de
      verre, an ancient glass technique rediscovered in France in the late 19th century; pieces are moulded
      and cast by the lost-wax process.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00014:
  kind: practice
  summary:
    fr: >-
      La glyptique, art millénaire de graver et sculpter les pierres dures et fines (sceaux, camées, intailles),
      est pratiquée dans un atelier parisien ; la pierre est façonnée par abrasion au touret, et aucune
      formation spécifique n'existe plus en France depuis 1995.
    en: >-
      Glyptics, the age-old art of engraving and carving hard and semi-precious stones (seals, cameos,
      intaglios), is practised in a Paris workshop; the stone is shaped by abrasion on a lathe, and France
      has had no dedicated training since 1995.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00015:
  kind: practice
  summary:
    fr: >-
      En Normandie, un maçon remplit et décore les murs à pans de bois, surtout sur des monuments historiques,
      avec du torchis d'argile et de paille, un enduit « tapisserie » ou du tuileau, éclats de vieilles
      tuiles posés à la chaux en motifs géométriques.
    en: >-
      In Normandy, a mason fills and decorates timber-framed walls, mostly on listed buildings, with clay-and-straw
      daub, "tapestry" render or tuileau, fragments of old roof tiles set in lime in geometric patterns.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00016:
  kind: practice
  summary:
    fr: >-
      À La Gacilly (Morbihan), un atelier pratique l'enluminure selon les techniques médiévales : parchemin
      poncé, apprêt à la colle de vessie d'esturgeon, pose de la feuille d'or puis des couleurs tirées
      de minéraux, de plantes et d'ocres.
    en: >-
      In La Gacilly (Morbihan), a workshop practises illumination using medieval techniques: sanded parchment,
      a sturgeon-bladder glue ground, then gold leaf and colours made from minerals, plants and ochres.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00017:
  kind: practice
  summary:
    fr: >-
      À Limoges, un atelier familial est le dernier à peindre des miniatures en émail « blanc Limoges
      » sur cuivre : les couches d'émail sont posées à l'aiguille ou au pinceau, avec des paillons d'or
      et d'argent, puis cuites plusieurs fois entre 850 et 900 °C.
    en: >-
      In Limoges, a family workshop is the last to paint miniatures in "blanc Limoges" enamel on copper:
      layers of enamel are laid with a needle or brush, with gold and silver foils between them, then
      fired several times at 850 to 900 °C.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00018:
  kind: practice
  summary:
    fr: >-
      À Felletin (Creuse), pays de la laine depuis le XVe siècle grâce aux troupeaux du plateau de Millevaches,
      une filature familiale carde, file, retord et teint la laine sur d'anciennes machines ; le métier
      ne s'apprend qu'en interne.
    en: >-
      In Felletin (Creuse), wool country since the 15th century thanks to the flocks of the Millevaches
      plateau, a family spinning mill cards, spins, twists and dyes wool on old machinery; the trade is
      learned only on the job.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00019:
  kind: practice
  summary:
    fr: >-
      Au Puy-en-Velay (Haute-Loire), la dentelle au fuseau naît du croisement de nombreux fuseaux autour
      d'épingles plantées sur un dessin ; le Velay passe pour l'un des berceaux de la dentelle et un centre
      local en enseigne toutes les étapes.
    en: >-
      In Le Puy-en-Velay (Haute-Loire), bobbin lace is made by crossing and twisting many bobbins around
      pins set on a pattern; the Velay is held to be one of the birthplaces of lace, and a local centre
      teaches every stage of the craft.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00020:
  kind: practice
  summary:
    fr: >-
      À Bécherel (Ille-et-Vilaine), un atelier fabrique sur mesure des pigments d'origine minérale, végétale
      ou animale et des vernis pour la lutherie, en s'appuyant sur des recettes anciennes ; il travaille
      surtout avec des spécialistes, notamment des luthiers.
    en: >-
      In Bécherel (Ille-et-Vilaine), a workshop makes made-to-order pigments of mineral, plant or animal
      origin and varnishes for stringed instruments, drawing on old recipes; it works mainly with specialists,
      violin makers in particular.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00021:
  kind: practice
  summary:
    fr: >-
      À Forcalquier (Alpes-de-Haute-Provence), un atelier restaure des sièges en les cannant au rotin
      ou en les rempaillant de paille de seigle ou de sagne, une laîche ; le rotin et la paille de seigle
      deviennent difficiles à trouver.
    en: >-
      In Forcalquier (Alpes-de-Haute-Provence), a workshop restores chairs by caning them with rattan
      or reseating them with rye straw or sagne, a sedge; rattan and rye straw are becoming hard to find.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00022:
  kind: practice
  summary:
    fr: >-
      À Saint-Junien (Haute-Vienne), un décorateur peint à la main de la porcelaine blanche achetée aux
      fabricants du Limousin : motif tracé au gabarit ou au poncif, couleurs préparées à partir de pigments,
      puis cuisson qui fixe le décor.
    en: >-
      In Saint-Junien (Haute-Vienne), a decorator hand-paints white porcelain bought from Limousin manufacturers:
      the motif is traced with a template or pounce, colours are mixed from pigments, and firing fixes
      the decoration.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00023:
  kind: practice
  summary:
    fr: >-
      Près de Metz, au Ban-Saint-Martin (Moselle), un forgeron d'art produit de l'acier damassé : aciers
      durs et doux sont soudés à la forge, étirés et repliés pour multiplier les couches, puis un bain
      d'acide fait apparaître les motifs après polissage.
    en: >-
      Near Metz, at Le Ban-Saint-Martin (Moselle), an art blacksmith makes Damascus steel: hard and soft
      steels are forge-welded, drawn out and folded to multiply the layers, and after polishing an acid
      bath brings out the patterns.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00024:
  kind: practice
  summary:
    fr: >-
      À Longwy (Meurthe-et-Moselle), une faïencerie perpétue les émaux cloisonnés propres à la ville depuis
      les années 1870 : le décor est imprimé en noir sur le biscuit, puis chaque alvéole ainsi cernée
      est remplie goutte à goutte d'émail coloré.
    en: >-
      In Longwy (Meurthe-et-Moselle), a faience works continues the town's cloisonné enamels, made there
      since the 1870s: the design is printed in black on the unglazed biscuit, then each outlined cell
      is filled drop by drop with coloured enamel.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00025:
  kind: practice
  summary:
    fr: >-
      À Dinan (Côtes-d'Armor), un atelier conserve et restaure des pendules anciennes, branche de l'horlogerie
      consacrée aux pièces de volume moyen ; chaque intervention commence par une observation et une documentation
      minutieuses, et moins de dix personnes pratiquent ce métier en France.
    en: >-
      In Dinan (Côtes-d'Armor), a workshop conserves and restores antique mantel and wall clocks, the
      branch of horology dealing with medium-sized pieces; each job starts with close observation and
      recording, and fewer than ten people practise this work in France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00026:
  kind: practice
  summary:
    fr: >-
      À Paris, un atelier de corseterie crée corsets, bustiers et guêpières en cuir et en soie, en alliant
      les techniques traditionnelles du métier à des matériaux actuels qui les rendent plus confortables
      ; il restaure aussi d'anciens corsets.
    en: >-
      In Paris, a corsetry workshop makes corsets, bustiers and waspies in leather and silk, combining
      the trade's traditional techniques with present-day materials that make them more comfortable; it
      also repairs old corsets.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00027:
  kind: practice
  summary:
    fr: >-
      À Dinan (Côtes-d'Armor), un graveur héraldiste grave en creux des blasons sur des chevalières et
      des cachets en or ou en bronze, au burin et aux ciselets miniatures, en traduisant les couleurs
      en hachures et pointillés selon un code précis.
    en: >-
      In Dinan (Côtes-d'Armor), a heraldic engraver cuts coats of arms in intaglio into gold or bronze
      signet rings and seals with gravers and miniature chisels, rendering colours as hatching and dots
      according to a strict code.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00028:
  kind: practice
  summary:
    fr: >-
      À Limoges, où l'émail se serait développé dès le haut Moyen Âge, un émailleur pose des poudres d'émail
      sur une base de cuivre, parfois d'or ou d'argent, puis les cuit entre 850 et 900 °C ; certaines
      pièces passent jusqu'à dix fois au four.
    en: >-
      In Limoges, where enamelling probably took root in the early Middle Ages, an enameller lays powdered
      enamel on a copper base, sometimes gold or silver, and fires it at 850 to 900 °C; some pieces go
      into the kiln up to ten times.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00030:
  kind: practice
  summary:
    fr: >-
      À Dinard (Ille-et-Vilaine), un tourneur sur bois façonne au tour des objets décoratifs dans des
      bois de pays, des bois exotiques ou des loupes ; les finitions (ponçage, lustrage, teintes naturelles,
      cire ou huile) occupent l'essentiel du temps de travail.
    en: >-
      In Dinard (Ille-et-Vilaine), a woodturner shapes decorative pieces on the lathe from local or exotic
      timbers and burls; finishing (sanding, buffing, natural stains, wax or oil) takes up most of the
      working time.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00031:
  kind: practice
  summary:
    fr: >-
      À Notre-Dame-d'Estrées (Calvados), une entreprise de charpente et de menuiserie restaure les maisons
      normandes à pans de bois : les épures sont tracées grandeur nature sur un parquet d'atelier, où
      chaque pan est monté une première fois avant d'être transporté sur le chantier.
    en: >-
      In Notre-Dame-d'Estrées (Calvados), a carpentry and joinery firm restores Norman timber-framed houses:
      full-size setting-out drawings are traced on a workshop floor, where each frame is assembled once
      before being taken to the site.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00032:
  kind: practice
  summary:
    fr: >-
      À Saint-Brieuc (Côtes-d'Armor), un doreur sur métal dore et argente des pièces d'orfèvrerie, au
      mercure ou par électrolyse « façon mercure », puis les brunit à l'agate ; il travaille pour l'horlogerie,
      l'art sacré, l'art de la table et des particuliers.
    en: >-
      In Saint-Brieuc (Côtes-d'Armor), a metal gilder gilds and silvers goldsmith's work, either with
      mercury or by electrolysis imitating it, then burnishes it with agate; clients include clockmaking,
      church art, tableware and private owners.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00033:
  kind: practice
  summary:
    fr: >-
      À Saint-Junien (Haute-Vienne), une ganterie familiale fondée en 1937 coupe des gants dans des peaux
      d'ovins ou de caprins en tenant compte de leur élasticité, les double de soie ou de cachemire, puis
      les met en forme sur des « mains chaudes » ; un gant demande plus de trois heures.
    en: >-
      In Saint-Junien (Haute-Vienne), a family glove maker founded in 1937 cuts gloves from sheep or goat
      skins, allowing for their stretch, lines them with silk or cashmere and shapes them on heated hand
      forms; one glove takes over three hours.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00034:
  kind: practice
  summary:
    fr: >-
      À Sainte-Soulle, près de La Rochelle (Charente-Maritime), un sculpteur ornemaniste reporte son dessin
      sur le bois, dégrossit la pièce puis la sculpte à la gouge avant ponçage, teinte et cire ; il réalise
      boiseries, bas-reliefs et statues, en création comme en restauration.
    en: >-
      In Sainte-Soulle, near La Rochelle (Charente-Maritime), an ornamental woodcarver transfers his drawing
      onto the wood, roughs out the piece and carves it with gouges before sanding, staining and waxing;
      he makes panelling, reliefs and statues, both new and restored.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00035:
  kind: practice
  summary:
    fr: >-
      À Aubusson (Creuse), centre de tapisserie depuis près de six siècles avec Felletin, des lissiers
      tissent sur métier horizontal, de basse lisse, en suivant un carton grandeur nature dont chaque
      numéro renvoie à une couleur de laine ; une manufacture en propose près d'un millier.
    en: >-
      In Aubusson (Creuse), a tapestry centre for nearly six centuries along with Felletin, weavers work
      on horizontal low-warp looms, following a full-size cartoon in which each number stands for a wool
      colour; one manufactory stocks almost a thousand shades.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00036:
  kind: practice
  summary:
    fr: >-
      Le point d'Alençon (Orne) est une dentelle à l'aiguille faite entièrement à la main avec un seul
      fil, en assemblant invisiblement de petits éléments au fil de dix étapes ; une dizaine de spécialistes
      seulement le maîtrisent, pour la plupart à l'atelier conservatoire national d'Alençon.
    en: >-
      Point d'Alençon (Orne) is a needle lace made entirely by hand with a single thread, small elements
      being invisibly joined over ten stages; only about ten specialists master it, most of them at the
      national conservatory workshop in Alençon.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2008_67717_INV_PCI_FRANCE_00037:
  kind: practice
  summary:
    fr: >-
      L'équitation de tradition française, que perpétue le Cadre noir de l'École nationale d'équitation
      à Saumur (Maine-et-Loire), recherche la légèreté et la coopération du cheval par des aides discrètes
      ; elle se transmet surtout directement de l'écuyer à ses élèves, cavaliers et chevaux.
    en: >-
      French-tradition horsemanship, kept alive by the Cadre Noir of the national riding school in Saumur
      (Maine-et-Loire), seeks lightness and the horse's cooperation through discreet aids; it is passed
      on mainly in person from riding master to pupils, both riders and horses.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00038:
  kind: event
  summary:
    fr: >-
      Chaque année, entre fin août et mi-septembre selon le calendrier hindou, un temple du 18e arrondissement
      de Paris célèbre la naissance du dieu Ganesh par un défilé dans le quartier tamoul de La Chapelle
      : sa statue en bronze doré y est promenée sur un char fleuri.
    en: >-
      Each year, between late August and mid-September according to the Hindu calendar, a temple in Paris's
      18th arrondissement celebrates the birth of the god Ganesh with a parade through the Tamil district
      of La Chapelle, carrying his gilded bronze statue on a flower-decked chariot.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00039:
  kind: practice
  summary:
    fr: >-
      À l'église Saint-Joseph-Artisan (Paris 10e), les statues des saints sont l'objet d'une dévotion
      populaire discrète mais constante : bougies, prières et demandes d'intercession, pratique ravivée
      par des fidèles venus des Outre-mer, d'Afrique subsaharienne et d'Asie.
    en: >-
      At the church of Saint-Joseph-Artisan (Paris, 10th arrondissement), the statues of saints receive
      quiet but steady popular devotion: candles, prayers and requests for intercession, a practice revived
      by worshippers from overseas France, sub-Saharan Africa and Asia.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00042:
  kind: practice
  summary:
    fr: >-
      À Paris, des familles mexicaines préparent pour l'Épiphanie la rosca de reyes, brioche en couronne
      parfumée à la fleur d'oranger et à l'anis, ornée de fruits confits ; une petite figurine de l'Enfant
      Jésus, souvent rapportée du Mexique, y est cachée.
    en: >-
      In Paris, Mexican families bake the rosca de reyes for Epiphany, a crown-shaped sweet bread flavoured
      with orange blossom and anise and topped with candied fruit; a small figure of the Christ Child,
      often brought from Mexico, is hidden inside.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00043:
  kind: practice
  summary:
    fr: >-
      À Tende (Alpes-Maritimes), la courenta est une danse de couple sautée des bals, jouée par un duo
      accordéon chromatique et clarinette ; elle enchaîne trois figures, progression en cercle, face-à-face
      et rotation, et alterne avec le balèt.
    en: >-
      In Tende (Alpes-Maritimes), the courenta is a hopping couple dance at village balls, played by a
      chromatic accordion and clarinet duo; it links three figures, circling forward, face to face and
      spinning, and alternates with the balèt.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00044:
  kind: practice
  summary:
    fr: >-
      À Tende (Alpes-Maritimes), l'accordéon chromatique, acheté en Italie, forme avec la clarinette le
      duo qui fait danser courente et balèt ; on l'apprend surtout en observant les joueurs aguerris,
      souvent dans des familles de bergers.
    en: >-
      In Tende (Alpes-Maritimes), the chromatic accordion, bought in Italy, forms the duo with the clarinet
      that plays for the courente and balèt dances; it is learned mainly by watching seasoned players,
      often within shepherd families.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00046:
  kind: practice
  summary:
    fr: >-
      Dans la vallée de la Roya (Alpes-Maritimes), les sugelli sont des pâtes faites maison de farine,
      d'eau et de sel, coupées en dés puis écrasées au pouce ; plat quotidien des bergers autrefois, elles
      se servent aujourd'hui le dimanche, souvent avec du brous et de l'ail.
    en: >-
      In the Roya valley (Alpes-Maritimes), sugelli are home-made pasta of flour, water and salt, cut
      into small pieces and pressed with the thumb; once everyday shepherds' fare, they are now a Sunday
      dish, often served with brous fresh cheese and garlic.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00047:
  kind: practice
  summary:
    fr: >-
      À Tende (Alpes-Maritimes), le balèt est une danse de couple sautée, jouée par un duo accordéon et
      clarinette : sans phase de progression, le couple reste sur place et alterne face-à-face et rotation
      ; plus fatigant, il est bien moins dansé que la courenta.
    en: >-
      In Tende (Alpes-Maritimes), the balèt is a hopping couple dance played by an accordion and clarinet
      duo: with no forward phase, the couple stays in place, alternating face-to-face steps and spins;
      more tiring, it is danced far less than the courenta.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00048:
  kind: practice
  summary:
    fr: >-
      À Paris, la chorale de la paroisse orthodoxe serbe Saint-Sava, une quinzaine de membres, chante
      chaque dimanche la liturgie de saint Jean Chrysostome, surtout en slavon, selon le système des huit
      tons du chant orthodoxe.
    en: >-
      In Paris, the choir of the Serbian Orthodox parish of Saint Sava, some fifteen singers, sings the
      Liturgy of Saint John Chrysostom every Sunday, mostly in Church Slavonic, following the eight-tone
      system of Orthodox chant.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00049:
  kind: practice
  summary:
    fr: >-
      Le trait de charpente rassemble les épures tracées à l'échelle ou grandeur nature, qui permettent
      de préparer au sol toutes les pièces d'une charpente avant le levage ; la fiche le décrit en Champagne-Ardenne,
      où il garde aussi un rôle symbolique chez les compagnons.
    en: >-
      Carpentry layout drawing ("trait de charpente") uses scale or full-size working drawings to prepare
      every timber of a roof frame on the ground before raising it; documented in Champagne-Ardenne, it
      also carries symbolic weight in the compagnonnage.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00050:
  kind: event
  summary:
    fr: >-
      À Géronce, dans le Béarn, le carnaval de la vallée de Josbaig mène un corso fleuri de chars d'actualité
      à travers les villages, le dimanche suivant Mardi gras ; les « Blancs », jeunes gens vêtus de blanc,
      ouvrent le défilé en se lançant leurs trophées à sonnailles.
    en: >-
      In Géronce, Béarn, the Josbaig valley carnival takes a parade of flower-decked topical floats through
      the villages on the Sunday after Shrove Tuesday, led by the "Blancs", young men in white who toss
      bell-hung trophies to one another.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00053:
  kind: practice
  summary:
    fr: >-
      Dans l'ouest des Pyrénées, des artisans fabriquent le tambourin à cordes ou tom-tom, caisse de bois
      aux cordes frappées d'une baguette qui donne un bourdon rythmé ; le musicien l'associe à la flûte
      à trois trous, jouée de l'autre main, pour faire danser.
    en: >-
      In the western Pyrenees, makers build the string drum or tom-tom, a wooden box whose strings are
      struck with a stick to give a rhythmic drone; the player pairs it with a three-hole flute held in
      the other hand to accompany dances.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00055:
  kind: practice
  summary:
    fr: >-
      Le rondeau (rondèu) est une danse de la Gascogne centrale, des Landes au Gers et à l'Agenais, qui
      tourne en cercle ; selon les pays, on la danse en longue chaîne de danseurs épaule contre épaule
      ou en couples qui avancent puis reculent, souvent au chant.
    en: >-
      The rondeau (rondèu) is a circling dance of central Gascony, from the Landes to the Gers and Agenais;
      depending on the area it is danced in a long shoulder-to-shoulder chain or by couples moving forward
      and back, often to the dancers' own singing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00056:
  kind: practice
  summary:
    fr: >-
      La banda est une formation de musiciens amateurs, cuivres, vents et percussions, qui joue en déambulant
      un répertoire d'inspiration espagnole ; née entre Dax et Bayonne au début des années 1960, elle
      anime fêtes, ferias et matchs dans le Sud-Ouest.
    en: >-
      A banda is a band of amateur brass, wind and percussion players performing a Spanish-inspired repertoire
      on the move; born between Dax and Bayonne in the early 1960s, bandas liven up festivals, ferias
      and matches across south-west France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00057:
  kind: practice
  summary:
    fr: >-
      Le compagnonnage forme des hommes de métier tout en les faisant entrer dans une communauté aux rites
      et symboles propres, comme la canne ou les rubans ; le Tour de France, voyage de plusieurs années
      de ville en ville, en marque les étapes.
    en: >-
      The compagnonnage trains craftspeople while bringing them into a community with its own rites and
      symbols, such as the cane and ribbons; the Tour de France, several years of travel from town to
      town, marks each stage of their progress.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00058:
  kind: practice
  summary:
    fr: >-
      Partout en France, le repas gastronomique marque les grands moments de la vie, naissances, mariages
      ou retrouvailles ; il se distingue du quotidien par un menu choisi à l'avance, une table dressée
      avec soin et une suite de plats accordés aux vins.
    en: >-
      Across France, the gastronomic meal marks life's important moments such as births, weddings or reunions;
      it differs from everyday meals through a menu planned ahead, a carefully laid table and a sequence
      of courses matched with wines.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00060:
  kind: practice
  summary:
    fr: >-
      À Chapaize (Saône-et-Loire), un atelier de dorure sur bois restaure miroirs, cadres et sculptures
      confiés par des musées ; le métier combine menuiserie, sculpture, modelage et pose de la feuille
      d'or sur une dizaine de couches d'apprêt à la craie et à la colle de peau.
    en: >-
      In Chapaize (Saône-et-Loire), a gilding workshop restores mirrors, frames and carvings for museums;
      the craft combines joinery, carving, modelling and laying gold leaf over a dozen coats of chalk
      and hide-glue ground.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00061:
  kind: practice
  summary:
    fr: >-
      À Saint-André-le-Désert, en Bourgogne, des céramistes d'art créent des pièces uniques en grès et
      en porcelaine ; l'un d'eux prépare lui-même ses terres et broie ses émaux à partir de roches, de
      cendres et d'argiles, et juge la cuisson à la couleur de la flamme.
    en: >-
      In Saint-André-le-Désert, Burgundy, studio ceramists make one-off stoneware and porcelain pieces;
      one prepares his own clays and grinds glazes from rocks, ashes and clays, judging the firing by
      the colour of the flame.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00062:
  kind: practice
  summary:
    fr: >-
      En Saône-et-Loire, un atelier fabrique et restaure des pianoforte et des clavicordes des XVIIIe
      et XIXe siècles en suivant les matériaux et techniques d'époque ; une copie demande plusieurs milliers
      d'heures, après des années de séchage du bois.
    en: >-
      In Saône-et-Loire, a workshop builds and restores 18th- and 19th-century fortepianos and clavichords
      using period materials and methods; a single copy takes thousands of hours, after the wood has seasoned
      for several years.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00063:
  kind: practice
  summary:
    fr: >-
      À Paris, l'art du tailleur sur mesure repose sur une quinzaine de mesures, la coupe, plusieurs essayages
      et un travail surtout fait à la main ; dans les grands ateliers, coupeur, apiéceur, culottier, giletier
      et boutonniériste se partagent les étapes.
    en: >-
      In Paris, bespoke tailoring relies on some fifteen measurements, cutting, several fittings and mostly
      hand stitching; in larger workshops the cutter, coat-maker, trouser-maker, waistcoat-maker and buttonhole-maker
      share the work.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00064:
  kind: practice
  summary:
    fr: >-
      À Donzy-le-Pertuis (Saône-et-Loire), un artisan choisit en forêt des arbres pour la lutherie, fait
      vieillir leur bois une quinzaine d'années et le fournit aux facteurs ; il fabrique et restaure aussi
      des instruments, surtout la vielle à roue.
    en: >-
      In Donzy-le-Pertuis (Saône-et-Loire), a craftsman selects trees in the forest for instrument making,
      seasons their wood for around fifteen years and supplies it to makers; he also builds and restores
      instruments, especially the hurdy-gurdy.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00065:
  kind: practice
  summary:
    fr: >-
      Au cap Sizun (Finistère), un gros bloc de granit couché sur la lande passe pour le bateau de pierre
      sur lequel saint Conogan aurait traversé la mer depuis l'Irlande ; la légende se transmet de bouche
      à oreille et lors de balades contées.
    en: >-
      On Cap Sizun (Finistère), a large granite block lying on the heath is said to be the stone boat
      on which Saint Conogan crossed the sea from Ireland; the legend passes by word of mouth and through
      storytelling walks.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00066:
  kind: practice
  summary:
    fr: >-
      Entre Plovan et Pouldreuzic, en pays Bigouden, un ensemble de pierres sur une colline est vu comme
      le « ménage » de saint Kodelig : son lit creusé dans la roche, son armoire et sa motte de beurre
      ; les promeneurs s'allongent encore dans l'empreinte du lit.
    en: >-
      Between Plovan and Pouldreuzic in the Bigouden country, a group of stones on a hill is seen as Saint
      Kodelig's household: his bed hollowed in the rock, his wardrobe and his pat of butter; walkers still
      lie down in the hollow of the bed.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00067:
  kind: practice
  summary:
    fr: >-
      À Locronan (Finistère), un énorme rocher de granit appelé jument de pierre ou chaise de saint Ronan
      passe pour favoriser la fécondité des femmes qui s'y assoient ; il est l'une des étapes de la grande
      troménie organisée tous les six ans.
    en: >-
      In Locronan (Finistère), a huge granite boulder known as the stone mare or Saint Ronan's chair is
      believed to help women who sit on it to conceive; it is one of the stops on the great troménie procession
      held every six years.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00068:
  kind: practice
  summary:
    fr: >-
      Près de la chapelle Saint-Vio à Tréguennec, en pays Bigouden, une stèle de l'Âge du fer est dite
      barque de saint Vio ; jusqu'à l'entre-deux-guerres, on retournait l'un de ses morceaux aux Rogations
      pour appeler la pluie ou le beau temps.
    en: >-
      Near the Saint-Vio chapel in Tréguennec, Bigouden country, an Iron Age stele is called Saint Vio's
      boat; until the interwar years, people turned one of its pieces over at Rogationtide to bring rain
      or fine weather.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00069:
  kind: practice
  summary:
    fr: >-
      La fauconnerie française consiste à chasser le gibier sauvage avec des oiseaux de proie dressés
      ; présente en France depuis au moins le Ve siècle, elle a décliné avec les armes à feu avant d'être
      reprise par des passionnés à partir du XIXe siècle.
    en: >-
      French falconry is the art of hunting wild game with trained birds of prey; practised in France
      since at least the 5th century, it declined with firearms before enthusiasts revived it from the
      19th century onwards.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00070:
  kind: practice
  summary:
    fr: >-
      À La Haye-de-Routot (Eure), deux ifs millénaires du cimetière abritent une chapelle et un oratoire
      marial où l'on dépose encore des cierges ; autour d'eux se tiennent des fêtes du végétal et, chaque
      16 juillet au soir, le grand feu de Saint-Clair préparé par une confrérie de charité.
    en: >-
      In La Haye-de-Routot (Eure), two thousand-year-old churchyard yews house a chapel and a Marian oratory
      where candles are still left; around them are plant festivals and, every 16 July at night, the great
      Saint-Clair bonfire built by a charity brotherhood.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00071:
  kind: practice
  summary:
    fr: >-
      À Allouville-Bellefosse, dans le pays de Caux, un chêne très ancien à quelques mètres de l'église
      abrite dans son tronc creux une chapelle aménagée à la fin du XVIIe siècle ; l'arbre, restauré à
      plusieurs reprises, est au cœur de la vie du village.
    en: >-
      In Allouville-Bellefosse, in the Pays de Caux, a very old oak a few metres from the church holds
      a chapel set up in its hollow trunk in the late 17th century; restored several times, the tree is
      at the heart of village life.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00072:
  kind: event
  summary:
    fr: >-
      Au Bas-Caumont (Eure), sur un coteau dominant la Seine, une petite chapelle enveloppe le pied d'un
      chêne d'environ trois siècles ; un pèlerinage marial, interrompu en 1972, y a repris en 2008 et
      se tient à la fin du mois de mai.
    en: >-
      In Bas-Caumont (Eure), on a slope above the Seine, a small chapel wraps around the base of a roughly
      300-year-old oak; a Marian pilgrimage, abandoned in 1972, was revived there in 2008 and takes place
      at the end of May.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00073:
  kind: practice
  summary:
    fr: >-
      À Bouquetot, sur le plateau du Roumois (Eure), une aubépine blanche d'environ six siècles se dresse
      au cœur du village ; sans culte direct, elle sert de repère symbolique à l'identité de la commune
      et à ses principales fêtes.
    en: >-
      In Bouquetot, on the Roumois plateau (Eure), a white hawthorn about six centuries old stands at
      the heart of the village; though not itself an object of worship, it is a symbolic landmark for
      the commune's identity and its main festivities.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00074:
  kind: practice
  summary:
    fr: >-
      À La Lande-Patry, près de Flers (Orne), deux ifs dits millénaires, l'un mâle et l'autre femelle,
      se dressent devant l'église ; la légende attribue leur plantation à un seigneur parti en croisade,
      et l'église accueille la dévotion à des saints guérisseurs.
    en: >-
      In La Lande-Patry, near Flers (Orne), two yews said to be a thousand years old, one male and one
      female, stand in front of the church; legend credits their planting to a crusading lord, and the
      church hosts devotion to healing saints.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00075:
  kind: practice
  summary:
    fr: >-
      Au Pré-d'Auge, près de Lisieux, un rituel de guérison des maladies de peau associe une source et
      un vieux chêne : les pèlerins se lavent à la source puis accrochent à l'arbre un morceau de tissu,
      gant, mouchoir ou vêtement.
    en: >-
      In Le Pré-d'Auge, near Lisieux, a healing ritual for skin complaints links a spring and an old oak:
      pilgrims bathe the affected spot at the spring, then hang a piece of cloth such as a flannel, handkerchief
      or garment on the tree.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2009_67717_INV_PCI_FRANCE_00076:
  kind: practice
  summary:
    fr: >-
      Dans la forêt de la Ferté-Macé (Orne), le prieuré Saint-Ortaire réunit deux chapelles ; l'une, installée
      dans une ancienne grange, abrite les statues habillées de saint Ortaire et sainte Radegonde et un
      rituel de guérison des douleurs articulaires.
    en: >-
      In the Ferté-Macé forest (Orne), the Saint-Ortaire priory brings together two chapels; one, set
      up in a former barn, houses dressed statues of Saint Ortaire and Saint Radegund and a healing ritual
      for joint pain.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00077:
  kind: practice
  summary:
    fr: >-
      À Saint-Ursin, dans le sud de la Manche, un if d'environ mille ans marque le centre du petit bourg
      et l'identité du lieu ; dans l'église voisine se pratique un ancien rituel de guérison des convulsions
      attribuées aux vers intestinaux.
    en: >-
      In Saint-Ursin, in the south of the Manche, a yew about a thousand years old marks the centre of
      the hamlet and its identity; in the nearby church an old healing ritual is performed for convulsions
      blamed on intestinal worms.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00078:
  kind: event
  summary:
    fr: >-
      À Armendarits, au Pays basque, la Fête-Dieu (Besta Berri) associe la célébration du Saint-Sacrement
      à d'anciennes réjouissances du solstice d'été ; une garde costumée et dansante, avec coqs, lanciers
      et autres figures, escorte la procession dans les rues décorées de blanc et de fleurs.
    en: >-
      In Armendarits, in the Basque Country, Corpus Christi (Besta Berri) joins the feast of the Holy
      Sacrament with old midsummer celebrations; a costumed dancing guard of cocks, lancers and other
      figures escorts the procession through streets decked in white and flowers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00082:
  kind: practice
  summary:
    fr: >-
      À Paris, des Mexicains préparent pour le jour des Morts le pain des morts, brioche parfumée à la
      fleur d'oranger et à l'anis, ornée de boudins de pâte en forme d'os ; déposé sur les autels d'offrandes,
      il est ensuite partagé entre proches.
    en: >-
      In Paris, Mexican families bake pan de muertos for the Day of the Dead, a sweet bread flavoured
      with orange blossom and anise and topped with dough strips shaped like bones; placed on offering
      altars, it is later shared among friends.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00083:
  kind: practice
  summary:
    fr: >-
      À Paris, des familles d'origine mexicaine fabriquent des piñatas en papier mâché remplies de bonbons
      pour les fêtes et les anniversaires ; les yeux bandés, les enfants tentent tour à tour de la briser
      au bâton pendant que les adultes chantent.
    en: >-
      In Paris, families of Mexican origin make papier-mâché piñatas filled with sweets for festivals
      and birthdays; blindfolded, children take turns trying to break them with a stick while the adults
      sing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00086:
  kind: practice
  summary:
    fr: >-
      À Tende (Alpes-Maritimes), on chante en groupe, de deux à quatre voix, un répertoire de chants italiens
      et piémontais lors des repas, des apéritifs et des fêtes du village ; la première voix lance le
      chant, puis les basses la rejoignent.
    en: >-
      In Tende (Alpes-Maritimes), people sing Italian and Piedmontese songs together in two to four parts
      at meals, village gatherings and festivals; the lead voice starts the song and the basses then join
      in.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00087:
  kind: practice
  summary:
    fr: >-
      À Marseille et Cassis, la barquette est un bateau en bois à coque arrondie pour la pêche côtière
      et la plaisance, héritée des pêcheurs napolitains arrivés au XIXe siècle ; sa pièce d'étrave, le
      capian, permet de reconnaître le chantier qui l'a construite.
    en: >-
      In Marseille and Cassis, the barquette is a round-hulled wooden boat for inshore fishing and pleasure,
      inherited from Neapolitan fishermen who arrived in the 19th century; its stem piece, the capian,
      reveals which boatyard built it.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00088:
  kind: practice
  summary:
    fr: >-
      Les calaveras, « crânes » en espagnol, sont les représentations de la mort du jour des Morts mexicain,
      maintenues à Paris : crânes en sucre ou en chocolat portant un prénom, squelettes d'offrande, gravures
      et poèmes satiriques.
    en: >-
      Calaveras, Spanish for "skulls", are the representations of death made for the Mexican Day of the
      Dead and kept up in Paris: sugar or chocolate skulls bearing a name, skeleton figures for altars,
      satirical prints and verses.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00089:
  kind: practice
  summary:
    fr: >-
      En Périgord, le conte occitan mêle contes traditionnels, dont les histoires facétieuses appelées
      viòrlas ou nhòrlas, et créations de conteurs ; longtemps transmis en famille et au village, il vit
      aujourd'hui surtout sur scène et se fait plus rare.
    en: >-
      In Périgord, Occitan storytelling combines traditional tales, notably the comic stories called viòrlas
      or nhòrlas, with tellers' own creations; long passed on in families and villages, it now lives mainly
      on stage and is becoming rarer.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00090:
  kind: practice
  summary:
    fr: >-
      En Lot-et-Garonne, quelques conteurs amateurs et professionnels font vivre le conte en occitan ou
      en bilingue ; le registre facétieux du faux simplet de campagne domine, et certains mêlent leurs
      récits au son d'instruments traditionnels ou bricolés.
    en: >-
      In Lot-et-Garonne, a handful of amateur and professional storytellers keep tales alive in Occitan
      or bilingually; the comic figure of the mock-simple country fellow dominates, and some mix their
      stories with traditional or home-made instruments.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00091:
  kind: event
  summary:
    fr: >-
      Chaque année vers l'Épiphanie, l'abbaye de Saint-Ferme (Gironde) accueille une crèche vivante en
      occitan : une soixantaine de figurants en costume, des animaux et un bébé jouent la Nativité, suivie
      d'une messe en occitan.
    en: >-
      Every year around Epiphany, Saint-Ferme abbey (Gironde) hosts a living Nativity scene in Occitan:
      some sixty costumed performers, animals and a real baby act out the Nativity, followed by a Mass
      in Occitan.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00092:
  kind: practice
  summary:
    fr: >-
      À Daglan (Dordogne), une troupe amateur joue chaque année au village et alentour une pièce de théâtre
      en occitan écrite et mise en scène sur place ; cette pratique, héritière du renouveau félibréen,
      est peu à peu reprise par des plus jeunes.
    en: >-
      In Daglan (Dordogne), an amateur company performs a new play in Occitan each year, written and staged
      locally, in the village and nearby; heir to the Félibrige revival, the practice is gradually being
      taken up by younger people.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00093:
  kind: event
  summary:
    fr: >-
      À Saint-Sulpice-de-Faleyrens (Gironde), le 21 juin, une fête de la Saint-Jean créée il y a une vingtaine
      d'années réunit chants, danses et feu d'artifice autour d'un grand menhir ; chacun confie ensuite
      un vœu à une petite barque de papier posée sur la Dordogne.
    en: >-
      In Saint-Sulpice-de-Faleyrens (Gironde), on 21 June, a midsummer festival created some twenty years
      ago brings songs, dances and fireworks around a large standing stone; each person then sets a wish
      afloat on the Dordogne in a little paper boat.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00094:
  kind: event
  summary:
    fr: >-
      À Nontron (Dordogne), le carnaval fait défiler les Soufflaculs, vêtus de blanc et armés de soufflets,
      qui se soufflent mutuellement au derrière selon une gestuelle en huit temps ; l'effigie de Bufador
      est ensuite jugée et brûlée sur la place du foirail.
    en: >-
      In Nontron (Dordogne), the carnival parades the Soufflaculs, dressed in white and armed with bellows,
      who blow at each other's backsides in an eight-step routine; the effigy of Bufador is then tried
      and burnt on the fairground square.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00095:
  kind: event
  summary:
    fr: >-
      À Lavaur (Dordogne), une source et une pierre marquent l'ancienne limite du Périgord, de l'Agenais
      et du Quercy ; selon la légende, trois évêques y priaient chacun dans son diocèse, et depuis 2006
      ceux de Périgueux, Agen et Cahors s'y retrouvent le lundi de Pâques.
    en: >-
      In Lavaur (Dordogne), a spring and a stone mark the old boundary of Périgord, Agenais and Quercy;
      legend says three bishops prayed there each in his own diocese, and since 2006 the bishops of Périgueux,
      Agen and Cahors have met there on Easter Monday.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00096:
  kind: practice
  summary:
    fr: >-
      À Blanquefort-sur-Briolance (Lot-et-Garonne), l'inventaire recense la mémoire de quêtes d'œufs,
      du carnaval des enfants, de conteurs et de l'occitan local ; une quête costumée a été recréée à
      la Toussaint, mêlant rites de la Saint-Martin et de carnaval.
    en: >-
      In Blanquefort-sur-Briolance (Lot-et-Garonne), the inventory records memories of egg-collecting
      rounds, children's carnival, storytellers and local Occitan; a costumed door-to-door round has been
      revived at All Saints, mixing Martinmas and carnival customs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00097:
  kind: event
  summary:
    fr: >-
      Créé en 1996, le carnaval des Deux-Rives à Bordeaux est une grande parade préparée pendant trois
      semaines dans les écoles et centres sociaux des deux rives ; il garde la trame classique, avec la
      crémation de Monsieur Carnaval, autour d'un thème écologique et citoyen.
    en: >-
      Created in 1996, the Deux-Rives carnival in Bordeaux is a large parade prepared over three weeks
      in schools and community centres on both banks; it keeps the classic pattern, including the burning
      of Monsieur Carnaval, around an eco-civic theme.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00098:
  kind: event
  summary:
    fr: >-
      À Périgueux (Dordogne), le carnaval, attesté de longue date et relancé en 1983, fait défiler chars,
      bandas et fanfares sur les boulevards avec l'effigie de Petaçon, qui est ensuite jugée et brûlée
      sur les quais de l'Isle.
    en: >-
      In Périgueux (Dordogne), the carnival, recorded for centuries and revived in 1983, parades floats,
      bandas and brass bands along the boulevards with the effigy of Petaçon, which is then tried and
      burnt on the banks of the Isle.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00099:
  kind: event
  summary:
    fr: >-
      À Brantôme (Dordogne), un carnaval de tradition occitane relancé en 2003 a lieu le plus souvent
      en mars : défilé costumé avec le char de Petaçon, jugement de ce personnage en occitan puis crémation
      sur la place devant l'abbaye.
    en: >-
      In Brantôme (Dordogne), an Occitan-style carnival revived in 2003 usually takes place in March:
      a costumed parade follows the float of Petaçon, who is then tried in Occitan and burnt on the square
      in front of the abbey.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00100:
  kind: event
  summary:
    fr: >-
      À Monsempron-Libos (Lot-et-Garonne), un carnaval porté par les acteurs éducatifs défile, souvent
      en mars, du haut de Monsempron jusqu'à Libos avec des chars évoquant le pays ; le mannequin Carnaval
      y est jugé puis brûlé.
    en: >-
      In Monsempron-Libos (Lot-et-Garonne), a carnival driven by schools and youth centres parades, often
      in March, from upper Monsempron down to Libos with floats about local life; the Carnival dummy is
      then tried and burnt.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00102:
  kind: practice
  summary:
    fr: >-
      À Bazas (Gironde), des éleveurs engraissent pendant environ quatre ans des bœufs de race bazadaise
      castrés jeunes, pour les présenter parés de fleurs au concours du Jeudi gras ; un savoir-faire familial
      aujourd'hui fragilisé.
    en: >-
      Around Bazas (Gironde), breeders fatten Bazadaise oxen, castrated young, for some four years before
      showing them, crowned with flowers, at the Jeudi Gras contest; this family know-how is now under
      economic pressure.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00105:
  kind: practice
  summary:
    fr: >-
      Dans la communauté orthodoxe serbe de Paris, des iconographes « écrivent » des icônes de saints
      sur des planches de bois, selon des modèles anciens et après une préparation spirituelle faite de
      prière et parfois de jeûne.
    en: >-
      Within the Serbian Orthodox community in Paris, iconographers "write" icons of saints on wooden
      panels, following old models and preparing themselves spiritually through prayer and sometimes fasting.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00106:
  kind: practice
  summary:
    fr: >-
      Les familles serbes orthodoxes de Paris fêtent chaque année la slava, jour de leur saint patron
      hérité de père en fils : un pain festif, du blé et du vin sont bénis à l'église, puis la famille
      reçoit ses proches autour d'un repas.
    en: >-
      Serbian Orthodox families in Paris celebrate the slava, the yearly feast of a patron saint handed
      down from father to son: festive bread, wheat and wine are blessed at church, then the family hosts
      relatives for a meal.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00107:
  kind: practice
  summary:
    fr: >-
      Dans le Vaucluse et les départements voisins, des maçons bâtissent sans mortier murs de soutènement,
      cabanes et calades, en calant des pierres prises de préférence sur place le long d'un cordeau tendu
      sur un gabarit en bois.
    en: >-
      In Vaucluse and neighbouring departments, masons build retaining walls, huts and cobbled paths without
      mortar, wedging stones gathered on site where possible along a line stretched from a wooden frame.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00109:
  kind: event
  summary:
    fr: >-
      De la Gironde au Béarn, des habitants d'un hameau ou d'un quartier allument autour de Noël des feux
      liés au solstice d'hiver, notamment en Chalosse, dans le nord du Béarn, à Bazas ou à Capbreton après
      la messe de minuit.
    en: >-
      From Gironde to Béarn, people of a hamlet or neighbourhood light bonfires around Christmas, linked
      to the winter solstice, notably in Chalosse, northern Béarn, Bazas and Capbreton, where one burns
      after midnight Mass.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00110:
  kind: event
  summary:
    fr: >-
      Dans le Bazadais (Gironde), la veille de Noël à la tombée de la nuit, on faisait en famille le tour
      des champs avec un flambeau de paille en récitant une formule en gascon pour protéger les récoltes
      ; la pratique renaît depuis 1988.
    en: >-
      In the Bazadais (Gironde), on Christmas Eve at nightfall, families walked round their fields with
      a straw torch, chanting a Gascon formula to protect the crops; the custom has seen a revival since
      1988.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00111:
  kind: event
  summary:
    fr: >-
      À Capbreton (Landes), à la sortie de la messe de minuit, un bûcher de troncs de pin en forme de
      tour, la torrèle, est embrasé sur la place de la mairie ; une légende y voit le souvenir d'une ruse
      contre des envahisseurs normands.
    en: >-
      In Capbreton (Landes), as midnight Mass ends, a tower-shaped pyre of pine trunks, the torrèle, is
      set alight on the town hall square; local legend links it to a ruse that kept Norse raiders away.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00112:
  kind: practice
  summary:
    fr: >-
      Dans les Pyrénées gasconnes, on chante à plusieurs voix à l'église, à table, au bar ou sur la place
      : sur un chant connu, les voix s'ajoutent selon des modèles appris à l'oreille et adaptés au nombre
      de chanteurs.
    en: >-
      In the Gascon Pyrenees, people sing in several parts in church, at table, in bars or on the village
      square: over a known tune, voices are added following patterns learnt by ear and adjusted to the
      number of singers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00113:
  kind: practice
  summary:
    fr: >-
      En Aquitaine, les danses tenues pour gasconnes, béarnaises, périgourdines ou plus largement occitanes
      vivent surtout dans le bal « trad », relancé depuis les années 1970 : environ deux cents bals par
      an, en fête de village comme dans les milieux étudiants de Bordeaux.
    en: >-
      In Aquitaine, dances regarded as Gascon, Béarnais, Périgord or more broadly Occitan live on mainly
      through the "trad" ball, revived since the 1970s: some two hundred balls a year, from village feasts
      to student events in Bordeaux.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00115:
  kind: event
  summary:
    fr: >-
      En Gascogne, les grandes fêtes patronales de Bayonne, de Mont-de-Marsan (la Madeleine, en juillet)
      et de Dax (autour du 15 août) réunissent les « festayres » en tenue blanche et rouge ou bleue et
      blanche, entre déambulations de rue, peñas et courses de vaches ou de taureaux.
    en: >-
      In Gascony, the major patronal feasts of Bayonne, Mont-de-Marsan (the Madeleine, in July) and Dax
      (around 15 August) gather the "festayres", dressed in white and red or blue and white, for street
      wandering, peñas and cow or bull races.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00119:
  kind: practice
  summary:
    fr: >-
      Dans un atelier du Bordelais (Gironde), des selliers-maroquiniers fabriquent à la main, « façon
      sellier », des articles de cuir sur mesure, notamment pour l'équipement du chasseur : étuis d'armes,
      fourreaux et cartouchières.
    en: >-
      In a workshop near Bordeaux (Gironde), saddler-leatherworkers make made-to-measure leather goods
      by hand in the saddler's manner, notably hunting gear such as gun cases, scabbards and cartridge
      belts.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00120:
  kind: practice
  summary:
    fr: >-
      À Saumur (Maine-et-Loire), un bottier fabrique sur mesure des bottes d'équitation : il relève l'empreinte
      du pied et les mesures de toute la jambe, puis consacre vingt à quarante-cinq heures et plus d'une
      centaine d'opérations à chaque paire.
    en: >-
      In Saumur (Maine-et-Loire), a bootmaker makes riding boots to measure: he takes a print of the foot
      and measurements of the whole leg, then spends twenty to forty-five hours and over a hundred operations
      on each pair.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00121:
  kind: practice
  summary:
    fr: >-
      À Nantes, un atelier de conservation-restauration soigne des tableaux abîmés par le temps, l'humidité,
      le feu ou les insectes, en travaillant sur la toile, le support, la couche picturale et le vernis,
      toujours dans le respect de l'œuvre de l'artiste.
    en: >-
      In Nantes, a conservation workshop treats paintings damaged by age, damp, fire or insects, working
      on canvas, support, paint layer and varnish while staying faithful to the artist's work.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00122:
  kind: practice
  summary:
    fr: >-
      À Périgueux (Dordogne), un atelier pratique entièrement à la main la reliure d'art et la dorure
      à la feuille d'or, et restaure des livres anciens avec des techniques médiévales réversibles, comme
      la couture sur nerfs.
    en: >-
      In Périgueux (Dordogne), a workshop practises fine bookbinding and gold-leaf tooling entirely by
      hand, restoring old books with reversible medieval techniques such as sewing on raised cords.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00123:
  kind: practice
  summary:
    fr: >-
      À Malicorne-sur-Sarthe (Sarthe), une faïencerie d'art travaille comme au XVIIIe siècle, de la préparation
      de l'argile locale aux émaux ; elle est connue pour l'ajourage, découpe au canif de l'argile crue
      qui allège vases et corbeilles.
    en: >-
      In Malicorne-sur-Sarthe (Sarthe), an art faience workshop works as in the 18th century, from preparing
      local clay to making glazes; it is known for openwork, cutting the raw clay with a small knife to
      lighten vases and baskets.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00124:
  kind: practice
  summary:
    fr: >-
      À Saint-Geniès (Dordogne), un lauzier couvre les toits de lourdes pierres calcaires taillées au
      marteau et posées à sec sur des lattes de châtaignier ; ce savoir-faire recule face aux tuiles et
      à l'ardoise industrielle.
    en: >-
      In Saint-Geniès (Dordogne), a lauze roofer covers roofs with heavy limestone slabs dressed with
      a hammer and laid dry on chestnut battens; the craft is declining as industrial tiles and slate
      take over.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00125:
  kind: practice
  summary:
    fr: >-
      À Came (Pyrénées-Atlantiques), un atelier fabrique et restaure sur mesure des chaises traditionnelles
      et de style, avec l'aide d'artisans locaux : sculpteurs, tourneurs, rempailleuses et canneurs.
    en: >-
      In Came (Pyrénées-Atlantiques), a workshop makes and restores traditional and period chairs to order,
      drawing on local craftspeople: carvers, turners, rush-seaters and caners.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00126:
  kind: practice
  summary:
    fr: >-
      À Bourdettes (Pyrénées-Atlantiques), un atelier familial façonne au marteau des sonnailles pour
      les troupeaux et les chiens de chasse à partir de plaques de tôle, les brase au laiton dans des
      moules d'argile puis les accorde à l'oreille.
    en: >-
      In Bourdettes (Pyrénées-Atlantiques), a family workshop hammers sheet metal into bells for livestock
      and hunting dogs, brazes them with brass inside clay moulds, then tunes them by ear.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00127:
  kind: practice
  summary:
    fr: >-
      À Larressore, au Pays basque, un atelier fabrique sur mesure des makhilas, bâtons de marche basques
      dont le pommeau gravé cache une pointe d'acier ; on les offre en signe d'honneur ou de remerciement.
    en: >-
      In Larressore, in the Basque Country, a workshop makes made-to-measure makhilas, Basque walking
      sticks whose engraved knob hides a steel point; they are given as a mark of honour or thanks.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00128:
  kind: practice
  summary:
    fr: >-
      À Périgueux (Dordogne), un fourreur transforme des peaux apprêtées en pièces de fourrure souvent
      uniques, par des gestes restés inchangés : dressage, assortiment des peaux, clouage pour les mettre
      en forme, puis coupe et couture.
    en: >-
      In Périgueux (Dordogne), a furrier turns dressed pelts into mostly one-off fur garments with unchanged
      techniques: stretching, matching the skins, nailing them out to shape, then cutting and sewing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00129:
  kind: practice
  summary:
    fr: >-
      À Bieuzy-les-Eaux (Morbihan), dans l'ermitage troglodyte de saint Gildas au bord du Blavet, les
      visiteurs frappent avec un galet une pierre qui sonne comme une cloche, en tournant autour pour
      formuler un vœu ; on la disait autrefois guérisseuse.
    en: >-
      In Bieuzy-les-Eaux (Morbihan), in Saint Gildas's cave chapel above the Blavet, visitors strike a
      bell-like ringing stone with a pebble, circling it while making a wish; it was once said to heal
      the sick.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00130:
  kind: practice
  summary:
    fr: >-
      Sur les berges de l'estuaire de l'Arguenon, au Guildo (Côtes-d'Armor), des promeneurs frappent avec
      des cailloux des rochers qui rendent un son métallique ; liées par la légende à Gargantua, ces pierres
      attirent les visiteurs depuis le début du XXe siècle.
    en: >-
      On the banks of the Arguenon estuary at Le Guildo (Côtes-d'Armor), walkers strike rocks with pebbles
      to make them ring with a metallic sound; linked in legend to Gargantua, the stones have drawn visitors
      since the early 20th century.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00131:
  kind: practice
  summary:
    fr: >-
      Dans la forêt de Huelgoat (Finistère), les visiteurs font osciller un bloc de granit de 137 tonnes
      posé en équilibre sur son arête, en poussant à un point précis ; le geste et les récits qui l'entourent
      font de ce lieu une étape du tourisme breton.
    en: >-
      In the forest of Huelgoat (Finistère), visitors make a 137-tonne granite block, balanced on its
      edge, rock by pushing at one precise spot; the gesture and the stories around it make the site a
      stop on Breton tourist routes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00132:
  kind: practice
  summary:
    fr: >-
      À Trégunc (Finistère), trois blocs de granit en équilibre instable oscillent sous une simple pression
      ; chacun a sa vertu, comme la Pierre des cocus ou la Pierre de la richesse, et les faire trembler
      est une pratique attestée depuis au moins deux siècles.
    en: >-
      In Trégunc (Finistère), three precariously balanced granite blocks rock under light pressure; each
      has its own virtue, like the Cuckolds' Stone or the Stone of Wealth, and making them move has been
      recorded for at least two centuries.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00134:
  kind: practice
  summary:
    fr: >-
      À Bayeux (Calvados), arbres et jardins publics, du jardin botanique au platane de la Liberté près
      de la cathédrale, portent une forte charge symbolique : ils incarnent la mémoire de la ville et
      son attachement à la liberté et à la démocratie.
    en: >-
      In Bayeux (Calvados), trees and public gardens, from the botanical garden to the Liberty plane tree
      near the cathedral, carry strong symbolic weight, embodying the town's memory and its attachment
      to freedom and democracy.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00135:
  kind: practice
  summary:
    fr: >-
      Dans la forêt de Brotonne, au creux d'une boucle de la Seine (Seine-Maritime), les habitants entretiennent
      un lien quasi sacré avec le massif : messe en forêt pour la fête du 1er mai, chasse à courre et
      croyances liées à des arbres comme le chêne cuve.
    en: >-
      In the Brotonne forest, inside a loop of the Seine (Seine-Maritime), residents keep an almost sacred
      bond with the woodland: a forest Mass for the 1 May local feast, ritualised hunting with hounds
      and beliefs tied to trees such as the "tub oak".
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00142:
  kind: practice
  summary:
    fr: >-
      Dans les Landes, la mayade consiste à dresser un jeune pin orné de rubans, de couronnes et d'une
      pancarte « honneur à… » pour fêter des élus, de jeunes mariés ou d'autres étapes de la vie ; la
      pose classique a lieu dans la nuit du 30 avril au 1er mai, par les conscrits.
    en: >-
      In the Landes, a mayade means raising a young pine decked with ribbons, wreaths and an "honour to…"
      sign to celebrate elected officials, newlyweds or other life events; the classic version is set
      up by the year's 18-year-olds on the night of 30 April.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2010_67717_INV_PCI_FRANCE_00143:
  kind: event
  summary:
    fr: >-
      À Amou (Landes), la classe des jeunes de 18 ans organise un samedi de février ou de mars un carnaval
      : quête dans les maisons les jours précédents, défilé avec les enfants derrière le pantin San Pansar,
      puis jugement de celui-ci au fronton.
    en: >-
      In Amou (Landes), the year's 18-year-olds organise a carnival on a Saturday in February or March:
      a door-to-door collection in the days before, a parade with the children behind the San Pansar dummy,
      then his trial at the pelota wall.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00144:
  kind: practice
  summary:
    fr: >-
      Né à Veynes (Hautes-Alpes) dans les années 1930 et joué aussi à Gap, ce jeu suit les règles de la
      pétanque mais avec des cubes de bois : leur trajectoire imprévisible sur des terrains en pente favorise
      le jeu et la bonne humeur plus que la compétition.
    en: >-
      Born in Veynes (Hautes-Alpes) in the 1930s and also played in Gap, this game follows pétanque rules
      but uses wooden cubes; their unpredictable rolls on sloping ground favour fun and banter over competition.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00145:
  kind: practice
  summary:
    fr: >-
      Sur le littoral méditerranéen, de Marseille à Nice, la joute provençale oppose deux jouteurs armés
      d'une lance, debout sur des barques qui se croisent ; très codifiée, elle mêle honneur de tradition
      médiévale, fête de village et chutes spectaculaires dans l'eau.
    en: >-
      Along the Mediterranean coast from Marseille to Nice, Provençal water jousting pits two lance-bearing
      jousters against each other on passing boats; highly codified, it blends a medieval sense of honour,
      village festivity and splashing falls.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00146:
  kind: practice
  summary:
    fr: >-
      Héritée des pêcheurs marseillais, la rame traditionnelle provençale se pratique en compétition sur
      des barques de 7,20 m à trois bancs fixes et six rames en bois ; distincte de l'aviron, elle exige
      souffle, force et esprit d'équipe.
    en: >-
      Inherited from Marseille's fishermen, traditional Provençal rowing is raced in 7.2-metre boats with
      three fixed benches and six wooden oars; unlike sculling, it calls for stamina, strength and strong
      team spirit.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00147:
  kind: practice
  summary:
    fr: >-
      Dans le Cotentin (Manche), ce jeu de comptoir et d'auberge consiste à lancer une boule sur un plateau
      de bois incliné, à travers un petit labyrinthe, jusqu'à l'une des quatre cases valant de 1 à 4 points
      ; une variante se jouait avec de l'argent.
    en: >-
      In the Cotentin (Manche), this bar and inn game sends a ball down a sloping wooden board, through
      a small maze, into one of four slots worth one to four points; one variant was played for money.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00149:
  kind: practice
  summary:
    fr: >-
      Chez les Wayana et Apalaï de Guyane, le maraké est un rite d'initiation et d'alliance, passé d'abord
      à la puberté : un cycle de cérémonies sur plusieurs mois, avec chants du kalawu, danses en costume
      et épreuve des fourmis ou des guêpes.
    en: >-
      Among the Wayana and Apalai of French Guiana, the maraké is an initiation and alliance rite first
      undergone at puberty: a months-long cycle of ceremonies with kalawu songs, costumed dances and an
      ordeal of ant or wasp stings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2011_67717_INV_PCI_FRANCE_00150:
  kind: practice
  summary:
    fr: >-
      En Camargue et dans les villages voisins, la course camarguaise met en valeur le taureau, le biòu
      : dans l'arène, des raseteurs vêtus de blanc tentent de lui retirer cocarde et ficelles, entre le
      tri au pré, l'abrivado et la bandido.
    en: >-
      In the Camargue and nearby villages, the course camarguaise puts the bull, the biòu, in the spotlight:
      in the arena, white-clad raseteurs try to snatch the rosette and strings from its horns, framed
      by the morning sorting, the abrivado and the bandido.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00152:
  kind: practice
  summary:
    fr: >-
      Dans les Pyrénées-Atlantiques, notamment à Morlanne, la pelèra réunit sur trois jours parents et
      amis pour abattre le cochon familial et le transformer en salaisons, boudins, pâtés et saucisses
      ; chacun est ensuite reçu au repas.
    en: >-
      In Pyrénées-Atlantiques, notably in Morlanne, the pelèra brings relatives and friends together over
      three days to slaughter the family pig and turn it into cured meat, black pudding, pâtés and sausages;
      helpers are then treated to a meal.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00153:
  kind: practice
  summary:
    fr: >-
      À Larrau (Pyrénées-Atlantiques), les éleveurs des maisons isolées de montagne ont gardé un savoir
      naturaliste sur les plantes, les animaux et des gestes de soin parfois rituels, pour soigner gens
      et bêtes ; il recule mais reste en mémoire.
    en: >-
      In Larrau (Pyrénées-Atlantiques), livestock farmers in isolated mountain houses have kept a lore
      of plants, animals and sometimes ritual healing gestures to treat people and animals; it is fading
      but still remembered.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00154:
  kind: practice
  summary:
    fr: >-
      En Soule, au Pays basque, des éleveurs taillent et tressent des haies vives mêlant frêne, noisetier,
      hêtre, aubépine ou houx pour clore leurs terres et les diviser en parcelles ; ce travail suppose
      une fine connaissance des plantes de montagne.
    en: >-
      In Soule, in the Basque Country, livestock farmers prune and weave living hedges of ash, hazel,
      beech, hawthorn or holly to enclose their land and split it into small plots, a task that needs
      a close knowledge of mountain plants.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00155:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, la borroka est une lutte inspirée d'anciennes formes locales et pratiquée depuis
      2009 : les adversaires se tiennent par la ceinture et chacun tente de repousser l'autre jusqu'au
      béret posé au fond de son camp, au son de la txalaparta.
    en: >-
      In the Basque Country, borroka is a wrestling style inspired by older local forms and practised
      since 2009: opponents grip each other's belt and each tries to push the other back to the beret
      set at the end of their lane, to the sound of the txalaparta.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00156:
  kind: practice
  summary:
    fr: >-
      Sur la côte basque, d'Hendaye à Anglet, des équipages de treize rameurs et un barreur s'affrontent
      en traînière, ancien bateau de pêche de douze mètres devenu bateau de course, sur un parcours en
      mer avec virage autour d'une bouée.
    en: >-
      On the Basque coast, from Hendaye to Anglet, crews of thirteen rowers and a cox race traineras,
      twelve-metre former fishing boats turned racing craft, on a sea course with a turn around a buoy.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00157:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, la « force basque » (herri kirolak) regroupe des épreuves de force et d'adresse
      issues des anciens travaux des champs, comme le lever de pierre ou de charrette ; concours et démonstrations
      ont lieu chaque semaine en été.
    en: >-
      In the Basque Country, "Basque strength" (herri kirolak) covers trials of strength and skill drawn
      from old farm work, such as lifting stones or a cart; contests and displays are held every week
      in summer.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00158:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, la pelote à main nue se joue en trinquet, salle fermée où l'on frappe la balle contre
      le mur de face, seul ou à deux ; le pan coupé et le xilo, trou carré dans le mur, dévient la pelote
      de façon imprévisible.
    en: >-
      In the Basque Country, bare-hand pelota is played in a trinquet, an enclosed court where players,
      singly or in pairs, strike the ball against the front wall; a bevelled corner and a square hole,
      the xilo, deflect it unpredictably.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00159:
  kind: practice
  summary:
    fr: >-
      Le laxoa, plus ancien jeu de pelote basque encore joué, oppose sur la place du village deux équipes
      gantées de cuir qui se renvoient la balle de part et d'autre d'une ligne ; côté français, il ne
      se joue plus qu'une ou deux fois par an.
    en: >-
      Laxoa, the oldest form of Basque pelota still played, pits two teams wearing leather gloves against
      each other across a line on the village square; in the French Basque Country it is now played only
      once or twice a year.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00161:
  kind: practice
  summary:
    fr: >-
      Dans les Landes, les échasses en bois des anciens bergers sont devenues un loisir : membres de groupes
      folkloriques et coureurs s'affrontent en courses de vitesse, en raids de longue distance ou en gymkhana
      lors des fêtes de Dax.
    en: >-
      In the Landes, the wooden stilts once used by shepherds have become a pastime: folk-group members
      and racers compete in sprints, long-distance treks and an obstacle course held during the Dax festivities.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00162:
  kind: practice
  summary:
    fr: >-
      Dans le bas Adour, les quilles de trois se jouent en plein air sur un quillier de gravillons : avec
      une lourde boule de bois cerclée de fer, on vise trois quilles alignées à cinq mètres l'une de l'autre,
      dont la plus grosse est appelée « la vieille ».
    en: >-
      In the lower Adour valley, three-pin skittles is played outdoors on a gravel alley: with a heavy
      iron-bound wooden ball, players aim at three pins set five metres apart, the largest of them known
      as "the old one".
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00163:
  kind: practice
  summary:
    fr: >-
      En Aquitaine, surtout dans les Landes et le Béarn, le jeu de quilles de six consiste à abattre exactement
      cinq des six quilles avec trois boulons lancés depuis le pas de tir ; il se pratique en loisir comme
      en championnat fédéral.
    en: >-
      In Aquitaine, chiefly in the Landes and Béarn, six-pin skittles requires knocking down exactly five
      of the six pins with up to three throws of a wooden ball; it is played both for fun and in federation
      championships.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00164:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, le pasaka est une spécialité de pelote jouée en trinquet par deux équipes de deux,
      qui se renvoient la balle par-dessus un filet avec un gant de cuir ; le geste de renvoi, le xirrist,
      en fait l'attrait.
    en: >-
      In the Basque Country, pasaka is a form of pelota played in a trinquet by two pairs who return the
      ball over a net with a leather glove; much of its appeal lies in the sweeping return stroke called
      the xirrist.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00165:
  kind: practice
  summary:
    fr: >-
      À Gémenos, le lundi suivant la Saint-Éloi, des joueurs juchés sur un boghei tiré par un cheval tentent
      de passer une perche dans le trou d'une planche sans renverser le seau d'eau suspendu au-dessus
      ; le jeu, presque impossible à gagner, sert surtout à se rafraîchir.
    en: >-
      In Gémenos, on the Monday after the Saint Eligius feast, players riding a horse-drawn cart try to
      push a pole through a hole in a board without tipping the bucket of water hung above; almost unwinnable,
      the game is mainly a way to cool off.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00166:
  kind: practice
  summary:
    fr: >-
      Au Plan de Grasse, la pelote basque a pris la suite de la pelote provençale, abandonnée en 1982
      ; on y joue à deux contre deux, avec une raquette de bois et une balle en gomme pleine, en trinquet
      couvert ou sur un fronton en plein air.
    en: >-
      At Plan de Grasse, Basque pelota took over from Provençal pelota, given up in 1982; it is played
      two against two with a wooden bat and a solid rubber ball, in a covered trinquet or against an outdoor
      fronton wall.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00167:
  kind: practice
  summary:
    fr: >-
      À Artignosc-sur-Verdon, dernier village provençal où elle se joue, la paume oppose des équipes qui
      frappent à main nue une balle contre la façade de l'église, en pleine place, sur la chaussée même
      de la route départementale.
    en: >-
      In Artignosc-sur-Verdon, the last Provençal village where it survives, the hand-ball game of paume
      sees teams strike a ball bare-handed against the church front, on the village square and the roadway
      itself.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00168:
  kind: practice
  summary:
    fr: >-
      Dans le pays niçois, la mourra est un jeu de doigts où deux adversaires lèvent des doigts en criant
      un nombre de zéro à dix, pour deviner le total ; un arbitre compte les points sur ses mains, dans
      un rythme rapide et bruyant.
    en: >-
      Around Nice, mourra is a finger game in which two opponents raise fingers while shouting a number
      from zero to ten, trying to call the total; a referee keeps score on his hands, and play is fast
      and loud.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00169:
  kind: practice
  summary:
    fr: >-
      Née en Provence au début du XXe siècle comme variante du jeu provençal, la pétanque oppose deux
      équipes qui lancent des boules métalliques vers un petit but en buis, le « cochonnet » ou « bouchon
      » ; perdre 13 à 0 vaut le rituel du « baiser de Fanny ».
    en: >-
      Born in Provence in the early 20th century as a variant of the jeu provençal, pétanque pits two
      teams throwing metal balls towards a small boxwood jack; losing 13–0 calls for the ritual known
      as "kissing Fanny".
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00170:
  kind: practice
  summary:
    fr: >-
      Le gouren, lutte traditionnelle de Bretagne, se pratique debout : agrippés à la chemise de l'adversaire,
      les lutteurs cherchent à le projeter sur le dos ; arbitrage et serment se font en breton, et les
      tournois d'été à l'ancienne peuvent avoir un bélier pour enjeu.
    en: >-
      Gouren, the traditional wrestling of Brittany, is fought standing: gripping each other's shirt,
      wrestlers try to throw their opponent flat on his back; refereeing and the oath are in Breton, and
      old-style summer tournaments may have a ram as the prize.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00171:
  kind: practice
  summary:
    fr: >-
      Variante de la boule nantaise propre à La Bernerie-en-Retz, la boule bernérienne se joue sur une
      piste aux bords cimentés et incurvés : les boules de résine doivent être roulées, jamais lancées,
      pour approcher le petit en s'aidant des bandes.
    en: >-
      A variant of the Nantes bowls game found only in La Bernerie-en-Retz, boule bernérienne is played
      on a lane with curved cement edges: resin balls must be rolled, never thrown, to get close to the
      jack, using the banks if needed.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00172:
  kind: practice
  summary:
    fr: >-
      Dans les Côtes-d'Armor, la boule bretonne se joue sur un terrain bordé où l'on peut utiliser les
      bandes pour approcher le « maître », petit but en métal ; concours du printemps à l'automne et boulodromes
      couverts l'hiver font vivre ce jeu répandu au XIXe siècle.
    en: >-
      In the Côtes-d'Armor, Breton bowls is played on an enclosed ground where the side banks may be used
      to approach the "maître", a small metal jack; spring-to-autumn contests and covered winter halls
      keep alive a game that spread in the 19th century.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00173:
  kind: practice
  summary:
    fr: >-
      Pratiquée dans trois communes du Finistère, la boule bretonne à un plomb se joue en équipe sur une
      allée lisse et plate : les boules lestées de plomb doivent toujours être roulées vers le « boulic
      », et celle qui touche le fond sans rien heurter est retirée.
    en: >-
      Played in three communes of Finistère, one-lead Breton bowls is a team game on a smooth, flat alley:
      the lead-weighted balls must always be rolled towards the "boulic" jack, and any ball that hits
      the back without touching another is removed.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00174:
  kind: practice
  summary:
    fr: >-
      La boule concelloise ne se joue plus qu'à Saint-Julien-de-Concelles, sur un unique terrain plat
      de sable de Loire : proches de la boule de fort, ses boules en chêne vert sont conservées dans l'eau
      ; l'initiation des jeunes y est presque inexistante.
    en: >-
      Boule concelloise is now played only in Saint-Julien-de-Concelles, on a single flat ground of Loire
      sand; its holm-oak balls, close to those of boule de fort, are kept in water, and young people are
      hardly ever introduced to the game.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00175:
  kind: practice
  summary:
    fr: >-
      Répandue surtout en Maine-et-Loire, ailleurs dans les Pays de la Loire et en Touraine, la boule
      de fort se joue au sein de sociétés : la boule cerclée de fer, plus lourde d'un côté, roule en courbe
      sur une piste aux bords relevés, parfois une demi-minute avant de s'arrêter près du maître.
    en: >-
      Found mainly in Maine-et-Loire and elsewhere in the Pays de la Loire and Touraine, boule de fort
      is played in members' societies: the iron-rimmed ball, weighted on one side, rolls in a curve along
      a lane with raised edges, sometimes for half a minute before stopping near the jack.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00176:
  kind: practice
  summary:
    fr: >-
      En Maine-et-Loire, la boule de sable se joue avec des boules en bois lancées d'un bac de sable vers
      un autre bac où se trouve le maître ; les bandes font partie du jeu, et la pratique se transmet
      par l'observation au sein de petites amicales.
    en: >-
      In Maine-et-Loire, sand bowls is played with wooden balls thrown from one sand-filled box into another,
      where the jack lies; the side boards are part of the game, which is learnt by watching and playing
      within small clubs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00177:
  kind: practice
  summary:
    fr: >-
      À Saint-Sébastien-sur-Loire, la boule de sable du pays nantais se joue sur une piste couverte de
      80 cm de sable de Loire, ratissée avant chaque partie ; les boules en bois noir, rayées ou non selon
      l'équipe, sont souvent lancées pour frapper directement celles de l'adversaire.
    en: >-
      In Saint-Sébastien-sur-Loire, Nantes sand bowls is played on a covered lane filled with 80 cm of
      Loire sand, raked before each game; the black wooden balls, striped or plain depending on the team,
      are often thrown to hit the opponent's balls directly.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00178:
  kind: practice
  summary:
    fr: >-
      Typique de la région nantaise, la boule nantaise se joue sur une piste bitumée aux bords incurvés,
      fermée à chaque bout par une planche, le « talon » : la boule, toujours roulée, peut y rebondir
      pour revenir vers le petit ; on joue en boulodrome ou dans l'arrière-salle des cafés.
    en: >-
      Typical of the Nantes area, boule nantaise is played on an asphalt lane with curved edges and a
      board, the "talon", at each end: the ball, always rolled, may bounce off it back towards the jack;
      play takes place in a bowling hall or in café back rooms.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00179:
  kind: practice
  summary:
    fr: >-
      À Oudon, la boule oudonnaise se joue entre deux bacs de sable de Loire placés face à face, avec
      des boules en bois plates d'un côté qu'on peut lancer, rouler ou faire rebondir sur les bandes ;
      ses quelques adhérents ne la pratiquent plus que lors de deux concours par an.
    en: >-
      In Oudon, boule oudonnaise is played between two facing boxes of Loire sand, with wooden balls flat
      on one side that may be thrown, rolled or bounced off the boards; its few club members now play
      it only at two contests a year.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00180:
  kind: practice
  summary:
    fr: >-
      Dans le Vignoble nantais, de Vertou à Clisson, la boule se joue sur des terrains couverts, plats
      ou légèrement incurvés ; sur ces derniers, faits de sable damé sur fond d'argile, les boules en
      bois exotique doivent toujours être roulées, jamais lancées.
    en: >-
      In the Nantes vineyard area, from Vertou to Clisson, bowls is played on covered grounds, flat or
      gently curved; on the curved ones, made of sand rammed on a clay base, the tropical-wood balls must
      always be rolled, never thrown.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00182:
  kind: practice
  summary:
    fr: >-
      Variante de la boule nantaise propre à Saint-Michel-Chef-Chef, la boule tharonnaise se joue avec
      des boules en laiton roulées, un pied à la planche, sur une piste de terre battue creusée de 40
      cm et bordée de bandes cimentées dont on se sert pour approcher le petit.
    en: >-
      A variant of the Nantes bowls game found only in Saint-Michel-Chef-Chef, boule tharonnaise uses
      brass balls rolled, one foot on the board, along a beaten-earth lane dipping 40 cm, with cement
      banks used to reach the jack.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00183:
  kind: practice
  summary:
    fr: >-
      Dans le Morbihan, les boules bretonnes se jouent sur un terrain entouré de planches, sur herbe ou
      sable dur : pour chasser la boule adverse, on la roule ou on la lance « à pok » ou « à demi-pok
      », toujours main ouverte ; un comité départemental fédère les clubs depuis 1936.
    en: >-
      In the Morbihan, Breton bowls is played on a board-edged ground of grass or hard sand: to knock
      away an opponent's ball, players roll it or throw it "à pok" or "à demi-pok", always open-handed;
      a county committee has federated the clubs since 1936.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00184:
  kind: practice
  summary:
    fr: >-
      Dans le pays de Morlaix (Nord-Finistère) et à Guérande, les boules plombées se roulent sur des allées
      sablées entourées de bandes en bois ; chaque boule porte cinq plombs, quatre pour la guider droit
      et un cinquième, le « fort », qui infléchit sa course.
    en: >-
      In the Morlaix area of north Finistère and in Guérande, lead-weighted bowls are rolled along sanded
      alleys edged with wooden boards; each ball holds five lead plugs, four to keep it straight and a
      fifth, the "fort", that bends its path.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00185:
  kind: practice
  summary:
    fr: >-
      Né dans le pays de Quimper, le boultenn est un jeu de tir : à environ 8,5 m, le joueur lance six
      boules pour chasser du billot trois boules posées dans des creux, la boule centrale comptant double
      ; remplacer exactement la boule chassée double les points.
    en: >-
      Originating in the Quimper area, boultenn is a shooting game: from about 8.5 m, a player throws
      six balls to knock three balls off a wooden block where they sit in hollows, the centre one scoring
      double; landing exactly in place of the ejected ball doubles the score.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00186:
  kind: practice
  summary:
    fr: >-
      D'origine hollandaise mais très pratiqué dans toute la Bretagne, le billard hollandais consiste
      à faire glisser trente palets de bois sur un long plateau jusque dans quatre cases à trous valant
      de 1 à 4 points ; une série complète d'un palet par case rapporte un bonus.
    en: >-
      Dutch in origin but widely played across Brittany, Dutch billiards involves sliding thirty wooden
      discs along a long board into four slotted compartments worth 1 to 4 points; a full set of one disc
      in each compartment earns a bonus.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00187:
  kind: practice
  summary:
    fr: >-
      Attesté de longue date dans l'ouest de la Bretagne, le birinig est un jeu de quilles de table :
      une boule suspendue par une ficelle à un mât doit contourner celui-ci avant d'abattre neuf quilles
      ; on joue en 101 points, un peu comme aux fléchettes anglaises.
    en: >-
      Long attested in western Brittany, birinig is a table skittles game: a ball hanging by a string
      from a post must swing round it before knocking down nine pins; games are played to 101 points,
      somewhat like English darts.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00188:
  kind: practice
  summary:
    fr: >-
      Populaire en Ille-et-Vilaine, la boîte à cases est un jeu dérivé du palet : on lance des palets
      en fonte dans une boîte en bois en trapèze divisée en cinq cases, la plus petite valant 5 points
      ; on y joue aux kermesses, aux fêtes de village et en marge des concours de palet.
    en: >-
      Popular in Ille-et-Vilaine, the box game is an offshoot of palet: players toss cast-iron discs into
      a trapezoid wooden box split into five compartments, the smallest worth 5 points; it is played at
      fêtes, village fairs and alongside palet contests.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00189:
  kind: practice
  summary:
    fr: >-
      Jeu de boules breton dont Plouégat-Guerrand serait le dernier foyer, la boule montante consiste
      à faire rouler une boule le plus haut possible sur un plan incliné sans la faire tomber au sommet
      ; une version connue à Argol demande plutôt de la faire passer dans un trou.
    en: >-
      A Breton bowls game whose last stronghold is said to be Plouégat-Guerrand, the climbing ball involves
      rolling a ball as high as possible up a slope without letting it drop off the top; a version known
      in Argol instead requires sending it through a hole.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00190:
  kind: practice
  summary:
    fr: >-
      Jeu attribué à la Bretagne sans lieu d'origine précis, la boule pendante consiste à toucher une
      boule de bois suspendue à une potence en lançant trois boules ; à chaque réussite, le joueur recule
      d'un mètre, et toucher le fil annule le lancer.
    en: >-
      Attributed to Brittany with no precise place of origin, the hanging ball game consists in hitting
      a wooden ball hung from a gallows-like frame with three thrown balls; after each hit the player
      steps back a metre, and touching the string voids the throw.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00191:
  kind: practice
  summary:
    fr: >-
      Connu dans toute l'Europe mais très pratiqué en Bretagne, le jeu de la grenouille consiste à lancer
      des palets de fonte dans la gueule ouverte d'une grenouille en métal fixée sur un meuble en bois
      percé de trous ; les palets tombent dans des casiers qui indiquent les points.
    en: >-
      Known across Europe but much played in Brittany, the frog game involves tossing cast-iron discs
      into the open mouth of a metal frog set on a wooden cabinet pierced with holes; the discs drop into
      slots showing the points scored.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00192:
  kind: practice
  summary:
    fr: >-
      Populaire en Ille-et-Vilaine, le jeu du sabot, dérivé du palet, consiste à lancer des palets en
      fonte dans un sabot posé au sol, suspendu ou fixé à une planche ; dans certaines versions, le poids
      des palets fait basculer un levier qui révèle une bouteille à gagner.
    en: >-
      Popular in Ille-et-Vilaine, the clog game, derived from palet, involves tossing cast-iron discs
      into a wooden clog set on the ground, hung up or fixed to a board; in some versions the weight of
      the discs tips a lever that reveals a bottle as the prize.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00193:
  kind: practice
  summary:
    fr: >-
      En Ille-et-Vilaine, le palet sur cible est un jeu de précision proposé lors des fêtes : à environ
      6 m, on lance des palets sur une planche carrée peinte de cercles concentriques de couleur, le centre
      valant 4 points, et le palet doit rester sur la planche pour compter.
    en: >-
      In Ille-et-Vilaine, target palet is a precision game offered at local fêtes: from about 6 m, players
      toss discs onto a square board painted with coloured concentric rings, the centre worth 4 points,
      and a disc counts only if it stays on the board.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00194:
  kind: practice
  summary:
    fr: >-
      Pratiqué en pays gallo, en Haute-Bretagne, le palet sur planche à trous consiste à lancer cinq palets
      qui doivent arriver à plat sur une planche percée de trous, chacun valant un nombre de points différent
      ; on le joue seul ou en équipe.
    en: >-
      Played in the Gallo country of eastern Brittany, palet on a holed board involves tossing five discs
      that must land flat on a board pierced with holes, each worth a different number of points; it is
      played singly or in teams.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00195:
  kind: practice
  summary:
    fr: >-
      Jeu de précision d'origine bretonne, le trou du chat ou patigo consiste à faire rouler une boule
      à travers un trou à peine plus grand qu'elle, percé dans une planche verticale ; à chaque réussite,
      le joueur recule d'un mètre, et le plus éloigné après dix lancers l'emporte.
    en: >-
      A precision game of Breton origin, the cat's hole or patigo consists in rolling a ball through a
      hole barely larger than itself cut in an upright board; after each success the player steps back
      a metre, and whoever ends farthest away after ten throws wins.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00196:
  kind: practice
  summary:
    fr: >-
      Dans les cinq départements de la Bretagne historique, les jeux athlétiques bretons, issus des durs
      travaux ruraux, réunissent sept épreuves de championnat, dont le lancer d'un poids de 20 kg, le
      lever d'un essieu de charrette et le lancer d'une gerbe de paille à la fourche.
    en: >-
      Across the five departments of historic Brittany, Breton athletic games, rooted in hard farm labour,
      comprise seven championship events, including throwing a 20 kg weight, lifting a cart axle and pitching
      a sheaf of straw over a bar with a fork.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00197:
  kind: practice
  summary:
    fr: >-
      Dans le Trégor (Côtes-d'Armor), des jeux de force traditionnels aux noms bretons perpétuent des
      gestes du travail paysan : charger un sac de sable sur l'épaule, dresser une perche en l'appuyant
      sur la cuisse, soulever d'une main un essieu de charrette.
    en: >-
      In the Trégor area of the Côtes-d'Armor, traditional strength games with Breton names carry on gestures
      of farm work: hoisting a sandbag onto the shoulder, raising a pole upright by bracing it against
      the thigh, lifting a cart axle with one hand.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00198:
  kind: event
  summary:
    fr: >-
      À Guerlesquin (Finistère), le jeu du bouloù pok occupe chaque année la journée du Mardi gras : les
      hommes de la ville, répartis en deux camps selon le côté de la place où ils habitent, lancent des
      demi-cylindres de buis lestés de plomb ; le tambour de la ville proclame les vainqueurs.
    en: >-
      In Guerlesquin, Finistère, the bouloù pok game fills the whole of Shrove Tuesday each year: the
      town's men, split into two camps by which side of the square they live on, throw lead-weighted half-cylinders
      of boxwood; the town drummer proclaims the winners.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00199:
  kind: practice
  summary:
    fr: >-
      Mentionnée à Quimper dès 1388, la galoche bigoudène consiste à lancer de lourds palets d'acier pour
      abattre un cylindre de bois, la galoche, surmonté d'une rondelle, le lipar ; le point va au palet
      le plus proche du lipar une fois tombé, et les concours ont lieu en galochodromes.
    en: >-
      Mentioned in Quimper as early as 1388, galoche bigoudène involves throwing heavy steel discs to
      knock over a wooden cylinder, the galoche, topped with a small washer, the lipar; the point goes
      to the disc nearest the fallen lipar, and contests take place on purpose-built grounds.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00200:
  kind: practice
  summary:
    fr: >-
      À Assérac, commune de la presqu'île guérandaise (Loire-Atlantique), on pratique une forme locale
      de la galoche, jeu d'adresse breton où l'on lance des palets vers un petit bloc de bois ; elle est
      décrite par la confédération des jeux et sports traditionnels de Bretagne.
    en: >-
      In Assérac, a town on the Guérande peninsula (Loire-Atlantique), people play a local form of galoche,
      a Breton game of skill in which palets are thrown at a small wooden block; it was documented by
      the confederation of Breton traditional games and sports.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00201:
  kind: practice
  summary:
    fr: >-
      Sur la côte nord du Finistère, autour de Saint-Pol-de-Léon, chaque joueur lance un palet de fonte
      pour renverser la galoche posée au sol à une quinzaine de pas, puis un second pour s'approcher au
      plus près de la pièce de monnaie qui y était appuyée.
    en: >-
      On the north coast of Finistère, around Saint-Pol-de-Léon, each player throws a cast-iron palet
      to topple the galoche, a wooden peg standing on the ground about fifteen paces away, then a second
      one to land as close as possible to the coin that leant against it.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00202:
  kind: practice
  summary:
    fr: >-
      Variante de la galoche relevée dans les communes du nord du Finistère : la galoche est posée à même
      le sol, sans billot ; le joueur la fait tomber avec un premier palet, puis cherche à placer le second
      au plus près de la pièce qu'elle portait.
    en: >-
      A variant of galoche recorded in the towns of northern Finistère: the wooden peg stands directly
      on the ground, with no block beneath it; the player knocks it over with a first palet, then tries
      to land the second closest to the coin it carried.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00204:
  kind: practice
  summary:
    fr: >-
      En Brière et dans la presqu'île guérandaise, les joueurs misaient des pièces sur la galoche, ou
      bique, puis tentaient de la renverser avec des palets d'acier souvent tirés des chantiers navals
      ; abandonné vers les années 1980, le jeu est remis en pratique lors d'animations associatives.
    en: >-
      In the Brière and on the Guérande peninsula, players staked coins on the galoche, or bique, then
      tried to knock it down with steel palets often cut from shipyard bars; dropped around the 1980s,
      the game is now revived at association-run events.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00205:
  kind: practice
  summary:
    fr: >-
      À Plougastel-Daoulas (Finistère), le péchou se joue avec des galets ou pierres taillés à la main
      de chaque joueur, lancés au plus près d'un petit cube de pierre, le « mest » ; né chez les marins
      attendant le vent, il ne survit plus que dans le quartier de Lauberlac'h, le dimanche.
    en: >-
      In Plougastel-Daoulas (Finistère), péchou is played with pebbles or stones each player shapes to
      fit his hand, thrown as close as possible to a small stone cube, the "mest"; born among sailors
      waiting for the wind, it now survives only on Sundays in the Lauberlac'h district.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00206:
  kind: practice
  summary:
    fr: >-
      Dans le pays de Pontivy (Morbihan), les joueurs lancent leurs palets pour les faire retomber à l'intérieur
      d'un trépied renversé, pieds en l'air ; dans une variante, la distance de lancer recule de cinq
      mètres jusqu'à ce que l'un des joueurs échoue.
    en: >-
      In the Pontivy area (Morbihan), players throw their palets so that they land inside an upturned
      tripod with its legs in the air; in one variant, the throwing distance moves back five metres at
      a time until one player misses.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00207:
  kind: practice
  summary:
    fr: >-
      Propre au village de Kerdiny, à Plougasnou (Finistère), ce jeu consiste à lancer cinq petits palets
      de fer dans une caisse en bois en trapèze divisée en cinq cases ; la plus petite, la plus proche
      du lanceur, rapporte le plus de points.
    en: >-
      Specific to the village of Kerdiny in Plougasnou (Finistère), this game involves throwing five small
      iron palets into a trapezoid wooden box split into five compartments; the smallest one, nearest
      the thrower, scores the most points.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00208:
  kind: practice
  summary:
    fr: >-
      Dans le sud de la Loire-Atlantique et en Vendée, on lance des palets de fonte à un peu moins de
      quatre mètres sur une plaque de plomb carrée, pour les placer au plus près d'un petit palet appelé
      maître ; le jeu se pratique aujourd'hui en salle.
    en: >-
      In southern Loire-Atlantique and the Vendée, players throw cast-iron palets from just under four
      metres onto a square lead plate, aiming to get closest to a smaller disc called the master; the
      game is now played indoors.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00209:
  kind: practice
  summary:
    fr: >-
      Surtout répandu en Vendée et présent dans le vignoble nantais, ce jeu consiste à approcher de petits
      palets de laiton d'un maître lancé sur une plaque de plomb ; il se joue en gymnase, la plaque posée
      sur de la moquette.
    en: >-
      Mainly played in the Vendée and also found in the Nantes vineyard area, this game involves landing
      small brass palets close to a master thrown onto a lead plate; it is played in gyms, with the plate
      laid on carpet.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00210:
  kind: practice
  summary:
    fr: >-
      Apparu en Bretagne après la Première Guerre mondiale, surtout en Ille-et-Vilaine, ce jeu consiste
      à lancer à cinq mètres des palets de fonte sur une planche de peuplier, au plus près du maître ;
      la fermeture des fonderies rend leur fabrication difficile.
    en: >-
      Introduced in Brittany after the First World War, especially in Ille-et-Vilaine, this game involves
      throwing cast-iron palets from five metres onto a poplar board, as close as possible to the master;
      the closure of foundries makes them hard to source.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00211:
  kind: practice
  summary:
    fr: >-
      Très présent dans le nord du Morbihan, le palet sur route se joue sur la chaussée : les joueurs
      lancent leurs palets vers un maître posé au centre d'un cercle tracé au sol, puis rejouent dans
      l'autre sens depuis un second cercle ; fêtes et pardons locaux en sont l'occasion.
    en: >-
      Widely played in northern Morbihan, road palet is played on the road surface: players throw their
      palets towards a master set in the middle of a circle drawn on the tarmac, then play back from a
      second circle; local fêtes and pardons are the usual occasions.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00212:
  kind: practice
  summary:
    fr: >-
      Dans la presqu'île de Guérande et à Férel (Morbihan), le palet sur route se joue en équipes de deux
      sur le bitume : de lourds palets de ferraille sont lancés à douze mètres vers un petit placé dans
      un carré tracé, et tout palet touchant la ligne est éliminé.
    en: >-
      On the Guérande peninsula and in Férel (Morbihan), road palet is played in pairs on tarmac: heavy
      scrap-iron palets are thrown twelve metres towards a small target disc set in a chalked square,
      and any palet touching the line is out.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00213:
  kind: practice
  summary:
    fr: >-
      En Loire-Atlantique, notamment dans le pays de Retz et le pays d'Ancenis, le palet sur terre consiste
      à approcher un petit placé au centre d'une cible tracée dans la terre, à une dizaine de mètres ;
      poids des palets et taille de la cible varient selon les secteurs.
    en: >-
      In Loire-Atlantique, notably the Pays de Retz and the Ancenis area, palet on earth consists in landing
      palets close to a small disc placed in the middle of a target drawn in the soil about ten metres
      away; palet weight and target size vary from area to area.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00214:
  kind: practice
  summary:
    fr: >-
      Dans le Poher, autour de Carhaix (Finistère), le palet sur terre se joue entre deux tas de terre
      mouillée distants d'environ dix-sept mètres, où l'on cherche à planter ses palets de fonte au plus
      près du maître ; il anime fermes, quartiers, fêtes et pardons d'été.
    en: >-
      In the Poher area around Carhaix (Finistère), palet on earth is played between two mounds of wet
      soil about seventeen metres apart, into which players try to stick their cast-iron palets nearest
      the master; it is played on farms, in neighbourhoods and at summer fêtes and pardons.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00215:
  kind: practice
  summary:
    fr: >-
      Joué depuis les années 1920 environ dans le canton de Lanmeur (pays de Morlaix, Finistère), le petit
      palet consiste à faire tomber d'un billot une minuscule galoche en bois avec douze palets d'acier
      ; des concours ont lieu l'été, en marge de ceux de galoche sur billot.
    en: >-
      Played since around the 1920s in the canton of Lanmeur (Morlaix area, Finistère), petit palet involves
      knocking a tiny wooden galoche off a block with twelve steel palets; contests are held in summer
      alongside those for galoche on a block.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00216:
  kind: practice
  summary:
    fr: >-
      En Ille-et-Vilaine, pays gallo, le pitao est un petit cylindre de bois dur sur lequel on pose des
      pièces de monnaie ; les joueurs le visent avec des palets d'acier et se disputent les pièces tombées.
      Connu ailleurs sous le nom de galoche, le jeu se pratiquait à tout âge.
    en: >-
      In Ille-et-Vilaine, in Gallo-speaking Brittany, the pitao is a small hardwood cylinder topped with
      coins; players aim steel palets at it and compete for the coins that fall. Known elsewhere as galoche,
      the game was played by children and adults alike.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00217:
  kind: practice
  summary:
    fr: >-
      Dans quelques communes du nord du Finistère, comme Plouescat ou Cléder, ce jeu de quilles consiste
      à lancer une boule de bois contre un petit talus pour qu'elle renverse en retombant neuf quilles
      posées à son pied ; il se jouait les dimanches et jours de fête.
    en: >-
      In a few towns of northern Finistère, such as Plouescat and Cléder, this skittles game consists
      in throwing a wooden ball against a low bank so that it knocks down, on its way back, nine pins
      set at its foot; it was played on Sundays and feast days.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00218:
  kind: practice
  summary:
    fr: >-
      À Guissény, en pays Pagan (Finistère), ce jeu de quilles se jouait contre un muret de pierre en
      demi-cercle, avec sept quilles et une grosse boule de bois percée pour les doigts ; aujourd'hui
      abandonné, il est vu comme l'ancêtre du jeu sur talus.
    en: >-
      In Guissény, in the Pays Pagan (Finistère), this skittles game was played against a semicircular
      low stone wall, with seven pins and a large wooden ball drilled with finger holes; no longer played,
      it is seen as the forerunner of the bank game.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00219:
  kind: practice
  summary:
    fr: >-
      Au village de Bilac, à Saint-André-des-Eaux (Loire-Atlantique), ce jeu de neuf quilles numérotées
      ne se jouait qu'une fois l'an, lors de la fête du village ; les quilles étant cassées, il n'est
      plus pratiqué et l'on envisage de refaire le jeu à l'identique.
    en: >-
      In the village of Bilac, in Saint-André-des-Eaux (Loire-Atlantique), this game with nine numbered
      skittles was played only once a year, at the village fête; as the pins are broken it is no longer
      played, and there are plans to make an identical set.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00220:
  kind: practice
  summary:
    fr: >-
      Propre à Marsac-sur-Don (Loire-Atlantique), ce jeu de quilles se joue sur un terrain herbeux avec
      neuf quilles de trois tailles et une boule percée pour la main ; le second lancer part de l'endroit
      où la boule s'est arrêtée.
    en: >-
      Specific to Marsac-sur-Don (Loire-Atlantique), this skittles game is played on level grass with
      nine pins of three sizes and a ball drilled for the hand; the second throw is taken from where the
      ball came to rest.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00221:
  kind: practice
  summary:
    fr: >-
      Retrouvé au village de Pont-Ruelland, à Mauron (pays de Brocéliande), ce jeu de neuf quilles de
      valeurs différentes se joue avec des boules ovales en forme de tête de maillet ; il faut atteindre
      exactement 64 points. Il animait fêtes locales et réunions de famille jusqu'à la fin des années
      1990.
    en: >-
      Recorded in the village of Pont-Ruelland in Mauron (Brocéliande area), this game uses nine pins
      of different values and oval balls shaped like mallet heads; players must reach exactly 64 points.
      It was played at local fêtes and family gatherings until the late 1990s.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00222:
  kind: practice
  summary:
    fr: >-
      Dans le quartier de Minez-Bibon, à Guiscriff (Morbihan), on lance une boule en bois de pommier sur
      une piste en bois à rebords vers dix quilles de houx disposées en losange ; créé vers 1980, le jeu
      sort lors des fêtes du pays des Montagnes noires.
    en: >-
      In the Minez-Bibon district of Guiscriff (Morbihan), players roll an apple-wood ball along a wooden
      lane with raised edges towards ten holly pins set in a diamond; made around 1980, the game comes
      out at fêtes in the Black Mountains area.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00223:
  kind: practice
  summary:
    fr: >-
      À Muël (Ille-et-Vilaine), ce jeu de neuf quilles numérotées, disposées en carré, se joue avec des
      « boules » ovales qui ressemblent à des têtes de maillet ; il est sorti lors de la fête communale,
      sous forme de concours l'après-midi.
    en: >-
      In Muël (Ille-et-Vilaine), this game of nine numbered pins set out in a square is played with oval
      "balls" that look like mallet heads; it is brought out for the village fête as an afternoon contest.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00224:
  kind: practice
  summary:
    fr: >-
      À Plougastel-Daoulas (Finistère), la boule n'est pas lancée directement sur les quilles : elle longe
      une palissade de bois en U avant de revenir les renverser. Attesté depuis au moins le début du XIXe
      siècle, le jeu accompagne la partie profane des fêtes de chapelle.
    en: >-
      In Plougastel-Daoulas (Finistère), the ball is not thrown straight at the pins: it runs round a
      U-shaped wooden fence before coming back to knock them down. Attested since at least the early 19th
      century, the game accompanies the secular side of chapel feasts.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00225:
  kind: practice
  summary:
    fr: >-
      À Plounéour-Trez (Finistère), ce jeu de quilles se jouait surtout à l'intérieur des cafés, sur un
      plateau incliné à rebords où l'on renversait six petites quilles avec deux boules, en jouant des
      bandes ; on le sortait dehors pour les fêtes locales.
    en: >-
      In Plounéour-Trez (Finistère), this skittles game was mostly played inside cafés, on a sloping board
      with raised sides where six small pins were knocked down with two balls, using the sides as cushions;
      it was taken outdoors for local fêtes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00226:
  kind: practice
  summary:
    fr: >-
      Au hameau de Pomeleuc, à Lanouée (Morbihan), un groupe de joueurs perpétue depuis plus de quarante
      ans ce jeu de quilles par équipes, sur terre battue ; celui qui ne renverse aucune quille est dit
      « cheval » et doit relever les quilles jusqu'à ce qu'un autre le remplace.
    en: >-
      In the hamlet of Pomeleuc, in Lanouée (Morbihan), a group of players has kept this team skittles
      game going for over forty years on a beaten-earth floor; whoever knocks down no pin is called the
      "horse" and must set the pins back up until someone else takes over.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00227:
  kind: practice
  summary:
    fr: >-
      À Trébédan (Côtes-d'Armor), ce jeu de neuf quilles numérotées en hêtre se joue avec deux boules
      percées pour les doigts, en visant 40 points exactement ; très répandu dans les fêtes communales
      entre 1945 et 1970 environ, il ne sort plus guère qu'en réunion privée.
    en: >-
      In Trébédan (Côtes-d'Armor), this game with nine numbered beech pins is played with two balls drilled
      for the fingers, aiming for exactly 40 points; common at village fêtes from about 1945 to 1970,
      it now rarely appears outside private gatherings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00228:
  kind: practice
  summary:
    fr: >-
      Dans le Bas-Léon (nord du Finistère), on fait rouler la boule sur un petit talus de terre incurvé
      pour qu'elle attaque de biais les neuf quilles, souvent près d'une chapelle ; une peinture bretonne
      du XVIIe siècle montre déjà ce jeu pratiqué sans club, de façon spontanée.
    en: >-
      In the Bas-Léon (northern Finistère), players roll the ball along a small curved earth bank so that
      it strikes the nine pins from the side, often near a chapel; a 17th-century Breton painting already
      shows this game, still played informally without clubs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00229:
  kind: practice
  summary:
    fr: >-
      En pays bigouden et au cap Sizun (Finistère), ce jeu de neuf quilles de houx se joue non avec une
      boule mais avec des galets de poids et de formes variés, adaptés à chaque main ; un concours a lieu
      sur la place lors du pardon communal, à côté de celui de galoche.
    en: >-
      In the Pays Bigouden and Cap Sizun (Finistère), this game of nine holly pins is played not with
      a ball but with pebbles of varied weights and shapes to suit each hand; a contest is held on the
      square at the parish pardon, next to a galoche contest.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00230:
  kind: practice
  summary:
    fr: >-
      Dans le pays de Fougères (Ille-et-Vilaine), ce jeu de neuf grandes quilles en hêtre, dont la plus
      haute, la « 18 », trône au centre, se jouait l'été dans les cours de ferme ou à l'arrière des cafés,
      au sein d'un cercle restreint de voisins et de familles.
    en: >-
      In the Fougères area (Ille-et-Vilaine), this game of nine tall beech pins, the tallest, called the
      "18", standing in the centre, was played in summer in farmyards or behind cafés, within a small
      circle of neighbours and families.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00231:
  kind: practice
  summary:
    fr: >-
      En pays Glazig (Finistère), les joueurs lancent deux boules depuis un ancien cercle de roue de charrette
      vers neuf quilles posées sur un plancher ; abattre les neuf d'un coup donne droit à une « relève
      », un lancer supplémentaire.
    en: >-
      In the Pays Glazig (Finistère), players throw two balls from an old cartwheel rim towards nine pins
      standing on a wooden floor; knocking all nine down at once earns a "relève", an extra throw.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00232:
  kind: practice
  summary:
    fr: >-
      Dans le Poher (Finistère), autour de Carhaix, on lance à neuf mètres une très grosse boule de trois
      à quatre kilos, tenue par une mortaise, vers neuf quilles en ogive dressées sur un plancher ; les
      règles varient d'une commune à l'autre, comme à Edern.
    en: >-
      In the Poher area (Finistère), around Carhaix, players throw a very large ball weighing three to
      four kilos, gripped by a slot, from nine metres at nine pointed pins standing on a wooden floor;
      rules vary between towns, as in Edern.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00233:
  kind: practice
  summary:
    fr: >-
      Dans le Trégor des Côtes-d'Armor, ce jeu de neuf quilles hautes comme un genou se distingue par
      leur disposition en triangle, la plus haute au centre ; présent dans la région dès le XIVe siècle
      selon les archives, il est aujourd'hui transmis lors d'initiations associatives.
    en: >-
      In the Trégor area of Côtes-d'Armor, this game of nine knee-high pins stands out for their triangular
      layout, with the tallest in the middle; found in the area as early as the 14th century according
      to archives, it is now passed on through association-run introductory sessions.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00234:
  kind: practice
  summary:
    fr: >-
      Récupéré à Quistinic (Morbihan), ce jeu d'adresse compte cinq quilles suspendues à un axe horizontal
      : frappée par la boule, chacune pivote et se bloque sur un second axe. Il anime aujourd'hui les
      kermesses des écoles bilingues de Lanester.
    en: >-
      Recovered in Quistinic (Morbihan), this game of skill has five pins hung from a horizontal bar:
      when struck by the ball, each one swings round and locks onto a second bar. It is now played at
      fêtes of the bilingual schools in Lanester.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00235:
  kind: practice
  summary:
    fr: >-
      À Pont-Aven (Finistère), près de la chapelle Saint-André, on lance du pied un sabot de travail en
      hêtre le plus loin possible dans un couloir de quarante mètres ; venu de Gourin, le jeu fait l'objet
      chaque année, en août, d'un championnat lors de la fête.
    en: >-
      In Pont-Aven (Finistère), near the Saint-André chapel, competitors kick a beech work clog as far
      as possible down a forty-metre lane; brought from Gourin, the game is the subject of a championship
      held each August during the local fête.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00236:
  kind: practice
  summary:
    fr: >-
      Sur les côtes bretonnes et dans les villes au bord d'une rivière ou d'un étang, les fêtes locales
      accueillaient des jeux nautiques : marche sur une poutre branlante au-dessus de l'eau, course de
      canots à la godille, chasse aux canards à la nage. Ils sont aujourd'hui peu pratiqués.
    en: >-
      On the Breton coast and in towns by a river or pond, local fêtes used to feature water games: walking
      a wobbly beam over the water, sculling races in small boats, and swimming after released ducks.
      They are rarely played today.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00237:
  kind: practice
  summary:
    fr: >-
      En Cornouaille, le kilhou koz consiste à renverser le plus souvent possible la « vieille », quille
      centrale valant neuf points, parmi neuf quilles disposées en rectangle ; pour être valable, la boule
      doit passer sous une ficelle tendue devant le jeu.
    en: >-
      In Cornouaille, kilhou koz consists in knocking down the "old woman", the central pin worth nine
      points, as often as possible among nine pins set out in a rectangle; to count, the ball must roll
      under a string stretched in front of the pins.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00238:
  kind: practice
  summary:
    fr: >-
      Dans de nombreuses communes du nord du Finistère, de Roscoff à Landivisiau, les joueurs faisaient
      rouler la boule sur une longue planche servant de guide pour abattre huit des neuf quilles ; joué
      pour une mise les dimanches et jours de pardon, il a décliné avec la loi sur les jeux d'argent.
    en: >-
      In many towns of northern Finistère, from Roscoff to Landivisiau, players rolled the ball along
      a long guiding plank to knock down eight of the nine pins; played for stakes on Sundays and pardon
      days, it declined once the law on gambling was enforced.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00239:
  kind: practice
  summary:
    fr: >-
      Dans la campagne du pays Pagan (nord du Finistère), la boule « ar mestr » tenait le rôle du cochonnet
      : on lançait vers cette boule de bois des boules de métal de tous poids, sur un terrain sans limites.
      Encore courant avant 1939, le jeu a cédé la place à la pétanque.
    en: >-
      In the countryside of the Pays Pagan (northern Finistère), the "ar mestr" ball served as the jack:
      players threw metal balls of any weight towards this wooden ball, on ground with no boundaries.
      Still common before 1939, the game gave way to pétanque.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00240:
  kind: practice
  summary:
    fr: >-
      À Douai (Nord), le billon est un jeu d'adresse où l'on lance une lourde massue en charme, d'environ
      trois kilos, vers un poteau de bois situé à neuf mètres, sur une piste de sable humide bordée de
      planches ; le billon le plus proche du but marque le point.
    en: >-
      In Douai (Nord), billon is a game of skill in which players throw a heavy hornbeam club weighing
      about three kilos towards a wooden post nine metres away, on a lane of damp sand edged with planks;
      the club closest to the post scores.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00241:
  kind: practice
  summary:
    fr: >-
      À Godewaersvelde (Nord), près de la frontière belge, la boule flamande se joue sur une piste concave,
      la bourloire, où l'on fait rouler une boule vers une rondelle de cuivre incrustée au sol ; jadis
      en terre battue mêlée de bouse, la piste est aujourd'hui en ciment.
    en: >-
      In Godewaersvelde (Nord), near the Belgian border, Flemish bowls is played on a concave lane, the
      bourloire, where a ball is rolled towards a copper disc set in the ground; once made of beaten earth
      mixed with dung, the lane is now concrete.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00242:
  kind: practice
  summary:
    fr: >-
      Autour de Tourcoing et Wattrelos (Nord), la bourle est un jeu de précision proche de la boule de
      fort : on fait rouler un disque de bois cerclé d'acier sur une piste concave, la « bourloire »,
      pour l'arrêter au plus près d'une rondelle de cuivre.
    en: >-
      Around Tourcoing and Wattrelos (Nord), bourle is a precision game akin to boule de fort: players
      roll a steel-rimmed wooden disc along a concave track, the bourloire, trying to stop it as close
      as possible to a small copper target.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00243:
  kind: practice
  summary:
    fr: >-
      Dans le Nord, où les « coulonneux » sont surtout issus du milieu minier, la colombophilie consiste
      à sélectionner et élever des pigeons voyageurs bagués, lâchés au loin lors de concours hebdomadaires
      : gagne celui dont l'oiseau rejoint le premier son colombier.
    en: >-
      In the Nord, where most fanciers come from mining families, pigeon racing means breeding and selecting
      ringed homing pigeons that are released far away in weekly contests; the winner is the owner whose
      bird reaches its loft first.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00244:
  kind: practice
  summary:
    fr: >-
      À Arras (Pas-de-Calais), les joutes nautiques se disputent sur le bassin de la Scarpe selon une
      méthode locale : les barques, bien que motorisées, sont rapprochées l'une de l'autre par les jouteurs
      qui tirent sur des cordes tendues le long du canal.
    en: >-
      In Arras (Pas-de-Calais), water jousting takes place on the Scarpe basin using a local method: although
      the boats have engines, the crews pull them towards each other along ropes stretched beside the
      canal before the jousters clash.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00245:
  kind: practice
  summary:
    fr: >-
      Dans le Haut-Pays (cantons d'Hucqueliers, Desvres et Samer, Pas-de-Calais), on joue surtout en équipes
      de quatre aux quilles de neuf : une lourde boule de bois plein, percée d'une poignée, doit renverser
      neuf grandes quilles disposées en carré.
    en: >-
      In the Haut-Pays (Hucqueliers, Desvres and Samer areas, Pas-de-Calais), teams of four mostly play
      nine-pin skittles: a heavy solid wooden ball with a finger grip is rolled to knock down nine large
      pins set out in a square.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00246:
  kind: practice
  summary:
    fr: >-
      Répandu dans les Flandres et le nord du Pas-de-Calais, le tir à la perche verticale consiste à abattre
      à l'arc des « oiseaux » de bois garnis de plumes, fixés en haut d'une perche de 25 à 30 mètres ;
      plus l'oiseau est haut, plus il rapporte de points.
    en: >-
      Common in French Flanders and northern Pas-de-Calais, vertical popinjay shooting has archers shoot
      down feathered wooden "birds" perched atop a 25 to 30 metre pole; the higher the bird, the more
      points it scores.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00247:
  kind: practice
  summary:
    fr: >-
      Organisée par une fédération qui siège à Hangest-en-Santerre (Somme), la balle à la main descend
      directement du jeu de paume médiéval : deux équipes se renvoient la balle à main nue sur un long
      terrain sans filet, où des piquets de couleur, les « chasses », marquent la limite des camps.
    en: >-
      Organised from Hangest-en-Santerre (Somme), hand ball is a direct descendant of the medieval jeu
      de paume: two teams hit the ball bare-handed across a long court with no net, where coloured stakes
      called chasses mark the line between the camps.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00248:
  kind: practice
  summary:
    fr: >-
      À Tours-en-Vimeu (Somme), la balle au tamis est un jeu d'équipe issu du jeu de paume : au service,
      le joueur peut faire rebondir la balle, très dure, sur un tamis grillagé posé sur trépied, puis
      chaque équipe cherche à gagner du terrain sur l'autre.
    en: >-
      In Tours-en-Vimeu (Somme), balle au tamis is a team game descended from jeu de paume: when serving,
      a player may bounce the very hard ball off a wire-mesh sieve on a tripod, and each side then tries
      to gain ground on the other.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00249:
  kind: practice
  summary:
    fr: >-
      Pratiqué dans le nord de l'Amiénois (Somme), le ballon au poing est un jeu de balle où l'on frappe
      le ballon du poing ; il appartient, comme la longue paume et la balle à la main, à la famille des
      jeux issus de l'ancien jeu de paume.
    en: >-
      Played north of Amiens (Somme), ballon au poing is a ball game in which the ball is struck with
      the fist; like longue paume and hand ball, it belongs to the family of games descended from the
      old jeu de paume.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00250:
  kind: practice
  summary:
    fr: >-
      À Boves (Somme), le jeu de guise, d'abord joué par les enfants dans la rue, consiste à frapper avec
      une batte un petit bâton de frêne taillé en pointe pour le faire sauter puis l'envoyer le plus loin
      possible ; il se joue aujourd'hui souvent sur une route droite.
    en: >-
      In Boves (Somme), the game of guise, once a children's street game, involves striking a small pointed
      ash stick with a bat to flip it into the air and then drive it as far as possible; it is now often
      played on a straight road.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00251:
  kind: practice
  summary:
    fr: >-
      Pratiqué notamment dans le Doullennais (Somme) et à Bauvin (Nord), le javelot tir sur cible consiste
      à planter, depuis un plancher placé à 8 mètres, deux javelots semblables à de grosses fléchettes
      dans une cible en bois de peuplier.
    en: >-
      Played notably around Doullens (Somme) and in Bauvin (Nord), target javelin involves throwing two
      javelins, a kind of oversized dart, from a wooden platform 8 metres away into a target set in a
      block of poplar wood.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00252:
  kind: practice
  summary:
    fr: >-
      Le jeu de l'assiette est un jeu traditionnel picard pratiqué à Albert (Somme), où une association
      de joueurs le fait vivre au sein du réseau des jeux traditionnels de Picardie.
    en: >-
      The game of the assiette is a traditional Picard game played in Albert (Somme), where a players'
      association keeps it alive within the network of Picardy's traditional games.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00253:
  kind: practice
  summary:
    fr: >-
      Le jeu de quilles du Ponthieu se pratique dans les villages autour d'Abbeville, au nord-ouest de
      la Somme ; il fait partie des jeux traditionnels picards défendus par la fédération régionale.
    en: >-
      The Ponthieu skittles game is played in the villages around Abbeville, in the north-west of the
      Somme; it is one of the traditional Picard games supported by the regional federation.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00254:
  kind: practice
  summary:
    fr: >-
      À Châteauneuf-sur-Sarthe (Maine-et-Loire), la boule de fort se joue en salle sur une piste incurvée
      dont les bords relevés servent à contourner les boules adverses ; les joueurs, en chaussons, visent
      le « petit » comme à la pétanque.
    en: >-
      In Châteauneuf-sur-Sarthe (Maine-et-Loire), boule de fort is played indoors on a curved track whose
      raised edges let players bend their bowls around opponents'; wearing slippers, they aim at the jack,
      much as in pétanque.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00255:
  kind: practice
  summary:
    fr: >-
      La boule de sable est un jeu de boules pratiqué dans le Val de Loire, entre Nantes, Angers et Cholet
      et surtout à l'ouest d'Angers, au sein de sociétés locales réunies en association régionale.
    en: >-
      Boule de sable is a bowls game played in the Loire Valley between Nantes, Angers and Cholet, mainly
      west of Angers, by local clubs grouped in a regional association.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00256:
  kind: practice
  summary:
    fr: >-
      Surtout pratiquée dans le Santerre (Somme), ainsi que dans l'Oise et à Paris, la longue paume est
      un sport de balle frappée à la raquette sur de grands terrains en plein air, souvent bordés de tilleuls,
      où des « chasses » marquent le terrain gagné.
    en: >-
      Played mainly in the Santerre (Somme), with a few clubs in the Oise and Paris, longue paume is a
      racket-and-ball sport on large outdoor grounds, often lined with lime trees, where stakes called
      chasses mark the ground won.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00258:
  kind: practice
  summary:
    fr: >-
      Pratiquée surtout dans l'est de la Somme (Corbie, Moreuil, Santerre, Roye), dans le nord de l'Oise
      et à Maubeuge, la balle à la main se joue à main nue sur un long terrain bordé de tilleuls, sans
      filet : des piquets mobiles marquent la séparation des camps.
    en: >-
      Played mostly in the eastern Somme (Corbie, Moreuil, Santerre, Roye), the northern Oise and Maubeuge,
      hand ball is played bare-handed on a long court lined with lime trees, with no net: movable stakes
      mark the line between the two camps.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00262:
  kind: practice
  summary:
    fr: >-
      Jeu normand pratiqué du Moyen Âge jusque vers 1942, souvent autour de Mardi gras, puis relancé en
      2001, la crosse oppose des équipes qui poussent une balle, la « choule », avec une crosse ou au
      pied pour la faire passer dans un but appelé « viquet ».
    en: >-
      A Norman game played from the Middle Ages until around 1942, often at Shrovetide, and revived in
      2001, crosse pits teams against each other as they drive a ball, the choule, with a stick or foot
      through a goal called the viquet.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00263:
  kind: practice
  summary:
    fr: >-
      En Normandie, la grande choule est un jeu collectif de balle au pied et à la main, attesté du Moyen
      Âge à 1914 et repris en 2004 : il se joue entre deux équipes qui cherchent à « noyer » la balle
      dans une mare.
    en: >-
      In Normandy, la grande choule is a team ball game played with feet and hands, recorded from the
      Middle Ages to 1914 and revived in 2004: two sides compete to "drown" the ball in a pond.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00264:
  kind: practice
  summary:
    fr: >-
      Venu du pays de Bray et de la région de Cherbourg et désormais joué dans toute la Normandie, le
      jeu du camembert consiste à faire glisser sur une longue planche des palets de bois verni de la
      taille d'un fromage, pour les arrêter sur les cases les mieux notées.
    en: >-
      Originating in the Pays de Bray and around Cherbourg and now played across Normandy, the camembert
      game involves sliding varnished wooden discs the size of the cheese along a long board so they stop
      on the highest-scoring squares.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00265:
  kind: practice
  summary:
    fr: >-
      Dans l'est du Cotentin (Manche), la tèque est un jeu de balle et de bâton jadis joué l'après-midi
      de Mardi gras : un batteur frappe la balle lancée puis court autour de piquets avant que l'équipe
      adverse la renvoie à son capitaine.
    en: >-
      In the eastern Cotentin (Manche), tèque is a bat-and-ball game once played on Shrove Tuesday afternoon:
      a batter hits the thrown ball and then runs round a circuit of stakes before the fielding side can
      return it to their captain.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00266:
  kind: practice
  summary:
    fr: >-
      Dans l'est du Cotentin, autour de Montebourg (Manche), le jeu des treis soeus consiste à renverser
      trois quilles coniques alignées en une ou deux boules lancées sans rouler au sol ; attesté depuis
      le XIXe siècle, il donne lieu à des concours locaux réguliers.
    en: >-
      In the eastern Cotentin, around Montebourg (Manche), the treis soeus game involves knocking down
      three cone-shaped skittles in a row with one or two balls thrown without rolling; recorded since
      the 19th century, it still has regular local contests.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00267:
  kind: practice
  summary:
    fr: >-
      Héritière des jeux de longue paume, la balle au tambourin se pratique surtout dans l'Hérault et
      aussi à Gruissan et Narbonne (Aude) : deux équipes de cinq se renvoient une balle frappée avec un
      tambourin, souvent en plein air d'avril à septembre.
    en: >-
      Descended from longue paume, balle au tambourin is played mainly in the Hérault and also in Gruissan
      and Narbonne (Aude): two teams of five strike the ball back and forth with a tambourine-like bat,
      usually outdoors from April to September.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00268:
  kind: practice
  summary:
    fr: >-
      Jeu angevin devenu sport à la fin du XIXe siècle, notamment à Mazé (Maine-et-Loire), la boule de
      fort se joue sur une piste en gouttière de 25 mètres : la boule, au roulement oscillant et très
      lent, suit des courbes pour s'approcher du « maître ».
    en: >-
      An Anjou game that became a sport in the late 19th century, played for instance in Mazé (Maine-et-Loire),
      boule de fort uses a 25-metre trough-shaped track: the slow, wobbling bowl follows curved paths
      to get close to the jack.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00269:
  kind: practice
  summary:
    fr: >-
      Joué dans toute la France et documenté ici à La Mure (Isère), le sport-boules ou boule lyonnaise
      consiste à placer ses boules au plus près d'un petit but, en pointant ou en tirant après une course
      d'élan ; il compte une forme traditionnelle et une forme sportive.
    en: >-
      Played throughout France and recorded here in La Mure (Isère), sport-boules or boule lyonnaise means
      landing one's bowls as close as possible to a small jack, either by pointing or by shooting after
      a run-up; it has traditional and athletic forms.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00270:
  kind: practice
  summary:
    fr: >-
      Dans la Drôme, où subsiste un club basé à Eurre, les jeux de billes reprennent une pratique enfantine
      universelle : dans la version classique, deux joueurs lancent leurs billes vers un petit trou creusé
      au sol puis les y font entrer d'une pichenette.
    en: >-
      In the Drôme, where one club based in Eurre remains, marble games draw on a worldwide children's
      pastime: in the classic version, two players roll their marbles towards a small hole in the ground
      and then flick them in.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00271:
  kind: practice
  summary:
    fr: >-
      À Fontainebleau et à Paris, la courte paume se joue en salle fermée : on se renvoie une balle à
      la raquette au-dessus d'un filet, les murs et les toits inclinés de la salle faisant partie du jeu
      ; des maîtres paumiers en transmettent les règles subtiles.
    en: >-
      In Fontainebleau and Paris, real tennis (courte paume) is played in an enclosed court: players hit
      the ball with a racket over a net, and the walls and sloping roofs of the court are part of play;
      professional masters pass on its intricate rules.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00272:
  kind: event
  summary:
    fr: >-
      Chaque année, le premier dimanche d'août, les communes de la Montagne bourbonnaise (Allier) s'affrontent
      amicalement aux Grands Jeux : tir à la corde, jeu des bûcherons et quilles, plus deux épreuves inventées
      par la commune hôte, souvent liées à son histoire.
    en: >-
      Every year on the first Sunday of August, the villages of the Montagne Bourbonnaise (Allier) compete
      in a friendly way at the Grands Jeux: tug of war, a woodcutters' contest and skittles, plus two
      games devised by the host village, often drawing on its history.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00273:
  kind: practice
  summary:
    fr: >-
      En Bresse, notamment à Saint-Étienne-du-Bois (Ain), le jeu de sept quilles se joue surtout pour
      de petites mises : un lancer ne compte que si la boule abat d'abord la « première », la quille placée
      dans l'axe de la piste.
    en: >-
      In the Bresse, for instance in Saint-Étienne-du-Bois (Ain), the seven-pin skittles game is mostly
      played for small stakes: a throw only counts if the ball first knocks down the "first" pin, the
      one in line with the alley.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00274:
  kind: practice
  summary:
    fr: >-
      Sur les canaux et étangs de l'Hérault (Sète, Agde, Palavas, Mèze…) et au Grau-du-Roi (Gard), les
      joutes languedociennes opposent deux barques à rames ; vêtu de blanc, lance et pavois en main, chaque
      jouteur tente de faire tomber l'autre à l'eau.
    en: >-
      On the canals and lagoons of the Hérault (Sète, Agde, Palavas, Mèze...) and at Le Grau-du-Roi (Gard),
      Languedoc jousting pits two rowed boats against each other; dressed in white with lance and shield,
      each jouster tries to tip the other into the water.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00275:
  kind: practice
  summary:
    fr: >-
      Sur le Rhône, de Givors et Lyon à Tain-l'Hermitage et Tournon, les joutes de méthode givordine et
      lyonnaise opposent un bateau rouge et un bleu ; de fin mai à fin août, défilés, fanfares et pesée
      des jouteurs accompagnent les tournois.
    en: >-
      On the Rhône, from Givors and Lyon to Tain-l'Hermitage and Tournon, jousting in the Givors and Lyon
      styles pits a red boat against a blue one; from late May to late August, parades, brass bands and
      the weighing of jousters surround the tournaments.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00276:
  kind: practice
  summary:
    fr: >-
      À Accolay (Yonne) et Clamecy (Nièvre), les joutes nautiques suivent des méthodes locales aux règles
      identiques, à côté de la méthode parisienne des championnats : debout sur le trinquet d'une barque
      rouge ou bleue, chaque jouteur doit pousser l'autre à l'eau.
    en: >-
      In Accolay (Yonne) and Clamecy (Nièvre), water jousting follows local methods with identical rules,
      alongside the Paris method used in championships: standing on the rear platform of a red or blue
      boat, each jouster must push the other into the water.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00277:
  kind: practice
  summary:
    fr: >-
      À La Chapelle-d'Angillon (Cher), le bordé est un jeu de bûcherons joué aux beaux jours par équipes
      de deux, en souvenir des paires qui maniaient la grande scie : on lance un bâton de charme taillé
      en pointe au plus près d'un piquet planté à 11 mètres.
    en: >-
      In La Chapelle-d'Angillon (Cher), bordé is a woodcutters' game played in fine weather by teams of
      two, recalling the pairs who worked the big two-man saw: players throw a pointed hornbeam stick
      as close as possible to a stake 11 metres away.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00278:
  kind: practice
  summary:
    fr: >-
      Apparu à la fin du XIXe siècle, le ninepin bowling classic est un jeu de neuf quilles surtout pratiqué
      en Alsace et en Côte-d'Or : en 30 lancers, le joueur alterne « jeu plein », où les quilles sont
      relevées à chaque coup, et « déblayage ».
    en: >-
      Dating from the late 19th century, ninepin bowling classic is a nine-pin game played mainly in Alsace
      and the Côte-d'Or: over 30 throws, players alternate between full play, with all pins reset after
      each throw, and clearing play.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00279:
  kind: practice
  summary:
    fr: >-
      Pratiqué en France surtout en Lorraine, ainsi que dans le Nord, les Vosges et les Ardennes, le ninepin
      bowling schere est un jeu de neuf quilles disposées en losange, chacune portant un nom selon sa
      place : quille de devant, dames, valets et roi au centre.
    en: >-
      Played in France mainly in Lorraine and also in the Nord, the Vosges and the Ardennes, ninepin bowling
      schere uses nine pins set in a diamond, each named after its position: front pin, queens, jacks
      and, in the middle, the king.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00280:
  kind: practice
  summary:
    fr: >-
      Attestées dans le Gers dès le XVe siècle et relancées dans les villages gascons en 1972, les quilles
      de six au maillet consistent à lancer un maillet pour renverser cinq des six quilles, trois petites
      placées devant trois grandes ; abattre les six ne rapporte rien.
    en: >-
      Recorded in the Gers as early as the 15th century and revived in Gascon villages in 1972, six-pin
      mallet skittles involves throwing a mallet to knock down five of six pins, three small ones set
      before three tall ones; toppling all six scores nothing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00281:
  kind: practice
  summary:
    fr: >-
      Surtout pratiqué en Aveyron, où il compte parmi les sports les plus suivis, le jeu de quilles de
      huit consiste à renverser huit quilles à l'aide d'une neuvième, le « quillou », que le joueur frappe
      avec une boule, à des distances allant de 1 à 20 mètres.
    en: >-
      Played mainly in the Aveyron, where it ranks among the most popular sports, eight-pin skittles involves
      knocking down eight pins with a ninth one, the quillou, which the player strikes with a ball, at
      distances ranging from 1 to 20 metres.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00282:
  kind: practice
  summary:
    fr: >-
      Pratiquées à Gruissan (Aude) et dans de nombreux ports, de Marseille à Collioure et jusqu'à Strasbourg,
      les rames traditionnelles sont des courses de 300 mètres où deux lourdes barques en bois, menées
      par six rameurs et un barreur, contournent une bouée.
    en: >-
      Practised in Gruissan (Aude) and many other harbours, from Marseille to Collioure and as far as
      Strasbourg, traditional rowing consists of 300-metre races in which two heavy wooden boats, each
      with six rowers and a cox, turn round a buoy.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00283:
  kind: practice
  summary:
    fr: >-
      À Morlanne (Pyrénées-Atlantiques), un tourneur sur bois fabrique les quilles de hêtre et les boules
      de noyer des jeux pyrénéens : la quille de neuf, haute de près d'un mètre, porte un renflement,
      la « pomme », cerclé de clous qui encaissent les chocs.
    en: >-
      In Morlanne (Pyrénées-Atlantiques), a wood turner makes the beech pins and walnut balls used in
      Pyrenean skittles: the nine-pin skittle, almost a metre tall, has a bulge called the pomme, ringed
      with nails to absorb the impact of the ball.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00284:
  kind: practice
  summary:
    fr: >-
      Emblème de l'identité guadeloupéenne, le gwoka unit chant responsorial en créole, rythmes des tambours
      ka et danse d'un soliste qui dialogue avec le tambour makè ; il se vit notamment lors des léwòz,
      veillées nocturnes ouvertes à tous.
    en: >-
      A symbol of Guadeloupean identity, gwoka combines call-and-response singing in Creole, rhythms played
      on ka drums and a solo dancer in dialogue with the lead makè drum; it is shared especially at léwòz,
      night gatherings open to all.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00285:
  kind: event
  summary:
    fr: >-
      Chaque année, les habitants d'un village différent de la Soule (Pays basque) montent une pastorale,
      théâtre en plein air en langue basque joué sur une estrade sans décor, où anges, Satans et humains
      rejouent la lutte du Bien et du Mal.
    en: >-
      Each year, the people of a different village in the Soule (Basque Country) stage a pastorale, open-air
      theatre in Basque performed on a bare stage, in which angels, Satans and humans act out the struggle
      between Good and Evil.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00286:
  kind: practice
  summary:
    fr: >-
      À Larrau, en Soule (Pyrénées-Atlantiques), quelques éleveurs perpétuent le bortüsorhoka : au printemps,
      après la traite du matin, le berger mène chaque jour ses brebis plus haut en montagne puis les redescend
      le soir à la ferme pour la seconde traite.
    en: >-
      In Larrau, in the Soule (Pyrénées-Atlantiques), a few farmers keep up bortüsorhoka: in spring, after
      the morning milking, the shepherd takes the ewes a little higher up the mountain each day and brings
      them back to the farm in the evening for the second milking.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00287:
  kind: practice
  summary:
    fr: >-
      À Larrau, en Soule (Pays basque), les éleveurs brûlent les landes de montagne à la fin de l'hiver,
      environ tous les deux ans, pour écarter les broussailles et favoriser l'herbe des estives ; ce feu
      pastoral, allumé au chalumeau, se conduit le plus souvent à deux.
    en: >-
      In Larrau, in the Basque province of Soule, livestock farmers burn the mountain heathland at the
      end of winter, roughly every two years, to keep scrub back and help pasture grass grow; the fire
      is lit with a torch and usually steered by just two people.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00288:
  kind: practice
  summary:
    fr: >-
      À Larrau (Pyrénées-Atlantiques), les fermes « atandes » les plus hautes jouissent de droits anciens
      sur les pâturages communs ; leurs éleveurs perpétuent la montée quotidienne des brebis, le feu pastoral,
      les haies tressées et des remèdes à base de plantes.
    en: >-
      In Larrau (Pyrénées-Atlantiques), the highest "atandes" farms hold long-standing rights on the common
      mountain pastures; their farmers keep up daily drives of ewes to the uplands, pastoral burning,
      woven hedges and plant-based remedies.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00289:
  kind: practice
  summary:
    fr: >-
      En Béarn, des familles préparent elles-mêmes leurs canards gras sur deux jours : découpe, salage
      sur un lit de paille, puis cuisson des morceaux dans leur graisse et mise en conserve du foie gras,
      une pratique jadis liée à l'autosuffisance des fermes.
    en: >-
      In Béarn, some families still process fattened ducks at home over two days: cutting up, salting
      on a bed of straw, then cooking the pieces in their own fat and preserving the foie gras, a practice
      once tied to farm self-sufficiency.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00291:
  kind: practice
  summary:
    fr: >-
      Dans les Landes, les Pyrénées-Atlantiques et les Hautes-Pyrénées, le jeu de quilles de neuf consiste
      à frapper la « quille de main » avec une lourde boule à poignée pour abattre les autres selon douze
      figures imposées ; il est devenu un sport fédéré.
    en: >-
      In the Landes, Pyrénées-Atlantiques and Hautes-Pyrénées, players of nine-pin skittles strike the
      "hand pin" with a heavy handled ball so that it knocks down the others in twelve set figures; the
      old game is now an organised sport.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2012_67717_INV_PCI_FRANCE_00292:
  kind: practice
  summary:
    fr: >-
      Le carillon est un instrument d'au moins 23 cloches accordées, joué depuis un clavier frappé du
      poing et un pédalier ; la France en compte plusieurs dizaines, du Nord à la Savoie, où des carillonneurs
      donnent concerts et sonneries dans les beffrois et clochers.
    en: >-
      A carillon is an instrument of at least 23 tuned bells, played from a keyboard struck with the fists
      and a pedalboard; France has several dozen, from the North to Savoy, where carillonneurs perform
      concerts and tunes from belfries and church towers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00293:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, le mus est un jeu de cartes qui se joue à quatre, en deux équipes, et mêle calcul
      et bluff ; chaque main se déroule en quatre phases de paris, avec un vocabulaire basque (« paso
      », « embido », « tira ») et des points souvent comptés avec des haricots.
    en: >-
      In the Basque Country, mus is a card game for four players in two teams that combines counting and
      bluffing; each hand has four betting rounds, called in Basque terms such as "paso", "embido" and
      "tira", and points are often kept with beans.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00294:
  kind: practice
  summary:
    fr: >-
      Dans le sud-ouest de la France, le flamenco, venu d'Andalousie et associant chant, danse et guitare,
      se pratique en famille comme sur scène ; des festivals, à Mont-de-Marsan et Toulouse notamment,
      et des écoles entretiennent cette tradition orale.
    en: >-
      In south-west France, flamenco, which came from Andalusia and combines song, dance and guitar, is
      practised both at family gatherings and on stage; festivals, notably in Mont-de-Marsan and Toulouse,
      and dance schools keep this oral tradition going.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00295:
  kind: event
  summary:
    fr: >-
      Pendant les fêtes de Montaner (Pyrénées-Atlantiques), désormais dans la seconde moitié de juillet,
      les conscrits et le comité des fêtes parcourent la commune en camions décorés et chantent, en français
      et en occitan, une sérénade devant chaque maison.
    en: >-
      During the village festival of Montaner (Pyrénées-Atlantiques), now held in the second half of July,
      the year's conscripts and the festival committee tour the commune in decorated lorries, singing
      a serenade in French and Occitan at every house.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00299:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, le chistera, gant d'osier courbe qui sert à lancer la pelote, est fabriqué sur mesure
      par un même artisan qui maîtrise trois métiers : le travail du châtaignier pour l'armature, la vannerie
      pour la poche et la couture du doigtier en cuir.
    en: >-
      In the Basque Country, the chistera, the curved wicker glove used to hurl the pelota, is made to
      measure by a single craftsman who combines three trades: shaping chestnut wood for the frame, basketry
      for the pocket and stitching the leather finger sleeve.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00300:
  kind: practice
  summary:
    fr: >-
      En Béarn, un atelier fabrique des palas, raquettes de bois plein utilisées dans plusieurs spécialités
      de pelote basque ; le bois, séché pendant environ un an, est tracé au gabarit, découpé puis mis
      en épaisseur, avec des modèles qui varient selon la pelote et le jeu.
    en: >-
      In Béarn, a workshop makes palas, the solid wooden bats used in several forms of Basque pelota;
      the wood is air-dried for about a year, marked out from templates, cut and planed to thickness,
      with models that vary according to the ball and the game.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00301:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, le xare est une raquette de pelote faite d'une tige de noisetier courbée en cadre
      et d'une poche en ficelle nouée comme une toile d'araignée ; le fabricant adapte son galbe au poste
      du joueur et au côté de sa main.
    en: >-
      In the Basque Country, the xare is a pelota racket made from a bent hazel stem forming the frame
      and a pocket of knotted string resembling a spider's web; the maker adjusts its curve to the player's
      position and to whether they are right- or left-handed.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00303:
  kind: practice
  summary:
    fr: >-
      En Bretagne, la bombarde et le biniou forment un couple instrumental emblématique, joué aux noces,
      aux fêtes et dans les festoù-noz ; après un net recul au début du XXe siècle, leur pratique a été
      relancée par les bagadoù, le collectage et les écoles de musique.
    en: >-
      In Brittany, the bombarde and the biniou form an emblematic pair of instruments, played at weddings,
      festivals and fest-noz dances; after a sharp decline in the early 20th century, they were revived
      through the bagad bands, field collecting and music schools.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00304:
  kind: practice
  summary:
    fr: >-
      En Haute-Bretagne, entre Saint-Brieuc, Vannes, Dinan et Châteaubriant, on chante « à la marche »
      : un meneur lance un chant que le groupe reprend en marchant sur plusieurs kilomètres, sur un vaste
      répertoire de chants en laisse et de chants à décompter.
    en: >-
      In Upper Brittany, in an area between Saint-Brieuc, Vannes, Dinan and Châteaubriant, people sing
      "à la marche": a leader starts a song that the group repeats while walking for miles, drawing on
      a large stock of call-and-response and countdown songs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00305:
  kind: practice
  summary:
    fr: >-
      En Haute-Bretagne, à Pâques et dans la nuit du 1er mai, de petits groupes vont chanter de maison
      en maison un chant propre à la fête, la Passion ou le chant de mai, et reçoivent en retour des œufs
      ou de l'argent s'ils l'ont chanté en entier.
    en: >-
      In Upper Brittany, at Easter and on the night before 1 May, small groups go from house to house
      singing a song tied to the feast, the Passion or the May song, and are given eggs or money in return
      once they have sung it through.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00306:
  kind: practice
  summary:
    fr: >-
      Dans les Côtes-d'Armor, à La Chapelle-Neuve, des soirées « Kan ba'r bistro » invitent un chanteur
      à chanter sans micro au comptoir d'un café, en quatre courts passages entrecoupés d'échanges avec
      le public, pour faire revivre le chant au bistrot.
    en: >-
      In La Chapelle-Neuve, in the Côtes-d'Armor, "Kan ba'r bistro" evenings invite a singer to perform
      unamplified at the bar of a village café, in four short sets broken up by conversation with the
      audience, reviving the custom of singing in cafés.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00307:
  kind: practice
  summary:
    fr: >-
      À Lorient, des repas chantés « Kan en davarn » réunissent chaque mois, dans une taverne, un chanteur
      invité et des convives qui chantent à leur tour, sans micro ni scène, en breton, en français ou
      en gallo.
    en: >-
      In Lorient, monthly "Kan en davarn" sung dinners in a tavern bring together a guest singer and diners
      who take turns to sing, with no microphone or stage, in Breton, French or Gallo.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00308:
  kind: practice
  summary:
    fr: >-
      En Basse-Bretagne, le kan ha diskan est un chant à danser en breton où deux chanteurs se relaient
      en reprenant chacun la fin de la phrase de l'autre ; d'abord transmis en famille, il a été repris
      par de jeunes chanteurs grâce aux festoù-noz et au collectage.
    en: >-
      In Lower Brittany, kan ha diskan is a Breton-language dance song in which two singers alternate,
      each picking up the end of the other's line; once passed on within families, it was taken up by
      younger singers through fest-noz dances and field recordings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00309:
  kind: practice
  summary:
    fr: >-
      Depuis la fin des années 1980, des associations organisent un peu partout en Bretagne, surtout en
      Haute-Bretagne, des randonnées de 5 à 15 km où l'on reprend des chants à la marche, parfois avec
      violon ou accordéon, avec des pauses pour des contes.
    en: >-
      Since the late 1980s, associations across Brittany, especially Upper Brittany, have organised walks
      of 5 to 15 km on which participants answer walking songs, sometimes led by fiddle or accordion,
      with stops for storytelling.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00310:
  kind: practice
  summary:
    fr: >-
      En Bretagne, le violon se joue de deux façons dans la musique de tradition orale : en soliste à
      la manière des anciens « sonneurs » ou violoneux, ou au sein de groupes issus du renouveau ; on
      compte quelques milliers de pratiquants.
    en: >-
      In Brittany, the fiddle is played in two ways in music from the oral tradition: solo, in the manner
      of the old "sonneurs" or village fiddlers, or within bands born of the folk revival; players number
      in the low thousands.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00311:
  kind: practice
  summary:
    fr: >-
      En Bretagne, des « veillées de café » réunissent régulièrement, souvent une fois par mois, chanteurs
      et conteurs de tradition orale autour des tables d'un café, sans scène, sans micro ni programme
      : chacun chante ou conte quand il le souhaite.
    en: >-
      In Brittany, "café evenings" regularly gather traditional singers and storytellers, often once a
      month, around the tables of a café, with no stage, microphone or line-up: anyone may sing or tell
      a tale when they wish.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00312:
  kind: practice
  summary:
    fr: >-
      Dans le Trégor et le Goëlo (Côtes-d'Armor), une douzaine d'associations locales organisent chaque
      saison des veillées gratuites en salle communale, où chanteurs, conteurs et musiciens bénévoles
      se succèdent, souvent en breton ; la formule a été relancée au début des années 1990.
    en: >-
      In the Trégor and Goëlo areas of the Côtes-d'Armor, a dozen local associations hold free evening
      gatherings each season in village halls, where volunteer singers, storytellers and musicians perform
      in turn, often in Breton; the format was revived in the early 1990s.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00314:
  kind: event
  summary:
    fr: >-
      À Arbois (Jura), le premier dimanche de septembre, des vignerons portent en cortège jusqu'à l'église
      Saint-Just le biou, énorme grappe faite de raisins blancs et noirs fixés sur une armature la veille,
      une fête liée aux vendanges et au saint patron de la ville.
    en: >-
      In Arbois (Jura), on the first Sunday of September, winegrowers carry the biou, a huge cluster built
      the day before from white and black grapes fixed on a frame, in procession to the church of Saint-Just,
      a festival tied to the harvest and the town's patron saint.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00315:
  kind: practice
  summary:
    fr: >-
      Dans les Landes de Gascogne, la boha est une cornemuse à anches simples dont le pied, taillé d'une
      seule pièce, porte deux tuyaux parallèles sans bourdon ; jadis jouée aux noces et aux fêtes, elle
      anime toujours bals et musique gasconne actuelle.
    en: >-
      In the Landes de Gascogne, the boha is a single-reed bagpipe whose chanter, carved from one block,
      has two parallel bores and no drone; once played at weddings and local festivals, it still accompanies
      dances and present-day Gascon music.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00316:
  kind: practice
  summary:
    fr: >-
      Sur le littoral de la Manche, autour de Granville et jusqu'au havre de Carteret, des pêcheries fixes
      en bois ou en pierres, pièges en forme de V découverts à marée basse, retiennent les poissons ;
      leur entretien demande pieux, tressage de saule et savoir-faire spécifiques.
    en: >-
      On the coast of the Manche, around Granville and north to the Carteret estuary, fixed V-shaped fish
      traps of wood or stone catch fish as the tide goes out; keeping them up calls for stakes, woven
      willow and particular skills.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00317:
  kind: practice
  summary:
    fr: >-
      En Bretagne, la cueillette des « simples », plantes sauvages ramassées près de chez soi pour soigner
      ou se nourrir, reste une pratique vivante, entre usages domestiques, herboristerie et collectage
      des savoirs auprès des anciens.
    en: >-
      In Brittany, gathering "simples", wild plants picked near home for healing or for food, remains
      a living practice, spanning household use, herbalism and the recording of knowledge from older people.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00319:
  kind: practice
  summary:
    fr: >-
      Dans une partie du Morbihan, on accroche le 30 avril une branche de hêtre, de bouleau ou d'aubépine,
      « ar mae », sur la façade ou aux ouvertures des maisons, pour saluer le retour des beaux jours,
      porter bonheur et protéger le foyer.
    en: >-
      In part of the Morbihan, on 30 April people hang a branch of beech, birch or hawthorn, "ar mae",
      on the front or the doors and windows of houses to welcome the fine weather, bring luck and protect
      the household.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00325:
  kind: event
  summary:
    fr: >-
      À Steenwerck (Nord), la « journée Stop », le dernier dimanche de septembre, associe braderie, ducasse
      et animations au musée de la vie rurale ; le géant local reçoit des géants voisins puis mène le
      soir un défilé aux lampions et aux flambeaux.
    en: >-
      In Steenwerck (Nord), the "journée Stop", on the last Sunday of September, combines a street market,
      funfair and activities at the rural life museum; the town's giant welcomes giants from nearby towns,
      then leads an evening lantern and torch parade.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2013_67717_INV_PCI_FRANCE_00326:
  kind: practice
  summary:
    fr: >-
      En Guadeloupe, surtout en Grande-Terre dans les Grands-Fonds, le bouladjel est une polyrythmie de
      bruits de gorge, de halètements et de battements de mains produite par des hommes pour accompagner
      certains chants, notamment lors des veillées mortuaires.
    en: >-
      In Guadeloupe, especially in the Grands-Fonds area of Grande-Terre, bouladjel is a polyrhythm of
      throat sounds, panting and hand claps made by men to accompany certain songs, particularly at wakes
      for the dead.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00052:
  kind: practice
  summary:
    fr: >-
      Dans les Pyrénées-Atlantiques, des facteurs fabriquent la flabuta, flûte gasconne à trois trous
      taillée d'une seule pièce dans du buis ; jouée de la main gauche, elle s'accompagne d'un tambour
      ou d'un tambourin à cordes, et sa facture a dû être en partie réinventée.
    en: >-
      In the Pyrénées-Atlantiques, instrument makers produce the flabuta, a Gascon three-hole pipe carved
      from a single piece of boxwood; played with the left hand, it goes with a drum or a string drum,
      and the craft has partly had to be reinvented.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00327:
  kind: practice
  summary:
    fr: >-
      En pays de Grasse (Alpes-Maritimes), les savoir-faire du parfum réunissent trois métiers liés :
      la culture des plantes à parfum, la connaissance et la transformation des matières premières naturelles,
      et l'art de composer un parfum.
    en: >-
      Around Grasse (Alpes-Maritimes), perfume-making skills bring together three linked trades: growing
      fragrant plants, knowing and processing natural raw materials, and the art of composing a perfume.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00328:
  kind: practice
  summary:
    fr: >-
      Pratiquée dans toute la France, la savate boxe française est un sport de combat qui n'utilise que
      les pieds, chaussés de chaussures spécifiques, et les poings ; elle se dispute en « assaut », où
      la puissance des coups est exclue, ou en « combat ».
    en: >-
      Practised across France, savate or French boxing is a combat sport using only the fists and the
      feet, which wear special shoes; bouts are fought either as "assaut", where full-power blows are
      banned, or as "combat".
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00332:
  kind: practice
  summary:
    fr: >-
      En haute vallée d'Ossau (Pyrénées-Atlantiques), des couturières confectionnent les costumes ossalois,
      notamment les habits de fête, comme la jupe rouge plissée des femmes, portés surtout le 15 août
      lors des fêtes de Laruns.
    en: >-
      In the upper Ossau valley (Pyrénées-Atlantiques), seamstresses make the traditional Ossau costumes,
      above all the festive outfits such as the women's pleated red skirt, worn mainly on 15 August at
      the Laruns festival.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00335:
  kind: practice
  summary:
    fr: >-
      En Bretagne, l'accordéon, chromatique surtout en Basse-Bretagne et diatonique en Haute-Bretagne,
      s'est implanté entre 1880 et 1930 ; des milliers de musiciens en jouent aujourd'hui, en sonneurs
      ou en groupe, principalement dans les festoù-noz.
    en: >-
      In Brittany, the accordion, mostly chromatic in Lower Brittany and diatonic in Upper Brittany, took
      root between 1880 and 1930; thousands of musicians play it today, solo in the "sonneur" style or
      in bands, chiefly at fest-noz dances.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00336:
  kind: event
  summary:
    fr: >-
      À Redon (Ille-et-Vilaine), le 4e dimanche d'octobre, pendant la vieille foire « teillouse », le
      concours de la Bogue d'or réunit depuis 1975 une quarantaine de chanteurs de tradition, sélectionnés
      lors d'assemblées de chant dans toute la Haute-Bretagne.
    en: >-
      In Redon (Ille-et-Vilaine), on the fourth Sunday of October during the old "teillouse" fair, the
      Bogue d'or contest has gathered some forty traditional singers since 1975, chosen at singing gatherings
      held across Upper Brittany.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00337:
  kind: practice
  summary:
    fr: >-
      Dans une grande partie de la Bretagne centrale et méridionale, le chant à répondre voit un meneur
      lancer chaque phrase, que l'assistance reprend à l'unisson ; il sert pour marcher, danser ou chanter
      à table, et vit aujourd'hui dans les festoù-noz et les veillées.
    en: >-
      Across much of central and southern Brittany, in call-and-response singing a leader sings each phrase
      and the whole group repeats it in unison; it is used for walking, dancing and table songs, and lives
      on today at fest-noz dances and singing evenings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00338:
  kind: event
  summary:
    fr: >-
      Tout au long de l'année, des concours de sonneurs se tiennent dans les terroirs de Bretagne ; les
      couples biniou-bombarde ou cornemuse-bombarde qualifiés s'affrontent ensuite à Gourin (Morbihan),
      début septembre, au championnat de Bretagne.
    en: >-
      Throughout the year, piping contests are held in the different areas of Brittany; the qualifying
      pairs of biniou or bagpipe with bombarde then compete at Gourin (Morbihan) in early September for
      the Brittany championship.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00339:
  kind: practice
  summary:
    fr: >-
      Les chants et complaintes de Bretagne, en breton, en français ou en gallo, se chantent a cappella
      en solo, à l'unisson ou en chant à répondre ; très présents jusqu'au milieu du XXe siècle, ils reposent
      aujourd'hui sur la mémoire d'un nombre réduit de chanteurs.
    en: >-
      The songs and laments of Brittany, in Breton, French or Gallo, are sung unaccompanied, solo, in
      unison or as call and response; widespread until the mid-20th century, they now rely on the memory
      of a shrinking number of singers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00341:
  kind: practice
  summary:
    fr: >-
      À Mayun, ancienne île du marais de Brière (Loire-Atlantique), des vanniers façonnent le « mayun
      », panier arrondi aux montants croisés en lames de châtaignier et tressé de bourdaine grattée, jadis
      destiné aux Briérons et aux paludiers de Guérande.
    en: >-
      In Mayun, a former island in the Brière marshes (Loire-Atlantique), basket makers weave the "mayun",
      a rounded basket with crossed chestnut-strip ribs and scraped alder buckthorn weavers, once made
      for marsh dwellers and the salt workers of Guérande.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00342:
  kind: practice
  summary:
    fr: >-
      Dans le pays vannetais (Morbihan), les « sklisseneù » sont des corbeilles rondes dont le fond part
      d'un bouton de brin tordu où l'on pique un nombre impair de montants arqués ; ce savoir-faire, lié
      aux forêts comme celle de Camors, est surtout entretenu par des agriculteurs retraités.
    en: >-
      In the Vannes area of the Morbihan, "sklisseneù" are round baskets started from a knot of twisted
      stem into which an odd number of curved ribs is pushed; the craft, tied to forests such as Camors,
      is now kept up mostly by retired farmers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00343:
  kind: practice
  summary:
    fr: >-
      Dans le sud du Finistère, notamment à Combrit et Plogastel-Saint-Germain, le baskodenn est un panier
      rond de pêcheur à nombre impair de montants, dont les flancs se referment en forme de goutte grâce
      à un gabarit percé utilisé au montage.
    en: >-
      In southern Finistère, notably Combrit and Plogastel-Saint-Germain, the baskodenn is a round fisherman's
      basket with an odd number of ribs, whose sides close into a teardrop shape thanks to a drilled template
      used during assembly.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00344:
  kind: practice
  summary:
    fr: >-
      Dans le Trégor, la « mann » est une corbeille ronde à nombre impair de montants en arcs, montée
      sur un gabarit de bois percé d'encoches ; des vanniers, le plus souvent amateurs, la tressent en
      châtaignier, noisetier, bourdaine ou osier.
    en: >-
      In the Trégor, the "mann" is a round basket with an odd number of arched ribs, built on a wooden
      template drilled with notches; basket makers, mostly amateurs, weave it from chestnut, hazel, alder
      buckthorn or willow.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00346:
  kind: event
  summary:
    fr: >-
      Chaque année en juin, la commune de Renac (Ille-et-Vilaine) met aux enchères, lot par lot, le foin
      encore sur pied de sa prairie de marais, la « Grand-Pré » ; les agriculteurs des environs viennent
      y compléter leurs réserves.
    en: >-
      Every June the commune of Renac (Ille-et-Vilaine) auctions off, plot by plot, the standing hay of
      its marshland meadow known as the "Grand-Pré", where local farmers come to top up their winter stocks.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00347:
  kind: practice
  summary:
    fr: >-
      Dans les CHU de Rouen et d'Angers, cette fiche décrit les savoir-faire, les savoir-être et les récits
      partagés par les soignants, ainsi que la dimension symbolique des lieux hospitaliers, vus comme
      des seuils entre la vie et ses limites.
    en: >-
      At the university hospitals of Rouen and Angers, this entry records the skills, professional attitudes
      and stories shared by care staff, and the symbolic meaning of hospital spaces, seen as thresholds
      at the limits of human life.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00355:
  kind: practice
  summary:
    fr: >-
      En Île-de-France, des écoles issues des communautés asiatiques pratiquent la danse du lion : deux
      danseurs animent un costume de lion au rythme d'un orchestre de percussions, surtout au Nouvel An
      chinois mais aussi pour des mariages ou des inaugurations.
    en: >-
      In the Paris region, schools rooted in Asian communities perform the lion dance: two dancers bring
      a lion costume to life to a percussion band, mainly at Chinese New Year but also at weddings and
      shop openings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00356:
  kind: practice
  summary:
    fr: >-
      Apporté par la diaspora géorgienne installée en Île-de-France depuis les années 1920, le chant polyphonique
      géorgien, à deux, trois ou quatre voix, est aujourd'hui porté par plusieurs chœurs aux membres d'origines
      diverses et par deux paroisses orthodoxes.
    en: >-
      Brought by the Georgian diaspora that settled in the Paris region from the 1920s, Georgian polyphonic
      singing in two, three or four parts is now kept up by several choirs of mixed origins and by two
      Orthodox parishes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00357:
  kind: practice
  summary:
    fr: >-
      Cor naturel enroulé apparu à la cour de France à la fin du XVIIe siècle pour les chasses royales,
      la trompe est aujourd'hui sonnée partout en France par des milliers de sonneurs réunis en groupes
      et écoles, avec un répertoire de fanfares enrichi depuis le XVIIIe siècle.
    en: >-
      A coiled natural horn that appeared at the French court in the late 17th century for royal hunts,
      the trompe is now sounded across France by thousands of players in groups and schools, with a repertoire
      of fanfares that has grown since the 18th century.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2014_67717_INV_PCI_FRANCE_00358:
  kind: practice
  summary:
    fr: >-
      En Bretagne, en Loire-Atlantique et en Vendée, surtout lors des feux de la Saint-Jean, on fait «
      chanter » une bassine de cuivre en frottant des brins de jonc tendus sur son rebord avec des doigts
      mouillés ; le bourdon s'entend à des kilomètres.
    en: >-
      In Brittany, Loire-Atlantique and Vendée, mostly around the Midsummer (Saint-Jean) bonfires, people
      make a copper basin "sing" by rubbing wet fingers along rushes stretched across its rim; the drone
      carries for kilometres.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00360:
  kind: practice
  summary:
    fr: >-
      Né au XVIIIe siècle dans le massif du Mont-Blanc avec les guides paysans, l'alpinisme est l'art
      de gravir sommets et parois de rocher, de neige ou de glace avec des moyens modestes, en autonomie
      et selon des valeurs partagées ; Chamonix-Mont-Blanc en porte l'inscription.
    en: >-
      Born in the Mont Blanc massif in the 18th century with peasant guides, mountaineering is the art
      of climbing rock, snow and ice faces with modest means, self-reliance and shared values; Chamonix-Mont-Blanc
      led its listing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00361:
  kind: event
  summary:
    fr: >-
      En Picardie, en Île-de-France et en Champagne, le bouquet provincial réunit les compagnies d'arc
      dans une ville décorée pour leur défilé, généralement un dimanche de mai, puis ouvre une saison
      de concours de tir Beursault de plusieurs mois.
    en: >-
      In Picardy, Île-de-France and Champagne, the bouquet provincial brings archery companies to a town
      decorated for their parade, usually on a Sunday in May, and opens a months-long season of Beursault
      shooting contests.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00362:
  kind: practice
  summary:
    fr: >-
      Surtout présent en Picardie et en Île-de-France, le tir Beursault est une forme traditionnelle de
      tir à l'arc pratiquée dans un « jeu d'arc », où l'archer tire alternativement vers deux cibles opposées,
      selon un cérémonial et des règles de courtoisie propres aux compagnies d'arc.
    en: >-
      Found mainly in Picardy and Île-de-France, Beursault is a traditional form of archery practised
      on a "jeu d'arc", where archers shoot in turn at two facing targets, following a ceremonial and
      code of courtesy kept by archery companies.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00363:
  kind: practice
  summary:
    fr: >-
      Dans les marais du pays de Redon, aux confins de l'Ille-et-Vilaine, du Morbihan et de la Loire-Atlantique,
      la bosselle est une nasse coudée en lames de châtaignier fendu pour piéger les anguilles ; son usage
      a presque disparu depuis le barrage d'Arzal.
    en: >-
      In the marshes around Redon, where Ille-et-Vilaine, Morbihan and Loire-Atlantique meet, the bosselle
      is an L-shaped eel trap woven from split chestnut strips; its use has almost vanished since the
      Arzal dam was built.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00364:
  kind: practice
  summary:
    fr: >-
      En Haute-Bretagne, du pays de Rennes au Penthièvre, le carbasson (ou calbasson, bine, cage) est
      une corbeille ronde à montants de châtaignier fendu croisés et tressée de bourdaine, à la contenance
      normalisée d'un boisseau, liée aux récoltes et au commerce agricole.
    en: >-
      In Upper Brittany, from the Rennes area to Penthièvre, the carbasson (also calbasson, bine or cage)
      is a round basket on crossed split-chestnut ribs woven with alder buckthorn, holding a standard
      bushel for harvests and farm trade.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00365:
  kind: practice
  summary:
    fr: >-
      Sur la marche orientale de la Bretagne, agriculteurs et pêcheurs fabriquent des paniers et corbeilles
      « sur arceaux » : l'ossature d'arceaux courbés en méridien est montée d'abord, puis tressée ; la
      pratique est aujourd'hui surtout le fait d'amateurs.
    en: >-
      On the eastern borders of Brittany, farmers and fishermen make baskets "on hoops": a frame of curved
      ribs set like meridians is built first and then woven; today the craft is kept up mostly by amateurs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00366:
  kind: practice
  summary:
    fr: >-
      Dans le Briançonnais (Hautes-Alpes), dont la flore mêle espèces alpines, méditerranéennes et arctiques,
      les habitants ont longtemps soigné ou prévenu leurs maux avec des plantes locales, une pharmacopée
      populaire courante jusqu'au milieu du XXe siècle.
    en: >-
      In the Briançon area (Hautes-Alpes), whose flora mixes alpine, Mediterranean and arctic species,
      people long used local plants to treat or prevent illness, a folk pharmacopoeia in common use until
      the mid-20th century.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00367:
  kind: practice
  summary:
    fr: >-
      Autour de Briançon (Hautes-Alpes), on transforme depuis au moins le XIVe siècle la « pierre bleue
      », un calcaire dolomitique des moraines, en chaux cuite dans des fours chauffés au charbon ; une
      association en transmet aujourd'hui la technique.
    en: >-
      Around Briançon (Hautes-Alpes), people have turned "blue stone", a dolomitic limestone from glacial
      moraines, into lime since at least the 14th century, firing it in coal-heated kilns; a local association
      now passes on the technique.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00368:
  kind: practice
  summary:
    fr: >-
      Attestée dès le XIVe siècle autour de Briançon (Hautes-Alpes), la culture du chanvre pour en tirer
      des fibres textiles a été pratiquée par de nombreuses familles jusqu'au milieu du XXe siècle ; seules
      quelques personnes en entretiennent aujourd'hui les savoir-faire.
    en: >-
      Recorded around Briançon (Hautes-Alpes) since the 14th century, growing hemp for textile fibre was
      common among local families until the mid-20th century; only a handful of people still keep the
      skills alive.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00369:
  kind: practice
  summary:
    fr: >-
      Dans le Briançonnais (Hautes-Alpes), l'élevage ovin, adapté au climat de montagne, et le travail
      de la laine marquent le paysage depuis le XVIIe siècle ; fermes pédagogiques et ateliers de filature
      en perpétuent les savoir-faire, notamment à Cervières.
    en: >-
      In the Briançon area (Hautes-Alpes), sheep farming suited to the mountain climate and wool working
      have shaped the landscape since the 17th century; teaching farms and spinning workshops, notably
      at Cervières, keep the skills going.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00372:
  kind: practice
  summary:
    fr: >-
      Le pourim-shpil est une pièce parodique, surtout jouée en yiddish par les communautés juives ashkénazes,
      qui met en scène l'histoire de la reine Esther lors de la fête de Pourim ; en France, il est joué
      partout où une communauté active le fait vivre.
    en: >-
      The Purim shpil is a parody play, mostly performed in Yiddish by Ashkenazi Jewish communities, that
      stages the story of Queen Esther for the feast of Purim; in France it is put on wherever an active
      community keeps it going.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2015_67717_INV_PCI_FRANCE_00373:
  kind: event
  summary:
    fr: >-
      À Pont-de-Cervières, hameau de Briançon (Hautes-Alpes), neuf jeunes hommes armés d'épées exécutent
      le Bacchu-Ber, une danse accompagnée de chants de femmes, chaque 16 août lors de la fête patronale
      de la Saint-Roch.
    en: >-
      In Pont-de-Cervières, a hamlet of Briançon (Hautes-Alpes), nine young men bearing swords perform
      the Bacchu-Ber, a dance accompanied by women's singing, every 16 August at the Saint Roch patronal
      feast.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2016_67717_INV_PCI_FRANCE_00374:
  kind: practice
  summary:
    fr: >-
      Joué depuis les années 1870 en région parisienne, notamment au bois de Vincennes, le jeu de boules
      parisien, ancien « jeu de berges », se pratique sur des terrains couverts ou en plein air dans une
      dizaine de communes de banlieue ; les boules sont roulées, jamais lancées en l'air.
    en: >-
      Played since the 1870s around Paris, notably in the Bois de Vincennes, the jeu de boules parisien,
      once called "jeu de berges", is played on covered or open-air grounds in about ten suburban towns,
      with the bowls always rolled.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00375:
  kind: practice
  summary:
    fr: >-
      Fonction héréditaire des communautés mandingues d'Afrique de l'Ouest, aussi présente en Île-de-France,
      la djèliya fait des djèli (griots) les gardiens de l'histoire orale et des généalogies, des médiateurs
      et des musiciens, notamment lors des mariages, baptêmes et funérailles.
    en: >-
      A hereditary role among the Manding peoples of West Africa, also found in the Paris region, djèliya
      makes the djèli (griots) keepers of oral history and genealogies, mediators and musicians, notably
      at weddings, namings and funerals.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00377:
  kind: practice
  summary:
    fr: >-
      Autour de Moissac (Tarn-et-Garonne), dans le Quercy, des producteurs cultivent le chasselas, raisin
      blanc de table doré, en réalisant à la main de nombreux gestes saisonniers sur la vigne et les grappes
      ; ce fut le premier fruit à obtenir une AOC, en 1971.
    en: >-
      Around Moissac (Tarn-et-Garonne) in Quercy, growers raise Chasselas, a golden white table grape,
      carrying out many seasonal tasks by hand on vines and bunches; in 1971 it became the first fruit
      to receive an AOC.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00378:
  kind: practice
  summary:
    fr: >-
      Depuis 1894, les cressonnières de Méréville (Essonne), longues fosses parallèles alimentées par
      des eaux de source dans la vallée de la Juine, produisent un cresson réputé ; moins d’une dizaine
      de cressiculteurs y travaillent encore.
    en: >-
      Since 1894 the watercress beds of Méréville (Essonne), long parallel trenches fed by spring water
      in the Juine valley, have produced well-known watercress; fewer than ten growers still work them.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00379:
  kind: practice
  summary:
    fr: >-
      Autour de Salers (Cantal), dans les volcans d'Auvergne, le fromage de Salers est fabriqué avec le
      lait des vaches nourries à l'herbe d'estive, autrefois par les vachers dans les burons de montagne,
      aujourd'hui à la ferme ou en coopérative.
    en: >-
      Around Salers (Cantal), in the Auvergne volcanoes, Salers cheese is made from the milk of cows grazing
      summer mountain pastures, once by herdsmen in stone burons and now on farms or in cooperatives.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00380:
  kind: practice
  summary:
    fr: >-
      Dans la Dombes (Ain), la pêche des étangs se pratique depuis près de 800 ans selon un cycle où quelque
      1 200 étangs alternent mise en eau pour les poissons, surtout la carpe, et assec cultivé en céréales
      ; elle repose sur l'entraide entre exploitants.
    en: >-
      In the Dombes (Ain), pond fishing has gone on for nearly 800 years in a cycle where some 1,200 ponds
      alternate between holding fish, mostly carp, and being drained to grow cereals; it relies on mutual
      help among pond keepers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00381:
  kind: practice
  summary:
    fr: >-
      Dans le Haut-Doubs, agriculteurs et charcutiers fument saucisses et salaisons dans le tuyé, grande
      cheminée de bois ou fumoir de pierre des fermes comtoises, au bois de résineux ; les porcs étaient
      traditionnellement nourris au petit-lait des fruitières.
    en: >-
      In the Haut-Doubs, farmers and charcutiers smoke sausages and cured meats in the tuyé, the large
      wooden chimney or stone smokehouse of Franche-Comté farms, over conifer wood; the pigs were traditionally
      fed whey from cheese dairies.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00382:
  kind: practice
  summary:
    fr: >-
      Partout en France, la fête foraine rassemble en plein air manèges, loteries et stands tenus par
      des forains indépendants ; cette communauté itinérante, marquée par les traditions tsiganes, a développé
      une culture propre, organisée autour de ses tournées.
    en: >-
      Across France, the funfair brings together rides, lotteries and stalls run by independent showpeople;
      this travelling community, shaped by Romani traditions, has built a culture of its own around its
      seasonal circuits.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00383:
  kind: practice
  summary:
    fr: >-
      Le mime, art du jeu muet de l'acteur fondé sur le corps et le geste, a été développé en France en
      un art à part entière doté d'une grammaire codifiée au milieu du XXe siècle ; il est aujourd'hui
      transmis par de nombreuses compagnies et écoles.
    en: >-
      Mime, the actor's wordless art of body and gesture, was developed in France into an art form of
      its own with a codified grammar in the mid-20th century; it is now passed on by many companies and
      schools.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00384:
  kind: practice
  summary:
    fr: >-
      Sur les toits de Paris, le couvreur zingueur pose zinc, plomb, cuivre, ardoise et tuile plate ;
      ce métier s'est formé dans la seconde moitié du XIXe siècle, quand le zinc laminé a couvert les
      toits des immeubles haussmanniens, et il s'apprend aujourd'hui en centres de formation.
    en: >-
      On the roofs of Paris, the roofer-zinc worker lays zinc, lead, copper, slate and flat tiles; the
      trade took shape in the later 19th century, when rolled zinc covered Haussmann-era buildings, and
      is now taught in training centres.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00385:
  kind: practice
  summary:
    fr: >-
      Depuis près de 800 ans, la cathédrale de Strasbourg (Bas-Rhin) est entretenue et restaurée par la
      même institution laïque, la Fondation de l'Œuvre Notre-Dame, dont l'atelier transmet les savoir-faire
      de taille de pierre et s'appuie sur des dons et un statut coutumier original.
    en: >-
      For nearly 800 years Strasbourg Cathedral (Bas-Rhin) has been maintained and restored by the same
      lay institution, the Fondation de l'Œuvre Notre-Dame, whose workshop passes on stone-working skills
      and relies on gifts and an unusual customary status.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00386:
  kind: practice
  summary:
    fr: >-
      Sur le lac de Grand-Lieu (Loire-Atlantique), au sud de l'estuaire de la Loire, une petite communauté
      de pêcheurs professionnels, réunie en coopérative depuis 1907, perpétue une pêche pratiquée depuis
      deux millénaires et organise chaque année une fête à Passay.
    en: >-
      On Lake Grand-Lieu (Loire-Atlantique), south of the Loire estuary, a small community of professional
      fishermen, organised as a cooperative since 1907, keeps up a fishery two thousand years old and
      holds a yearly festival at Passay.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00387:
  kind: practice
  summary:
    fr: >-
      À Tahiti et dans les îles de la Société (Polynésie française), le ’ori tahiti réunit danse, percussions,
      chants, art oratoire et costumes ; dansé en groupes de 80 à 200 personnes, il transmet aux jeunes
      l'histoire et les mythes polynésiens.
    en: >-
      In Tahiti and the Society Islands (French Polynesia), ’ori tahiti combines dance, drumming, song,
      oratory and costume; performed in groups of 80 to 200 dancers, it passes Polynesian history and
      myths on to young people.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00388:
  kind: practice
  summary:
    fr: >-
      En Guyane, le long du Maroni et de la Lawa (Papaïchton, Maripasoula, Apatou) et désormais sur le
      littoral, les Aluku pratiquent des musiques dansées où un orchestre de tambours mené par le gaandong
      dialogue avec chanteurs et danseurs portant des sonnailles.
    en: >-
      In French Guiana, along the Maroni and Lawa rivers (Papaïchton, Maripasoula, Apatou) and now on
      the coast, the Aluku perform danced music in which a drum ensemble led by the gaandong interacts
      with singers and dancers wearing rattles.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00390:
  kind: practice
  summary:
    fr: >-
      À La Réunion, le rakontaz zistoir réunit un conteur et son public autour de contes, légendes, proverbes,
      chants et devinettes (sirandane) en créole, avec formules rituelles d'ouverture et de clôture ;
      après un déclin dans les années 1960-1970, la pratique a repris vigueur.
    en: >-
      On Réunion, rakontaz zistoir brings a storyteller and audience together around Creole tales, legends,
      proverbs, songs and riddles (sirandane), framed by ritual opening and closing lines; after a decline
      in the 1960s and 70s it has revived.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00391:
  kind: practice
  summary:
    fr: >-
      À La Réunion, surtout sur la côte sud-est, des femmes souvent réunies en associations tressent les
      feuilles séchées du vacoa (pandanus) pour en faire sacs, paniers et nattes, un savoir-faire né dans
      l'économie de plantation qui mêle influences africaines, malgaches, asiatiques et françaises.
    en: >-
      On Réunion, especially along the south-east coast, women often working in local associations plait
      dried vacoa (pandanus) leaves into bags, baskets and mats, a craft born of the plantation economy
      that blends African, Malagasy, Asian and French influences.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00393:
  kind: practice
  summary:
    fr: >-
      En Lozère, notamment dans les Cévennes et en Margeride, des générations ont aménagé des béals, canaux
      qui conduisent l'eau par simple gravité vers les terrasses, les prés et les moulins ; ces ouvrages,
      encore utilisés, sont aujourd'hui menacés d'abandon.
    en: >-
      In Lozère, notably in the Cévennes and Margeride, generations have built béals, channels carrying
      water by gravity alone to terraces, meadows and mills; still in use, these works are now at risk
      of being abandoned.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00396:
  kind: practice
  summary:
    fr: >-
      La cabrette, ou musette, est une cornemuse auvergnate sans bourdon que le cabrettaïre joue en soliste
      en marquant le rythme du pied ; on la joue en Auvergne et ses environs comme à Paris, où elle fait
      danser les banquets des amicales.
    en: >-
      The cabrette, or musette, is an Auvergne bagpipe without a drone, played solo while the piper beats
      time with the feet; it is heard in Auvergne and nearby regions and in Paris, where it plays for
      dancing at community banquets.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00398:
  kind: practice
  summary:
    fr: >-
      En Soule (Pyrénées-Atlantiques), la danse souletine se transmet dans des écoles de danse de village
      où se croisent les générations, autour de maîtres à danser, anciens danseurs expérimentés qui enseignent
      ce qu'ils ont eux-mêmes appris en adaptant leurs méthodes.
    en: >-
      In Soule (Pyrénées-Atlantiques), Souletin dance is handed down in village dance schools where generations
      meet, led by dance masters, experienced former dancers who teach what they themselves learned while
      adapting their methods.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2017_67717_INV_PCI_FRANCE_00399:
  kind: practice
  summary:
    fr: >-
      En Soule (Pyrénées-Atlantiques), l'Errejent met en scène la pastorale, spectacle chanté, dansé et
      joué en basque par une centaine d'habitants d'un village différent chaque été ; il choisit les acteurs,
      crée les tableaux et guide toute une année de préparation.
    en: >-
      In Soule (Pyrénées-Atlantiques), the Errejent directs the pastorale, a play sung, danced and acted
      in Basque by about a hundred residents of a different village each summer; he casts the actors,
      devises the scenes and leads a year of rehearsals.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00394:
  kind: practice
  summary:
    fr: >-
      La gravure de poinçons typographiques est la première étape de la fabrication des caractères en
      plomb, avant la frappe de la matrice et la fonte ; ce savoir-faire, transmis surtout oralement,
      ne se perpétue plus qu'à l'Imprimerie nationale, qui conserve une importante collection de poinçons
      anciens.
    en: >-
      Punch-cutting is the first step in making lead type, before striking the matrix and casting; passed
      on mostly by word of mouth, this skill now survives only at the Imprimerie nationale, which holds
      a large collection of historic punches.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00397:
  kind: event
  summary:
    fr: >-
      Au Pays basque nord (Labourd et Basse-Navarre), Besta Berri, la Fête-Dieu, est célébrée les deuxième
      et troisième dimanches après la Pentecôte avec messe, procession et danses ; les jeunes hommes y
      défilent en tenue de garde nationale.
    en: >-
      In the northern Basque Country (Labourd and Lower Navarre), Besta Berri, the feast of Corpus Christi,
      is celebrated on the second and third Sundays after Pentecost with Mass, a procession and dances,
      young men parading as a national guard.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00400:
  kind: event
  summary:
    fr: >-
      Dans le Labourd (Pyrénées-Atlantiques), pendant la période de carnaval (Ihauteri), de janvier à
      mars, des groupes de jeunes vont de maison en maison avec danseurs kaskarot, personnages déguisés
      et l'ours (Hartza), une tradition relancée à la fin des années 1970.
    en: >-
      In Labourd (Pyrénées-Atlantiques), during the carnival season (Ihauteri) from January to March,
      groups of young people go from house to house with kaskarot dancers, masked figures and the bear
      (Hartza), a custom revived in the late 1970s.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00401:
  kind: practice
  summary:
    fr: >-
      En Basse-Navarre et en Labourd, la Kabalkada ou Toberak associe un défilé de sauts basques et une
      pièce satirique jouée en basque. Héritée des charivaris qui sanctionnaient les mœurs, elle s'est
      ravivée dans les années 1970 et moque désormais la vie locale.
    en: >-
      In Lower Navarre and Labourd, the Kabalkada or Toberak combines a parade of Basque jumping dances
      with a satirical play in Basque. Descended from charivaris that punished moral lapses, it revived
      in the 1970s and now pokes fun at local life.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00402:
  kind: event
  summary:
    fr: >-
      À Gignac (Hérault), la fête de l'Âne réunit le village autour d'un âne totémique porté par les jeunes
      au jeudi de l'Ascension. Elle inclut le Senibelet, simulacre de combat où trois jeunes hommes rejouent
      la lutte légendaire des Gignacois contre les Sarrasins.
    en: >-
      In Gignac (Hérault), the Donkey festival gathers the village around a totem donkey carried by young
      people on Ascension Thursday. It includes the Senibelet, a mock fight in which three young men re-enact
      the legendary battle of the townspeople against the Saracens.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00403:
  kind: practice
  summary:
    fr: >-
      À La Réunion, les simples ou zerbaz péi désignent les plantes médicinales préparées en tisane, décoction,
      bain ou cataplasme. Ce savoir, nourri des apports africains, malgaches, indiens, chinois et européens,
      se transmet dans les familles et chez les tizanèr.
    en: >-
      On Réunion, "simples" or zerbaz péi are medicinal plants prepared as infusions, decoctions, baths
      or poultices. Drawing on African, Malagasy, Indian, Chinese and European knowledge, the practice
      is handed down within families and by recognised healers, the tizanèr.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00404:
  kind: practice
  summary:
    fr: >-
      Partout en France, des perliers façonnent des perles de verre au chalumeau : le verre fondu est
      enroulé autour d'un mandrin d'acier, puis décoré. Ce métier très ancien connaît un renouveau depuis
      une vingtaine d'années, surtout dans de petits ateliers individuels.
    en: >-
      Across France, bead makers shape glass beads at the torch, winding molten glass around a steel mandrel
      before decorating it. This ancient craft has seen a revival over the past twenty years, mostly in
      small one-person workshops.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00405:
  kind: practice
  summary:
    fr: >-
      Le formaire fabrique la forme, châssis de bois tendu d'un tamis métallique (vergé ou vélin) avec
      lequel le papetier puise la pâte pour faire une feuille à la main. Ce métier presque disparu au
      XXe siècle n'est plus exercé que par une seule artisane en France.
    en: >-
      A mould maker builds the paper mould, a wooden frame fitted with a laid or wove metal screen that
      hand papermakers dip into the vat to form a sheet. The trade nearly vanished in the 20th century;
      only one craftswoman still practises it in France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00407:
  kind: practice
  summary:
    fr: >-
      Dans le Pays de Billom (Puy-de-Dôme), en Limagne, l'ail rose est cultivé en plein champ depuis le
      XIXe siècle, où il a remplacé le chanvre. Des variétés d'ail rose d'Auvergne y ont été mises au
      point ; les producteurs défendent aujourd'hui une culture menacée par la concurrence.
    en: >-
      Around Billom (Puy-de-Dôme), in the Limagne plain, pink garlic has been grown in open fields since
      the 19th century, when it replaced hemp. Auvergne pink garlic varieties were bred for the area;
      growers now defend a crop under pressure from cheap imports.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00408:
  kind: practice
  summary:
    fr: >-
      Dans les monts du Forez (Loire et Puy-de-Dôme), la fourme de Montbrison est un fromage persillé
      au lait de vache, né dans les jasseries d'estive. Elle est égouttée dans des chéneaux d'épicéa et
      retournée d'un quart de tour matin et soir.
    en: >-
      In the Forez mountains (Loire and Puy-de-Dôme), Fourme de Montbrison is a blue cow's-milk cheese
      that originated in summer pasture huts, the jasseries. It is drained in spruce troughs and given
      a quarter turn every morning and evening.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00409:
  kind: practice
  summary:
    fr: >-
      À Apt (Vaucluse), au pied du Luberon, on confit les fruits dans le sucre depuis le Moyen Âge, en
      chaudrons de cuivre ou en étuves. Cerises, abricots, melons ou agrumes deviennent translucides ou
      glacés ; quelques artisans et deux usines entretiennent ce savoir-faire.
    en: >-
      In Apt (Vaucluse), below the Luberon, fruit has been candied in sugar since the Middle Ages, in
      copper pans or drying ovens. Cherries, apricots, melons and citrus become translucent or glazed;
      a few craftspeople and two factories keep the skill alive.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00410:
  kind: practice
  summary:
    fr: >-
      À Fougerolles (Haute-Saône), au pied des Vosges, on distille le kirsch, eau-de-vie de cerise, depuis
      la fin du XVIIIe siècle. Les cerises viennent de prés-vergers de hautes tiges qui associent élevage
      et fruits, et toute une communauté vit autour de la distillation.
    en: >-
      In Fougerolles (Haute-Saône), at the foot of the Vosges, kirsch, a cherry brandy, has been distilled
      since the late 18th century. The fruit comes from tall-tree meadow orchards that combine grazing
      and fruit growing, and a whole community has grown up around distilling.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00411:
  kind: practice
  summary:
    fr: >-
      À Saint-Gilles-Croix-de-Vie (Vendée), une centaine de marins pêchent la sardine, abondante de mai
      à septembre entre l'île d'Yeu et Noirmoutier. La pêche au filet droit, introduite au XVIIe siècle,
      a fait vivre ramendeuses, conserveries et criée.
    en: >-
      In Saint-Gilles-Croix-de-Vie (Vendée), around a hundred fishermen catch sardines, plentiful from
      May to September between the islands of Yeu and Noirmoutier. Drift-net fishing, introduced in the
      17th century, has supported net menders, canneries and the fish auction.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00412:
  kind: practice
  summary:
    fr: >-
      Sur les côtes du Roussillon, du Languedoc, de Provence et de Corse, des pêcheurs, charpentiers et
      associations naviguent encore sous voile latine, voile triangulaire portée par une antenne. Le savoir-faire
      se transmet de main en main, notamment lors de rassemblements.
    en: >-
      Along the coasts of Roussillon, Languedoc, Provence and Corsica, fishermen, boatbuilders and associations
      still sail under the lateen sail, a triangular sail hung from a long yard. The skills pass from
      hand to hand, notably at boat gatherings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00413:
  kind: practice
  summary:
    fr: >-
      Dans toute la France, les boulangers artisanaux fabriquent la baguette en une suite d'étapes, du
      pétrissage au façonnage, à la scarification et à la cuisson. Achetée chaque jour en boulangerie,
      elle tient une place centrale dans la vie quotidienne.
    en: >-
      Throughout France, artisan bakers make the baguette through a sequence of steps, from kneading and
      shaping to scoring and baking. Bought daily at the bakery, it holds a central place in everyday
      life and has inspired festivities and artworks.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00415:
  kind: practice
  summary:
    fr: >-
      La mécanique horlogère réunit les savoirs de la fabrication d'horloges, de montres et de chronomètres.
      En France, elle se concentre dans le Doubs (Besançon et Pays horloger), organisée en petites unités
      spécialisées et liée à l'Arc jurassien suisse.
    en: >-
      Watch and clock mechanics combines the skills needed to make clocks, watches and chronometers. In
      France it is concentrated in the Doubs (Besançon and the Pays horloger), organised in small specialised
      units and closely tied to the Swiss Jura arc.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00416:
  kind: practice
  summary:
    fr: >-
      En Haute-Provence occidentale, le plantain badasson, plante ligneuse, servait de remède à presque
      tout jusqu'aux années 1980. Les usages ruraux ont presque disparu, mais des néo-ruraux l'emploient
      aujourd'hui en baume, surtout pour la peau.
    en: >-
      In western Haute-Provence, badasson plantain, a woody plant, was used as a near cure-all until the
      1980s. The old rural uses have almost vanished, but newcomers to the countryside now prepare it
      as a balm, mainly for skin complaints.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00417:
  kind: practice
  summary:
    fr: >-
      Dans les Alpes-de-Haute-Provence, l'herboristerie, héritière des colporteurs et droguistes du XVIIIe
      siècle, réunit paysans-herboristes, pharmaciens et entreprises. Le diplôme d'herboriste a disparu
      en 1941, mais la recherche ethnobotanique locale nourrit les pratiques.
    en: >-
      In Alpes-de-Haute-Provence, herbalism, heir to the 18th-century pedlars and druggists, brings together
      farmer-herbalists, pharmacists and firms. The herbalist's diploma was abolished in 1941, but local
      ethnobotanical research continues to feed the practice.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00418:
  kind: practice
  summary:
    fr: >-
      Dans les Alpes-de-Haute-Provence, notamment sur le plateau de Valensole et dans le Verdon, on cultive
      lavande fine et lavandin, puis on les coupe et on les distille. Mécanisée depuis les années 1970,
      la culture connaît un renouveau porté par la qualité.
    en: >-
      In Alpes-de-Haute-Provence, especially on the Valensole plateau and in the Verdon, true lavender
      and lavandin are grown, cut and distilled. Mechanised since the 1970s, the crop is enjoying a revival
      built on quality.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00419:
  kind: event
  summary:
    fr: >-
      Dans treize villages du nord-ouest des Bouches-du-Rhône, entre Alpilles et Durance, des fêtes votives
      font défiler une charrette garnie de verdure tirée par une file de chevaux de trait harnachés. Elles
      honorent surtout saint Éloi, saint Roch et saint Jean.
    en: >-
      In thirteen villages of north-western Bouches-du-Rhône, between the Alpilles and the Durance, local
      feasts parade a cart dressed with greenery and drawn by a line of harnessed draught horses. Most
      honour Saint Eligius, Saint Roch or Saint John.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2018_67717_INV_PCI_FRANCE_00427:
  kind: practice
  summary:
    fr: >-
      Depuis la fin du XVIe siècle, les bouquinistes vendent des livres d'occasion à ciel ouvert sur les
      quais de la Seine à Paris, autour du Pont-Neuf. Environ 230 bouquinistes tiennent leurs boîtes sur
      4 km de quais, ouvertes à tous et à petits prix.
    en: >-
      Since the late 16th century, booksellers have sold second-hand books in the open air along the Seine
      embankments in Paris, around the Pont Neuf. Some 230 bouquinistes keep their boxes on 4 km of quays,
      open to all and at low prices.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00426:
  kind: practice
  summary:
    fr: >-
      En Île-de-France, notamment à Paris et à Villeneuve-Saint-Georges, la communauté géorgienne transmet
      les danses folkloriques de Géorgie. Chaque région a ses danses propres, comme le Kartuli ou le Khorumi,
      avec costumes, musiques et chants associés.
    en: >-
      In Île-de-France, notably in Paris and Villeneuve-Saint-Georges, the Georgian community passes on
      Georgia's folk dances. Each region has its own, such as the Kartuli or the Khorumi, with their own
      costumes, music and songs.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00428:
  kind: practice
  summary:
    fr: >-
      Verriers à la main, au chalumeau et décorateurs perpétuent en France des gestes de mise en forme
      et de décor du verre, à chaud comme à froid, hérités de techniques très anciennes. Ces gestes ne
      s'acquièrent que par une longue pratique, ce qui rend leur transmission difficile.
    en: >-
      Glassblowers, lampworkers and glass decorators in France keep up hot and cold techniques for shaping
      and decorating glass inherited from very old traditions. The gestures are learned only through long
      practice, which makes passing them on a challenge.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00431:
  kind: practice
  summary:
    fr: >-
      À Saint-Jean-Pla-de-Corts, la dernière briqueterie active des Pyrénées-Orientales produit de façon
      semi-artisanale une centaine de modèles de terre cuite. Elle a relancé le cayrou, grande brique
      du bâti catalan, cuit dans un four Hoffmann.
    en: >-
      In Saint-Jean-Pla-de-Corts, the last working brickworks in Pyrénées-Orientales makes about a hundred
      kinds of terracotta in a semi-artisanal way. It revived the cayrou, the large brick typical of Catalan
      buildings, fired in a Hoffmann kiln.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00433:
  kind: practice
  summary:
    fr: >-
      En Île-de-France, la diaspora portugaise fait vivre le fado, chant urbain né à Lisbonne au XIXe
      siècle qui unit musique, chant et poésie. Il est traditionnellement chanté par une voix seule accompagnée
      de deux guitares, dont la guitare portugaise.
    en: >-
      In Île-de-France, the Portuguese diaspora keeps fado alive, an urban song born in 19th-century Lisbon
      that blends music, singing and poetry. It is traditionally performed by a solo voice with two guitars,
      one of them the Portuguese guitar.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00434:
  kind: practice
  summary:
    fr: >-
      Le boutis, ou broderie de Marseille, donne du relief au tissu : deux étoffes sont piquées ensemble
      selon un motif, puis des mèches de coton glissées entre elles remplissent les formes. Né en Provence,
      il est aujourd'hui transmis surtout par des associations.
    en: >-
      Boutis, or Marseille embroidery, gives fabric relief: two layers are stitched together along a design,
      then cotton cords are pushed between them to fill the shapes. Born in Provence, it is now passed
      on mainly through associations across France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00435:
  kind: practice
  summary:
    fr: >-
      Dans le Luberon (Vaucluse et Alpes-de-Haute-Provence), des agriculteurs remettent en culture des
      variétés anciennes de blé, adaptées aux sols caillouteux et à la sécheresse. Des filières sont nées
      autour du petit épeautre puis du blé meunier d'Apt.
    en: >-
      In the Luberon (Vaucluse and Alpes-de-Haute-Provence), farmers are bringing back old wheat varieties
      suited to stony soils and drought. Local supply chains have grown up around einkorn and then the
      Apt miller's wheat.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00436:
  kind: practice
  summary:
    fr: >-
      Dans le golfe du Morbihan, la pêche à la palourde, longtemps vivrière et pratiquée surtout par des
      femmes de Séné, s'est professionnalisée dans les années 1990. Elle se pratique à pied sur les vasières,
      en plongée ou à la drague.
    en: >-
      In the Gulf of Morbihan, clam fishing, long done for food, mostly by women from Séné, became a profession
      in the 1990s. It is carried out on foot on the mudflats, by diving or from boats with a dredge.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00437:
  kind: practice
  summary:
    fr: >-
      En Île-de-France, notamment à Château-d'Eau et à la Goutte-d'Or à Paris, des coiffeurs entretiennent
      et coiffent les cheveux crépus selon des techniques d'origine africaine. Le tressage, jadis signe
      d'appartenance ou d'étape de vie, reste au cœur de la pratique.
    en: >-
      In Île-de-France, notably in the Château-d'Eau and Goutte-d'Or districts of Paris, hairdressers
      care for and style afro-textured hair using techniques of African origin. Braiding, once a sign
      of identity or life stage, remains at its heart.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00438:
  kind: practice
  summary:
    fr: >-
      Dans les monts Dore et le Cézallier (Puy-de-Dôme et Cantal), de petites fermes fabriquent le Saint-Nectaire
      fermier, fromage à pâte pressée non cuite au lait cru de vache. Il est affiné au moins 28 jours
      en cave.
    en: >-
      In the Monts Dore and Cézallier (Puy-de-Dôme and Cantal), small farms make farmhouse Saint-Nectaire,
      an uncooked pressed cheese from raw cow's milk. It is ripened in a cellar for at least 28 days.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00439:
  kind: practice
  summary:
    fr: >-
      Dans le Domfrontais (Orne), entre Normandie et Bretagne, une vingtaine de producteurs font le poiré,
      boisson pétillante issue de la fermentation de poires à poiré. Les fruits viennent de grands poiriers
      de haute tige plantés dans des prés-vergers.
    en: >-
      In the Domfrontais (Orne), between Normandy and Brittany, around twenty producers make perry, a
      sparkling drink from fermented perry pears. The fruit comes from tall pear trees planted in grazed
      meadow orchards.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00440:
  kind: practice
  summary:
    fr: >-
      À Châteauneuf-du-Pape (Vaucluse), quelque 320 vignerons indépendants élaborent un vin pouvant assembler
      dix-huit cépages, sur des terrasses de galets roulés exposées au mistral. Le vignoble s'est développé
      au XIVe siècle autour de la résidence d'été des papes.
    en: >-
      In Châteauneuf-du-Pape (Vaucluse), some 320 independent winegrowers make a wine that may blend eighteen
      grape varieties, on terraces of rounded pebbles swept by the mistral. The vineyard grew up in the
      14th century around the popes' summer residence.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00441:
  kind: practice
  summary:
    fr: >-
      À Cancale (Ille-et-Vilaine), face au Mont-Saint-Michel, une trentaine d'entreprises élèvent des
      huîtres plates et creuses sur 500 ha de parcs, au rythme des grandes marées. L'huître plate indigène,
      draguée autrefois, a fait la réputation de la ville.
    en: >-
      In Cancale (Ille-et-Vilaine), facing Mont-Saint-Michel, some thirty businesses farm flat and cupped
      oysters on 500 ha of beds, following the great tides. The native flat oyster, once dredged from
      the bay, made the town's name.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00443:
  kind: practice
  summary:
    fr: >-
      La cuisine du pays niçois (Alpes-Maritimes) compte plus de deux cents recettes tirées de la mer
      et de la montagne, à base de blettes, courgettes rondes ou basilic. Elle mêle apports ligures, piémontais
      et provençaux, comme le stockfish.
    en: >-
      The cooking of the Nice area (Alpes-Maritimes) counts over two hundred recipes from both sea and
      mountain, using chard, round courgettes or basil. It blends Ligurian, Piedmontese and Provençal
      influences, as in the local stockfish dishes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00444:
  kind: practice
  summary:
    fr: >-
      Né à Lunéville (Meurthe-et-Moselle) au début du XIXe siècle, le point de Lunéville est une broderie
      au point de chaînette faite au crochet sur tulle. Vers 1865 en est issue la broderie perlée et pailletée,
      encore utilisée par la haute couture.
    en: >-
      Developed in Lunéville (Meurthe-et-Moselle) in the early 19th century, Lunéville stitch is a chain-stitch
      embroidery worked with a hook on tulle. Around 1865 it gave rise to bead and sequin embroidery,
      still used in haute couture.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00445:
  kind: event
  summary:
    fr: >-
      Dans plusieurs communes drômoises de la vallée du Rhône, les fêtes des bouviers et des laboureurs
      se tiennent chaque année de janvier à avril, sur deux à cinq jours. Elles gardent leurs « rois »,
      la bénédiction du pain, des corsos et un banquet.
    en: >-
      In several Drôme towns of the Rhône valley, the ploughmen's and oxherds' festivals take place each
      year between January and April, lasting two to five days. They keep their "kings", the blessing
      of bread, parades and a banquet.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00446:
  kind: practice
  summary:
    fr: >-
      Les maréchaux-ferrants de la Garde républicaine, à Paris, entretiennent les savoir-faire de la maréchalerie
      militaire hérités de l'école de Saumur. Ils sont les gardiens de la forge à trois marteaux et de
      la ferrure à la française.
    en: >-
      The farriers of the Republican Guard in Paris keep up military farriery skills inherited from the
      Saumur school. They act as a living repository of three-hammer forging and French-style shoeing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00448:
  kind: event
  summary:
    fr: >-
      En basse vallée du Rhône, des fêtes de la vigne et du vin rassemblent confréries, vignerons et public.
      La fiche décrit la fête de la Souche à Villeneuve-lès-Avignon, la fête des Vins de Vacqueyras et
      la fête de la Véraison à Châteauneuf-du-Pape.
    en: >-
      In the lower Rhône valley, wine and vine festivals bring together brotherhoods, winegrowers and
      visitors. The record describes the Souche festival in Villeneuve-lès-Avignon, the Vacqueyras wine
      festival and the Véraison festival in Châteauneuf-du-Pape.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2019_67717_INV_PCI_FRANCE_00451:
  kind: practice
  summary:
    fr: >-
      Dans le Pays d'Olmes (Ariège), on fabrique des peignes de toilette en corne naturelle en trois temps
      : découpe de la corne, profilage, polissage. Jadis très répandue, cette fabrication ne compte plus
      qu'un seul peignier en activité.
    en: >-
      In the Pays d'Olmes (Ariège), toilet combs are made from natural horn in three stages: cutting the
      horn, shaping the teeth and polishing. Once a widespread industry, it now has only one working comb
      maker.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00452:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie et Haute-Savoie), la chèvre, longtemps animal d'appoint dont le
      lait servait aux fromages familiaux, est désormais élevée pour elle-même. Une trentaine de chevriers
      réinventent les recettes fromagères traditionnelles.
    en: >-
      In the Bauges massif (Savoie and Haute-Savoie), the goat, long a sideline whose milk went into family
      cheeses, is now raised in its own right. Some thirty goat farmers are reinventing traditional cheese
      recipes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00453:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie), la rissole ou r'zoule est un chausson de pâte feuilletée fourré
      de compote de fruits locaux, préparé en famille. Elle accompagne les fêtes d'hiver, les fêtes de
      village et les grands moments de la vie.
    en: >-
      In the Bauges massif (Savoie), the rissole or r'zoule is a puff-pastry turnover filled with local
      fruit compote, made at home. It is shared at winter feasts, village festivals and family milestones.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00454:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie et Haute-Savoie), habitants et associations rallument les fours
      à pain de village pour cuire ensemble. La pratique mobilise le levain, le pétrissage, la préparation
      du petit bois de chauffe et la conduite de la cuisson.
    en: >-
      In the Bauges massif (Savoie and Haute-Savoie), residents and local groups relight village bread
      ovens to bake together. The practice involves sourdough, kneading, gathering kindling to heat the
      oven and managing the bake.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00455:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie et Haute-Savoie), habitants et cueilleurs récoltent plantes sauvages,
      fleurs, racines et champignons pour des salades, soupes, tisanes ou liqueurs. Une filière professionnelle
      de plantes aromatiques et médicinales s'y est installée.
    en: >-
      In the Bauges massif (Savoie and Haute-Savoie), residents and pickers gather wild plants, flowers,
      roots and mushrooms for salads, soups, herbal teas and liqueurs. A professional aromatic and medicinal
      plant sector has also grown up there.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00456:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie et Haute-Savoie), plus de 350 apiculteurs, surtout de petits producteurs,
      entretiennent environ 3 000 ruches au fil des saisons. Leur pratique repose sur l'observation attentive
      des essaims et de la flore de montagne.
    en: >-
      In the Bauges massif (Savoie and Haute-Savoie), over 350 beekeepers, mostly small producers, tend
      some 3,000 hives through the seasons. Their practice rests on close observation of the colonies
      and of the mountain flora.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00457:
  kind: practice
  summary:
    fr: >-
      Dans le massif des Bauges (Savoie et Haute-Savoie), le potager familial rythme l'année, des semis
      de printemps aux récoltes d'automne ; l'hiver venu, on « rentre le jardin à la cave », où choux,
      blettes ou salades replantés en bassines continuent de nourrir la maison.
    en: >-
      In the Bauges massif (Savoie and Haute-Savoie), the family kitchen garden sets the pace of the year,
      from spring sowing to autumn harvest; in winter the garden "goes into the cellar", where cabbages,
      chard or lettuces replanted in tubs keep feeding the household.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00458:
  kind: practice
  summary:
    fr: >-
      Les gavottes forment une famille de danses traditionnelles de Basse-Bretagne, en ronde, en chaîne
      ou en cortège de couples ; on les danse aujourd'hui en fest-noz, au son du kan ha diskan chanté
      a cappella, du couple biniou-bombarde, de la clarinette ou de l'accordéon.
    en: >-
      The gavottes are a family of traditional dances from Lower Brittany, performed in rings, chains
      or processions of couples; today they are danced at fest-noz to kan ha diskan call-and-response
      singing, bagpipe and bombarde pairs, clarinet or accordion.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00459:
  kind: practice
  summary:
    fr: >-
      Les émailleurs sur métal posent poudres ou barbotines colorées sur un support d'or, d'argent, de
      cuivre ou d'acier, puis cuisent la pièce à plusieurs reprises ; ce savoir-faire hérité de l'Antiquité
      se pratique à Limoges, dans le Jura, à Paris et dans des ateliers dispersés.
    en: >-
      Enamellers apply coloured powders or slips to gold, silver, copper or steel and fire the piece several
      times; this craft, known since Antiquity, is practised in Limoges, the Jura, Paris and in scattered
      workshops across France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00460:
  kind: practice
  summary:
    fr: >-
      Héritières des pèlerinages médiévaux, les marches vers le Mont Saint-Michel (Manche) se poursuivent
      aujourd'hui sous des formes spirituelles, culturelles, sportives ou touristiques, souvent par la
      traversée à pied de la baie jusqu'au rocher.
    en: >-
      Heirs to medieval pilgrimages, journeys on foot to Mont Saint-Michel (Manche) continue today in
      spiritual, cultural, sporting or tourist forms, often including the walk across the bay to the rock.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00461:
  kind: practice
  summary:
    fr: >-
      En Bretagne, graines et huile de lin et de chanvre servent depuis longtemps à soigner hommes et
      animaux, surtout pour les troubles digestifs et cutanés ; transmis en famille, ces remèdes reculent,
      mais suscitent un regain d'intérêt avec l'herboristerie.
    en: >-
      In Brittany, linseed, hempseed and their oils have long been used to treat people and animals, mainly
      for digestive and skin complaints; handed down in families, these remedies are fading but draw renewed
      interest through herbalism.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00462:
  kind: practice
  summary:
    fr: >-
      Dans les Landes, le Gers et la Gascogne voisine, la course landaise oppose dans les arènes des villages
      des écarteurs et sauteurs à des vaches sauvages qu'ils esquivent par un pivot ou un saut, au son
      des bandas lors des fêtes locales.
    en: >-
      In the Landes, the Gers and neighbouring Gascony, the course landaise pits dodgers and leapers against
      wild cows in village arenas, evading each charge with a pivot or a jump, to the sound of brass bandas
      at local festivals.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00463:
  kind: practice
  summary:
    fr: >-
      Aux îles Marquises (Polynésie française), le matatiki est un répertoire de motifs graphiques gravés
      ou sculptés sur pierre, bois, nacre ou bambou, tatoués sur la peau ou peints sur le tapa ; ses noms
      et significations relient les Marquisiens à leurs ancêtres.
    en: >-
      In the Marquesas Islands (French Polynesia), matatiki is a repertoire of graphic motifs carved on
      stone, wood, mother-of-pearl or bamboo, tattooed on skin or applied to bark cloth; their names and
      meanings link Marquesans to their ancestors.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00464:
  kind: practice
  summary:
    fr: >-
      À La Réunion, le séga réunit musique, chant en créole et danse de couple au balancement des hanches,
      sur un rythme qui mêle binaire et ternaire ; il anime les fêtes de famille comme les bals et concerts
      publics.
    en: >-
      On Réunion, séga combines music, songs in Creole and a hip-swaying couple dance, on a rhythm that
      blends duple and triple time; it livens up family celebrations as well as public dances and concerts.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00465:
  kind: practice
  summary:
    fr: >-
      En France, une poignée d'éventaillistes, à Paris et en région, montent la feuille d'éventail en
      papier, soie, plumes ou dentelle sur sa monture et restaurent des pièces anciennes, en s'appuyant
      sur peintres, graveurs, plumassiers et tabletiers.
    en: >-
      In France a handful of fan makers, in Paris and the regions, mount fan leaves of paper, silk, feathers
      or lace on their sticks and restore old fans, working with painters, engravers, featherworkers and
      sticks makers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00466:
  kind: practice
  summary:
    fr: >-
      En Charente et Charente-Maritime, le cognac naît d'un vin de base distillé deux fois en alambic
      charentais, puis vieilli et assemblé ; ce savoir-faire collectif, transmis depuis le XVIIe siècle,
      unit vignerons, distillateurs, maîtres de chai et négociants.
    en: >-
      In Charente and Charente-Maritime, cognac is made from a base wine double-distilled in a Charentais
      pot still, then aged and blended; this collective know-how, passed on since the 17th century, links
      growers, distillers, cellar masters and merchants.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00467:
  kind: event
  summary:
    fr: >-
      En Bretagne historique, quelque 2 000 pardons honorent chaque année un saint local, surtout entre
      Pâques et la Toussaint, avec un pic autour du 15 août : messe, procession souvent jusqu'à une fontaine,
      parfois en mer ou en circuit (troménie), puis fête profane.
    en: >-
      Across historic Brittany some 2,000 pardons honour a local saint each year, mostly between Easter
      and All Saints' Day and peaking around 15 August: a Mass, a procession often to a spring, sometimes
      at sea or on a circuit (troménie), then a secular fête.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00472:
  kind: event
  summary:
    fr: >-
      À Bayonne (Pyrénées-Atlantiques), la coutume des bœufs gras, attestée depuis 1289 et jadis liée
      au Jeudi gras, survit sous forme d'exposition : un samedi matin de fin d'hiver, une boucherie présente
      dans la rue des bœufs lavés, brossés et ornés de cocardes.
    en: >-
      In Bayonne (Pyrénées-Atlantiques), the fatted-ox custom, recorded since 1289 and once tied to Fat
      Thursday, survives as a street display: on a Saturday morning in late winter a butcher's shop shows
      oxen that are washed, brushed and decked with rosettes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00473:
  kind: event
  summary:
    fr: >-
      En Basse-Navarre et dans quelques villages du Labourd, le carnaval se fête en deux temps : Santibate,
      cortège nocturne de zirtzil dépenaillés chantant avec un improvisateur, figure l'hiver ; Libertimendua,
      fête diurne de danseurs et de théâtre satirique, annonce le printemps.
    en: >-
      In Lower Navarre and a few Labourd villages, carnival comes in two parts: Santibate, a night procession
      of ragged masked zirtzil singing with an improvising bertsulari, stands for winter; Libertimendua,
      a daytime fête of dancers and satirical theatre, heralds spring.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00475:
  kind: event
  summary:
    fr: >-
      Au Pays basque nord, Zan Pantzar, figure du carnaval jouée par un acteur ou un mannequin, est promené,
      jugé puis condamné un samedi de la période grasse ou le soir du Mardi gras, comme à Ustaritz ; la
      farce marque le passage de l'hiver au Carême.
    en: >-
      In the French Basque Country, Zan Pantzar, the carnival figure played by an actor or a dummy, is
      paraded, tried and condemned on a Saturday before Lent or, as in Ustaritz, on Shrove Tuesday evening,
      a farce marking the shift from winter to Lent.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00477:
  kind: practice
  summary:
    fr: >-
      Dans les Landes, le Gers et le Lot-et-Garonne, l'armagnac est tiré d'un vin blanc de cépages comme
      la folle blanche ou le baco, distillé en une seule chauffe dans un alambic à colonne propre à la
      région, puis vieilli de longues années en fût de chêne.
    en: >-
      In the Landes, Gers and Lot-et-Garonne, armagnac is made from white wine of grapes such as Folle
      blanche or Baco, distilled in a single pass through a column still specific to the region, then
      aged for many years in oak casks.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00478:
  kind: practice
  summary:
    fr: >-
      Autour de Lalbenque (Lot), sur les causses calcaires, on cultive la truffe noire au pied de chênes
      truffiers ; repérée grâce au « brûlé » sans herbe autour de l'arbre, elle est cavée au flair d'un
      chien ou d'une truie, puis vendue sur le marché de la commune.
    en: >-
      Around Lalbenque (Lot), on limestone plateaux, black truffles are grown at the foot of truffle oaks;
      spotted by the bare "burnt" patch around the tree, they are dug up with the help of a trained dog
      or sow and sold at the village market.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00480:
  kind: practice
  summary:
    fr: >-
      En Île-de-France, des associations péruviennes font vivre la marinera, danse de séduction en couple
      où les partenaires, sans jamais se toucher, s'approchent et s'éloignent au son de la guitare et
      du cajón, en costumes des régions du Pérou.
    en: >-
      In the Île-de-France region, Peruvian associations keep up the marinera, a couple's courtship dance
      in which partners approach and draw apart without ever touching, to guitar and cajón, wearing costumes
      from different Peruvian regions.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00481:
  kind: practice
  summary:
    fr: >-
      En France, notamment dans le Lot, l'Aveyron, la Normandie ou le Maine-et-Loire, agriculteurs, tisserands
      et associations relancent la culture et la transformation du chanvre textile, dont le teillage en
      fibre longue et fine reste l'étape la plus délicate à mécaniser.
    en: >-
      Across France, notably in the Lot, Aveyron, Normandy and Maine-et-Loire, farmers, weavers and associations
      are reviving the growing and processing of textile hemp, where scutching the stems into long, fine
      fibre remains the hardest step to mechanise.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00482:
  kind: practice
  summary:
    fr: >-
      À Pénestin (Morbihan), dans l'estuaire de la Vilaine, une trentaine d'entreprises élèvent la moule
      sur des bouchots, alignements de pieux plantés dans l'estran depuis la fin du XIXe siècle, le long
      d'un littoral partagé avec la pêche à pied et le tourisme.
    en: >-
      At Pénestin (Morbihan), in the Vilaine estuary, some thirty firms farm mussels on bouchots, rows
      of wooden stakes driven into the foreshore since the late 19th century, along a coast shared with
      shore fishing and tourism.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00483:
  kind: practice
  summary:
    fr: >-
      Le système Conté, présenté en 1931, note les mouvements du corps sur une portée comparable à la
      partition musicale ; danseurs, chorégraphes, enseignants et chercheurs l'utilisent en France pour
      écrire, lire et transmettre la danse comme le geste sportif.
    en: >-
      The Conté system, made public in 1931, records body movement on a stave much like a musical score;
      dancers, choreographers, teachers and researchers in France use it to write down, read and pass
      on dance as well as sporting gestures.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00484:
  kind: practice
  summary:
    fr: >-
      La frivolité est une dentelle nouée faite à la navette, à l'aiguille ou au crochet : des anneaux
      et arceaux de nœuds sur un fil, ornés de picots ou de perles, donnent bordures, napperons et bijoux
      ; ses pratiquants, dispersés en France, apprennent souvent seuls.
    en: >-
      Tatting is a knotted lace made with a shuttle, needle or crochet hook: rings and arches of knots
      on a thread, set off with picots or beads, form edgings, doilies and jewellery; its practitioners,
      scattered across France, often learn on their own.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00485:
  kind: practice
  summary:
    fr: >-
      À Aubusson et Felletin (Creuse), les lissiers tissent à la main sur des métiers de basse lisse des
      tapisseries d'après les cartons d'artistes, en choisissant laines et couleurs ; filateurs, teinturiers
      et ateliers y forment depuis plus de cinq siècles une filière complète.
    en: >-
      In Aubusson and Felletin (Creuse), weavers work tapestries by hand on low-warp looms from artists'
      cartoons, choosing wools and colours themselves; spinners, dyers and workshops have formed a complete
      production chain there for over five centuries.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00487:
  kind: practice
  summary:
    fr: >-
      Dans le bassin de l'Adour (Landes, Pyrénées-Atlantiques), des pêcheurs amateurs riverains fabriquent
      eux-mêmes nasses, cordeaux, carrelets et éperviers ; tendus le soir et relevés à l'aube, ces engins
      servent une pêche de loisir encadrée chaque année par arrêté préfectoral.
    en: >-
      In the Adour basin (Landes, Pyrénées-Atlantiques), amateur fishers living along the rivers make
      their own fish traps, set lines, lift nets and cast nets; set at dusk and raised at dawn, they serve
      a leisure fishery regulated each year by prefectoral order.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00488:
  kind: practice
  summary:
    fr: >-
      Sur l'île de Marie-Galante (Guadeloupe), les « chan a chari » sont des chants de labour a cappella
      en créole : un commandeur lance le chant, les répondeurs lui répondent, pour rythmer l'effort et
      guider les bœufs ; la pratique ne repose plus que sur quelques agriculteurs âgés.
    en: >-
      On the island of Marie-Galante (Guadeloupe), "chan a chari" are a cappella ploughing songs in Creole:
      a lead singer calls and a chorus of men replies, pacing the work and guiding the oxen; the practice
      now rests on a handful of elderly farmers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00493:
  kind: practice
  summary:
    fr: >-
      À Ouvéa, dans les îles Loyauté (Nouvelle-Calédonie), le seloo est un chant polyphonique a cappella,
      le plus souvent à quatre voix d'hommes, aux harmonies réputées « dissonantes » ; chanté en toutes
      circonstances, il porte les langues iaai et fagauvea.
    en: >-
      On Ouvéa, in the Loyalty Islands (New Caledonia), the seloo is an a cappella polyphonic song, usually
      for four male voices, known for its "dissonant" harmonies; sung on any occasion, it carries the
      Iaai and Fagauvea languages.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2020_67717_INV_PCI_FRANCE_00494:
  kind: practice
  summary:
    fr: >-
      À Lifou, dans les îles Loyauté (Nouvelle-Calédonie), l'anethem est un chant religieux mixte à quatre
      voix, introduit par les missionnaires protestants vers 1840 et noté en tonic sol-fa ; chanté entre
      les lectures du culte, il accompagne aussi des événements coutumiers.
    en: >-
      On Lifou, in the Loyalty Islands (New Caledonia), the anethem is a four-part mixed-voice hymn brought
      by Protestant missionaries around 1840 and written in tonic sol-fa; sung between Bible readings,
      it also accompanies customary events.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00489:
  kind: practice
  summary:
    fr: >-
      Dans le Briançonnais (Hautes-Alpes), un réseau de canaux creusés dès le Moyen Âge conduit par gravité
      l'eau des torrents vers champs et jardins ; des associations syndicales de propriétaires l'entretiennent
      et le gèrent encore, au bénéfice des nappes et du paysage.
    en: >-
      In the Briançonnais (Hautes-Alpes), a network of channels dug from the Middle Ages carries mountain
      water by gravity to fields and gardens; landowners' associations still maintain and manage it, which
      also helps recharge groundwater and keep the landscape green.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00490:
  kind: practice
  summary:
    fr: >-
      De la Vilaine à l'Adour, environ 3 000 pêcheurs pratiquent le carrelet : un filet carré, sans appât,
      est descendu dans l'eau puis remonté au treuil depuis une plate-forme sur pilotis, souvent dotée
      d'une cabane devenue emblème des paysages d'estuaire.
    en: >-
      From the Vilaine to the Adour, about 3,000 people fish with the carrelet: a square net, used without
      bait, is lowered into the water and winched back up from a platform on stilts, often with a hut
      that has become a landmark of estuary landscapes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00491:
  kind: practice
  summary:
    fr: >-
      Une trentaine de festivals de tango argentin se tiennent chaque année dans presque toutes les régions
      de France, réunissant milongas, concerts, cours, spectacles et conférences ; nés du renouveau du
      tango depuis les années 1980, ils restent fragiles financièrement.
    en: >-
      Some thirty Argentine tango festivals take place each year in nearly every region of France, combining
      milongas, concerts, classes, shows and talks; born of the tango revival since the 1980s, they remain
      financially fragile.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00492:
  kind: practice
  summary:
    fr: >-
      Partout en France, les milongas sont des bals consacrés à la danse et à l'écoute du tango argentin,
      animés par un DJ spécialisé et parfois des musiciens ; développées depuis les années 1990, elles
      sont le principal lieu de pratique hors des cours.
    en: >-
      Across France, milongas are dance evenings devoted to dancing and listening to Argentine tango,
      led by a specialist DJ and sometimes live musicians; growing since the 1990s, they are the main
      place to dance tango outside classes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00495:
  kind: practice
  summary:
    fr: >-
      En Basse-Loire, entre Nantes et Saint-Nazaire, apiculteurs amateurs et professionnels tirent parti
      des marais et de leur flore mellifère, parfois en transhumance ; les plantes des zones humides servaient
      aussi aux vanniers « huchiers » qui tressaient des ruches.
    en: >-
      In the Lower Loire, between Nantes and Saint-Nazaire, amateur and professional beekeepers rely on
      the marshes and their nectar-rich plants, sometimes moving hives seasonally; wetland plants were
      also woven into hives by local basket-makers.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00496:
  kind: event
  summary:
    fr: >-
      À Dunkerque (Nord), huit danseurs en blanc et bleu, reliés par leurs épées en ronde, enchaînent
      des figures au son des fifres et tambours sur la place Jean-Bart, le deuxième dimanche après le
      mardi gras ; recréée en 1990, la danse se rattache aux danses d'épées européennes.
    en: >-
      In Dunkirk (Nord), eight dancers in white and blue, linked in a ring by their swords, perform a
      sequence of figures to fifes and drums on the Place Jean-Bart on the second Sunday after Shrove
      Tuesday; revived in 1990, it belongs to Europe's sword-dance tradition.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00497:
  kind: practice
  summary:
    fr: >-
      Dans l'estuaire de la Loire, entre Nantes et Saint-Nazaire, pêcheurs amateurs et professionnels
      ciblent surtout les poissons migrateurs (anguille, alose, lamproie) avec bosses, nacelles, bignées
      ou tamis à civelle, des pêches liées à la vannerie et à la charpenterie de marine.
    en: >-
      In the Loire estuary, between Nantes and Saint-Nazaire, amateur and professional fishers mainly
      target migratory fish such as eel, shad and lamprey, using traps, dip nets or glass-eel sieves,
      fisheries closely tied to basketry and boatbuilding.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00498:
  kind: practice
  summary:
    fr: >-
      Dans les Pyrénées centrales, du Béarn au Comminges, « las bonas èrbas » désignent les plantes cueillies
      pour soigner : tisanes, macérations, liqueurs ou bains aromatiques, une médecine populaire longtemps
      associée aux stations thermales et entretenue par cueilleurs, herboristes et botanistes.
    en: >-
      In the central Pyrenees, from Béarn to Comminges, "las bonas èrbas" (the good herbs) are plants
      gathered for healing: herbal teas, macerations, liqueurs or aromatic baths, a folk medicine long
      linked to spa towns and kept up by gatherers, herbalists and botanists.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00499:
  kind: practice
  summary:
    fr: >-
      Partout en France, dans de petits ateliers, des carrossiers-restaurateurs remettent en forme à la
      main les tôles des automobiles anciennes, avec des gestes peu changés depuis le début du XXe siècle
      ; le métier figure parmi les métiers d'art depuis 2014.
    en: >-
      Throughout France, in small workshops, coachbuilder-restorers shape the metal bodywork of vintage
      cars by hand, with techniques little changed since the early 20th century; the trade has been on
      the official list of craft professions since 2014.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00500:
  kind: practice
  summary:
    fr: >-
      Dans l'ancien pays de Cocagne, entre Albi, Carcassonne et Toulouse, des teinturiers ont relancé
      depuis les années 1970 la teinture au pastel : le bleu, invisible dans la feuille, n'apparaît qu'après
      macération, fermentation et oxydation, et l'on obtient aussi verts et violets.
    en: >-
      In the former Pays de Cocagne, between Albi, Carcassonne and Toulouse, dyers have revived woad dyeing
      since the 1970s: the blue, invisible in the leaf, appears only after steeping, fermentation and
      oxidation, and greens and purples can also be obtained.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00501:
  kind: practice
  summary:
    fr: >-
      Dans les Bouches-du-Rhône, autour d'Aubagne, Marseille et Aix-en-Provence, les santonniers sculptent,
      moulent, cuisent et peignent les figurines de la crèche provençale ; appris à l'atelier, le métier
      invente chaque année de nouveaux sujets à partir d'un « moule-mère ».
    en: >-
      In the Bouches-du-Rhône, around Aubagne, Marseille and Aix-en-Provence, santon makers sculpt, mould,
      fire and paint the small figures of the Provençal crib; learnt in the workshop, the craft creates
      new figures every year from a master mould.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00502:
  kind: practice
  summary:
    fr: >-
      Sur la côte française de la Méditerranée, Corse comprise, les trente-trois prud'homies de pêche,
      d'origine médiévale, réunissent les pêcheurs artisans d'un secteur ; leurs prud'hommes élus tirent
      au sort les postes de pêche, jugent les litiges et veillent au partage de la ressource.
    en: >-
      Along France's Mediterranean coast, Corsica included, thirty-three fishing prud'homies of medieval
      origin bring together the small-scale fishers of each area; their elected officers draw fishing
      spots by lot, settle disputes and see that marine resources are shared fairly.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00503:
  kind: practice
  summary:
    fr: >-
      En Brenne (Indre), « pays des mille étangs » façonné depuis le Moyen Âge, la pisciculture élève
      surtout la carpe : reproduction des poissons, gestion de l'eau d'un étang à l'autre, entretien des
      digues et pêches d'étang forment un savoir-faire qui modèle le paysage.
    en: >-
      In the Brenne (Indre), the "land of a thousand ponds" shaped since the Middle Ages, fish farmers
      mainly raise carp: breeding the fish, moving water from pond to pond, maintaining dykes and holding
      pond harvests make up know-how that shapes the landscape.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00504:
  kind: practice
  summary:
    fr: >-
      En Bretagne, broderie et dentelle se mêlent souvent dans un même ouvrage, des costumes traditionnels
      aux ornements liturgiques et aux tenues actuelles ; transmises par des cours et des stages, ces
      techniques attirent un nombre croissant d'apprenants.
    en: >-
      In Brittany, embroidery and lace are often combined in a single piece, from traditional costumes
      to church vestments and modern clothing; passed on through classes and workshops, these techniques
      draw a growing number of learners.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00505:
  kind: practice
  summary:
    fr: >-
      En Loire-Atlantique, quelque 320 pêcheurs amateurs aux engins et aux filets pêchent sur la Loire
      en amont de l'estuaire, l'Erdre ou la Sèvre nantaise, surtout anguille, alose et lamproie ; leur
      pratique, liée à la vannerie et à la batellerie, peine à se renouveler.
    en: >-
      In Loire-Atlantique, some 320 amateur fishers using traps and nets work the Loire above its estuary,
      the Erdre and the Sèvre Nantaise, mainly for eel, shad and lamprey; their practice, linked to basketry
      and boatbuilding, struggles to attract younger people.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2021_67717_INV_PCI_FRANCE_00506:
  kind: practice
  summary:
    fr: >-
      En Normandie, dans le Nord et en Île-de-France, agriculteurs, teilleurs, fileurs et tisserands forment
      une chaîne de savoirs qui mène du lin cultivé et roui à l'étoffe ; la filière, fragilisée par la
      désindustrialisation, cherche à relancer filatures et tissages en France.
    en: >-
      In Normandy, northern France and the Île-de-France, growers, scutchers, spinners and weavers share
      a chain of skills taking flax from the retted plant to cloth; weakened by deindustrialisation, the
      sector is working to bring spinning and weaving back to France.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00507:
  kind: practice
  summary:
    fr: >-
      Chez les Businenge (Noirs-Marrons) de Guyane, le long du Maroni, le gi pangi est un rite de passage
      où l'on remet aux jeunes filles le pangi, pagne enroulé à la taille, qui les fait reconnaître comme
      femmes adultes par la communauté.
    en: >-
      Among the Businenge (Maroons) of French Guiana, along the Maroni river, gi pangi is a rite of passage
      in which girls receive the pangi, a wrap-around cloth, marking their recognition as adult women
      by the community.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00508:
  kind: practice
  summary:
    fr: >-
      Sur le littoral breton, les charpentiers de marine construisent et entretiennent des bateaux en
      bois, le plus souvent à franc-bord sur membrure, un métier qui associe art du tracé, géométrie et
      précision des assemblages et que menace le recul du bois face à d'autres matériaux.
    en: >-
      On the Breton coast, shipwrights build and maintain wooden boats, mostly carvel-planked on frames,
      a craft combining lofting, geometry and precise joinery that is threatened as wood gives way to
      other materials.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00509:
  kind: practice
  summary:
    fr: >-
      En Savoie et Haute-Savoie, des troupes surtout rurales jouent depuis le milieu du XXe siècle des
      soirées théâtrales en francoprovençal savoyard, enchaînant saynètes, chansons, monologues et histoires
      drôles, de l'automne au début du printemps.
    en: >-
      In Savoie and Haute-Savoie, mostly rural troupes have staged evenings of theatre in the Savoyard
      Franco-Provençal language since the mid-20th century, mixing sketches, songs, monologues and jokes
      from autumn to early spring.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00511:
  kind: practice
  summary:
    fr: >-
      Dans des forêts comme Bercé, Tronçais ou Orléans, les forestiers conduisent la futaie régulière
      de chêne : des arbres d'âge voisin grandissent ensemble pendant un à deux siècles, éclaircis peu
      à peu, avant des coupes de régénération qui laissent place aux jeunes semis.
    en: >-
      In forests such as Bercé, Tronçais and Orléans, foresters manage even-aged oak high forest: trees
      of similar age grow together for one or two centuries, gradually thinned, before regeneration fellings
      make room for young seedlings.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00512:
  kind: practice
  summary:
    fr: >-
      Associé à l'ancien Dauphiné, le rigodon est une musique et une danse vive à rythme binaire, au violon
      à l'origine, dansée à deux, quatre, six ou plus avec frappés de pieds ; groupes folkloriques et
      musiciens de bals trad le font vivre aujourd'hui.
    en: >-
      Linked to the former Dauphiné, the rigodon is a lively tune and dance in duple time, historically
      played on the fiddle and danced in twos, fours, sixes or more with foot stamps; folk groups and
      trad ball musicians keep it alive today.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00513:
  kind: practice
  summary:
    fr: >-
      Dans le Pas-de-Calais, deux chantiers navals perpétuent le savoir-faire des charpentiers de marine
      du Nord : construction à clin pour les petits canots d'échouage de la Côte d'Opale, à franc-bord
      pour les plus grandes unités, de la conception au gréement.
    en: >-
      In the Pas-de-Calais, two boatyards keep up the craft of northern France's shipwrights: clinker
      building for the small beach-landing boats of the Opal Coast and carvel building for larger vessels,
      from design through to rigging.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00514:
  kind: event
  summary:
    fr: >-
      Attesté sous sa forme actuelle depuis 1902, le carnaval de Pornic (Loire-Atlantique) défile autour
      de chars construits par des groupes de familles et d'amis, un dimanche d'avril, la nuit suivante
      et en août, où l'effigie du roi carnaval est brûlée sur le port.
    en: >-
      Held in its present form since 1902, the Pornic carnival (Loire-Atlantique) parades floats built
      by groups of families and friends on a Sunday in April, the following night and again in August,
      when the carnival king's effigy is burnt at the harbour.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00515:
  kind: event
  summary:
    fr: >-
      À Montaren-et-Saint-Médiers (Gard), une fête créée dans les années 2000 célèbre le Pois Chiche,
      figure totémique revendiquée comme inventée : ouverte par une procession aux Rameaux, elle culmine
      un mois plus tard sur trois jours et s'achève par l'embrasement du totem.
    en: >-
      In Montaren-et-Saint-Médiers (Gard), a festival created in the 2000s honours the Chickpea, a totemic
      figure openly claimed as invented: it opens with a Palm Sunday procession and peaks about a month
      later over three days, ending with the burning of the totem.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00516:
  kind: practice
  summary:
    fr: >-
      Au Pays basque, le bertsularisme est une joute verbale improvisée, rimée et chantée a cappella en
      basque : les bertsolaris répondent sur un thème imposé par un meneur, lors de fêtes de village,
      de carnavals ou de championnats.
    en: >-
      In the Basque Country, bertsolaritza is an improvised verbal contest, rhymed and sung unaccompanied
      in Basque: bertsolaris respond to a theme set by a host at village fêtes, carnivals and championships.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00517:
  kind: practice
  summary:
    fr: >-
      Danse populaire du Bas-Languedoc pratiquée autour de Béziers depuis la Renaissance, la danse des
      Treilles accompagne fêtes du vin, de Saint-Aphrodise et Caritats, au son du hautbois languedocien,
      et se transmet dans les familles et les associations.
    en: >-
      A folk dance of Lower Languedoc performed around Béziers since the Renaissance, the danse des Treilles
      accompanies wine festivals, the Saint-Aphrodise feast and the Caritats to the Languedoc oboe, and
      is passed on in families and associations.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2022_67717_INV_PCI_FRANCE_00518:
  kind: practice
  summary:
    fr: >-
      À La Réunion, le bal tamoul (ou bal malbar) est un théâtre populaire chanté, dansé et mimé tiré
      des épopées indiennes ; le Vartial le dirige et chante en tamoul, tandis que les acteurs, grimés
      et masqués, jouent les divinités et les héros.
    en: >-
      On Réunion, the bal tamoul (or bal malbar) is a popular theatre of song, dance and mime drawn from
      the Indian epics; the Vartial leads it and sings in Tamil while the made-up, masked actors play
      gods and heroes.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00520:
  kind: practice
  summary:
    fr: >-
      À La Réunion, rod lo gèp désigne la recherche des nids de guêpes papetières, de janvier à fin avril,
      pour en prélever les larves, mets prisé partagé en famille ; repérer et décrocher les nids demande
      une bonne connaissance des sites et des saisons.
    en: >-
      On Réunion, rod lo gèp is the hunt for paper-wasp nests between January and late April to collect
      their larvae, a prized dish shared with family; finding and taking the nests calls for close knowledge
      of sites and seasons.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00522:
  kind: practice
  summary:
    fr: >-
      En Basse-Provence, les cercles sont des associations où des membres se retrouvent pour discuter,
      jouer, manger ou boire un verre ; héritiers des chambrettes et sociétés d'entraide, ils ont perdu
      leur rôle politique au profit du loisir et du lien social.
    en: >-
      In Lower Provence, cercles are clubs where members meet to talk, play games, eat or have a drink;
      descended from chambrettes and mutual-aid societies, they have shed their political role in favour
      of leisure and social ties.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00525:
  kind: practice
  summary:
    fr: >-
      L'art de l'espalier consiste à cultiver des arbres fruitiers palissés contre des murs ou en formes
      plates et en volume, grâce à des tailles de formation et de fructification ; longtemps la norme
      en arboriculture, il revient aujourd'hui dans les jardins et les villes.
    en: >-
      Espalier growing trains fruit trees flat against walls or into flat and three-dimensional shapes
      through specific formative and fruiting pruning; long the standard in fruit growing, it is now returning
      to gardens and cities.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00526:
  kind: practice
  summary:
    fr: >-
      Présents dans toute la France, l'apprentissage et l'usage du braille, écriture tactile en points
      en relief reconnue en 1825 à l'Institut royal des jeunes aveugles de Paris, donnent aux personnes
      aveugles un accès direct à la lecture, à l'écriture et à la musique.
    en: >-
      Found across France, learning and using braille, a tactile script of raised dots recognised in 1825
      at the Royal Institute for Blind Youth in Paris, gives blind people direct access to reading, writing
      and music.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00527:
  kind: practice
  summary:
    fr: >-
      Près de mille confréries vineuses et gastronomiques, en France métropolitaine et outre-mer, promeuvent
      un vin, un mets ou un produit de terroir ; en tenue de parade d'inspiration médiévale, elles animent
      foires, concours et banquets.
    en: >-
      Nearly a thousand wine and food brotherhoods across mainland and overseas France promote a local
      wine, dish or product; wearing parade robes inspired by the Middle Ages, they take part in fairs,
      competitions and banquets.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00528:
  kind: practice
  summary:
    fr: >-
      À Mayotte, le mbiwi est une danse et un chant féminins rythmés par deux bâtonnets de bambou entrechoqués
      ; il ponctue les étapes du mariage, avec des défis où deux danseuses font vibrer leurs hanches le
      plus longtemps possible.
    en: >-
      In Mayotte, mbiwi is a women's dance and song set to the beat of two bamboo sticks struck together;
      it marks the stages of a wedding, with contests in which two dancers shimmy their hips for as long
      as they can.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00529:
  kind: practice
  summary:
    fr: >-
      En Corse, la récolte « à l'ancienne » consiste à laisser tomber naturellement les olives de très
      grands oliviers séculaires dans des filets tendus au sol pendant des mois, avant de les porter au
      moulin ; elle donne une huile douce.
    en: >-
      In Corsica, the "old-style" harvest leaves olives from very tall, centuries-old trees to fall naturally
      into nets spread on the ground over several months before they are taken to the mill; it yields
      a mild oil.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00530:
  kind: practice
  summary:
    fr: >-
      Dans plusieurs régions, dont les Savoies, la Corse, les vallées au nord de Nice et les Pyrénées,
      le sonneur installé en haut du clocher relie les battants de trois ou quatre cloches à des cordes
      qu'il tire à la main ou au pied pour obsèques et fêtes.
    en: >-
      In several regions, including Savoy, Corsica, the valleys north of Nice and the Pyrenees, a bell-ringer
      sitting at the top of the tower ties the clappers of three or four bells to ropes pulled by hand
      or foot for funerals and feasts.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00531:
  kind: practice
  summary:
    fr: >-
      En France, une quinzaine de graveurs taillent au burin sur acier, à taille réelle et à l'envers,
      le poinçon des timbres-poste en taille-douce, ensuite imprimés à Boulazac (Dordogne) ; la Marianne
      d'usage courant en est issue.
    en: >-
      In France, about fifteen engravers cut postage-stamp dies in steel with a burin, actual size and
      in reverse, for intaglio printing at Boulazac (Dordogne); the everyday Marianne stamp is made this
      way.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2023_67717_INV_PCI_FRANCE_00532:
  kind: practice
  summary:
    fr: >-
      Autour de Millau, en Occitanie, la ganterie relie depuis environ sept siècles éleveurs, mégissiers
      et gantiers, de la peau d'agneau au gant fini ; ces gants servent encore aux mariages, aux uniformes,
      au spectacle et au sport.
    en: >-
      Around Millau in Occitania, glove-making has linked sheep farmers, tawers and glovers for some seven
      centuries, from lambskin to finished glove; the gloves are still used for weddings, uniforms, the
      stage and sport.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00534:
  kind: practice
  summary:
    fr: >-
      En Haute-Bretagne, le craquelin est un biscuit sec échaudé en forme de petite écuelle croustillante
      ; cinq fabricants le produisent encore en une douzaine d'étapes, de l'échaudage à la cuisson, et
      on le mange sucré ou salé.
    en: >-
      In Upper Brittany, the craquelin is a dry scalded biscuit shaped like a small crunchy bowl; five
      makers still produce it in about a dozen steps, from scalding to baking, and it is eaten sweet or
      savoury.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00535:
  kind: practice
  summary:
    fr: >-
      À Saint-Pierre-et-Miquelon, le doris, barque en bois de petite pêche dérivée des doris des Bancs,
      n'a plus de constructeurs professionnels ; des amateurs et associations le construisent et le réparent
      désormais pour le patrimoine, la pêche de loisir et la plaisance.
    en: >-
      In Saint-Pierre-et-Miquelon, the dory, a small wooden fishing boat derived from the Grand Banks
      dories, no longer has professional builders; amateurs and associations now build and repair it for
      heritage, leisure fishing and sailing.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00536:
  kind: practice
  summary:
    fr: >-
      Partout en France, des liquoristes élaborent des liqueurs à partir de plantes, fruits et épices
      par infusion, macération et distillation, des savoirs hérités des monastères et apothicaires et
      devenus un métier au XIXe siècle.
    en: >-
      Across France, liqueur makers extract the flavour of herbs, fruit and spices through infusion, maceration
      and distillation, skills inherited from monasteries and apothecaries that became a trade in the
      19th century.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00537:
  kind: practice
  summary:
    fr: >-
      Dans les marais salants de la presqu'île de Guérande et du sud du Morbihan, les paludiers récoltent
      le sel selon des gestes peu changés depuis des siècles, au cœur d'un paysage façonné par l'homme
      où se mêlent pêche, cueillette et fêtes.
    en: >-
      In the salt marshes of the Guérande peninsula and southern Morbihan, salt workers harvest salt with
      methods little changed over centuries, in a man-made landscape that also supports fishing, gathering
      and festivities.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00538:
  kind: practice
  summary:
    fr: >-
      Dans les bourgs comme dans les villes de France, cafés et bistrots sont des lieux ouverts où l'on
      vient s'informer, boire, manger et se retrouver ; comptoir, terrasse et salle y favorisent les échanges
      entre patrons, serveurs, habitués et passants.
    en: >-
      In villages and towns across France, cafés and bistros are open places to catch up on news, drink,
      eat and meet; the counter, terrace and dining room encourage exchanges between owners, staff, regulars
      and passers-by.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00539:
  kind: practice
  summary:
    fr: >-
      Née à Paris au XIXe siècle et devenue la référence nationale, la découpe bouchère à la française
      repose sur une connaissance fine de l'anatomie pour tirer de chaque muscle des morceaux adaptés
      à la cuisine ; elle se transmet par l'apprentissage.
    en: >-
      Developed in Paris in the 19th century and now the national standard, French-style butchery cutting
      relies on detailed knowledge of anatomy to turn each muscle into cuts suited to different dishes;
      it is passed on through apprenticeship.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00540:
  kind: practice
  summary:
    fr: >-
      Le long du littoral normand, des charpentiers de marine construisent et surtout restaurent des bateaux
      en bois, le plus souvent à franc-bord ; autrefois tournés vers la pêche et le cabotage, les chantiers
      travaillent aujourd'hui beaucoup sur les bateaux patrimoniaux.
    en: >-
      Along the Normandy coast, shipwrights build and above all restore wooden boats, mostly carvel-planked;
      once focused on fishing and coastal trade, the yards now work largely on heritage vessels.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00541:
  kind: practice
  summary:
    fr: >-
      À Mayotte, en Petite-Terre et dans le sud de Grande-Terre, des potiers et potières façonnent à la
      main, sans tour, ustensiles, objets décoratifs et rituels en argile prélevée dans les vasières,
      sur les plages ou en carrière.
    en: >-
      In Mayotte, on Petite-Terre and in the south of Grande-Terre, potters shape household, decorative
      and ritual objects by hand, without a wheel, from clay dug in mudflats, on beaches or in quarries.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00542:
  kind: practice
  summary:
    fr: >-
      Le chant de marin regroupe en France les chansons liées aux gens de mer, chantées souvent en chœur,
      avec parfois des instruments ; surtout présent en Bretagne, Pays de la Loire et Normandie, il mêle
      répertoire de la marine à voile et créations récentes.
    en: >-
      Sea songs in France cover the songs of seafaring people, often sung by choirs, sometimes with instruments;
      strongest in Brittany, the Pays de la Loire and Normandy, the repertoire mixes songs from the age
      of working sail with new ones.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00543:
  kind: practice
  summary:
    fr: >-
      Dans les Baronnies provençales, la cueillette des fleurs de tilleul, née à la fin du XIXe siècle
      pour l'herboristerie et la parfumerie, mobilise des gestes de greffe, de taille, de cueillette et
      de séchage qui réunissent chaque été plusieurs générations.
    en: >-
      In the Baronnies provençales, lime-blossom picking, which began in the late 19th century for herbal
      medicine and perfumery, involves grafting, pruning, picking and drying skills that bring several
      generations together each summer.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00544:
  kind: practice
  summary:
    fr: >-
      Dans les Grands-Fonds de Grande-Terre (Guadeloupe), la veillée qui suit un décès réunit voisins
      et amis autour de chants sans instrument, de devinettes en créole et en français et de jeux d'agilité
      menés par un soliste, pour soutenir la famille.
    en: >-
      In the Grands-Fonds of Grande-Terre (Guadeloupe), the wake held after a death gathers neighbours
      and friends for unaccompanied songs, riddles in Creole and French and agility games led by a soloist,
      to support the bereaved family.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2024_67717_INV_PCI_FRANCE_00546:
  kind: practice
  summary:
    fr: >-
      Dans une vingtaine de moulins et ateliers en France, des papetiers fabriquent du papier à la main
      en trois étapes, préparation de la pâte, formation de la feuille et séchage, pour l'écriture, l'art,
      l'édition ou la restauration.
    en: >-
      In about twenty mills and workshops across France, papermakers produce paper by hand in three stages,
      preparing the pulp, forming the sheet and drying it, for writing, art, publishing or conservation.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2025_67717_INV_PCI_FRANCE_00547:
  kind: practice
  summary:
    fr: >-
      À Mayotte, le debaa des femmes est une cérémonie de chants d'inspiration soufie menée par une soliste
      et des chœurs, au son des percussions, où des groupes de femmes alignées exécutent tour à tour des
      chorégraphies du haut du corps.
    en: >-
      In Mayotte, the women's debaa is a ceremony of Sufi-inspired songs led by a soloist and chorus to
      percussion, in which lines of women take turns performing choreographies using the upper body.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
2025_67717_INV_PCI_FRANCE_00551:
  kind: practice
  summary:
    fr: >-
      Dans le bassin de la Loire, les savoirs nautiques ligériens réunissent la construction de bateaux
      à fond plat bordés à clin, la navigation à la voile carrée, au courant ou à la perche, et la pêche,
      fondées sur une lecture fine du fleuve.
    en: >-
      In the Loire basin, Loire boating knowledge brings together building flat-bottomed clinker boats,
      sailing with a square sail, drifting with the current or poling, and fishing, all based on close
      reading of the river.
    lang_review: draft
  read: pcilab
  review_status: unreviewed
